# ============================================================
# Q-IM local 프로파일 — 샌드박스 직접 구동용
# Kafka 브로커 없이 DB + Redis 계층만 검증
# ============================================================

spring:
  kafka:
    bootstrap-servers: localhost:9092
    listener:
      missing-topics-fatal: false   # 토픽 없어도 기동 허용
    consumer:
      properties:
        metadata.max.age.ms: 5000   # 메타데이터 재조회 주기 단축
  # Flyway: 마이그레이션 실행
  flyway:
    enabled: true
    connect-retries: 3
    connect-retries-interval: 3s

# Outbox Relay 비활성 (Kafka 없으므로)
idem.registry:
  outbox:
    relay-interval-ms: 3600000     # 1시간 = 사실상 비활성
  # CI 암호화 키 부팅 검증 우회 (Sprint γ-2 / F3.3)
  # 로컬 샌드박스에서는 IDEM_REGISTRY_CI_AES_KEY_V1 미주입을 허용. 운영에서는 절대 사용 금지.
  crypto:
    ci:
      allow-empty-key: true

logging:
  level:
    org.springframework.kafka: ERROR
    org.apache.kafka: ERROR
