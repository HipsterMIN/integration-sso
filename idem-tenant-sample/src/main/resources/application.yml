server:
  port: 8084
  shutdown: graceful

spring:
  application:
    name: idem-tenant-sample
  lifecycle:
    timeout-per-shutdown-phase: 20s

  # ── DataSource ──────────────────────────────────────────────
  datasource:
    url: jdbc:postgresql://${DB_HOST:localhost}:${DB_PORT:5432}/${DB_NAME:onepass}?currentSchema=agency_stub&sslmode=disable
    username: ${DB_USERNAME:onepass}
    password: ${DB_PASSWORD:onepass}
    driver-class-name: org.postgresql.Driver
    hikari:
      pool-name: agency-stub-hikari
      maximum-pool-size: 10
      minimum-idle: 3
      idle-timeout: 300000
      connection-timeout: 30000
      max-lifetime: 1800000
      keepalive-time: 60000
      connection-test-query: SELECT 1

  # ── JPA ────────────────────────────────────────────────────
  jpa:
    hibernate:
      ddl-auto: validate
    show-sql: false
    open-in-view: false
    properties:
      hibernate:
        dialect: org.hibernate.dialect.PostgreSQLDialect
        default_schema: agency_stub
        jdbc:
          time_zone: UTC

  # ── Flyway ─────────────────────────────────────────────────
  flyway:
    enabled: true
    locations: classpath:db/migration
    schemas: agency_stub
    default-schema: agency_stub
    baseline-on-migrate: true
    baseline-version: 0
    validate-on-migrate: true
    out-of-order: false
    connect-retries: 5
    connect-retries-interval: 10s

  # ── Redis (로컬 세션 캐시 보조) ─────────────────────────────
  data:
    redis:
      host: ${REDIS_HOST:localhost}
      port: ${REDIS_PORT:6379}
      password: ${REDIS_PASSWORD:}
      timeout: 2000ms
      lettuce:
        pool:
          max-active: 10
          max-idle: 5
          min-idle: 1
          max-wait: 1000ms

  # ── Kafka ──────────────────────────────────────────────────
  # ⚠️  PoC ONLY — 실 운영에서 외부 기관은 내부 Kafka에 직접 연결 불가
  # 운영 시 이 Kafka 설정 블록 전체를 제거하고,
  # 기관 세션 무효화는 IdO Webhook(Push) 또는 Polling API로 대체합니다.
  # 설계 상세: docs/agency-external-arch-supplement.md §3.1
  kafka:
    bootstrap-servers: ${KAFKA_SERVERS:localhost:9092}
    properties:
      security.protocol: PLAINTEXT
    consumer:
      group-id: idem-tenant-sample-consumer
      auto-offset-reset: earliest
      enable-auto-commit: false
      max-poll-records: 50
      key-deserializer: org.apache.kafka.common.serialization.StringDeserializer
      value-deserializer: org.springframework.kafka.support.serializer.JsonDeserializer
      properties:
        spring.json.trusted.packages: "io.github.hipstermin.idem.*"
        isolation.level: read_committed
    listener:
      ack-mode: MANUAL_IMMEDIATE
      concurrency: 2
      missing-topics-fatal: true

# ── Agency-Stub 도메인 설정 ────────────────────────────────────
idem.sample:
  code: AGENCY_STUB_001
  # S6 PR-2: 기관이 Idem 에 붙는 방식 — HANDOFF(기본, /agency/entry) | OIDC_RP(표준 OIDC, /agency/oidc/login).
  # Idem 쪽 Service Profile 의 protocol.type 과 같아야 한다. 세션 저장·쿠키·웹훅은 두 방식이 같다.
  protocol: ${AGENCY_PROTOCOL:HANDOFF}
  oidc:
    # Idem 에서 받는 셋 — issuer 는 {IDEM_PUBLIC_URL_GATE}/realms/{realm}, client 는 프로파일 저장 시 프로비저닝, secret 은 회전 API 로 1회 수령
    issuer: ${IDEM_OIDC_ISSUER:http://localhost:8081/realms/onepass}
    client-id: ${AGENCY_OIDC_CLIENT_ID:}
    client-secret: ${AGENCY_OIDC_CLIENT_SECRET:}
    redirect-uri: ${AGENCY_OIDC_REDIRECT_URI:http://localhost:8084/agency/oidc/callback}
    post-logout-redirect-uri: ${AGENCY_OIDC_POST_LOGOUT_URI:http://localhost:8084/}
  # §11 IdO Verify API 연동
  ido:
    base-url: ${IDEM_HUB_BASE_URL:http://localhost:8083}
    api-key: ${AGENCY_API_KEY:stub-api-key-dev}
    connect-timeout-ms: 3000
    read-timeout-ms: 5000

  # §14.6 기관 로컬 세션
  session:
    cookie-name: AGSID
    idle-timeout-minutes: 30
    absolute-timeout-minutes: 480    # 8시간 절대 만료
    same-site: Strict
    secure: true
    http-only: true

  # §14.8 기관 최소 인증 수준
  min-auth-level: L1

  # §14.7 Webhook 수신 (IdO → 기관)
  webhook:
    signing-secret: ${IDEM_HUB_WEBHOOK_SIGNING_SECRET:poc-webhook-secret-change-in-production}
    # 수신 엔드포인트: POST /api/v1/webhook/inbound
    # HMAC-SHA256 서명 검증 + 타임스탬프 ±5분
    enabled: true

  # Kafka 토픽 구독 (PoC 전용 — 운영 시 webhook으로 대체)
  kafka:
    consumer-group: idem-tenant-sample-consumer
    topic-handoff-events: idem.hub.handoff.events
    topic-session-advisory: platform.session.advisory

# ── Resilience4j — IdO Verify API Circuit Breaker / Retry ────
resilience4j:
  circuitbreaker:
    instances:
      ido-verify:
        # 슬라이딩 윈도우: 최근 10회 호출 중 실패율 50% 초과 시 OPEN
        sliding-window-type: COUNT_BASED
        sliding-window-size: 10
        failure-rate-threshold: 50
        # OPEN 상태 유지 시간: 10초
        wait-duration-in-open-state: 10s
        # HALF-OPEN: 3회 시도 후 판정
        permitted-number-of-calls-in-half-open-state: 3
        # 슬로우 콜 임계값: 4초 초과 시 실패로 간주
        slow-call-duration-threshold: 4s
        slow-call-rate-threshold: 80
        # 예외 기반 실패 판정
        record-exceptions:
          - org.springframework.web.client.HttpServerErrorException
          - org.springframework.web.client.ResourceAccessException
          - java.net.SocketTimeoutException
          - java.io.IOException
        # 4xx 는 실패로 간주하지 않음 (비즈니스 로직으로 처리)
        ignore-exceptions:
          - org.springframework.web.client.HttpClientErrorException
        register-health-indicator: true

      # IdO Ticket 발급 CircuitBreaker (시뮬레이터 전용)
      ido-ticket:
        sliding-window-type: COUNT_BASED
        sliding-window-size: 10
        failure-rate-threshold: 50
        wait-duration-in-open-state: 10s
        permitted-number-of-calls-in-half-open-state: 3
        slow-call-duration-threshold: 5s
        slow-call-rate-threshold: 80
        record-exceptions:
          - org.springframework.web.client.HttpServerErrorException
          - org.springframework.web.client.ResourceAccessException
          - java.net.SocketTimeoutException
          - java.io.IOException
        ignore-exceptions:
          - org.springframework.web.client.HttpClientErrorException
          - io.github.hipstermin.idem.tenant.client.IdoTicketClient$IdoTicketIssuanceException
        register-health-indicator: true

  retry:
    instances:
      ido-verify:
        # 최대 재시도 2회 (초기 시도 포함 총 3회)
        max-attempts: 3
        # 재시도 대기: 500ms → 1000ms (exponential)
        wait-duration: 500ms
        exponential-backoff-multiplier: 2
        # 5xx / 네트워크 오류만 재시도
        retry-exceptions:
          - org.springframework.web.client.HttpServerErrorException
          - org.springframework.web.client.ResourceAccessException
          - java.net.SocketTimeoutException
        # 4xx 는 재시도하지 않음
        ignore-exceptions:
          - org.springframework.web.client.HttpClientErrorException

      # IdO Ticket 발급 (시뮬레이터 전용)
      ido-ticket:
        max-attempts: 3
        wait-duration: 500ms
        exponential-backoff-multiplier: 2
        retry-exceptions:
          - org.springframework.web.client.HttpServerErrorException
          - org.springframework.web.client.ResourceAccessException
          - java.net.SocketTimeoutException
        ignore-exceptions:
          - org.springframework.web.client.HttpClientErrorException

# ── Actuator ──────────────────────────────────────────────────
management:
  endpoints:
    web:
      exposure:
        include: health,info,metrics,prometheus,flyway
  endpoint:
    health:
      show-details: when-authorized
      probes:
        enabled: true
  metrics:
    tags:
      application: ${spring.application.name}

logging:
  level:
    io.github.hipstermin.idem.tenant: INFO
    org.springframework.kafka: WARN
    org.flywaydb: INFO

# ── D1-b: Kafka 선택 의존 — 샘플은 제품 밖이지만 같은 스위치를 따른다 (false 면 Handoff/Advisory 컨슈머가 시작되지 않는다) ──
idem:
  messaging:
    kafka:
      enabled: ${IDEM_KAFKA_ENABLED:false}
