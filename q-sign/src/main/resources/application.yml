server:
  port: 8081
  servlet:
    context-path: /
  shutdown: graceful

spring:
  application:
    name: q-sign
  lifecycle:
    timeout-per-shutdown-phase: 20s

  # ── DataSource ──────────────────────────────────────────────
  datasource:
    url: jdbc:postgresql://${DB_HOST:localhost}:${DB_PORT:5432}/${DB_NAME:onepass}?currentSchema=qsign
    username: ${DB_USERNAME:onepass}
    password: ${DB_PASSWORD:onepass}
    driver-class-name: org.postgresql.Driver
    hikari:
      pool-name: qsign-hikari
      maximum-pool-size: 20
      minimum-idle: 5
      idle-timeout: 300000        # 5분
      connection-timeout: 30000   # 30초
      max-lifetime: 1800000       # 30분
      keepalive-time: 60000       # 1분
      connection-test-query: SELECT 1

  # ── JPA ────────────────────────────────────────────────────
  jpa:
    hibernate:
      ddl-auto: validate           # Flyway 가 DDL 관리 → validate 만
    show-sql: false
    open-in-view: false
    properties:
      hibernate:
        dialect: org.hibernate.dialect.PostgreSQLDialect
        default_schema: qsign
        jdbc:
          time_zone: UTC
          batch_size: 50
        order_inserts: true
        order_updates: true
        format_sql: false

  # ── Flyway ─────────────────────────────────────────────────
  flyway:
    enabled: true
    locations: classpath:db/migration
    schemas: qsign
    default-schema: qsign
    baseline-on-migrate: true
    baseline-version: 0
    validate-on-migrate: true
    out-of-order: false
    connect-retries: 5
    connect-retries-interval: 10s

  # ── Redis ──────────────────────────────────────────────────
  data:
    redis:
      host: ${REDIS_HOST:localhost}
      port: ${REDIS_PORT:6379}
      password: ${REDIS_PASSWORD:}
      timeout: 2000ms
      lettuce:
        pool:
          max-active: 20
          max-idle: 8
          min-idle: 2
          max-wait: 1000ms

  # ── Kafka ──────────────────────────────────────────────────
  kafka:
    bootstrap-servers: ${KAFKA_SERVERS:localhost:9092}
    properties:
      security.protocol: PLAINTEXT
    producer:
      client-id: q-sign-producer
      key-serializer: org.apache.kafka.common.serialization.StringSerializer
      value-serializer: org.springframework.kafka.support.serializer.JsonSerializer
      acks: all                    # 모든 ISR 확인 후 응답
      retries: 3
      batch-size: 16384
      linger-ms: 5
      buffer-memory: 33554432
      compression-type: lz4
      properties:
        enable.idempotence: "true"
        max.in.flight.requests.per.connection: "5"
        spring.json.add.type.headers: "false"
    consumer:
      group-id: q-sign-consumer
      auto-offset-reset: earliest
      enable-auto-commit: false    # 수동 커밋 (멱등 처리)
      max-poll-records: 50
      key-deserializer: org.apache.kafka.common.serialization.StringDeserializer
      value-deserializer: org.springframework.kafka.support.serializer.JsonDeserializer
      properties:
        spring.json.trusted.packages: "kr.go.smes.*"
        isolation.level: read_committed
    listener:
      ack-mode: MANUAL_IMMEDIATE
      concurrency: 3
      missing-topics-fatal: true

# ── Q-Sign 도메인 설정 ─────────────────────────────────────────
qsign:
  # §9.6 잠금·재시도 정책
  lock:
    max-attempts: 5
    lock-duration-minutes: 30
    reset-window-minutes: 10      # 이 시간 내 연속 실패만 카운트
  # 인증수단별 보증 수준
  auth-level:
    KAKAO_OIDC: L1
    NAVER_OIDC: L1
    PASS_OIDC: L2
    PASS: L2
    FINANCIAL_CERT: L3
    GPKI_OIDC: L3
    GPKI: L3
  # IdO 내부 통신 설정
  ido:
    base-url: ${IDO_BASE_URL:http://localhost:8083}
    # X-Internal-Sig HMAC-SHA256 공유 비밀키 (ido와 동일 값, IDO_INTERNAL_SIG_SECRET 필수)
    internal-sig-secret: ${IDO_INTERNAL_SIG_SECRET:}
    internal-sig-ttl-seconds: 60
    # GAP-QS-04: broker-input 수신 측 서명 검증 strict 모드
    # true(운영): HMAC 불일치 시 403 반환 / false(PoC): 경고 로그 후 통과
    internal-sig-strict-mode: ${QSIGN_INTERNAL_SIG_STRICT:false}
    connect-timeout-ms: 3000
    read-timeout-ms: 5000
  # Kafka 토픽
  kafka:
    topic-auth-events: qsign.auth.events
  # Outbox Relay
  outbox:
    relay-interval-ms: 500
    batch-size: 100
    max-retry: 3

  # ── Keycloak 어댑터 설정 ────────────────────────────────────
  # q-sign 은 Keycloak 의 OIDC 클라이언트 어댑터로 동작한다.
  # 카카오·네이버 등 소셜 IdP 연동은 Keycloak 이 내부 처리하며,
  # q-sign 은 Keycloak 과만 통신한다 (외부 IdP 직접 호출 금지).
  keycloak:
    # Keycloak 서버 Base URL
    # Docker 환경: http://keycloak:8080
    # 로컬 환경:   http://localhost:8088
    base-url: ${KEYCLOAK_URL:http://localhost:8088}
    # Keycloak Realm
    realm: ${KEYCLOAK_REALM:onepass}
    # q-sign 용 Keycloak Client ID
    client-id: ${QSIGN_KEYCLOAK_CLIENT_ID:q-sign-client}
    # q-sign 용 Keycloak Client Secret
    # 환경변수: QSIGN_KEYCLOAK_CLIENT_SECRET
    client-secret: ${QSIGN_KEYCLOAK_CLIENT_SECRET:change-me}
    # Keycloak 이 인증 완료 후 리다이렉트할 q-sign Callback URI
    # Keycloak Admin Console > Clients > q-sign-client > Valid Redirect URIs 에 등록 필요
    redirect-uri: ${QSIGN_KEYCLOAK_REDIRECT_URI:http://localhost:8081/api/v1/oidc/keycloak/callback}
    # state/nonce Redis TTL (초)
    state-ttl-seconds: 300
    # JWKS 공개키 캐시 TTL (초, 기본 1시간)
    jwks-cache-ttl-seconds: 3600
    # HTTP 클라이언트 타임아웃
    http:
      connect-timeout-ms: 3000
      read-timeout-ms: 5000
    # provider 식별자 → Keycloak kc_idp_hint 매핑
    # ido 가 전달하는 provider 이름을 Keycloak Identity Provider alias 로 변환
    idp-hint-mapping:
      kakao: social-kakao
      naver: social-naver
      pass:  social-pass
      gpki:  social-gpki

# ── Resilience4j ──────────────────────────────────────────────
resilience4j:
  circuitbreaker:
    instances:
      idp-broker:
        register-health-indicator: true
        sliding-window-type: COUNT_BASED
        sliding-window-size: 20
        failure-rate-threshold: 50
        slow-call-rate-threshold: 80
        slow-call-duration-threshold: 3s
        wait-duration-in-open-state: 30s
        permitted-number-of-calls-in-half-open-state: 5
        minimum-number-of-calls: 5
  retry:
    instances:
      idp-broker:
        max-attempts: 3
        wait-duration: 500ms
        retry-exceptions:
          - java.io.IOException
          - java.util.concurrent.TimeoutException
  timelimiter:
    instances:
      idp-broker:
        timeout-duration: 5s
        cancel-running-future: true

# ── Actuator ──────────────────────────────────────────────────
management:
  endpoints:
    web:
      exposure:
        include: health,info,metrics,prometheus,flyway
  endpoint:
    health:
      show-details: when-authorized
      probes:
        enabled: true
  metrics:
    tags:
      application: ${spring.application.name}

logging:
  level:
    kr.go.smes.qsign: INFO
    org.springframework.kafka: WARN
    org.flywaydb: INFO

# ── PKCE (RFC 7636) ────────────────────────────────────────────────────────
qsign:
  pkce:
    enabled:              ${QSIGN_PKCE_ENABLED:true}
    challenge-ttl-seconds: ${QSIGN_PKCE_TTL:300}    # 5분
