<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Outbox 패턴 — 시나리오 워크스루</title>
<style>
:root {
  --bg: #0d1117;
  --bg2: #161b22;
  --bg3: #1c2128;
  --border: #30363d;
  --text: #e6edf3;
  --text2: #8b949e;
  --blue: #58a6ff;
  --blue-bg: #0d2137;
  --blue-border: #1f6feb;
  --green: #3fb950;
  --green-bg: #0a1f14;
  --green-border: #238636;
  --orange: #f0883e;
  --orange-bg: #2a1a08;
  --orange-border: #9e6a03;
  --purple: #bc8cff;
  --purple-bg: #1a0f2a;
  --purple-border: #6e40c9;
  --red: #f85149;
  --red-bg: #2a0a0a;
  --red-border: #8b1a1a;
  --yellow: #e3b341;
  --yellow-bg: #1f1900;
  --teal: #39d353;
}
* { margin:0; padding:0; box-sizing:border-box; }

body {
  font-family: 'Segoe UI', 'Noto Sans KR', -apple-system, sans-serif;
  background: var(--bg);
  color: var(--text);
  min-height: 100vh;
}

/* ── 헤더 ── */
.top-header {
  background: var(--bg2);
  border-bottom: 1px solid var(--border);
  padding: 0 24px;
  display: flex;
  align-items: center;
  gap: 0;
  height: 56px;
  position: sticky; top:0; z-index:200;
}
.logo { font-size:20px; margin-right:12px; }
.top-title { font-size:15px; font-weight:700; color:var(--text); margin-right:32px; white-space:nowrap; }

.scenario-tabs {
  display:flex; gap:4px; overflow-x:auto;
}
.stab {
  padding:6px 16px;
  border-radius:6px;
  border: 1px solid transparent;
  background: transparent;
  color: var(--text2);
  font-size:13px; cursor:pointer;
  white-space:nowrap;
  transition: all .2s;
}
.stab:hover { background:var(--bg3); color:var(--text); }
.stab.active { background:var(--blue-bg); color:var(--blue); border-color:var(--blue-border); font-weight:600; }
.stab.active.green { background:var(--green-bg); color:var(--green); border-color:var(--green-border); }
.stab.active.orange { background:var(--orange-bg); color:var(--orange); border-color:var(--orange-border); }

/* ── 메인 레이아웃 ── */
.main {
  display: grid;
  grid-template-columns: 300px 1fr 320px;
  grid-template-rows: 1fr;
  height: calc(100vh - 56px);
  overflow: hidden;
}

/* ── 왼쪽: 스텝 목록 ── */
.step-panel {
  background: var(--bg2);
  border-right: 1px solid var(--border);
  overflow-y: auto;
  padding: 16px 0;
}
.step-panel-title {
  font-size:11px; font-weight:600; color:var(--text2);
  text-transform:uppercase; letter-spacing:.08em;
  padding: 0 16px 8px;
}
.step-item {
  display: flex;
  align-items: flex-start;
  gap: 12px;
  padding: 10px 16px;
  cursor: pointer;
  border-left: 3px solid transparent;
  transition: all .15s;
  position: relative;
}
.step-item:hover { background: var(--bg3); }
.step-item.active { background: var(--bg3); border-left-color: var(--blue); }
.step-item.active.green { border-left-color: var(--green); }
.step-item.active.orange { border-left-color: var(--orange); }
.step-item.done .step-num { background: var(--green); color: #000; }

.step-num {
  width:26px; height:26px; border-radius:50%;
  background: var(--bg3); border: 2px solid var(--border);
  display:flex; align-items:center; justify-content:center;
  font-size:12px; font-weight:700; flex-shrink:0;
  transition: all .2s;
}
.step-item.active .step-num { background:var(--blue); border-color:var(--blue); color:#000; }
.step-item.active.green .step-num { background:var(--green); border-color:var(--green); color:#000; }
.step-item.active.orange .step-num { background:var(--orange); border-color:var(--orange); color:#000; }

.step-meta { flex:1; min-width:0; }
.step-actor {
  font-size:10px; font-weight:600; color:var(--text2);
  text-transform:uppercase; letter-spacing:.06em; margin-bottom:2px;
}
.step-title { font-size:13px; font-weight:600; color:var(--text); line-height:1.3; }
.step-sub { font-size:11px; color:var(--text2); margin-top:2px; line-height:1.4; }

/* connector line between steps */
.step-item:not(:last-child)::after {
  content:'';
  position:absolute;
  left:28px; bottom:-10px;
  width:2px; height:20px;
  background: var(--border);
  z-index:1;
}

/* ── 중앙: 메인 콘텐츠 ── */
.content-panel {
  overflow-y: auto;
  padding: 24px;
  background: var(--bg);
}

/* 시나리오 헤더 */
.scenario-header {
  background: var(--bg2);
  border: 1px solid var(--border);
  border-radius: 10px;
  padding: 20px 24px;
  margin-bottom: 20px;
}
.scenario-badge {
  display:inline-flex; align-items:center; gap:6px;
  font-size:11px; font-weight:700; letter-spacing:.08em;
  padding:3px 10px; border-radius:20px;
  margin-bottom:10px;
}
.scenario-header h2 { font-size:20px; font-weight:700; margin-bottom:6px; }
.scenario-header p { font-size:13px; color:var(--text2); line-height:1.6; }

/* 스텝 콘텐츠 카드 */
.step-content {
  display:none;
}
.step-content.active { display:block; }

.step-card {
  background: var(--bg2);
  border: 1px solid var(--border);
  border-radius: 10px;
  margin-bottom: 16px;
  overflow: hidden;
}
.step-card-header {
  display:flex; align-items:center; gap:12px;
  padding:14px 18px;
  border-bottom: 1px solid var(--border);
}
.step-card-num {
  width:32px; height:32px; border-radius:50%;
  display:flex; align-items:center; justify-content:center;
  font-size:14px; font-weight:700; flex-shrink:0;
}
.step-card-header h3 { font-size:15px; font-weight:700; }
.step-card-header .actor-tag {
  font-size:11px; font-weight:600;
  padding:2px 8px; border-radius:4px;
  margin-left:auto;
}

.step-card-body { padding:16px 18px; }

/* 설명 블록 */
.explain-box {
  font-size:13px; color:var(--text2); line-height:1.8;
  margin-bottom:14px;
}
.explain-box strong { color:var(--text); }
.explain-box .key { 
  display:inline-block;
  background:var(--bg3); border:1px solid var(--border);
  border-radius:4px; padding:0 6px; font-size:12px;
  font-family: 'JetBrains Mono', monospace; color:var(--blue);
}

/* 코드 블록 */
.code-wrap {
  margin-bottom:14px;
}
.code-label {
  font-size:11px; font-weight:600; color:var(--text2);
  text-transform:uppercase; letter-spacing:.08em;
  margin-bottom:6px; display:flex; align-items:center; gap:6px;
}
.code-label .dot { width:8px; height:8px; border-radius:50%; }
pre {
  background: #0d1117;
  border: 1px solid var(--border);
  border-radius: 8px;
  padding: 14px 16px;
  overflow-x: auto;
  font-family: 'JetBrains Mono', 'Fira Code', 'Consolas', monospace;
  font-size: 12.5px;
  line-height: 1.7;
}
.hl-class   { color: #ff7b72; }
.hl-method  { color: #d2a8ff; }
.hl-anno    { color: #f0883e; }
.hl-kw      { color: #ff7b72; }
.hl-str     { color: #a5d6ff; }
.hl-comment { color: #8b949e; font-style:italic; }
.hl-num     { color: #79c0ff; }
.hl-var     { color: #e6edf3; }
.hl-sql-kw  { color: #ff7b72; font-weight:600; }
.hl-sql-tbl { color: #ffa657; }
.hl-sql-col { color: #a5d6ff; }
.hl-sql-val { color: #79c0ff; }
.hl-highlight { background: rgba(255,235,0,.12); border-radius:3px; padding:1px 3px; }

/* 포인트 카드 */
.point-list { list-style:none; }
.point-list li {
  display:flex; align-items:flex-start; gap:10px;
  font-size:13px; color:var(--text2); line-height:1.6;
  padding: 6px 0;
  border-bottom: 1px solid var(--border);
}
.point-list li:last-child { border-bottom:none; }
.point-list li .icon { font-size:16px; flex-shrink:0; margin-top:1px; }
.point-list li strong { color:var(--text); }

/* 경고/중요 박스 */
.alert-box {
  border-radius:8px;
  padding:12px 14px;
  margin-bottom:14px;
  font-size:13px; line-height:1.7;
  display:flex; gap:10px;
}
.alert-box .icon { font-size:18px; flex-shrink:0; }
.alert-box.warn { background:var(--orange-bg); border:1px solid var(--orange-border); }
.alert-box.info { background:var(--blue-bg); border:1px solid var(--blue-border); }
.alert-box.success { background:var(--green-bg); border:1px solid var(--green-border); }
.alert-box.danger { background:var(--red-bg); border:1px solid var(--red-border); }

/* ── 오른쪽: 상태 패널 ── */
.state-panel {
  background: var(--bg2);
  border-left: 1px solid var(--border);
  overflow-y: auto;
  padding: 16px;
}
.state-panel-title {
  font-size:11px; font-weight:600; color:var(--text2);
  text-transform:uppercase; letter-spacing:.08em;
  margin-bottom:14px;
}

/* DB 상태 카드 */
.db-card {
  background: var(--bg);
  border: 1px solid var(--border);
  border-radius:8px;
  margin-bottom:12px;
  overflow:hidden;
  transition: all .3s;
}
.db-card.active-db { border-color:var(--blue); box-shadow: 0 0 0 1px var(--blue-border); }
.db-card.active-db.green { border-color:var(--green); box-shadow: 0 0 0 1px var(--green-border); }
.db-card.active-db.orange { border-color:var(--orange); box-shadow: 0 0 0 1px var(--orange-border); }

.db-card-header {
  padding:8px 12px;
  border-bottom:1px solid var(--border);
  display:flex; align-items:center; gap:8px;
  font-size:12px; font-weight:600;
}
.db-icon { font-size:14px; }
.db-badge {
  font-size:10px; padding:1px 6px; border-radius:3px;
  font-weight:600; margin-left:auto;
}

.db-table {
  width:100%; font-size:11px; font-family:monospace;
}
.db-table th {
  padding:5px 10px;
  text-align:left; color:var(--text2);
  background:var(--bg3);
  border-bottom:1px solid var(--border);
  font-weight:600; font-size:10px;
}
.db-table td {
  padding:5px 10px;
  border-bottom: 1px solid #21262d;
  color: var(--text2);
  transition: all .4s;
}
.db-table tr:last-child td { border-bottom:none; }
.db-table tr.new-row td { 
  background: rgba(63,185,80,.08);
  color: var(--green);
}
.db-table tr.updated-row td {
  background: rgba(88,166,255,.08);
  color: var(--blue);
}
.db-table td .status-badge {
  font-size:10px; padding:1px 6px; border-radius:3px; font-weight:700;
}
.status-PENDING { background:#9e6a03; color:#ffd166; }
.status-PUBLISHED { background:#1a6632; color:#3fb950; }
.status-FAILED { background:#6e1313; color:#f85149; }
.status-DISPATCHED { background:#0d419d; color:#58a6ff; }
.status-COMPLETED { background:#1a6632; color:#3fb950; }
.status-LOCKED { background:#6e1313; color:#f85149; }
.status-OK { background:#1a6632; color:#3fb950; }

/* Kafka 상태 */
.kafka-card {
  background: var(--purple-bg);
  border: 1px solid var(--border);
  border-radius:8px;
  margin-bottom:12px;
  overflow:hidden;
  transition: all .3s;
}
.kafka-card.active-kafka { border-color:var(--purple); }
.kafka-card-header {
  padding:8px 12px;
  border-bottom:1px solid var(--border);
  display:flex; align-items:center; gap:8px;
  font-size:12px; font-weight:600; color:var(--purple);
}
.kafka-msg {
  padding:8px 12px;
  font-size:11px; font-family:monospace;
  color:var(--text2);
  border-bottom:1px solid #21262d;
  transition: all .3s;
}
.kafka-msg.new-msg { color:var(--purple); background:rgba(188,140,255,.05); }
.kafka-msg.empty { color:#30363d; font-style:italic; }

/* 네비 버튼 */
.nav-buttons {
  display:flex; gap:12px; margin-top:20px;
}
.btn {
  padding:10px 20px; border-radius:8px;
  border:1px solid var(--border);
  background:var(--bg2); color:var(--text);
  font-size:13px; font-weight:600;
  cursor:pointer; transition:all .2s;
  display:flex; align-items:center; gap:6px;
}
.btn:hover { background:var(--bg3); }
.btn.primary { background:var(--blue); border-color:var(--blue); color:#000; }
.btn.primary:hover { opacity:.9; }
.btn.primary.green { background:var(--green); border-color:var(--green); }
.btn.primary.orange { background:var(--orange); border-color:var(--orange); }
.btn:disabled { opacity:.3; cursor:not-allowed; }

/* 진행 바 */
.progress-bar {
  height:3px; background:var(--border); margin-bottom:20px; border-radius:2px;
  overflow:hidden;
}
.progress-fill {
  height:100%; background:var(--blue);
  border-radius:2px; transition:width .4s ease;
}
.progress-fill.green { background:var(--green); }
.progress-fill.orange { background:var(--orange); }

/* 완료 배너 */
.complete-banner {
  background: var(--green-bg);
  border: 1px solid var(--green-border);
  border-radius:10px;
  padding:20px;
  text-align:center;
  margin-top:20px;
}
.complete-banner h3 { color:var(--green); font-size:18px; margin-bottom:8px; }
.complete-banner p { color:var(--text2); font-size:13px; }

@media (max-width:1100px) {
  .main { grid-template-columns: 260px 1fr; }
  .state-panel { display:none; }
}
</style>
</head>
<body>

<!-- ── 상단 헤더 ── -->
<div class="top-header">
  <span class="logo">📬</span>
  <span class="top-title">Outbox 패턴 워크스루</span>
  <div class="scenario-tabs">
    <button class="stab active" onclick="loadScenario('A')">🔐 시나리오 A — 인증 완료 흐름</button>
    <button class="stab" onclick="loadScenario('B')">🚫 시나리오 B — 회원 탈퇴/정지</button>
    <button class="stab" onclick="loadScenario('C')">🤝 시나리오 C — Handoff + Webhook</button>
  </div>
</div>

<div class="main">
  <!-- 왼쪽 스텝 패널 -->
  <div class="step-panel" id="stepPanel"></div>

  <!-- 중앙 콘텐츠 -->
  <div class="content-panel" id="contentPanel"></div>

  <!-- 오른쪽 상태 패널 -->
  <div class="state-panel" id="statePanel">
    <div class="state-panel-title">💾 현재 DB / Kafka 상태</div>
    <div id="stateContent"></div>
  </div>
</div>

<script>
// ══════════════════════════════════════════════════════════════════
// 시나리오 데이터 정의
// ══════════════════════════════════════════════════════════════════

const SCENARIOS = {

// ══════════════════════════════════════════════════════════════════
// 시나리오 A: 인증 완료 흐름
// 실제 파일: KeycloakCallbackService.java, QSignOutboxRepository.java,
//            OutboxRelay.java, QsignAuthEventConsumer.java, AuthResultCacheService.java
// ══════════════════════════════════════════════════════════════════
A: {
  icon: '🔐',
  color: 'blue',
  title: '인증 완료 → Kafka → Redis Pre-warming',
  desc: '사용자가 PASS/카카오 등으로 인증을 완료합니다. Q-Sign이 AuthResult + Outbox를 같은 트랜잭션에 저장하고, Relay가 Kafka로 발행하면 IdO가 수신해 Redis에 미리 캐싱합니다. 60,000명 동시 접속에도 DB 부하 없이 대응합니다.',
  steps: [
    {
      actor: 'Q-Sign 서버 (8082)',
      actorColor: 'blue',
      title: 'Keycloak이 인증 완료 후 Q-Sign으로 콜백을 보낸다',
      sub: 'KeycloakCallbackService.handleCallback(code, state)',
      explain: `
        사용자가 PASS/카카오/네이버 인증을 마치면 Keycloak이 <code>code</code>와 <code>state</code>를 담아 Q-Sign(포트 8082)의 콜백 URL로 리다이렉트합니다.<br><br>
        <strong>KeycloakCallbackService.handleCallback()</strong>이 진입점입니다. 이 메서드에는 <strong>@Transactional</strong>이 붙어 있어, 내부의 모든 DB 작업이 하나의 트랜잭션으로 묶입니다.<br><br>
        처리 순서: ① state 검증(Redis 1회 소비, CSRF 방어) → ② Keycloak에서 id_token 교환 → ③ JWKS RS256 서명 검증 → ④ nonce/audience/exp 검증 → ⑤ SHA-256(sub) → identifierHash → ⑥ 잠금 상태 확인 → ⑦ AuthResult + Outbox 저장
      `,
      code: {
        lang: 'java', label: 'q-sign/…/keycloak/KeycloakCallbackService.java',
        content: `<span class="hl-comment">// 파일: q-sign/src/main/java/kr/go/smes/qsign/keycloak/KeycloakCallbackService.java</span>
<span class="hl-comment">// 실행 위치: Q-Sign 서버 (포트 8082)</span>
<span class="hl-comment">// 진입 시점: Keycloak이 인증 완료 후 /keycloak/callback?code=...&amp;state=... 리다이렉트</span>

<span class="hl-anno">@Transactional</span>  <span class="hl-comment">// ← 이 어노테이션이 핵심! 아래 DB 작업 전체가 하나로 묶임</span>
<span class="hl-kw">public</span> String <span class="hl-method">handleCallback</span>(String code, String state) {

    <span class="hl-comment">// ① state 검증 (Redis 1회 소비 — CSRF 방어)</span>
    KeycloakStateEntry stateEntry = stateStore.<span class="hl-method">consumeAndValidate</span>(state)
            .<span class="hl-method">orElseThrow</span>(() -&gt; <span class="hl-kw">new</span> PlatformException(
                    PlatformErrorCode.IDP_SIGNATURE_MISMATCH, ...));

    String correlationId  = stateEntry.<span class="hl-method">getCorrelationId</span>();
    String requestedLevel = stateEntry.<span class="hl-method">getRequestedLevel</span>();

    <span class="hl-comment">// ② Keycloak Token Endpoint — authorization code 교환</span>
    KeycloakTokenResponse tokenResp = <span class="hl-method">exchangeCode</span>(code, correlationId);
    <span class="hl-comment">// POST {keycloak.tokenEndpoint}  → access_token + id_token</span>

    <span class="hl-comment">// ③ JWKS RS256 서명 검증 → KeycloakIdTokenClaims</span>
    KeycloakIdTokenClaims claims = jwksVerifier.<span class="hl-method">verify</span>(tokenResp.<span class="hl-method">getIdToken</span>(), correlationId);

    <span class="hl-comment">// ④~⑥ nonce/audience/exp 검증, 잠금 상태 확인 (생략)</span>

    <span class="hl-comment">// ⑦ SHA-256(sub) → identifierHash (PII 비보관 원칙)</span>
    String identifierHash = <span class="hl-method">computeIdentifierHash</span>(claims.<span class="hl-method">getSubject</span>(), correlationId);

    <span class="hl-comment">// ⑧ AuthResult + Outbox 저장 (단일 트랜잭션) ← 핵심!</span>
    AuthResult authResult = <span class="hl-method">issueAuthResult</span>(
            correlationId, identifierHash, requestedLevel, providerCode, claims);
    <span class="hl-comment">// → issueAuthResult() 내부에서 authResultRepository.save() + outboxRepository.save() 동시 실행</span>

    <span class="hl-comment">// ⑨ ido FE 세션 발급 요청 (POST /api/internal/v1/oidc/complete)</span>
    <span class="hl-kw">return</span> <span class="hl-method">notifyIdoAndGetRedirect</span>(authResult, returnUrl);
}`
      },
      state: {
        dbs: [
          { name: 'Q-Sign PostgreSQL', icon: '🐘', color: 'blue',
            tables: [{ name: 'qsign.auth_result', cols: ['auth_result_id','status'], rows: [{ cells: ['(비어 있음)',''], empty:true }] }] },
          { name: 'Q-Sign PostgreSQL', icon: '🐘', color: 'blue',
            tables: [{ name: 'qsign.outbox', cols: ['event_id','status'], rows: [{ cells: ['(비어 있음)',''], empty:true }] }] }
        ],
        kafka: [{ topic: 'qsign.auth.events', msgs: [] }]
      }
    },
    {
      actor: 'Q-Sign 서버 DB',
      actorColor: 'green',
      title: 'AuthResult와 Outbox 레코드를 같은 트랜잭션에 저장한다',
      sub: 'issueAuthResult() → authResultRepository.save() + outboxRepository.save()',
      explain: `

       w.payload<span class="hl-sql-val">::text</span> <span class="hl-sql-kw">AS</span> payload,
       w.retry_count, w.max_retry,
       c.signing_secret_hash
<span class="hl-sql-kw">FROM</span>   <span class="hl-sql-tbl">ido.webhook_dispatch_outbox</span> w
<span class="hl-sql-kw">LEFT JOIN</span> <span class="hl-sql-tbl">ido.agency_webhook_config</span> c
       <span class="hl-sql-kw">ON</span> c.agency_code = w.agency_code <span class="hl-sql-kw">AND</span> c.active = <span class="hl-sql-val">TRUE</span>
<span class="hl-sql-kw">WHERE</span>  w.status = <span class="hl-sql-val">'PENDING'</span>
  <span class="hl-sql-kw">AND</span>  (w.next_retry_at <span class="hl-sql-kw">IS NULL</span> <span class="hl-sql-kw">OR</span> w.next_retry_at &lt;= NOW())
<span class="hl-sql-kw">ORDER BY</span> w.created_at <span class="hl-sql-kw">ASC</span>
<span class="hl-sql-kw">LIMIT</span>  <span class="hl-sql-val">50</span>
<span class="hl-highlight"><span class="hl-sql-kw">FOR UPDATE OF</span> w <span class="hl-sql-kw">SKIP LOCKED</span></span>;

<span class="hl-comment">-- ② HTTP 200 성공 시: DISPATCHED로 갱신</span>
<span class="hl-sql-kw">UPDATE</span> <span class="hl-sql-tbl">ido.webhook_dispatch_outbox</span>
<span class="hl-sql-kw">SET</span>    status          = <span class="hl-highlight"><span class="hl-sql-val">'DISPATCHED'</span></span>,
       last_http_status = <span class="hl-sql-val">200</span>,
       dispatched_at    = NOW()
<span class="hl-sql-kw">WHERE</span>  dispatch_id = <span class="hl-sql-val">'disp-uuid-001'</span>;

<span class="hl-comment">-- ③ 실패 시: 지수 백오프 재시도 예약</span>
<span class="hl-comment">-- next_retry_at = NOW() + 2^(retryCount+1) 초</span>
<span class="hl-sql-kw">UPDATE</span> <span class="hl-sql-tbl">ido.webhook_dispatch_outbox</span>
<span class="hl-sql-kw">SET</span>    retry_count      = retry_count + <span class="hl-sql-val">1</span>,
       next_retry_at    = NOW() + (<span class="hl-sql-val">'4 seconds'</span>)<span class="hl-comment">::interval</span>  <span class="hl-comment">-- 2^1=2, 2^2=4, 2^3=8</span>
<span class="hl-sql-kw">WHERE</span>  dispatch_id = <span class="hl-sql-val">'disp-uuid-001'</span>;`
      },
      state: {
        dbs: [
          { name: 'IdO PostgreSQL', icon: '🐘', color: 'purple', active: true,
            tables: [{ name: 'ido.webhook_dispatch_outbox', cols: ['dispatch_id','status','http_status'], rows: [{ cells: ['disp-uuid-001','DISPATCHED','200'], updated:true }] }] }
        ],
        kafka: [{ topic: 'ido.handoff.events', msgs: [
          { text: '✅ HANDOFF_ISSUED → webhook DISPATCHED (HTTP 200) | agencyCode=AGENCY_A', isNew: false }
        ]}]
      }
    },
    {
      actor: '기관 서버',
      actorColor: 'purple',
      title: '기관이 Webhook을 수신하고 HMAC 서명을 검증한다',
      sub: 'X-Webhook-Signature 검증 → ticketId로 /api/v1/handoff/verify 호출',
      explain: `
        기관 서버가 IdO로부터 HTTPS POST를 수신합니다.<br><br>
        수신 즉시 <strong>HMAC-SHA256 서명 검증</strong>을 수행합니다:<br>
        ① <code>X-Webhook-Timestamp</code>가 현재 시각 ±5분 이내인지 확인 (재사용 공격 방지)<br>
        ② <code>signTarget = timestamp + "." + requestBody</code><br>
        ③ <code>expectedSig = "sha256=" + HEX(HmacSHA256(signTarget, sharedSecret))</code><br>
        ④ <code>X-Webhook-Signature == expectedSig</code> 검증<br><br>
        검증 통과 후 payload의 <code>ticketId</code>를 꺼내 IdO의 <code>/api/v1/handoff/verify</code>를 호출합니다. 이때 ticketId만 사용하며, qimUserId나 CI/DN은 webhook payload에 포함되지 않습니다. (보안 원칙)
      `,
      code: {
        lang: 'java', label: '기관 측 수신 처리 예시 (HMAC 검증 방법)',
        content: `<span class="hl-comment">// 기관 서버 측 구현 예시 (실제 기관이 구현해야 할 부분)</span>
<span class="hl-comment">// IdO WebhookDispatchOutboxRelay.buildHeaders() 에서 설정한 헤더 기준</span>

<span class="hl-comment">// ① 타임스탬프 유효성 검사 (±5분 이내)</span>
String timestamp = request.<span class="hl-method">getHeader</span>(<span class="hl-str">"X-Webhook-Timestamp"</span>);
<span class="hl-kw">long</span> ts = Long.<span class="hl-method">parseLong</span>(timestamp);
<span class="hl-kw">long</span> now = Instant.<span class="hl-method">now</span>().<span class="hl-method">getEpochSecond</span>();
<span class="hl-kw">if</span> (Math.<span class="hl-method">abs</span>(now - ts) &gt; <span class="hl-num">300</span>) {
    <span class="hl-kw">return</span> ResponseEntity.<span class="hl-method">status</span>(<span class="hl-num">401</span>).<span class="hl-method">build</span>();  <span class="hl-comment">// 재사용 공격</span>

<span class="hl-highlight">String expectedSig = <span class="hl-method">computeHmac</span>(signTarget, sharedSecret);</span>
<span class="hl-kw">if</span> (!MessageDigest.<span class="hl-method">isEqual</span>(

        ],
        kafka: [{ topic: 'ido.handoff.events', msgs: [

}

}; // END SCENARIOS

// ══════════════════════════════════════════════════════════════════
// 상태 관리
// ══════════════════════════════════════════════════════════════════
let currentScenario = 'A';
let currentStep = 0;

function loadScenario(id) {
  currentScenario = id;
  currentStep = 0;
  document.querySelectorAll('.stab').forEach(b => {
    b.classList.remove('active','green','orange');
  });
  const tabs = document.querySelectorAll('.stab');
  const idx = id === 'A' ? 0 : id === 'B' ? 1 : 2;
  tabs[idx].classList.add('active');
  if (id === 'B') tabs[idx].classList.add('orange');
  render();
}

function goStep(n) {
  const sc = SCENARIOS[currentScenario];
  currentStep = Math.max(0, Math.min(sc.steps.length - 1, n));
  render();
  document.getElementById('contentPanel').scrollTop = 0;
}

// ══════════════════════════════════════════════════════════════════
// 렌더링
// ══════════════════════════════════════════════════════════════════
function render() {
  const sc = SCENARIOS[currentScenario];
  const color = sc.color;
  const step = sc.steps[currentStep];
  const totalSteps = sc.steps.length;
  const progress = Math.round(((currentStep + 1) / totalSteps) * 100);

  // 액센트 컬러 매핑
  const accentMap = { blue: '#58a6ff', green: '#3fb950', orange: '#f0883e', purple: '#bc8cff' };
  const bgMap = { blue: '#0d2137', green: '#0a1f14', orange: '#2a1a08', purple: '#1a0f2a' };
  const borderMap = { blue: '#1f6feb', green: '#238636', orange: '#9e6a03', purple: '#6e40c9' };

  renderStepPanel(sc, color, accentMap);
  renderContent(sc, step, color, progress, totalSteps, accentMap, bgMap, borderMap);
  renderState(step, color, accentMap, borderMap);
}

function renderStepPanel(sc, color, accentMap) {
  const panel = document.getElementById('stepPanel');
  const colorName = color === 'blue' ? sc.icon + ' 인증 흐름' : sc.icon + ' ' + sc.title.split('→')[0];
  let html = `<div class="step-panel-title">${sc.icon} ${sc.title.split('→')[0].trim()}</div>`;
  sc.steps.forEach((s, i) => {
    const isActive = i === currentStep;
    const isDone = i < currentStep;
    const activeClass = isActive ? `active ${color}` : '';
    const doneClass = isDone ? 'done' : '';
    html += `
      <div class="step-item ${activeClass} ${doneClass}" onclick="goStep(${i})">
        <div class="step-num">${isDone ? '✓' : i + 1}</div>
        <div class="step-meta">
          <div class="step-actor">${s.actor}</div>
          <div class="step-title">${s.title}</div>
          <div class="step-sub">${s.sub}</div>
        </div>
      </div>`;
  });
  panel.innerHTML = html;
}

function renderContent(sc, step, color, progress, totalSteps, accentMap, bgMap, borderMap) {
  const accent = accentMap[color];
  const bg = bgMap[color];
  const border = borderMap[color];

  let codeHtml = '';
  if (step.code) {
    codeHtml += `
      <div class="code-wrap">
        <div class="code-label">
          <div class="dot" style="background:${accent}"></div>
          Java 코드 — ${step.code.label}
        </div>
        <pre>${step.code.content}</pre>
      </div>`;
  }
  if (step.sql) {
    codeHtml += `
      <div class="code-wrap">
        <div class="code-label">
          <div class="dot" style="background:#f0883e"></div>
          SQL — ${step.sql.label}
        </div>
        <pre>${step.sql.content}</pre>
      </div>`;
  }

  const html = `
    <div class="scenario-header">
      <div class="scenario-badge" style="background:${bg};color:${accent};border:1px solid ${border}">
        ${sc.icon} 시나리오 ${currentScenario}
      </div>
      <h2>${sc.title}</h2>
      <p>${sc.desc}</p>
    </div>

    <div class="progress-bar">
      <div class="progress-fill ${color}" style="width:${progress}%"></div>
    </div>

    <div class="step-card">
      <div class="step-card-header" style="background:${bg}20">
        <div class="step-card-num" style="background:${accent};color:#000">${currentStep + 1}</div>
        <div>
          <h3>${step.title}</h3>
          <div style="font-size:12px;color:var(--text2);margin-top:2px">${step.sub}</div>
        </div>
        <div class="actor-tag" style="background:${bg};color:${accent};border:1px solid ${border}">
          ${step.actor}
        </div>
      </div>
      <div class="step-card-body">
        <div class="explain-box">${step.explain}</div>
        ${codeHtml}
      </div>
    </div>

    <div class="nav-buttons">
      <button class="btn" onclick="goStep(${currentStep - 1})" ${currentStep === 0 ? 'disabled' : ''}>
        ← 이전 단계
      </button>
      ${currentStep < totalSteps - 1
        ? `<button class="btn primary ${color}" onclick="goStep(${currentStep + 1})">
             다음 단계 → <span style="font-size:11px;opacity:.8">(${currentStep + 2}/${totalSteps})</span>
           </button>`
        : `<button class="btn primary ${color}" onclick="showComplete()">
             ✅ 완료!
           </button>`
      }
      <span style="margin-left:auto;font-size:12px;color:var(--text2);align-self:center">
        ${currentStep + 1} / ${totalSteps} 단계
      </span>
    </div>

    <div id="completeBanner" style="display:none">
      <div class="complete-banner">
        <h3>🎉 시나리오 ${currentScenario} 완료!</h3>
        <p style="margin-top:8px">${sc.title} 흐름을 모두 살펴봤습니다.<br>다른 시나리오 탭을 클릭해 계속 학습하세요.</p>
      </div>
    </div>
  `;
  document.getElementById('contentPanel').innerHTML = html;
}

function renderState(step, color, accentMap, borderMap) {
  const accent = accentMap[color];
  const border = borderMap[color];
  const state = step.state;
  if (!state) return;

  let html = '';

  // DB 카드들
  if (state.dbs) {
    state.dbs.forEach(db => {
      const isActive = db.active;
      const dbColor = db.color || color;
      const dbAccent = accentMap[dbColor];
      const dbBorder = borderMap[dbColor];
      html += `
        <div class="db-card ${isActive ? 'active-db ' + dbColor : ''}">
          <div class="db-card-header">
            <span class="db-icon">${db.icon}</span>
            <span>${db.name}</span>
            ${isActive ? `<span class="db-badge" style="background:${bgMap(dbColor)};color:${dbAccent}">활성</span>` : ''}
          </div>`;
      db.tables.forEach(tbl => {
        html += `
          <table class="db-table">
            <thead><tr><th colspan="${tbl.cols.length}" style="color:${isActive ? dbAccent : 'var(--text2)'}">${tbl.name}</th></tr>
            <tr>${tbl.cols.map(c => `<th>${c}</th>`).join('')}</tr></thead>
            <tbody>`;
        tbl.rows.forEach(row => {
          const cls = row.empty ? '' : row.new ? 'new-row' : row.updated ? 'updated-row' : row.highlight ? 'updated-row' : '';
          html += `<tr class="${cls}">`;
          row.cells.forEach((cell, ci) => {
            const isStatus = ['PENDING','PUBLISHED','FAILED','DISPATCHED','COMPLETED','LOCKED','OK'].includes(cell);
            html += `<td>${isStatus ? `<span class="status-badge status-${cell}">${cell}</span>` : cell}</td>`;
          });
          html += '</tr>';
        });
        html += '</tbody></table>';
      });
      html += '</div>';
    });
  }

  // Kafka 카드들
  if (state.kafka) {
    state.kafka.forEach(kf => {
      html += `
        <div class="kafka-card ${kf.msgs && kf.msgs.length ? 'active-kafka' : ''}">
          <div class="kafka-card-header">
            <span>⚡</span>
            <span>Kafka: ${kf.topic}</span>
          </div>`;
      if (!kf.msgs || kf.msgs.length === 0) {
        html += `<div class="kafka-msg empty">(메시지 없음)</div>`;
      } else {
        kf.msgs.forEach(m => {
          html += `<div class="kafka-msg ${m.isNew ? 'new-msg' : ''}">${m.text}</div>`;
        });
      }
      html += '</div>';
    });
  }

  document.getElementById('stateContent').innerHTML = html;
}

function bgMap(color) {
  return { blue: '#0d2137', green: '#0a1f14', orange: '#2a1a08', purple: '#1a0f2a', red: '#1a0f0f' }[color] || '#0d2137';
}

function showComplete() {
  const el = document.getElementById('completeBanner');
  if (el) el.style.display = 'block';
}

// 초기 로드
loadScenario('A');
</script>
