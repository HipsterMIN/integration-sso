# Idem 관리 콘솔 — 정적 SPA + /api → idem-hub 같은 출처 프록시.
# 관리자 인증·인가는 전부 hub 가 한다(docs/admin-auth.md). 이 서버는 쿠키·헤더를 그대로 전달할 뿐이다.
upstream idem_hub {
    server idem-hub:8083;
    keepalive 16;
}

server {
    listen       80;
    server_name  _;
    root         /usr/share/nginx/html;
    index        index.html;
    server_tokens off;

    add_header X-Frame-Options        "DENY"  always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header Referrer-Policy        "strict-origin-when-cross-origin" always;
    add_header Permissions-Policy     "camera=(), microphone=(), geolocation=(), payment=(), usb=()" always;
    add_header Content-Security-Policy "default-src 'self'; script-src 'self'; style-src 'self' 'unsafe-inline'; img-src 'self' data:; connect-src 'self'; font-src 'self'; frame-ancestors 'none'; form-action 'self'; base-uri 'self'" always;

    gzip on; gzip_types text/css application/javascript application/json image/svg+xml; gzip_min_length 256;

    location = /nginx-health { return 200 'ok'; add_header Content-Type text/plain; }

    # 관리 API 만 넘긴다 — 콘솔은 /api/v1/admin/** 외에 부를 것이 없다
    location /api/v1/admin/ {
        proxy_pass         http://idem_hub;
        proxy_http_version 1.1;
        proxy_set_header   Connection        "";
        proxy_set_header   Host              $host;
        proxy_set_header   X-Real-IP         $remote_addr;
        proxy_set_header   X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header   X-Forwarded-Proto $scheme;
        proxy_read_timeout 30s;
    }
    location /api/ { return 404; }

    location /assets/ { expires 1y; add_header Cache-Control "public, immutable"; }
    location / { try_files $uri /index.html; add_header Cache-Control "no-store"; }
}
