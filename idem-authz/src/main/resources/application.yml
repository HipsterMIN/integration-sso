server:
  port: 8086
  shutdown: graceful

spring:
  application:
    name: idem-authz
  lifecycle:
    timeout-per-shutdown-phase: 20s

  jackson:
    serialization:
      write-dates-as-timestamps: false
    time-zone: UTC
    deserialization:
      fail-on-unknown-properties: false

  datasource:
    url: jdbc:postgresql://${IDEM_AUTHZ_DB_HOST:${DB_HOST:localhost}}:${IDEM_AUTHZ_DB_PORT:${DB_PORT:5432}}/${IDEM_AUTHZ_DB_NAME:${DB_NAME:idem}}?currentSchema=idem_authz&sslmode=${IDEM_AUTHZ_DB_SSLMODE:${DB_SSLMODE:disable}}
    username: ${IDEM_AUTHZ_DB_USERNAME:${DB_USERNAME:idem}}
    password: ${IDEM_AUTHZ_DB_PASSWORD:${DB_PASSWORD:idem}}
    driver-class-name: org.postgresql.Driver
    hikari:
      pool-name: authz-hikari
      maximum-pool-size: 10
      minimum-idle: 2
      idle-timeout: 300000
      connection-timeout: 30000
      max-lifetime: 1800000
      keepalive-time: 60000
      connection-test-query: SELECT 1

  jpa:
    hibernate:
      ddl-auto: validate
    show-sql: false
    open-in-view: false
    properties:
      hibernate:
        dialect: org.hibernate.dialect.PostgreSQLDialect
        default_schema: idem_authz
        jdbc:
          time_zone: UTC

  flyway:
    enabled: true
    locations: classpath:db/migration
    schemas: idem_authz
    default-schema: idem_authz
    baseline-on-migrate: true
    baseline-version: 0
    validate-on-migrate: true
    out-of-order: false
    connect-retries: 5
    connect-retries-interval: 10s

# ── 내부 전용 API 보안 ────────────────────────────────────────────────────────
# /api/v1/internal/** 는 ido(플랫폼 PEP/Claim Issuer)만 호출 가능.
# 키 미설정 시 모든 내부 요청을 401로 거부(fail-closed) — InternalApiKeyInterceptor 참조.
idem.authz:
  security:
    internal-api-key: ${IDEM_AUTHZ_INTERNAL_API_KEY:}
  # 한시 권한(JIT) 만료 전이 스케줄러 — expires_at 경과 ACTIVE → EXPIRED
  # 다중 인스턴스 운영 시 ShedLock 도입 권장(현재 단일 리더 가정).
  expiry:
    enabled: ${IDEM_AUTHZ_EXPIRY_ENABLED:true}
    scan-interval-ms: ${IDEM_AUTHZ_EXPIRY_SCAN_INTERVAL_MS:60000}
    initial-delay-ms: ${IDEM_AUTHZ_EXPIRY_INITIAL_DELAY_MS:30000}
    batch-size: ${IDEM_AUTHZ_EXPIRY_BATCH_SIZE:500}

management:
  # 1.0.1 (3차 점검 M7): actuator 를 별도 관리 포트로 뗄 수 있다 — Helm 은 IDEM_MANAGEMENT_PORT=9090 을 주고 Service/Ingress 는 앱 포트만 내보낸다.
  # 비어 있거나 앱 포트와 같으면 종전처럼 앱 포트에 함께 뜬다(compose·로컬).
  server:
    port: ${IDEM_MANAGEMENT_PORT:${server.port}}
  endpoints:
    web:
      exposure:
        include: health,info,metrics,prometheus,flyway
  endpoint:
    health:
      show-details: when-authorized
      probes:
        enabled: true
  metrics:
    tags:
      application: ${spring.application.name}

logging:
  level:
    io.github.hipstermin.idem.authz: INFO
    org.flywaydb: INFO

springdoc:
  api-docs:
    path: /api-docs
  swagger-ui:
    path: /swagger-ui.html
