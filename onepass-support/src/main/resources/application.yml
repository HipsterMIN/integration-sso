server:
  port: 8085
  shutdown: graceful

spring:
  application:
    name: onepass-support
  lifecycle:
    timeout-per-shutdown-phase: 20s

  jackson:
    serialization:
      write-dates-as-timestamps: false
    time-zone: UTC
    deserialization:
      fail-on-unknown-properties: false

  datasource:
    url: jdbc:postgresql://${SUPPORT_DB_HOST:${DB_HOST:localhost}}:${SUPPORT_DB_PORT:${DB_PORT:5432}}/${SUPPORT_DB_NAME:${DB_NAME:onepass}}?currentSchema=support&sslmode=${SUPPORT_DB_SSLMODE:disable}
    username: ${SUPPORT_DB_USERNAME:${DB_USERNAME:onepass}}
    password: ${SUPPORT_DB_PASSWORD:${DB_PASSWORD:onepass}}
    driver-class-name: org.postgresql.Driver
    hikari:
      pool-name: support-hikari
      maximum-pool-size: 10
      minimum-idle: 2
      idle-timeout: 300000
      connection-timeout: 30000
      max-lifetime: 1800000
      keepalive-time: 60000
      connection-test-query: SELECT 1

  jpa:
    hibernate:
      ddl-auto: validate
    show-sql: false
    open-in-view: false
    properties:
      hibernate:
        dialect: org.hibernate.dialect.PostgreSQLDialect
        default_schema: support
        jdbc:
          time_zone: UTC

  flyway:
    enabled: true
    locations: classpath:db/migration
    schemas: support
    default-schema: support
    baseline-on-migrate: true
    baseline-version: 0
    validate-on-migrate: true
    out-of-order: false
    connect-retries: 5
    connect-retries-interval: 10s

management:
  endpoints:
    web:
      exposure:
        include: health,info,metrics,prometheus,flyway
  endpoint:
    health:
      show-details: when-authorized
      probes:
        enabled: true
  metrics:
    tags:
      application: ${spring.application.name}

logging:
  level:
    kr.go.smes.support: INFO
    org.flywaydb: INFO
