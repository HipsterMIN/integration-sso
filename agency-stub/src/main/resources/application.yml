server:
  port: 8084
  shutdown: graceful

spring:
  application:
    name: agency-stub
  lifecycle:
    timeout-per-shutdown-phase: 20s

  # ── DataSource ──────────────────────────────────────────────
  datasource:
    url: jdbc:postgresql://${DB_HOST:localhost}:${DB_PORT:5432}/${DB_NAME:onepass}?currentSchema=agency_stub
    username: ${DB_USERNAME:onepass}
    password: ${DB_PASSWORD:onepass}
    driver-class-name: org.postgresql.Driver
    hikari:
      pool-name: agency-stub-hikari
      maximum-pool-size: 10
      minimum-idle: 3
      idle-timeout: 300000
      connection-timeout: 30000
      max-lifetime: 1800000
      keepalive-time: 60000
      connection-test-query: SELECT 1

  # ── JPA ────────────────────────────────────────────────────
  jpa:
    hibernate:
      ddl-auto: validate
    show-sql: false
    open-in-view: false
    properties:
      hibernate:
        dialect: org.hibernate.dialect.PostgreSQLDialect
        default_schema: agency_stub
        jdbc:
          time_zone: UTC

  # ── Flyway ─────────────────────────────────────────────────
  flyway:
    enabled: true
    locations: classpath:db/migration
    schemas: agency_stub
    default-schema: agency_stub
    baseline-on-migrate: true
    baseline-version: 0
    validate-on-migrate: true
    out-of-order: false
    connect-retries: 5
    connect-retries-interval: 10s

  # ── Redis (로컬 세션 캐시 보조) ─────────────────────────────
  data:
    redis:
      host: ${REDIS_HOST:localhost}
      port: ${REDIS_PORT:6379}
      password: ${REDIS_PASSWORD:}
      timeout: 2000ms
      lettuce:
        pool:
          max-active: 10
          max-idle: 5
          min-idle: 1
          max-wait: 1000ms

  # ── Kafka ──────────────────────────────────────────────────
  kafka:
    bootstrap-servers: ${KAFKA_SERVERS:localhost:9092}
    properties:
      security.protocol: PLAINTEXT
    consumer:
      group-id: agency-stub-consumer
      auto-offset-reset: earliest
      enable-auto-commit: false
      max-poll-records: 50
      key-deserializer: org.apache.kafka.common.serialization.StringDeserializer
      value-deserializer: org.springframework.kafka.support.serializer.JsonDeserializer
      properties:
        spring.json.trusted.packages: "com.onepass.*"
        isolation.level: read_committed
    listener:
      ack-mode: MANUAL_IMMEDIATE
      concurrency: 2
      missing-topics-fatal: true

# ── Agency-Stub 도메인 설정 ────────────────────────────────────
agency-stub:
  code: AGENCY_STUB_001
  # §11 IdO Verify API 연동
  ido:
    base-url: ${IDO_BASE_URL:http://localhost:8083}
    api-key: ${AGENCY_API_KEY:stub-api-key-dev}
    connect-timeout-ms: 3000
    read-timeout-ms: 5000

  # §14.6 기관 로컬 세션
  session:
    cookie-name: AGSID
    idle-timeout-minutes: 30
    absolute-timeout-minutes: 480    # 8시간 절대 만료
    same-site: Strict
    secure: true
    http-only: true

  # §14.8 기관 최소 인증 수준
  min-auth-level: L1

  # Kafka 토픽 구독
  kafka:
    consumer-group: agency-stub-consumer
    topic-handoff-events: ido.handoff.events
    topic-session-advisory: platform.session.advisory

# ── Actuator ──────────────────────────────────────────────────
management:
  endpoints:
    web:
      exposure:
        include: health,info,metrics,prometheus,flyway
  endpoint:
    health:
      show-details: when-authorized
      probes:
        enabled: true
  metrics:
    tags:
      application: ${spring.application.name}

logging:
  level:
    com.onepass.agency: INFO
    org.springframework.kafka: WARN
    org.flywaydb: INFO
