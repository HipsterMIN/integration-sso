server:
  port: 8083
  shutdown: graceful
  servlet:
    session:
      timeout: 30m
      cookie:
        name: feSessionId
        http-only: true
        secure: true
        same-site: lax

spring:
  application:
    name: idem-hub
  lifecycle:
    timeout-per-shutdown-phase: 20s

  # ── DataSource ──────────────────────────────────────────────
  datasource:
    url: jdbc:postgresql://${DB_HOST:localhost}:${DB_PORT:5432}/${DB_NAME:idem}?currentSchema=idem_hub&sslmode=disable
    username: ${DB_USERNAME:idem}
    password: ${DB_PASSWORD:idem}
    driver-class-name: org.postgresql.Driver
    hikari:
      pool-name: ido-hikari
      maximum-pool-size: 20
      minimum-idle: 5
      idle-timeout: 300000
      connection-timeout: 30000
      max-lifetime: 1800000
      keepalive-time: 60000
      connection-test-query: SELECT 1

  # ── JPA ────────────────────────────────────────────────────
  jpa:
    hibernate:
      ddl-auto: validate
    show-sql: false
    open-in-view: false
    properties:
      hibernate:
        dialect: org.hibernate.dialect.PostgreSQLDialect
        default_schema: idem_hub
        jdbc:
          time_zone: UTC
          batch_size: 50
        order_inserts: true
        order_updates: true

  # ── Flyway ─────────────────────────────────────────────────
  flyway:
    enabled: true
    locations: classpath:db/migration
    schemas: idem_hub
    default-schema: idem_hub
    baseline-on-migrate: true
    baseline-version: 0
    validate-on-migrate: false   # V1 멱등화(IF NOT EXISTS) 후 체크섬 변경 허용
    repair-on-migrate: true      # 체크섬 불일치 시 자동 repair 후 migrate
    out-of-order: false
    connect-retries: 5
    connect-retries-interval: 10s

  # ── Redis ──────────────────────────────────────────────────
  data:
    redis:
      host: ${REDIS_HOST:localhost}
      port: ${REDIS_PORT:6379}
      password: ${REDIS_PASSWORD:}
      timeout: 2000ms
      lettuce:
        pool:
          max-active: 20
          max-idle: 8
          min-idle: 2
          max-wait: 1000ms

  # ── Kafka ──────────────────────────────────────────────────
  kafka:
    bootstrap-servers: ${KAFKA_SERVERS:localhost:9092}
    properties:
      security.protocol: PLAINTEXT
    producer:
      client-id: idem-hub-producer
      key-serializer: org.apache.kafka.common.serialization.StringSerializer
      value-serializer: org.springframework.kafka.support.serializer.JsonSerializer
      acks: all
      retries: 3
      batch-size: 16384
      linger-ms: 5
      compression-type: lz4
      properties:
        enable.idempotence: "true"
        max.in.flight.requests.per.connection: "5"
        spring.json.add.type.headers: "false"
        transactional.id: ido-tx-producer
    consumer:
      group-id: idem-hub-registry-consumer          # Q-IM 이벤트 수신 컨슈머 그룹
      auto-offset-reset: earliest
      enable-auto-commit: false
      max-poll-records: 50
      key-deserializer: org.apache.kafka.common.serialization.StringDeserializer
      value-deserializer: org.springframework.kafka.support.serializer.JsonDeserializer
      properties:
        spring.json.trusted.packages: "io.github.hipstermin.idem.*"
        isolation.level: read_committed
    listener:
      ack-mode: MANUAL_IMMEDIATE
      concurrency: 3
      missing-topics-fatal: true

# ── IdO 도메인 설정 ────────────────────────────────────────────
idem.hub:

  # ── S7-T2: NICE/OACX 본인인증 연동 (AuthProperties 바인딩) ──────────────
  # 설계 결정: Q1=B(API Key 없음), Q2=B(callback 추가), Q3=B(CI FE 미반환), Q4=A(WebClient)
  auth:
    # ── NICE 휴대폰 본인인증 (S5a: idem-plugin-nice-oacx 가 이 키를 바인딩한다 — 코어에는 NICE 코드 없음) ──
    # NICE IDO 인증 서버: https://auth.niceid.co.kr
    # NICE 계약 후 발급받은 clientId/clientSecret 필수
    nice:
      # NICE 클라이언트 ID — 운영: NICE_CLIENT_ID 환경변수 필수 설정
      client-id: ${NICE_CLIENT_ID:}
      # NICE 클라이언트 시크릿 — 운영: NICE_CLIENT_SECRET 환경변수 필수 설정 (절대 코드에 하드코딩 금지)
      client-secret: ${NICE_CLIENT_SECRET:}
      # NICE 인증 완료 후 리다이렉트 URL (FE 팝업 결과 수신 페이지)
      # 개발: http://localhost:3000/otp/auth-result (React dev-server)
      # 운영: https://portal.example.org/otp/auth-result (실제 도메인)
      return-url: ${NICE_RETURN_URL:http://localhost:3000/otp/auth-result}
      # NICE API 응답 타임아웃 (초) — 기본 10초
      timeout-seconds: ${NICE_TIMEOUT_SECONDS:10}
      # NICE API 기본 URL — 통합 테스트(WireMock)에서만 바꾼다
      base-url: ${NICE_BASE_URL:https://auth.niceid.co.kr}

    # ── OACX 전자서명 중계모듈 (S5a: 플러그인이 바인딩. SDK 는 저장소 밖 vendor-libs 에서 공급, 없으면 제공자 미등록) ──
    oacx:
      # OACX provider key JSON 파일 절대 경로
      # OACX 운영사에서 발급한 파일 — 운영: OACX_PROVIDER_KEY_PATH 환경변수 필수 설정
      # 예: /app/config/oacx-provider-key.json
      provider-key-path: ${OACX_PROVIDER_KEY_PATH:}
      # OACX SDK 디버그 모드 — 개발/검증: true, 운영: 반드시 false
      debug-mode: ${OACX_DEBUG_MODE:false}

    # (S8-a) 통합인증 서버 설정(기업인증 콜백)은 KR 에디션(idem-kr-hub) 기본값으로 이동

    # ── Auth 엔드포인트 IP 기반 Rate Limiting (S9-T7) ─────────────────────────
    # /api/v1/auth/** 경로 전용 제한 (NICE/OACX 인증 API 남용 방지)
    # 기관별 Rate Limit(AgencyRateLimiter)과 독립적으로 동작 (AND 조건)
    # ⚠️ F-01 독립 환경변수: IDEM_HUB_AUTH_RL_ENABLED (F-02의 IDEM_HUB_RATE_LIMIT_ENABLED와 분리)
    rate-limit:
      enabled:    ${IDEM_HUB_AUTH_RL_ENABLED:true}
      # TPS: 초당 최대 요청 수 (IP 단위)
      # 기본 20 req/s — 정상 사용자는 버튼 1회 클릭 시 1~3 req 발생
      # NICE 인증 flow: URL 발급(1) + 결과 조회(1) = 2 req
      tps:        ${IDEM_HUB_AUTH_RL_TPS:20}
      # 분당 최대 요청 수 (IP 단위)
      # 기본 100 req/min — 연속 재시도 허용 범위
      per-minute: ${IDEM_HUB_AUTH_RL_PER_MIN:100}
      # 일별 최대 요청 수 (IP 단위)
      # 기본 1000 req/day — 하루 인증 시도 횟수 제한
      daily:      ${IDEM_HUB_AUTH_RL_DAILY:1000}

  # ── F4.8 (Sprint β-2) 내부 호출자 인증 ─────────────────────────────────
  # /api/v1/fe-session (POST), /api/v1/fe-session/conversion (POST) 호출 시
  # X-Internal-Caller + X-Internal-Api-Key 헤더 검증.
  #
  # 운영: 각 호출 서비스(q-sign, outbox-relay 등)별로 강력한 무작위 키(≥32자)를
  # K8s Secret / Vault → 환경변수로 주입한다.
  #   IDEM_HUB_INTERNAL_API_KEY_GATE=<openssl rand -hex 32>
  #
  # ⚠️ allow-empty-callers=false 운영 시 callers 가 비면 부팅 실패 (F4.3 패턴 재사용).
  internal:
    callers:
      idem-gate:  ${IDEM_HUB_INTERNAL_API_KEY_GATE:}
      idem-relay: ${IDEM_HUB_INTERNAL_API_KEY_RELAY:}
    allow-empty-callers: ${IDEM_HUB_INTERNAL_ALLOW_EMPTY_CALLERS:false}
    # D2 fail-secure: IDEM_HUB_INTERNAL_SIG_SECRET 이 비면 기동 거부 (FailSecureBootGuard). 로컬·테스트에서만 true
    allow-empty-sig-secret: ${IDEM_HUB_INTERNAL_ALLOW_EMPTY_SIG_SECRET:false}

  # §11.5 Q-IM 연동
  registry:
    base-url: ${IDEM_REGISTRY_BASE_URL:http://localhost:8082}
    cache-ttl-seconds: 300           # ≤5분 (설계서 §11.3)
    agency-meta-ttl-seconds: 3600    # ≤60분 (기관 메타·정책 캐시)
    connect-timeout-ms: 3000
    read-timeout-ms: 5000
    # [P2 수정] Q-IM 내부 API 호출 키 — 환경변수 주입 (하드코딩 'ido-internal' 제거)
    # 운영: K8s Secret / Vault → IDEM_HUB_REGISTRY_INTERNAL_API_KEY 환경변수로 주입
    # 로컬 개발: docker-compose.yml에서 IDEM_HUB_REGISTRY_INTERNAL_API_KEY=ido-internal 설정
    # ⚠️ 미설정 시 Q-IM API 호출 시 X-Internal-Api-Key 헤더 누락 → Q-IM 서버 401 응답
    internal-api-key: ${IDEM_HUB_REGISTRY_INTERNAL_API_KEY:}
    # Q-IM 외부 API 키 — ExtProxyController가 FE 대신 X-Ext-Api-Key 헤더로 주입 (Q3=B)
    # FE webpack DefinePlugin EXT_API_KEY 번들 노출 문제 해결:
    # FE extInstance → beApiInstance 전환 후 이 환경변수로 API Key 관리
    # 운영: K8s Secret / Vault → IDEM_HUB_REGISTRY_EXT_API_KEY 환경변수로 주입
    ext-api-key: ${IDEM_HUB_REGISTRY_EXT_API_KEY:}
    # ── Q-IM → IdO 아웃바운드 수신 API (SP 역할) ─────────────────────────
    # Q-IM 관리 콘솔에서 발급한 API Key PBKDF2 해시
    # 포맷: pbkdf2:{iterations}:{saltBase64}:{hashBase64}
    # 생성: scripts/generate-api-key-hash.sh 스크립트 사용
    # 운영: IDEM_REGISTRY_INBOUND_API_KEY_HASH 환경변수 필수 설정 (미설정 시 모든 SP API 거부)
    inbound-api-key-hash: ${IDEM_REGISTRY_INBOUND_API_KEY_HASH:}
    # Q-IM과 협의하여 발급받은 AES-256 공유키 (Base64 인코딩, 32바이트 디코드)
    # [합의 필요 #1] Q-IM 팀과 암호화 스펙(transformation/IV 방식) 협의 후 확정
    # 운영: IDEM_REGISTRY_AES_SHARED_KEY 환경변수 필수 설정 (미설정 시 AES 복호화 불가)
    aes-shared-key: ${IDEM_REGISTRY_AES_SHARED_KEY:}
    # D2 fail-secure: 공유키가 비었거나 placeholder·길이 오류면 기동 거부. 로컬·테스트에서만 true
    allow-empty-aes-key: ${IDEM_HUB_REGISTRY_ALLOW_EMPTY_AES_KEY:false}
    # AES 변환 방식 (Q-IM 팀 합의 후 IDEM_REGISTRY_AES_TRANSFORMATION 환경변수로 확정)
    aes-transformation: ${IDEM_REGISTRY_AES_TRANSFORMATION:AES/CBC/PKCS5Padding}
    # AES IV 길이 (바이트, 기본 16)
    aes-iv-length: ${IDEM_REGISTRY_AES_IV_LENGTH:16}
    # SP 수신 API 멱등성 키 TTL (일) — sp_receiver_idempotency.expires_at 기준
    idempotency-ttl-days: 7
    # SP 수신 감사 로그 활성화 (운영: true 권장)
    receiver-audit-enabled: ${IDEM_REGISTRY_RECEIVER_AUDIT:true}

  # (S8-a) FE AES-GCM 키(CI 토큰 교환)는 KR 에디션(idem-kr-hub) 기본값으로 이동

  # 연합 인가(Federated Authorization) — Q-Authz 연동
  # 토큰(CAST/Handoff) 발급 시 사용자×대상기관 유효 역할 조회 → roles[] 클레임 임베드.
  # GET /api/v1/internal/authz/users/{qimUserId}/effective-roles?agencyCode=...
  # ⚠️ 장애·미설정 시 QAuthzClient가 fail-open(빈 역할) — SSO/Handoff 발급은 계속됨.
  authz:
    # D2 fail-secure: authz 조회 실패 = 거부(503). authz 없는 SSO 단독 설치는 enabled=false 로 명시
    enabled: ${IDEM_HUB_AUTHZ_ENABLED:true}
    allow-empty-api-key: ${IDEM_HUB_AUTHZ_ALLOW_EMPTY_API_KEY:false}
    base-url: ${IDEM_HUB_AUTHZ_BASE_URL:http://localhost:8086}
    connect-timeout-ms: 3000
    read-timeout-ms: 5000
    # 운영: K8s Secret / Vault → IDEM_HUB_AUTHZ_INTERNAL_API_KEY 환경변수 주입
    # 미설정 시 q-authz가 401 → 빈 역할 fail-open(경고 로그)
    internal-api-key: ${IDEM_HUB_AUTHZ_INTERNAL_API_KEY:}

  # §11.8 Q-Sign 연동 — X-Internal-Sig
  gate:
    base-url: ${IDEM_GATE_BASE_URL:http://localhost:8081}
    internal-sig-ttl-seconds: 60
    nonce-ttl-seconds: 60
    connect-timeout-ms: 3000
    read-timeout-ms: 5000
    # X-Internal-Sig HMAC-SHA256 공유 비밀키 (Q-Sign 동일 값 사용)
    # 운영: IDEM_HUB_INTERNAL_SIG_SECRET 환경변수 필수 설정 (최소 32자 이상 무작위 문자열)
    # 생성 예: openssl rand -hex 32
    internal-sig-secret: ${IDEM_HUB_INTERNAL_SIG_SECRET:}

  # ── 브로커 모드 설정 (표준 OIDC 처리 백엔드 선택 — 문서 §6) ────────────
  #
  # ⚠️  이 설정은 "표준 OIDC(카카오·네이버 등)"의 처리 백엔드만 결정한다.
  #     비표준 OIDC(플러그인 직접 브로커 인증수단, PASS 등)는 이 값과 무관하게 ido가 직접 처리한다.
  #
  # qsign    : [표준 OIDC] q-sign에 URL 발급 위임 (기본값)
  # keycloak : [표준 OIDC] ido가 직접 Keycloak Authorization URL 생성
  #
  # [비표준 OIDC] — IDEM_HUB_BROKER_MODE 값과 무관하게 항상 ido 직접 처리:
  #   플러그인 DirectBrokerAdapter 가 맡는 인증수단(KR 에디션 idem-plugin-anyid: MOBILE_ID / EASY_SIGN / JOINT_CERT / FINANCIAL_CERT / PRIVATE_ID)
  #   PASS 등 기타 비표준 → NonOidcBrokerAdapter
  broker:
    # D2 fail-secure: CI 없는 인증 결과를 identifierHash 로 세션 발급하던 PoC 폴백 — 기본 금지(422), 로컬·테스트에서만 true
    allow-ciless-identity: ${IDEM_HUB_BROKER_ALLOW_CILESS_IDENTITY:false}
    mode: ${IDEM_HUB_BROKER_MODE:qsign}
    # D3: 비OIDC 직접 브로커 사업자 목록 — 코어는 비어 있다. KR 에디션 후처리기가 PASS·FINANCIAL_CERT·GPKI·JOINT_CERT 를 넣는다.
    #   providers.{CODE}: { initiate-url: "https://…?callback={callbackUrl}&cid={correlationId}", auth-level: L2, tx-prefix: CODE }
    nonoidc:
      providers: {}

  # ── Any-ID 설치형 연동 설정: S5b 부터 코어에 없다 ─────────────────────────────
  # idem.hub.anyid.* 기본값·환경변수(ANYID_*) 매핑은 plugins/idem-plugin-anyid 의 idem-plugin-anyid-defaults.yml 이 올린다.
  # 운영기관 식별자·자격증명은 환경변수·K8s Secret 으로만 주입한다.

  # ── Keycloak OIDC 브로커 설정 (문서 §7, §10) ──────────────────────────
  # idem.hub.broker.mode=keycloak 전환 시 아래 설정 활성화
  keycloak:
    # Keycloak 서버 URL (로컬: http://localhost:8088, Docker: http://keycloak:8088)
    base-url: ${KEYCLOAK_BASE_URL:http://localhost:8088}
    # Realm 이름 (§10-1)
    realm: ${KEYCLOAK_REALM:idem}
    # idem-hub 클라이언트 ID (§10-2 confidential client)
    client-id: ${KEYCLOAK_CLIENT_ID:idem-hub}
    # idem-hub 클라이언트 시크릿 (§10-2 — Keycloak Admin Console에서 생성)
    # [Sprint γ-1 / F2.1] default("change-me") 제거 → 미설정 시
    # KeycloakProperties.validateClientSecret() 가 부팅을 차단.
    # 테스트/로컬은 idem.hub.keycloak.allow-empty-client-secret=true 로 우회.
    client-secret: ${KEYCLOAK_CLIENT_SECRET:}
    # Keycloak 콜백 redirect_uri (§10-2 Valid Redirect URIs에 등록 필수)
    redirect-uri: ${KEYCLOAK_REDIRECT_URI:http://localhost:8083/api/v1/broker/callback}
    # state/nonce Redis TTL (초) — CSRF 방어
    state-ttl-seconds: 300
    # JWKS 캐시 TTL (초) — 키 로테이션 주기보다 짧게 설정
    jwks-cache-ttl-seconds: 3600
    # HTTP 타임아웃
    connect-timeout-ms: 3000
    read-timeout-ms: 5000
    # kc_idp_hint 매핑 (§10-3 — Keycloak Identity Provider alias)
    idp-hint-mapping:
      kakao: social-kakao
      naver: social-naver
    # ACR → AuthLevel 매핑 (§10-4 — Keycloak ACR Mapper 설정 필요)
    acr-to-auth-level:
      "1": L1
      "2": L2
      "3": L3

  # ── S6 표준 프로토콜(OIDC_RP): Keycloak 을 숨긴 채 기관 RP 를 붙인다 ──────────────
  # issuer 는 gate 공개 URL 아래 /realms/{realm} — Keycloak 의 KC_HOSTNAME_URL(=gate 공개 URL)과 같아야 한다.
  # Keycloak client 는 Idem 이 Service Profile(protocol.oidc)에서 프로비저닝한다(콘솔 조작 없음).
  oidc-rp:
    enabled: ${IDEM_HUB_OIDC_RP_ENABLED:true}
    issuer: ${IDEM_OIDC_ISSUER:${IDEM_PUBLIC_URL_GATE:http://localhost:8081}/realms/${KEYCLOAK_REALM:idem}}
    client-id-prefix: idem-svc-
    provisioner:
      # realm-management(manage-clients·view-clients)만 가진 서비스 계정 — 관리자 비밀번호는 앱이 쓰지 않는다
      client-id: ${KEYCLOAK_PROVISIONER_CLIENT_ID:idem-provisioner}
      client-secret: ${KEYCLOAK_PROVISIONER_CLIENT_SECRET:}
      connect-timeout-ms: 3000
      read-timeout-ms: 5000
    # NOTE(P1): Kafka 인증 이벤트 토픽은 idem.hub.kafka.topic-auth-events 로 통일.
    # KeycloakOidcService / NonOidcAuthService 모두 ${idem.hub.kafka.topic-auth-events} 참조.
    # 이전에 있던 idem.hub.keycloak.auth-events-topic 키는 제거 — idem.hub.kafka.topic-auth-events 사용.

  # ── S7 관리자 인증 (docs/admin-auth.md, ADR-015) ────────────────────────────
  admin:
    bootstrap:
      username: ${IDEM_HUB_ADMIN_BOOTSTRAP_USERNAME:admin}
      password: ${IDEM_HUB_ADMIN_BOOTSTRAP_PASSWORD:}          # 관리자가 없을 때만 쓰인다. 비면 hardened 프로파일은 기동 거부
      require-password-change: true                        # 운영 필수 (FailSecureBootGuard)
    secret-key: ${IDEM_HUB_ADMIN_SECRET_KEY:}                  # TOTP 비밀 봉인 AES-256 키 (base64 32바이트)
    allow-derived-secret-key: ${IDEM_HUB_ADMIN_ALLOW_DERIVED_SECRET_KEY:false}   # 로컬 전용 탈출구
    session:
      idle-minutes: ${IDEM_HUB_ADMIN_SESSION_IDLE_MINUTES:15}
      absolute-minutes: ${IDEM_HUB_ADMIN_SESSION_ABSOLUTE_MINUTES:480}
      concurrent: 1
      mfa-token-seconds: 300
    cookie:
      name: idemAdminSid
      secure: ${IDEM_HUB_ADMIN_COOKIE_SECURE:true}             # http 로컬만 false. 운영 필수 true
      same-site: Strict
    lock:
      max-attempts: 5
      duration-minutes: 15
    mfa:
      required: ${IDEM_HUB_ADMIN_MFA_REQUIRED:true}             # 운영 필수 true
      issuer: ${IDEM_HUB_ADMIN_MFA_ISSUER:Idem}
      window: 1
    password:
      min-length: 10
      min-classes: 3
      history: 3

  # 플랫폼 API 버전 (Webhook 헤더, Payload 등에 사용)
  platform-version: ${IDEM_HUB_PLATFORM_VERSION:1.0}
  # D3: 이 설치본의 플랫폼 코드 — CAST(기관 간 SSO) 의 sourceAgency 등 (종전 고정값 "ONEPASS")
  platform:
    code: ${IDEM_PLATFORM_CODE:IDEM}
  # D3: 날짜 경계·점검 시간·파기 스케줄이 쓰는 시간대. 설치본은 컨테이너 TZ(IDEM_TZ)를 따른다. 코어 기본 UTC (종전 고정값 Asia/Seoul)
  zone: ${IDEM_ZONE:${TZ:UTC}}

  # provider_circuit_config 캐시 (ProviderCircuitBreakerConfig / ProviderConfigRepository)
  provider:
    circuit-cache-ttl-seconds: ${IDEM_HUB_PROVIDER_CIRCUIT_CACHE_TTL:3600}

  # §11.2 기관 정책 기본값
  policy:
    default-version: ${IDEM_HUB_DEFAULT_POLICY_VERSION:1.0}   # 신규 기관 생성 시 policyVersion 기본값

  # §16.4 Handoff Ticket 설정
  ticket:
    ttl-seconds: 60                  # 1회성 TTL
    encryption-algorithm: AES-256-GCM
    signing-algorithm: HMAC-SHA256
    key-rotation-days: 90
    key-grace-period-hours: 24
    reuse-block-threshold: 3
    # ── Handoff Ticket 폴백 키 (Sprint γ-3 / F3.3 후속) ────────────────────
    # KeyVersionRegistry 가 읽는 폴백 키. Redis/DB(KMS) 경로 실패 시 사용된다.
    # 환경변수 IDEM_HUB_HANDOFF_AES_KEY / IDEM_HUB_HANDOFF_HMAC_KEY 로 주입 — 운영 의무.
    # default("AAAA...=" 32바이트 0x00) 제거 →
    #   미설정 시 KeyVersionRegistry.validateFallbackKeys() 가 부팅 차단(CrashLoopBackOff).
    # 32바이트 무작위 키 생성: openssl rand -base64 32
    # 테스트/로컬은 idem.hub.ticket.allow-empty-fallback-keys=true 로 우회.
    aes-key:  ${IDEM_HUB_HANDOFF_AES_KEY:}
    hmac-key: ${IDEM_HUB_HANDOFF_HMAC_KEY:}

  # §16.4.1 Clock Skew 허용
  clock-skew-tolerance-minutes: 5

  # ── FE 세션 설정 (onepass-fe BFF 이관) ──────────────────────────────────
  fe:
    session:
      sliding-ttl-minutes: 30            # §12.4 Sliding TTL
      absolute-timeout-minutes: 480      # §12.4 절대 만료 (8h)
    # returnUrl 화이트리스트 (§12.6 — 기관 callback_whitelist 보조) — 쉼표 구분 목록.
    # 운영기관·연동기관 URL 은 설치 시 IDEM_HUB_FE_ALLOWED_RETURN_URLS 로 주입한다 (코어 기본값은 로컬 개발용, S1 범용화).
    # 주의: 이전에는 YAML 시퀀스였는데 @Value 가 시퀀스를 해석하지 못해 목록이 비어 있었다 → 스칼라(쉼표 구분)로 전환.
    allowed-return-urls: ${IDEM_HUB_FE_ALLOWED_RETURN_URLS:http://localhost:3000,http://localhost:3001}
      - ${AGENCY_STUB_URL:http://localhost:8084}
      - ${REACT_DEV_URL:http://localhost:3000}
      - ${REACT_PROD_URL:http://localhost:3001}

  # (S8-a) 회원 전환 세션 설정은 KR 에디션(idem-kr-hub) 기본값으로 이동

  # Kafka 토픽
  kafka:
    topic-handoff-events: idem.hub.handoff.events
    topic-session-advisory: platform.session.advisory
    # P1 수정: KeycloakOidcService / NonOidcAuthService @Value(${idem.hub.kafka.topic-auth-events}) 키와 일치
    topic-auth-events: ${IDEM_HUB_KAFKA_TOPIC_AUTH_EVENTS:idem.gate.auth.events}
    consumer-group-qim: idem-hub-registry-consumer               # idem.registry.user.events 구독
    consumer-group-qsign: ido-qsign-consumer            # idem.gate.auth.events 구독
    consumer-group-fe-advisory: ido-fe-advisory-consumer  # platform.session.advisory 구독 (FE 세션)
    # Q-IM SP 수신 API 내부 전파 컨슈머 (QimSpMemberEventConsumer) — QIM-OUTBOX-SPEC-001
    # topic-qim-user-events: idem.registry.user.events 로 전환 (KafkaTopicConfig에 신규 빈 추가)
    topic-registry-user-events: ${IDEM_REGISTRY_USER_EVENTS_TOPIC:idem.registry.user.events}
    consumer-group-qim-member: ido-qim-member-consumer
    # idem.registry.agency.events (기관 이벤트, 파티션 3, 보존 365일)
    topic-registry-agency-events: ${IDEM_REGISTRY_AGENCY_EVENTS_TOPIC:idem.registry.agency.events}
    # ── Deprecated (QIM-OUTBOX-SPEC-001 마이그레이션 완료 후 제거 예정) ──────
    topic-registry-sp-member-events: ${IDEM_REGISTRY_SP_MEMBER_TOPIC:idem.registry.sp.member.events}
    consumer-group-qim-sp-member: ido-qim-sp-member-consumer
    # Handoff 이벤트 컨슈머 (HandoffEventConsumer → WebhookDispatcherService)
    consumer-group-handoff: ido-handoff-consumer
    # 60,000명 대응 파티션/복제 설정 (KafkaTopicConfig 참조)
    # PoC: partition-count-main=12(기본), replication-factor=1, min-insync-replicas=1
    # 운영 3-broker: 환경변수 IDEM_HUB_KAFKA_PARTITION_COUNT_MAIN=12, REPLICATION_FACTOR=3, ISR=2
    partition-count-main: ${IDEM_HUB_KAFKA_PARTITION_COUNT_MAIN:12}
    partition-count-dlq:  ${IDEM_HUB_KAFKA_PARTITION_COUNT_DLQ:6}
    replication-factor:   ${IDEM_HUB_KAFKA_REPLICATION_FACTOR:1}
    min-insync-replicas:  ${IDEM_HUB_KAFKA_MIN_INSYNC_REPLICAS:1}

  # ── Webhook Dispatcher 설정 ────────────────────────────────────────────
  # 기관 외부 HTTPS webhook 발송 Outbox Relay 설정
  webhook:
    # Outbox 폴링 간격 (ms) — 500ms: 60k 급증 시 빠른 발송
    relay-interval-ms: 500
    # 배치당 처리 건수 — 50건: 기관당 HTTP 동시 연결 수 제어
    relay-batch-size: 50
    # 기본 최대 재시도 횟수 (기관별 설정 우선)
    max-retry: 3
    # webhook 요청 타임아웃
    connect-timeout-ms: 3000
    read-timeout-ms: 8000
    # ── Sprint α-3 / F4.3 — HMAC-SHA256 기본 서명 비밀키 ─────────────────
    # 운영: 환경변수 IDEM_HUB_WEBHOOK_SIGNING_SECRET (또는 Vault) 강제 주입.
    # 미설정 시 WebhookDispatcherService.validateSigningSecret() 가 부팅 단계에서 fail-fast.
    # 테스트/로컬 컨텍스트에서만 allow-empty-secret=true 로 우회 (application-local.yml / test yml에서 활성).
    signing-secret: ${IDEM_HUB_WEBHOOK_SIGNING_SECRET:}
    allow-empty-secret: ${IDEM_HUB_WEBHOOK_ALLOW_EMPTY_SECRET:false}

  # ── 60k 급증 대응 — Redis Pre-warming (Burst Absorption) ──────────────
  burst:
    # Auth Result Redis 캐시 TTL (초)
    # Handoff Ticket TTL(60s)보다 길게 설정 (사용자 이동 시간 고려)
    auth-result-cache-ttl-seconds: 300

  # ── Kafka 토픽 파티션 수 (환경별 오버라이드) ───────────────────────────
  # PoC 단일 브로커: partition-count-main=6, replication-factor=1
  # 운영 3-broker: partition-count-main=12, replication-factor=3, min-insync-replicas=2
  # (KafkaTopicConfig 참조)
  # kafka.partition-count-main, replication-factor, min-insync-replicas는
  # idem.hub.kafka.* 네임스페이스가 아닌 KafkaTopicConfig @Value로 직접 주입됨.
  # 아래는 해당 설정을 위한 표준 위치 안내 주석 — 실제 값은 환경변수 또는 k8s ConfigMap으로 주입.
  # IDEM_HUB_KAFKA_PARTITION_COUNT_MAIN=12
  # IDEM_HUB_KAFKA_REPLICATION_FACTOR=3
  # IDEM_HUB_KAFKA_MIN_INSYNC_REPLICAS=2

  # ── CORS (React dev-server / Nginx → IdO) ──────────────────────────────
  # BFF 이관에 따라 CORS 허용 Origin 관리
  cors:
    enabled: true
    allowed-origins:
      - ${CORS_ORIGIN_DEV:http://localhost:3000}    # React dev server (개발)
      - ${CORS_ORIGIN_PROD:http://localhost:3001}   # Nginx React (Option B 프로덕션)

  # ── Async Executor 설정 ───────────────────────────────────────────────────
  async:
    audit:
      core-pool-size: ${IDEM_HUB_AUDIT_EXECUTOR_CORE:4}
      max-pool-size:  ${IDEM_HUB_AUDIT_EXECUTOR_MAX:16}
      queue-capacity: ${IDEM_HUB_AUDIT_EXECUTOR_QUEUE:10000}
      keep-alive-seconds: 60
    webhook:
      core-pool-size: ${IDEM_HUB_WEBHOOK_EXECUTOR_CORE:4}
      max-pool-size:  ${IDEM_HUB_WEBHOOK_EXECUTOR_MAX:20}
      queue-capacity: ${IDEM_HUB_WEBHOOK_EXECUTOR_QUEUE:5000}

  audit:
    # F-03: Kafka 감사 발행 On/Off (IDEM_HUB_AUDIT_KAFKA_ENABLED) — Kafka 없는 환경 false 권장
    kafka-publish-enabled: ${IDEM_HUB_AUDIT_KAFKA_ENABLED:true}
    # F-04: DB 감사 저장 On/Off (IDEM_HUB_AUDIT_DB_ENABLED) — ⚠️ 운영에서 false 금지
    db-save-enabled: ${IDEM_HUB_AUDIT_DB_ENABLED:true}
    retry-interval-ms: 600000   # 10분마다 Kafka 미발행 감사 로그 재처리

  # ── Rate Limiting (Redis 기반 기관별 TPS/Daily 제한) ──────────────────────
  rate-limit:
    enabled:              ${IDEM_HUB_RATE_LIMIT_ENABLED:true}
    default-tps:          ${IDEM_HUB_RATE_LIMIT_DEFAULT_TPS:200}
    default-daily-limit:  ${IDEM_HUB_RATE_LIMIT_DEFAULT_DAILY:1000000}

  # ── F-08: Redisson 분산 락 On/Off ──────────────────────────────────────────
  # false → NoOpRedissonConfig 사용 (Redis 없는 환경 앱 기동 가능)
  # ⚠️ K8s 다중 Pod 환경에서는 반드시 true
  redisson:
    enabled: ${IDEM_HUB_REDISSON_ENABLED:true}

  # ── F-10: 보안 응답 헤더 On/Off ──────────────────────────────────────────
  # false → SecurityHeadersFilter 빈 미등록 (FE 개발 환경 CSP 오류 방지)
  security-headers:
    enabled: ${IDEM_HUB_SECURITY_HEADERS_ENABLED:true}

  # ── F-05: OTel 분산 추적 AOP On/Off ──────────────────────────────────────
  # false → AuthTracingAspect 빈 미등록 (Jaeger/Tempo 없는 환경)
  tracing:
    auth-aspect-enabled: ${IDEM_HUB_AUTH_TRACING_ENABLED:true}

  # ── F-11: 개인정보 파기 스케줄러 (이중 안전장치) ───────────────────────────
  # enabled 기본 false — 명시적 true 설정 시에만 실행
  # dry-run 기본 true  — 실제 삭제 전 반드시 dry-run 검증
  # ⚠️ 법무팀 보존 기간 확정 후 IDEM_HUB_RETENTION_DAYS 설정 필수
  retention:
    enabled: ${IDEM_HUB_RETENTION_ENABLED:false}
    dry-run: ${IDEM_HUB_RETENTION_DRY_RUN:true}
    personal-data-days: ${IDEM_HUB_RETENTION_DAYS:365}
    batch-size: ${IDEM_HUB_RETENTION_BATCH_SIZE:100}

  # ── F-13: IdO Outbox Relay On/Off ────────────────────────────────────────
  # false → PENDING 폴링 없음 (Kafka 없는 환경 500ms 오류 방지)
  # 처리 대상: idem.gate.auth.events (idem.registry.user.events 는 qim-outbox 릴레이가 전담)
  outbox:
    relay-enabled: ${IDEM_HUB_OUTBOX_RELAY_ENABLED:true}
    relay-interval-ms: 500
    batch-size: 100
    max-retry: 3

  # ── F-30: Q-IM 회원 이벤트 Outbox Relay (QIM-OUTBOX-SPEC-001) ─────────────
  # Q-IM / Q-Sign 이 idem_hub.outbox에 INSERT한 idem.registry.user.events PENDING 레코드 발행
  # false → Q-IM SP 수신 후 Kafka 발행 없음 (Q-IM 통합 전 개발 단계)
  # true  → 1000ms 주기로 idem.registry.user.events PENDING 레코드 폴링 후 Kafka 발행
  registry-outbox:
    relay-enabled: ${IDEM_HUB_REGISTRY_OUTBOX_RELAY_ENABLED:true}
    relay-interval-ms: ${IDEM_HUB_REGISTRY_OUTBOX_RELAY_INTERVAL_MS:1000}
    batch-size: ${IDEM_HUB_REGISTRY_OUTBOX_BATCH_SIZE:50}
    max-retry: ${IDEM_HUB_REGISTRY_OUTBOX_MAX_RETRY:5}

  # ── D3: Kafka 없는 설치의 사용자 상태 변경 전파 — registry 이벤트 피드 폴링 ─────
  # Kafka 가 꺼지면(idem.messaging.kafka.enabled=false) KafkaOptionalEnvironmentPostProcessor 가 enabled=true 로 켠다.
  # Kafka 설치에서는 QimEventConsumer 의 KafkaListener 가 같은 일을 하므로 기본 false.
  registry-events:
    poll:
      enabled: ${IDEM_HUB_REGISTRY_EVENTS_POLL_ENABLED:false}
      interval-ms: ${IDEM_HUB_REGISTRY_EVENTS_POLL_INTERVAL_MS:5000}
      initial-delay-ms: 10000
      batch-size: 100
      initial-lookback-hours: 24     # 워터마크가 없을 때 이만큼 과거부터 (중복은 processed_event 가 거른다)
      max-failures: 5                # 같은 이벤트가 이만큼 연속 실패하면 FAILED 로 기록하고 건너뛴다

  # ── F-14: Webhook Outbox Relay On/Off ────────────────────────────────────
  # false → 기관 webhook 발송 없음 (PENDING은 DB 유지 → 재활성 시 처리)

  # ════════════════════════════════════════════════════════════════════════
  # Sprint 14~16 신규 기능 — Phase-Gate Feature Flags
  # 📖 docs/phased-rollout-strategy.md 참조
  # ⚠️  Phase 1: 아래 모든 신규 기능 기본값 false (안전)
  # ════════════════════════════════════════════════════════════════════════

  # (S4b) F-20~F-22 전 기관 프로비저닝은 제거되었다 — 서비스에는 어설션·백채널 로그아웃·보안/감사 이벤트만 push 한다 (docs/generalization-plan.md §2.0)

  # ── F-23/F-24: Agency Gateway API (Sprint 15, Phase 3 활성화) ────────────
  # F-23: 기관 → OnePass 인바운드 이벤트 수신 (POST /inbound/event)
  # F-24: OnePass → 기관 아웃바운드 발송 (PATCH /outbound/notify)
  # F-25: Redis 멱등성 중복 방어 (항상 true 권장)
  # F-26: HMAC-SHA256 서명 필수화 (Sprint 17, Phase 4↑, 현재 false)
  # F-27: Agency Key 인증 감사 로그 (항상 true)
  gateway:
    inbound-enabled:        ${IDEM_HUB_GATEWAY_INBOUND_ENABLED:false}    # F-23: Phase 3-A↑
    outbound-enabled:       ${IDEM_HUB_GATEWAY_OUTBOUND_ENABLED:false}   # F-24: Phase 3-B↑
    idempotency-enabled:    ${IDEM_HUB_GATEWAY_IDEMPOTENCY_ENABLED:true} # F-25: 항상 ON
    hmac-sig-required:      ${IDEM_HUB_HMAC_SIG_REQUIRED:false}          # F-26: Phase 4↑ (Sprint 17)
    agency-key-audit-log:   ${IDEM_HUB_AGENCY_KEY_AUDIT_LOG:true}        # F-27: 항상 ON

  # ── AES 키 로테이션 스케줄러 ────────────────────────────────────────────
  crypto:
    rotation-enabled:      ${IDEM_HUB_CRYPTO_ROTATION_ENABLED:true}
    rotation-check-cron:   "0 0 * * * *"    # 매 시간 정각
    # Sprint γ-3 / F3.3 후속:
    # [DEPRECATED] idem.hub.crypto.handoff-aes-key / handoff-hmac-key 는 어떤 Java 코드도
    # 읽지 않는 dead config 였다 (γ-2 정적 검증에서 발견). 실제 폴백 키는
    # idem.hub.ticket.aes-key / idem.hub.ticket.hmac-key 에서 처리한다 (KeyVersionRegistry).
    # IDEM_HUB_HANDOFF_AES_KEY / IDEM_HUB_HANDOFF_HMAC_KEY 환경변수는 idem.hub.ticket.* 로 매핑된다.

  # ── KMS 연동 설정 (S9-T8) ─────────────────────────────────────────────────
  #
  # ┌─────────────────────────────────────────────────────────────────────┐
  # │  KMS On/Off 및 Provider 선택                                         │
  # │                                                                     │
  # │  enabled=false → LocalKmsClient  (Base64 패스스루, 개발·로컬)        │
  # │  enabled=true  → provider 값으로 구현체 자동 선택                    │
  # │    provider=vault → VaultKmsClient  ★ 기본 표준 (HashiCorp Vault)   │
  # │    provider=nhn   → NhnKmsClient   (NHN Cloud SKM, 레거시)          │
  # │    provider=noop  → NoOpKmsClient  (Base64 패스스루, 명시적 테스트)  │
  # └─────────────────────────────────────────────────────────────────────┘
  #
  # [환경별 권장 설정]
  #   local/CI   : IDEM_HUB_KMS_ENABLED=false
  #   dev 서버   : IDEM_HUB_KMS_ENABLED=true  / IDEM_HUB_KMS_PROVIDER=vault
  #   stage/prod : IDEM_HUB_KMS_ENABLED=true  / IDEM_HUB_KMS_PROVIDER=vault
  #   NHN 유지   : IDEM_HUB_KMS_ENABLED=true  / IDEM_HUB_KMS_PROVIDER=nhn  (레거시)
  kms:
    # ── On/Off 스위치 ────────────────────────────────────────────────────
    # false(기본): LocalKmsClient 활성화 — KMS 서버 없이 개발 가능
    # true:        provider 값에 따라 실제 KMS 클라이언트 활성화
    enabled:  ${IDEM_HUB_KMS_ENABLED:false}

    # ── Provider 선택 (enabled=true 시에만 유효) ─────────────────────────
    # vault : HashiCorp Vault Transit Engine (★ 운영 표준)
    # nhn   : NHN Cloud Secure Key Manager  (레거시, 기존 운영 환경 유지용)
    # noop  : Base64 패스스루 — enabled=true이지만 실제 암호화 없음 (테스트)
    provider: ${IDEM_HUB_KMS_PROVIDER:vault}

    # ── 공통 타임아웃 ────────────────────────────────────────────────────
    connection-timeout-ms: ${IDEM_HUB_KMS_CONN_TIMEOUT_MS:3000}
    request-timeout-ms:    ${IDEM_HUB_KMS_REQ_TIMEOUT_MS:5000}

    # ── HashiCorp Vault Transit Engine (provider=vault) ──────────────────
    # 업계 표준 KMS. 온프레미스·클라우드·하이브리드 환경 모두 지원.
    # Transit Engine: 키 재료는 Vault 내부에만 존재, 앱은 ciphertext만 보관.
    #
    # [Vault 빠른 시작 — docker-compose 개발 환경]
    #   VAULT_ADDR=http://localhost:8200
    #   VAULT_TOKEN=dev-root-token
    #   vault secrets enable transit
    #   vault write -f transit/keys/idem-handoff-key
    #
    # [K8s 운영 — Kubernetes Auth 권장]
    #   VAULT_AUTH_METHOD=kubernetes
    #   VAULT_K8S_ROLE=ido
    vault:
      # Vault 서버 주소 — 환경변수 VAULT_ADDR 우선
      address:      ${VAULT_ADDR:http://vault:8200}

      # Transit 시크릿 엔진 마운트 경로 (vault secrets enable -path=transit transit)
      transit-path: ${VAULT_TRANSIT_PATH:transit}

      # Transit 키 이름 (vault write -f transit/keys/idem-handoff-key)
      key-name:     ${VAULT_TRANSIT_KEY:idem-handoff-key}

      # 인증 방식: token | approle | kubernetes
      # 환경변수 VAULT_AUTH_METHOD로 오버라이드 가능
      auth-method:  ${VAULT_AUTH_METHOD:token}

      # Token 인증 전용 (auth-method=token, 개발용)
      # 운영: 절대 소스 코드에 직접 기재 금지 — K8s Secret VAULT_TOKEN으로 주입
      token:        ${VAULT_TOKEN:}

      # HCP Vault Dedicated 전용 Namespace (자체 호스팅 Vault는 비워둠)
      namespace:    ${VAULT_NAMESPACE:}

      # ── F5.2 Escape Hatch (Sprint α-1) ─────────────────────────────────
      # 토큰 획득 실패 시 startup을 차단할지 여부.
      #   false (기본): 토큰 획득 실패 시 IllegalStateException → startup 차단 → Pod 재시작
      #   true        : 경고만 출력하고 startup 진행 (테스트·일시 격리 전용, 운영 금지)
      # 환경변수: IDEM_HUB_KMS_VAULT_ALLOW_EMPTY_TOKEN
      allow-empty-token: ${IDEM_HUB_KMS_VAULT_ALLOW_EMPTY_TOKEN:false}

    # ── LocalKmsClient F5.1 Escape Hatch (Sprint α-1) ─────────────────────
    # @Profile("!prod & !stage") 어노테이션 + matchIfMissing=false 로 1차 가드.
    # @PostConstruct 부팅 가드가 활성 프로파일에 prod/stage 포함 시 fail-fast.
    # 이 escape hatch는 부팅 가드를 우회하지만 평문 키 모드는 그대로이므로
    # 운영 환경 절대 사용 금지.
    local:
      allow-in-prod: ${IDEM_HUB_KMS_LOCAL_ALLOW_IN_PROD:false}

    # ── NHN Cloud Secure Key Manager (provider=nhn, 레거시) ─────────────
    # 기존 NHN Cloud 운영 환경 유지를 위한 레거시 옵션.
    # 신규 환경은 provider=vault 사용 권장.
    # API: https://docs.nhncloud.com/ko/Security/Secure Key Manager/ko/api-guide-v1.0/
    nhn:
      endpoint:    ${NHN_SKM_ENDPOINT:https://api-keymanager.nhncloudservice.com}
      appkey:      ${NHN_SKM_APPKEY:}
      # mode: secret(기본) | envelope
      # secret:   SKM 기밀 데이터에서 키 재료 직접 조회 (keyId를 DB에 보관)
      # envelope: SKM 대칭 키로 DEK 암/복호화 (ciphertext를 DB에 보관)
      mode:        ${NHN_SKM_MODE:secret}
      aes-key-id:  ${NHN_SKM_AES_KEY_ID:}
      hmac-key-id: ${NHN_SKM_HMAC_KEY_ID:}

# ── Resilience4j (S9-T2: NICE/OACX/통합인증 CB+Retry 추가) ───────────────
  cast:
    # D2 fail-secure: Ed25519 CAST 서명키(IDEM_HUB_CAST_PRIVATE_KEY/PUBLIC_KEY) 미설정 시 임시 키 자동 생성 금지(기동 거부). 로컬·테스트에서만 true
    allow-generated-keys: ${IDEM_HUB_CAST_ALLOW_GENERATED_KEYS:false}
resilience4j:
  circuitbreaker:
    instances:
      qim-client:
        register-health-indicator: true
        sliding-window-type: COUNT_BASED
        sliding-window-size: 10
        failure-rate-threshold: 60
        slow-call-rate-threshold: 80
        slow-call-duration-threshold: 3s
        wait-duration-in-open-state: 15s
        permitted-number-of-calls-in-half-open-state: 3
        minimum-number-of-calls: 5
      # P2 수정: qsign-client → keycloak-client (Keycloak HTTP 호출 보호)
      keycloak-client:
        sliding-window-size: 10
        failure-rate-threshold: 50
        slow-call-rate-threshold: 80
        slow-call-duration-threshold: 3s
        wait-duration-in-open-state: 30s
        permitted-number-of-calls-in-half-open-state: 5
        minimum-number-of-calls: 5
      # ── S9-T2 신규: NICE API 클라이언트 CB ────────────────────────────────
      # NICE 서버 장애 시 빠른 Open 전환으로 불필요한 블로킹 방지
      # Half-Open: 3건 탐침 → 실패율 50% 이하이면 Closed 복귀
      nice-api-client:
        register-health-indicator: true
        sliding-window-type: COUNT_BASED
        sliding-window-size: 10
        failure-rate-threshold: 50
        slow-call-rate-threshold: 80
        slow-call-duration-threshold: 8s          # NICE API 평균 응답 ~1s, SLA 기준 8s
        wait-duration-in-open-state: 30s
        permitted-number-of-calls-in-half-open-state: 3
        minimum-number-of-calls: 5
        record-exceptions:
          - java.lang.IllegalStateException
          - java.io.IOException
          - java.util.concurrent.TimeoutException
  retry:
    instances:
      qim-client:
        max-attempts: 3
        wait-duration: 300ms
        retry-exceptions:
          - java.io.IOException
          - java.util.concurrent.TimeoutException
      # P2 수정: qsign-client → keycloak-client
      keycloak-client:
        max-attempts: 3
        wait-duration: 500ms
        retry-exceptions:
          - java.io.IOException
          - java.util.concurrent.TimeoutException
      # ── S9-T2 신규: NICE API Retry ────────────────────────────────────────
      # 최대 2회 재시도 (총 3회 시도): NICE 서버 간헐적 5xx 대응
      # Exponential Backoff: 500ms → 1000ms (jitter 포함)
      nice-api-client:
        max-attempts: 2
        wait-duration: 500ms
        enable-exponential-backoff: true
        exponential-backoff-multiplier: 2.0
        retry-exceptions:
          - java.io.IOException
          - java.util.concurrent.TimeoutException
        ignore-exceptions:
          - java.lang.IllegalArgumentException   # 클라이언트 입력 오류는 재시도 불필요
  timelimiter:
    instances:
      qim-client:
        timeout-duration: 5s
      # P2 수정: qsign-client → keycloak-client
      keycloak-client:
        timeout-duration: 5s
      # ── S9-T2 신규: NICE/통합인증 TimeLimiter ─────────────────────────────
      # WebClient는 자체 타임아웃이 있으나 Resilience4j TimeLimiter도 추가하여
      # 반응형 파이프라인 외부에서도 시간 제한 보장
      nice-api-client:
        timeout-duration: 12s    # WebClient 타임아웃(10s) + 여유 2s

# ── Actuator (S9-T4: OTel 추적 설정 포함) ─────────────────────
management:
  endpoints:
    web:
      exposure:
        # features: 현재 기능 플래그 On/Off 상태 조회 (/actuator/features)
        include: health,info,metrics,prometheus,flyway,features
  endpoint:
    health:
      show-details: when-authorized
      probes:
        enabled: true
      # ── Health Group 매핑 (PR-A5: 운영 단순화) ───────────────────────────
      # liveness  : 자체 결함만 (Pod 재시작이 의미 있는 항목)
      # readiness : 핵심 의존성만 — db / redis / kms
      #
      # KMS는 readiness에 포함: KMS 다운 시 ID 핸드오프 암호화 자체가 불가능하므로
      # 트래픽 차단이 정당하다. (VaultKmsHealthIndicator → @Component("kms"))
      #
      # ※ 이외의 모든 비-핵심 지표(Kafka 연결, Outbox 백로그 등)는 readiness에서
      #   제외하고 Prometheus Metric으로 처리한다. 자세한 정책은
      #   docs/OPERATION_INVENTORY.md 참조.
      group:
        liveness:
          include: livenessState
        readiness:
          include: readinessState,db,redis,kms
  metrics:
    tags:
      application: ${spring.application.name}
  # ── Micrometer Tracing (S9-T4) ──────────────────────────────────
  # Spring Boot Actuator 자동 설정: Micrometer Tracing Bridge → OTel SDK → OTLP Exporter
  tracing:
    sampling:
      probability: ${TRACING_SAMPLING_PROBABILITY:1.0}   # 운영: 0.1~0.3 권장 (10%~30% 샘플링)
    # W3C TraceContext 전파 (traceparent 헤더)
    propagation:
      type: W3C
  otlp:
    tracing:
      endpoint: ${OTLP_ENDPOINT:http://localhost:4318/v1/traces}
      timeout: 5s


logging:
  level:
    io.github.hipstermin.idem.hub: INFO
    io.github.hipstermin.idem.hub.fe: INFO
    io.github.hipstermin.idem.hub.webhook: INFO
    io.github.hipstermin.idem.hub.burst: INFO
    io.github.hipstermin.idem.hub.audit: INFO
    org.springframework.kafka: WARN
    org.flywaydb: INFO

# ── 플러그인 (docs/vendor-plugin-plan.md · 범용화 S5) ─────────────────────────
# 코어 에디션은 mock 만, KR 공공 에디션은 nice-oacx(·anyid) 를 켠다. 기본값은 현행 KR 배포 호환(true).
idem:
  # ── D1-b: Kafka 선택 의존 (docs/generalization-plan.md D1, docs/install.md) ──
  # false(기본): 브로커 없이 기동. 토픽 생성·컨슈머·Kafka 릴레이(F-30)·감사 Kafka 발행(F-03) 정지,
  #              idem_hub.outbox 는 IdoOutboxRelay 가 같은 프로세스의 컨슈머로 배달, 감사는 DB 저장(F-04)만.
  # true : Kafka 경로(다중 인스턴스·외부 시스템 연동). infra/docker 전체 스택·helm 은 true 로 준다.
  messaging:
    kafka:
      enabled: ${IDEM_KAFKA_ENABLED:false}
  plugins:
    mock-auth:
      enabled: ${IDEM_PLUGINS_MOCK_AUTH_ENABLED:false}
    # D3: 코어 기본값은 false — 벤더 플러그인은 KR 에디션(editions/idem-kr-hub)만 번들하고, 그 에디션의 후처리기가 true 를 공급한다
    nice-oacx:
      enabled: ${IDEM_PLUGINS_NICE_OACX_ENABLED:false}
    anyid:
      enabled: ${IDEM_PLUGINS_ANYID_ENABLED:false}
