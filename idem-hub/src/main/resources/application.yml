server:
  port: 8083
  shutdown: graceful
  servlet:
    session:
      timeout: 30m
      cookie:
        name: feSessionId
        http-only: true
        secure: true
        same-site: lax

spring:
  application:
    name: ido
  lifecycle:
    timeout-per-shutdown-phase: 20s

  # ── DataSource ──────────────────────────────────────────────
  datasource:
    url: jdbc:postgresql://${DB_HOST:localhost}:${DB_PORT:5432}/${DB_NAME:onepass}?currentSchema=ido&sslmode=disable
    username: ${DB_USERNAME:onepass}
    password: ${DB_PASSWORD:onepass}
    driver-class-name: org.postgresql.Driver
    hikari:
      pool-name: ido-hikari
      maximum-pool-size: 20
      minimum-idle: 5
      idle-timeout: 300000
      connection-timeout: 30000
      max-lifetime: 1800000
      keepalive-time: 60000
      connection-test-query: SELECT 1

  # ── JPA ────────────────────────────────────────────────────
  jpa:
    hibernate:
      ddl-auto: validate
    show-sql: false
    open-in-view: false
    properties:
      hibernate:
        dialect: org.hibernate.dialect.PostgreSQLDialect
        default_schema: ido
        jdbc:
          time_zone: UTC
          batch_size: 50
        order_inserts: true
        order_updates: true

  # ── Flyway ─────────────────────────────────────────────────
  flyway:
    enabled: true
    locations: classpath:db/migration
    schemas: ido
    default-schema: ido
    baseline-on-migrate: true
    baseline-version: 0
    validate-on-migrate: false   # V1 멱등화(IF NOT EXISTS) 후 체크섬 변경 허용
    repair-on-migrate: true      # 체크섬 불일치 시 자동 repair 후 migrate
    out-of-order: false
    connect-retries: 5
    connect-retries-interval: 10s

  # ── Redis ──────────────────────────────────────────────────
  data:
    redis:
      host: ${REDIS_HOST:localhost}
      port: ${REDIS_PORT:6379}
      password: ${REDIS_PASSWORD:}
      timeout: 2000ms
      lettuce:
        pool:
          max-active: 20
          max-idle: 8
          min-idle: 2
          max-wait: 1000ms

  # ── Kafka ──────────────────────────────────────────────────
  kafka:
    bootstrap-servers: ${KAFKA_SERVERS:localhost:9092}
    properties:
      security.protocol: PLAINTEXT
    producer:
      client-id: ido-producer
      key-serializer: org.apache.kafka.common.serialization.StringSerializer
      value-serializer: org.springframework.kafka.support.serializer.JsonSerializer
      acks: all
      retries: 3
      batch-size: 16384
      linger-ms: 5
      compression-type: lz4
      properties:
        enable.idempotence: "true"
        max.in.flight.requests.per.connection: "5"
        spring.json.add.type.headers: "false"
        transactional.id: ido-tx-producer
    consumer:
      group-id: ido-qim-consumer          # Q-IM 이벤트 수신 컨슈머 그룹
      auto-offset-reset: earliest
      enable-auto-commit: false
      max-poll-records: 50
      key-deserializer: org.apache.kafka.common.serialization.StringDeserializer
      value-deserializer: org.springframework.kafka.support.serializer.JsonDeserializer
      properties:
        spring.json.trusted.packages: "io.github.hipstermin.idem.*"
        isolation.level: read_committed
    listener:
      ack-mode: MANUAL_IMMEDIATE
      concurrency: 3
      missing-topics-fatal: true

# ── IdO 도메인 설정 ────────────────────────────────────────────
ido:

  # ── S7-T2: NICE/OACX 본인인증 연동 (AuthProperties 바인딩) ──────────────
  # 설계 결정: Q1=B(API Key 없음), Q2=B(callback 추가), Q3=B(CI FE 미반환), Q4=A(WebClient)
  auth:
    # ── NICE 휴대폰 본인인증 ───────────────────────────────────────────────
    # NICE IDO 인증 서버: https://auth.niceid.co.kr
    # NICE 계약 후 발급받은 clientId/clientSecret 필수
    nice:
      # NICE 클라이언트 ID — 운영: NICE_CLIENT_ID 환경변수 필수 설정
      client-id: ${NICE_CLIENT_ID:}
      # NICE 클라이언트 시크릿 — 운영: NICE_CLIENT_SECRET 환경변수 필수 설정 (절대 코드에 하드코딩 금지)
      client-secret: ${NICE_CLIENT_SECRET:}
      # NICE 인증 완료 후 리다이렉트 URL (FE 팝업 결과 수신 페이지)
      # 개발: http://localhost:3000/otp/auth-result (React dev-server)
      # 운영: https://www.smes.go.kr/otp/auth-result (실제 도메인)
      return-url: ${NICE_RETURN_URL:http://localhost:3000/otp/auth-result}
      # NICE API 응답 타임아웃 (초) — 기본 10초
      timeout-seconds: ${NICE_TIMEOUT_SECONDS:10}

    # ── OACX 전자서명 중계모듈 ───────────────────────────────────────────
    # OACX SDK(v1.3.2)를 통한 간편서명 기능 제공
    # OACX-SDK-v1.3.2.jar: ido/libs/ 디렉토리에 배치 필요
    oacx:
      # OACX provider key JSON 파일 절대 경로
      # OACX 운영사에서 발급한 파일 — 운영: OACX_PROVIDER_KEY_PATH 환경변수 필수 설정
      # 예: /app/config/oacx-provider-key.json
      provider-key-path: ${OACX_PROVIDER_KEY_PATH:}
      # OACX SDK 디버그 모드 — 개발/검증: true, 운영: 반드시 false
      debug-mode: ${OACX_DEBUG_MODE:false}

    # ── 통합인증 서버 연동 (기업 간편인증 콜백, Q2=B) ──────────────────────
    # 기업인증 콜백(POST /api/v1/auth/callback) 처리 시 auth-check 요청
    # 현재 FE 미호출 상태 — 향후 FE 기업인증 구현 시 활성화
    integration:
      # 통합인증 서버 기본 URL — 운영: INTEGRATION_AUTH_BASE_URL 환경변수 필수 설정
      # 예: https://intg-auth.smes.go.kr
      base-url: ${INTEGRATION_AUTH_BASE_URL:}
      # 통합인증 서버 응답 타임아웃 (초) — 기본 10초
      timeout-seconds: ${INTEGRATION_AUTH_TIMEOUT_SECONDS:10}

    # ── Auth 엔드포인트 IP 기반 Rate Limiting (S9-T7) ─────────────────────────
    # /api/v1/auth/** 경로 전용 제한 (NICE/OACX 인증 API 남용 방지)
    # 기관별 Rate Limit(AgencyRateLimiter)과 독립적으로 동작 (AND 조건)
    # ⚠️ F-01 독립 환경변수: IDO_AUTH_RL_ENABLED (F-02의 IDO_RATE_LIMIT_ENABLED와 분리)
    rate-limit:
      enabled:    ${IDO_AUTH_RL_ENABLED:true}
      # TPS: 초당 최대 요청 수 (IP 단위)
      # 기본 20 req/s — 정상 사용자는 버튼 1회 클릭 시 1~3 req 발생
      # NICE 인증 flow: URL 발급(1) + 결과 조회(1) = 2 req
      tps:        ${IDO_AUTH_RL_TPS:20}
      # 분당 최대 요청 수 (IP 단위)
      # 기본 100 req/min — 연속 재시도 허용 범위
      per-minute: ${IDO_AUTH_RL_PER_MIN:100}
      # 일별 최대 요청 수 (IP 단위)
      # 기본 1000 req/day — 하루 인증 시도 횟수 제한
      daily:      ${IDO_AUTH_RL_DAILY:1000}

  # ── F4.8 (Sprint β-2) 내부 호출자 인증 ─────────────────────────────────
  # /api/v1/fe-session (POST), /api/v1/fe-session/conversion (POST) 호출 시
  # X-Internal-Caller + X-Internal-Api-Key 헤더 검증.
  #
  # 운영: 각 호출 서비스(q-sign, outbox-relay 등)별로 강력한 무작위 키(≥32자)를
  # K8s Secret / Vault → 환경변수로 주입한다.
  #   IDO_INTERNAL_API_KEY_QSIGN=<openssl rand -hex 32>
  #
  # ⚠️ allow-empty-callers=false 운영 시 callers 가 비면 부팅 실패 (F4.3 패턴 재사용).
  internal:
    callers:
      q-sign:       ${IDO_INTERNAL_API_KEY_QSIGN:}
      outbox-relay: ${IDO_INTERNAL_API_KEY_OUTBOX:}
    allow-empty-callers: ${IDO_INTERNAL_ALLOW_EMPTY_CALLERS:false}

  # §11.5 Q-IM 연동
  qim:
    base-url: ${QIM_BASE_URL:http://localhost:8082}
    cache-ttl-seconds: 300           # ≤5분 (설계서 §11.3)
    agency-meta-ttl-seconds: 3600    # ≤60분 (기관 메타·정책 캐시)
    connect-timeout-ms: 3000
    read-timeout-ms: 5000
    # [P2 수정] Q-IM 내부 API 호출 키 — 환경변수 주입 (하드코딩 'ido-internal' 제거)
    # 운영: K8s Secret / Vault → IDO_QIM_INTERNAL_API_KEY 환경변수로 주입
    # 로컬 개발: docker-compose.yml에서 IDO_QIM_INTERNAL_API_KEY=ido-internal 설정
    # ⚠️ 미설정 시 Q-IM API 호출 시 X-Internal-Api-Key 헤더 누락 → Q-IM 서버 401 응답
    internal-api-key: ${IDO_QIM_INTERNAL_API_KEY:}
    # Q-IM 외부 API 키 — ExtProxyController가 FE 대신 X-Ext-Api-Key 헤더로 주입 (Q3=B)
    # FE webpack DefinePlugin EXT_API_KEY 번들 노출 문제 해결:
    # FE extInstance → beApiInstance 전환 후 이 환경변수로 API Key 관리
    # 운영: K8s Secret / Vault → IDO_QIM_EXT_API_KEY 환경변수로 주입
    ext-api-key: ${IDO_QIM_EXT_API_KEY:}
    # ── Q-IM → IdO 아웃바운드 수신 API (SP 역할) ─────────────────────────
    # Q-IM 관리 콘솔에서 발급한 API Key PBKDF2 해시
    # 포맷: pbkdf2:{iterations}:{saltBase64}:{hashBase64}
    # 생성: scripts/generate-api-key-hash.sh 스크립트 사용
    # 운영: QIM_INBOUND_API_KEY_HASH 환경변수 필수 설정 (미설정 시 모든 SP API 거부)
    inbound-api-key-hash: ${QIM_INBOUND_API_KEY_HASH:}
    # Q-IM과 협의하여 발급받은 AES-256 공유키 (Base64 인코딩, 32바이트 디코드)
    # [합의 필요 #1] Q-IM 팀과 암호화 스펙(transformation/IV 방식) 협의 후 확정
    # 운영: QIM_AES_SHARED_KEY 환경변수 필수 설정 (미설정 시 AES 복호화 불가)
    aes-shared-key: ${QIM_AES_SHARED_KEY:}
    # AES 변환 방식 (Q-IM 팀 합의 후 QIM_AES_TRANSFORMATION 환경변수로 확정)
    aes-transformation: ${QIM_AES_TRANSFORMATION:AES/CBC/PKCS5Padding}
    # AES IV 길이 (바이트, 기본 16)
    aes-iv-length: ${QIM_AES_IV_LENGTH:16}
    # SP 수신 API 멱등성 키 TTL (일) — sp_receiver_idempotency.expires_at 기준
    idempotency-ttl-days: 7
    # SP 수신 감사 로그 활성화 (운영: true 권장)
    receiver-audit-enabled: ${QIM_RECEIVER_AUDIT:true}

  # ── FE AES-GCM 복호화 키 (CI 토큰 교환 전용) ───────────────────────────
  # FE의 aesGcm.ts에서 CI 암호화에 사용하는 AES-GCM 키 (서버사이드 복호화용)
  # FE webpack DefinePlugin AES_GCM_KEY와 동일한 값이어야 함
  # 운영: K8s Secret / Vault → FE_AES_GCM_KEY 환경변수로 주입
  # ⚠️ 미설정 시 POST /api/v1/auth/ci-token 엔드포인트에서 CI 복호화 불가
  fe-aes-gcm-key: ${FE_AES_GCM_KEY:}

  # 연합 인가(Federated Authorization) — Q-Authz 연동
  # 토큰(CAST/Handoff) 발급 시 사용자×대상기관 유효 역할 조회 → roles[] 클레임 임베드.
  # GET /api/v1/internal/authz/users/{qimUserId}/effective-roles?agencyCode=...
  # ⚠️ 장애·미설정 시 QAuthzClient가 fail-open(빈 역할) — SSO/Handoff 발급은 계속됨.
  q-authz:
    base-url: ${QAUTHZ_BASE_URL:http://localhost:8086}
    connect-timeout-ms: 3000
    read-timeout-ms: 5000
    # 운영: K8s Secret / Vault → IDO_QAUTHZ_INTERNAL_API_KEY 환경변수 주입
    # 미설정 시 q-authz가 401 → 빈 역할 fail-open(경고 로그)
    internal-api-key: ${IDO_QAUTHZ_INTERNAL_API_KEY:}

  # §11.8 Q-Sign 연동 — X-Internal-Sig
  qsign:
    base-url: ${QSIGN_BASE_URL:http://localhost:8081}
    internal-sig-ttl-seconds: 60
    nonce-ttl-seconds: 60
    connect-timeout-ms: 3000
    read-timeout-ms: 5000
    # X-Internal-Sig HMAC-SHA256 공유 비밀키 (Q-Sign 동일 값 사용)
    # 운영: IDO_INTERNAL_SIG_SECRET 환경변수 필수 설정 (최소 32자 이상 무작위 문자열)
    # 생성 예: openssl rand -hex 32
    internal-sig-secret: ${IDO_INTERNAL_SIG_SECRET:}

  # ── 브로커 모드 설정 (표준 OIDC 처리 백엔드 선택 — 문서 §6) ────────────
  #
  # ⚠️  이 설정은 "표준 OIDC(카카오·네이버 등)"의 처리 백엔드만 결정한다.
  #     비표준 OIDC(Any-ID 인증수단, PASS 등)는 이 값과 무관하게 ido가 직접 처리한다.
  #
  # qsign    : [표준 OIDC] q-sign에 URL 발급 위임 (기본값)
  # keycloak : [표준 OIDC] ido가 직접 Keycloak Authorization URL 생성
  #
  # [비표준 OIDC] — IDO_BROKER_MODE 값과 무관하게 항상 ido 직접 처리:
  #   MOBILE_ID / EASY_SIGN / JOINT_CERT / FINANCIAL_CERT / PRIVATE_ID
  #   → AnyIdBrokerAdapter (anyid.dev:1443 직접 연동)
  #   PASS 등 기타 비표준 → NonOidcBrokerAdapter
  broker:
    mode: ${IDO_BROKER_MODE:qsign}

  # ── Any-ID 설치형 연동 설정 (기관 #311, srvc_No=1000001157) ────────────
  # 참조: wiki/iam/06-install-type-integration.md
  # 행안부 Any-ID 사업단 발급 개발키 적용 (별첨2. 개발KEY 311_중소기업기술정보진흥원)
  anyid:
    # ── 기관 식별자 ──────────────────────────────────────────────────────
    # 모든 API 호출 시 srvc_no 파라미터로 전달
    srvc-no: ${ANYID_SRVC_NO:1000001157}
    agency-code: ${ANYID_AGENCY_CODE:1000001157}
    agency-name: ${ANYID_AGENCY_NAME:중소벤처24기업마당}

    # ── Any-ID 포털 (관리/프로비저닝 API) ────────────────────────────────
    # 개발: https://www.anyid.dev:1451 / 운영: https://www.anyid.go.kr:443
    portal:
      domain: ${ANYID_PORTAL_DOMAIN:https://www.anyid.dev}
      port:   ${ANYID_PORTAL_PORT:1451}
      base-url: ${ANYID_PORTAL_DOMAIN:https://www.anyid.dev}:${ANYID_PORTAL_PORT:1451}

    # ── Any-ID 인증 서버 (L1~L3 인증 API) ────────────────────────────────
    # 개발: https://www.anyid.dev:1443 / 운영: https://www.anyid.go.kr:443
    auth:
      domain: ${ANYID_AUTH_DOMAIN:https://www.anyid.dev}
      port:   ${ANYID_AUTH_PORT:1443}
      base-url: ${ANYID_AUTH_DOMAIN:https://www.anyid.dev}:${ANYID_AUTH_PORT:1443}

    # ── Any-ID SSO 서버 ───────────────────────────────────────────────────
    # 개발: https://sso.anyid.dev:1452 / 운영: https://sso.anyid.go.kr:443
    sso:
      domain: ${ANYID_SSO_DOMAIN:https://sso.anyid.dev}
      port:   ${ANYID_SSO_PORT:1452}
      base-url: ${ANYID_SSO_DOMAIN:https://sso.anyid.dev}:${ANYID_SSO_PORT:1452}
      # SSO HMAC-SHA256 서명 검증 시크릿 (Base64, 행안부 발급)
      # 운영: K8s Secret ANYID_SSO_SECRET_CODE로 주입 (평문 설정 금지)
      secret-code: ${ANYID_SSO_SECRET_CODE:}
      # SSO 어댑터 설정 파일 경로 (classpath 기준)
      adaptor-conf: ${ANYID_SSO_ADAPTOR_CONF:classpath:sso-adaptor-conf-local.properties}
      # SSO 세션 토큰 TTL (초)
      session-ttl-seconds: 3600
      verify-url: ${ANYID_SSO_DOMAIN:https://sso.anyid.dev}:${ANYID_SSO_PORT:1452}/sso/api/v1/verify
      logout-url:  ${ANYID_SSO_DOMAIN:https://sso.anyid.dev}:${ANYID_SSO_PORT:1452}/sso/api/v1/logout

    # ── Any-ID KMS (ARIA-CBC-256) ─────────────────────────────────────────
    # 개발: https://www.anyid.dev:8119 / 운영: https://www.anyid.go.kr:8119
    # NHN SKM(AES-256)과 독립적으로 운영. AnyIdKmsClient가 전담.
    kms:
      server-host: ${ANYID_KMS_HOST:https://www.anyid.dev:8119/}
      enc-alg:     ${ANYID_KMS_ENC_ALG:ARIA-CBC-256}
      cversion:    ${ANYID_KMS_CVERSION:1}
      # kdist 설정 파일 경로 (classpath 기준, 프로파일별 교체)
      kdist-config: ${ANYID_KMS_KDIST_CONFIG:classpath:config/anyid/kdist-local.json}
      # KMS app_key (Base64, 행안부 발급) — 운영: K8s Secret ANYID_KMS_APP_KEY로 주입
      app-key: ${ANYID_KMS_APP_KEY:}
      # KMS client_info (Base64, 행안부 발급) — 운영: K8s Secret ANYID_KMS_CLIENT_INFO로 주입
      client-info: ${ANYID_KMS_CLIENT_INFO:}
      connect-timeout-ms: 3000
      read-timeout-ms:    5000

    # ── 민간ID(소셜) 설정 ─────────────────────────────────────────────────
    # social-relay 경유 소셜 로그인 (카카오·네이버 등, L1)
    pid:
      # pid_api.json 위치
      api-config: ${ANYID_PID_API_CONFIG:classpath:config/anyid/pid_api.json}
      # 민간ID 인증 시작 URL (social-relay)
      provider-url: ${ANYID_PID_PROVIDER_URL:https://www.anyid.dev:1443/pid/auth.do}
      # ido 수신 콜백 경로
      callback-path: /api/v1/anyid/pid/callback
      # pid API 키 (행안부 발급 — 운영: K8s Secret으로 주입)
      client-id:      ${ANYID_PID_CLIENT_ID:}
      client-secret:  ${ANYID_PID_CLIENT_SECRET:}
      client-api-key: ${ANYID_PID_CLIENT_API_KEY:}

    # ── config.anyidc.json 위치 ────────────────────────────────────────────
    config-file: ${ANYID_CONFIG_FILE:classpath:config/anyid/config.anyidc.json}

    # ── HTTP 클라이언트 공통 타임아웃 ─────────────────────────────────────
    http:
      connect-timeout-ms: ${ANYID_HTTP_CONNECT_TIMEOUT_MS:3000}
      read-timeout-ms:    ${ANYID_HTTP_READ_TIMEOUT_MS:5000}

  # ── Keycloak OIDC 브로커 설정 (문서 §7, §10) ──────────────────────────
  # ido.broker.mode=keycloak 전환 시 아래 설정 활성화
  keycloak:
    # Keycloak 서버 URL (로컬: http://localhost:8088, Docker: http://keycloak:8088)
    base-url: ${KEYCLOAK_BASE_URL:http://localhost:8088}
    # Realm 이름 (§10-1)
    realm: ${KEYCLOAK_REALM:onepass}
    # ido-client 클라이언트 ID (§10-2 confidential client)
    client-id: ${KEYCLOAK_CLIENT_ID:ido-client}
    # ido-client 클라이언트 시크릿 (§10-2 — Keycloak Admin Console에서 생성)
    # [Sprint γ-1 / F2.1] default("change-me") 제거 → 미설정 시
    # KeycloakProperties.validateClientSecret() 가 부팅을 차단.
    # 테스트/로컬은 ido.keycloak.allow-empty-client-secret=true 로 우회.
    client-secret: ${KEYCLOAK_CLIENT_SECRET:}
    # Keycloak 콜백 redirect_uri (§10-2 Valid Redirect URIs에 등록 필수)
    redirect-uri: ${KEYCLOAK_REDIRECT_URI:http://localhost:8083/api/v1/broker/callback}
    # state/nonce Redis TTL (초) — CSRF 방어
    state-ttl-seconds: 300
    # JWKS 캐시 TTL (초) — 키 로테이션 주기보다 짧게 설정
    jwks-cache-ttl-seconds: 3600
    # HTTP 타임아웃
    connect-timeout-ms: 3000
    read-timeout-ms: 5000
    # kc_idp_hint 매핑 (§10-3 — Keycloak Identity Provider alias)
    idp-hint-mapping:
      kakao: social-kakao
      naver: social-naver
    # ACR → AuthLevel 매핑 (§10-4 — Keycloak ACR Mapper 설정 필요)
    acr-to-auth-level:
      "1": L1
      "2": L2
      "3": L3
    # NOTE(P1): Kafka 인증 이벤트 토픽은 ido.kafka.topic-auth-events 로 통일.
    # KeycloakOidcService / NonOidcAuthService 모두 ${ido.kafka.topic-auth-events} 참조.
    # 이전에 있던 ido.keycloak.auth-events-topic 키는 제거 — ido.kafka.topic-auth-events 사용.

  # 플랫폼 API 버전 (Webhook 헤더, Payload 등에 사용)
  platform-version: ${IDO_PLATFORM_VERSION:1.0}

  # provider_circuit_config 캐시 (ProviderCircuitBreakerConfig / ProviderConfigRepository)
  provider:
    circuit-cache-ttl-seconds: ${IDO_PROVIDER_CIRCUIT_CACHE_TTL:3600}

  # §11.2 기관 정책 기본값
  policy:
    default-version: ${IDO_DEFAULT_POLICY_VERSION:1.0}   # 신규 기관 생성 시 policyVersion 기본값

  # §16.4 Handoff Ticket 설정
  ticket:
    ttl-seconds: 60                  # 1회성 TTL
    encryption-algorithm: AES-256-GCM
    signing-algorithm: HMAC-SHA256
    key-rotation-days: 90
    key-grace-period-hours: 24
    reuse-block-threshold: 3
    # ── Handoff Ticket 폴백 키 (Sprint γ-3 / F3.3 후속) ────────────────────
    # KeyVersionRegistry 가 읽는 폴백 키. Redis/DB(KMS) 경로 실패 시 사용된다.
    # 환경변수 IDO_HANDOFF_AES_KEY / IDO_HANDOFF_HMAC_KEY 로 주입 — 운영 의무.
    # default("AAAA...=" 32바이트 0x00) 제거 →
    #   미설정 시 KeyVersionRegistry.validateFallbackKeys() 가 부팅 차단(CrashLoopBackOff).
    # 32바이트 무작위 키 생성: openssl rand -base64 32
    # 테스트/로컬은 ido.ticket.allow-empty-fallback-keys=true 로 우회.
    aes-key:  ${IDO_HANDOFF_AES_KEY:}
    hmac-key: ${IDO_HANDOFF_HMAC_KEY:}

  # §16.4.1 Clock Skew 허용
  clock-skew-tolerance-minutes: 5

  # ── FE 세션 설정 (onepass-fe BFF 이관) ──────────────────────────────────
  fe:
    session:
      sliding-ttl-minutes: 30            # §12.4 Sliding TTL
      absolute-timeout-minutes: 480      # §12.4 절대 만료 (8h)
    # returnUrl 화이트리스트 (§12.6 — 기관 callback_whitelist 보조)
    # [버그 수정 2026-05-16] B-2: PoC 더미 URL 제거, 실제 기관 URL로 교체
    # 운영 배포 시: 환경변수 IDO_FE_ALLOWED_RETURN_URLS 또는 ConfigMap으로 주입
    # ※ 기관 추가/변경 시 이 목록과 agency_meta.callback_whitelist DB 모두 갱신 필요
    allowed-return-urls:
      # ── 중소벤처기업부 직속 서비스 ──────────────────────────────────
      - ${ALLOWED_URL_SMES:https://www.smes.go.kr}
      - ${ALLOWED_URL_BIZINFO:https://www.bizinfo.go.kr}
      - ${ALLOWED_URL_MSS:https://www.mss.go.kr}
      # ── 산하기관 ─────────────────────────────────────────────────
      - ${ALLOWED_URL_SBIZ:https://www.sbiz.or.kr}
      - ${ALLOWED_URL_FANFAN:https://www.fanfan.or.kr}
      - ${ALLOWED_URL_KOSMES:https://www.kosmes.or.kr}
      # ── 나머지 기관 (환경변수로 추가 주입 — 운영팀 등록 필요) ──────
      # IDO_FE_ALLOWED_RETURN_URLS_EXTRA=https://기관1.go.kr,https://기관2.or.kr
      # ── 개발/스테이징 (운영 배포 시 제거 또는 환경변수로 분리) ───────
      - ${AGENCY_STUB_URL:http://localhost:8084}
      - ${REACT_DEV_URL:http://localhost:3000}
      - ${REACT_PROD_URL:http://localhost:3001}

  # ── 회원 전환 세션 설정 (ConversionInitService) ─────────────────────────
  conversion:
    session-ttl-minutes: 30              # ConversionSession Redis TTL (GUIDE-002)
    signed-request-max-age-minutes: 5    # JWT exp 허용 시간 (기관 signed_request 만료)

  # Kafka 토픽
  kafka:
    topic-handoff-events: ido.handoff.events
    topic-session-advisory: platform.session.advisory
    # P1 수정: KeycloakOidcService / NonOidcAuthService @Value(${ido.kafka.topic-auth-events}) 키와 일치
    topic-auth-events: ${IDO_KAFKA_TOPIC_AUTH_EVENTS:qsign.auth.events}
    consumer-group-qim: ido-qim-consumer               # qim.user.events 구독
    consumer-group-qsign: ido-qsign-consumer            # qsign.auth.events 구독
    consumer-group-fe-advisory: ido-fe-advisory-consumer  # platform.session.advisory 구독 (FE 세션)
    # Q-IM SP 수신 API 내부 전파 컨슈머 (QimSpMemberEventConsumer) — QIM-OUTBOX-SPEC-001
    # topic-qim-user-events: qim.user.events 로 전환 (KafkaTopicConfig에 신규 빈 추가)
    topic-qim-user-events: ${QIM_USER_EVENTS_TOPIC:qim.user.events}
    consumer-group-qim-member: ido-qim-member-consumer
    # qim.agency.events (기관 이벤트, 파티션 3, 보존 365일)
    topic-qim-agency-events: ${QIM_AGENCY_EVENTS_TOPIC:qim.agency.events}
    # ── Deprecated (QIM-OUTBOX-SPEC-001 마이그레이션 완료 후 제거 예정) ──────
    topic-qim-sp-member-events: ${QIM_SP_MEMBER_TOPIC:qim.sp.member.events}
    consumer-group-qim-sp-member: ido-qim-sp-member-consumer
    # Handoff 이벤트 컨슈머 (HandoffEventConsumer → WebhookDispatcherService)
    consumer-group-handoff: ido-handoff-consumer
    # 60,000명 대응 파티션/복제 설정 (KafkaTopicConfig 참조)
    # PoC: partition-count-main=12(기본), replication-factor=1, min-insync-replicas=1
    # 운영 3-broker: 환경변수 IDO_KAFKA_PARTITION_COUNT_MAIN=12, REPLICATION_FACTOR=3, ISR=2
    partition-count-main: ${IDO_KAFKA_PARTITION_COUNT_MAIN:12}
    partition-count-dlq:  ${IDO_KAFKA_PARTITION_COUNT_DLQ:6}
    replication-factor:   ${IDO_KAFKA_REPLICATION_FACTOR:1}
    min-insync-replicas:  ${IDO_KAFKA_MIN_INSYNC_REPLICAS:1}

  # ── Webhook Dispatcher 설정 ────────────────────────────────────────────
  # 기관 외부 HTTPS webhook 발송 Outbox Relay 설정
  webhook:
    # Outbox 폴링 간격 (ms) — 500ms: 60k 급증 시 빠른 발송
    relay-interval-ms: 500
    # 배치당 처리 건수 — 50건: 기관당 HTTP 동시 연결 수 제어
    relay-batch-size: 50
    # 기본 최대 재시도 횟수 (기관별 설정 우선)
    max-retry: 3
    # webhook 요청 타임아웃
    connect-timeout-ms: 3000
    read-timeout-ms: 8000
    # ── Sprint α-3 / F4.3 — HMAC-SHA256 기본 서명 비밀키 ─────────────────
    # 운영: 환경변수 IDO_WEBHOOK_SIGNING_SECRET (또는 Vault) 강제 주입.
    # 미설정 시 WebhookDispatcherService.validateSigningSecret() 가 부팅 단계에서 fail-fast.
    # 테스트/로컬 컨텍스트에서만 allow-empty-secret=true 로 우회 (application-local.yml / test yml에서 활성).
    signing-secret: ${IDO_WEBHOOK_SIGNING_SECRET:}
    allow-empty-secret: ${IDO_WEBHOOK_ALLOW_EMPTY_SECRET:false}

  # ── 60k 급증 대응 — Redis Pre-warming (Burst Absorption) ──────────────
  burst:
    # Auth Result Redis 캐시 TTL (초)
    # Handoff Ticket TTL(60s)보다 길게 설정 (사용자 이동 시간 고려)
    auth-result-cache-ttl-seconds: 300

  # ── Kafka 토픽 파티션 수 (환경별 오버라이드) ───────────────────────────
  # PoC 단일 브로커: partition-count-main=6, replication-factor=1
  # 운영 3-broker: partition-count-main=12, replication-factor=3, min-insync-replicas=2
  # (KafkaTopicConfig 참조)
  # kafka.partition-count-main, replication-factor, min-insync-replicas는
  # ido.kafka.* 네임스페이스가 아닌 KafkaTopicConfig @Value로 직접 주입됨.
  # 아래는 해당 설정을 위한 표준 위치 안내 주석 — 실제 값은 환경변수 또는 k8s ConfigMap으로 주입.
  # IDO_KAFKA_PARTITION_COUNT_MAIN=12
  # IDO_KAFKA_REPLICATION_FACTOR=3
  # IDO_KAFKA_MIN_INSYNC_REPLICAS=2

  # ── CORS (React dev-server / Nginx → IdO) ──────────────────────────────
  # BFF 이관에 따라 CORS 허용 Origin 관리
  cors:
    enabled: true
    allowed-origins:
      - ${CORS_ORIGIN_DEV:http://localhost:3000}    # React dev server (개발)
      - ${CORS_ORIGIN_PROD:http://localhost:3001}   # Nginx React (Option B 프로덕션)

  # ── Async Executor 설정 ───────────────────────────────────────────────────
  async:
    audit:
      core-pool-size: ${IDO_AUDIT_EXECUTOR_CORE:4}
      max-pool-size:  ${IDO_AUDIT_EXECUTOR_MAX:16}
      queue-capacity: ${IDO_AUDIT_EXECUTOR_QUEUE:10000}
      keep-alive-seconds: 60
    webhook:
      core-pool-size: ${IDO_WEBHOOK_EXECUTOR_CORE:4}
      max-pool-size:  ${IDO_WEBHOOK_EXECUTOR_MAX:20}
      queue-capacity: ${IDO_WEBHOOK_EXECUTOR_QUEUE:5000}

  audit:
    # F-03: Kafka 감사 발행 On/Off (IDO_AUDIT_KAFKA_ENABLED) — Kafka 없는 환경 false 권장
    kafka-publish-enabled: ${IDO_AUDIT_KAFKA_ENABLED:true}
    # F-04: DB 감사 저장 On/Off (IDO_AUDIT_DB_ENABLED) — ⚠️ 운영에서 false 금지
    db-save-enabled: ${IDO_AUDIT_DB_ENABLED:true}
    retry-interval-ms: 600000   # 10분마다 Kafka 미발행 감사 로그 재처리

  # ── Rate Limiting (Redis 기반 기관별 TPS/Daily 제한) ──────────────────────
  rate-limit:
    enabled:              ${IDO_RATE_LIMIT_ENABLED:true}
    default-tps:          ${IDO_RATE_LIMIT_DEFAULT_TPS:200}
    default-daily-limit:  ${IDO_RATE_LIMIT_DEFAULT_DAILY:1000000}

  # ── F-08: Redisson 분산 락 On/Off ──────────────────────────────────────────
  # false → NoOpRedissonConfig 사용 (Redis 없는 환경 앱 기동 가능)
  # ⚠️ K8s 다중 Pod 환경에서는 반드시 true
  redisson:
    enabled: ${IDO_REDISSON_ENABLED:true}

  # ── F-10: 보안 응답 헤더 On/Off ──────────────────────────────────────────
  # false → SecurityHeadersFilter 빈 미등록 (FE 개발 환경 CSP 오류 방지)
  security-headers:
    enabled: ${IDO_SECURITY_HEADERS_ENABLED:true}

  # ── F-05: OTel 분산 추적 AOP On/Off ──────────────────────────────────────
  # false → AuthTracingAspect 빈 미등록 (Jaeger/Tempo 없는 환경)
  tracing:
    auth-aspect-enabled: ${IDO_AUTH_TRACING_ENABLED:true}

  # ── F-11: 개인정보 파기 스케줄러 (이중 안전장치) ───────────────────────────
  # enabled 기본 false — 명시적 true 설정 시에만 실행
  # dry-run 기본 true  — 실제 삭제 전 반드시 dry-run 검증
  # ⚠️ 법무팀 보존 기간 확정 후 IDO_RETENTION_DAYS 설정 필수
  retention:
    enabled: ${IDO_RETENTION_ENABLED:false}
    dry-run: ${IDO_RETENTION_DRY_RUN:true}
    personal-data-days: ${IDO_RETENTION_DAYS:365}
    batch-size: ${IDO_RETENTION_BATCH_SIZE:100}

  # ── F-13: IdO Outbox Relay On/Off ────────────────────────────────────────
  # false → PENDING 폴링 없음 (Kafka 없는 환경 500ms 오류 방지)
  # 처리 대상: qsign.auth.events (qim.user.events 는 qim-outbox 릴레이가 전담)
  outbox:
    relay-enabled: ${IDO_OUTBOX_RELAY_ENABLED:true}
    relay-interval-ms: 500
    batch-size: 100
    max-retry: 3

  # ── F-30: Q-IM 회원 이벤트 Outbox Relay (QIM-OUTBOX-SPEC-001) ─────────────
  # Q-IM / Q-Sign 이 ido.outbox에 INSERT한 qim.user.events PENDING 레코드 발행
  # false → Q-IM SP 수신 후 Kafka 발행 없음 (Q-IM 통합 전 개발 단계)
  # true  → 1000ms 주기로 qim.user.events PENDING 레코드 폴링 후 Kafka 발행
  qim-outbox:
    relay-enabled: ${IDO_QIM_OUTBOX_RELAY_ENABLED:true}
    relay-interval-ms: ${IDO_QIM_OUTBOX_RELAY_INTERVAL_MS:1000}
    batch-size: ${IDO_QIM_OUTBOX_BATCH_SIZE:50}
    max-retry: ${IDO_QIM_OUTBOX_MAX_RETRY:5}

  # ── F-14: Webhook Outbox Relay On/Off ────────────────────────────────────
  # false → 기관 webhook 발송 없음 (PENDING은 DB 유지 → 재활성 시 처리)

  # ════════════════════════════════════════════════════════════════════════
  # Sprint 14~16 신규 기능 — Phase-Gate Feature Flags
  # 📖 docs/phased-rollout-strategy.md 참조
  # ⚠️  Phase 1: 아래 모든 신규 기능 기본값 false (안전)
  # ════════════════════════════════════════════════════════════════════════

  # ── F-20: 전 기관 프로비저닝 (Sprint 14, Phase 2 활성화) ─────────────────
  # true: JDK 21 Virtual Thread로 최대 68개 기관에 동시 HTTP POST 발행
  # ⚠️  F-22 dry-run=true 상태로 먼저 2주 관찰 후 운영 전환 권장
  provisioning:
    enabled:              ${IDO_PROVISIONING_ENABLED:false}       # F-20: Phase 2↑
    dry-run:              ${IDO_PROVISIONING_DRY_RUN:true}        # F-22: Phase 2-A=true, 2-B=false
    relay-enabled:        ${IDO_PROVISIONING_RELAY_ENABLED:false} # F-21: Phase 2-B↑
    relay-interval-ms:    ${IDO_PROVISIONING_RELAY_INTERVAL_MS:30000}
    relay-batch-size:     ${IDO_PROVISIONING_RELAY_BATCH_SIZE:50}
    timeout-ms:           ${IDO_PROVISIONING_TIMEOUT_MS:0}
    max-parallel-agencies: ${IDO_PROVISIONING_MAX_PARALLEL:100}

  # ── F-23/F-24: Agency Gateway API (Sprint 15, Phase 3 활성화) ────────────
  # F-23: 기관 → OnePass 인바운드 이벤트 수신 (POST /inbound/event)
  # F-24: OnePass → 기관 아웃바운드 발송 (PATCH /outbound/notify)
  # F-25: Redis 멱등성 중복 방어 (항상 true 권장)
  # F-26: HMAC-SHA256 서명 필수화 (Sprint 17, Phase 4↑, 현재 false)
  # F-27: Agency Key 인증 감사 로그 (항상 true)
  gateway:
    inbound-enabled:        ${IDO_GATEWAY_INBOUND_ENABLED:false}    # F-23: Phase 3-A↑
    outbound-enabled:       ${IDO_GATEWAY_OUTBOUND_ENABLED:false}   # F-24: Phase 3-B↑
    idempotency-enabled:    ${IDO_GATEWAY_IDEMPOTENCY_ENABLED:true} # F-25: 항상 ON
    hmac-sig-required:      ${IDO_HMAC_SIG_REQUIRED:false}          # F-26: Phase 4↑ (Sprint 17)
    agency-key-audit-log:   ${IDO_AGENCY_KEY_AUDIT_LOG:true}        # F-27: 항상 ON

  # ── AES 키 로테이션 스케줄러 ────────────────────────────────────────────
  crypto:
    rotation-enabled:      ${IDO_CRYPTO_ROTATION_ENABLED:true}
    rotation-check-cron:   "0 0 * * * *"    # 매 시간 정각
    # Sprint γ-3 / F3.3 후속:
    # [DEPRECATED] ido.crypto.handoff-aes-key / handoff-hmac-key 는 어떤 Java 코드도
    # 읽지 않는 dead config 였다 (γ-2 정적 검증에서 발견). 실제 폴백 키는
    # ido.ticket.aes-key / ido.ticket.hmac-key 에서 처리한다 (KeyVersionRegistry).
    # IDO_HANDOFF_AES_KEY / IDO_HANDOFF_HMAC_KEY 환경변수는 ido.ticket.* 로 매핑된다.

  # ── KMS 연동 설정 (S9-T8) ─────────────────────────────────────────────────
  #
  # ┌─────────────────────────────────────────────────────────────────────┐
  # │  KMS On/Off 및 Provider 선택                                         │
  # │                                                                     │
  # │  enabled=false → LocalKmsClient  (Base64 패스스루, 개발·로컬)        │
  # │  enabled=true  → provider 값으로 구현체 자동 선택                    │
  # │    provider=vault → VaultKmsClient  ★ 기본 표준 (HashiCorp Vault)   │
  # │    provider=nhn   → NhnKmsClient   (NHN Cloud SKM, 레거시)          │
  # │    provider=noop  → NoOpKmsClient  (Base64 패스스루, 명시적 테스트)  │
  # └─────────────────────────────────────────────────────────────────────┘
  #
  # [환경별 권장 설정]
  #   local/CI   : IDO_KMS_ENABLED=false
  #   dev 서버   : IDO_KMS_ENABLED=true  / IDO_KMS_PROVIDER=vault
  #   stage/prod : IDO_KMS_ENABLED=true  / IDO_KMS_PROVIDER=vault
  #   NHN 유지   : IDO_KMS_ENABLED=true  / IDO_KMS_PROVIDER=nhn  (레거시)
  kms:
    # ── On/Off 스위치 ────────────────────────────────────────────────────
    # false(기본): LocalKmsClient 활성화 — KMS 서버 없이 개발 가능
    # true:        provider 값에 따라 실제 KMS 클라이언트 활성화
    enabled:  ${IDO_KMS_ENABLED:false}

    # ── Provider 선택 (enabled=true 시에만 유효) ─────────────────────────
    # vault : HashiCorp Vault Transit Engine (★ 운영 표준)
    # nhn   : NHN Cloud Secure Key Manager  (레거시, 기존 운영 환경 유지용)
    # noop  : Base64 패스스루 — enabled=true이지만 실제 암호화 없음 (테스트)
    provider: ${IDO_KMS_PROVIDER:vault}

    # ── 공통 타임아웃 ────────────────────────────────────────────────────
    connection-timeout-ms: ${IDO_KMS_CONN_TIMEOUT_MS:3000}
    request-timeout-ms:    ${IDO_KMS_REQ_TIMEOUT_MS:5000}

    # ── HashiCorp Vault Transit Engine (provider=vault) ──────────────────
    # 업계 표준 KMS. 온프레미스·클라우드·하이브리드 환경 모두 지원.
    # Transit Engine: 키 재료는 Vault 내부에만 존재, 앱은 ciphertext만 보관.
    #
    # [Vault 빠른 시작 — docker-compose 개발 환경]
    #   VAULT_ADDR=http://localhost:8200
    #   VAULT_TOKEN=dev-root-token
    #   vault secrets enable transit
    #   vault write -f transit/keys/ido-handoff-key
    #
    # [K8s 운영 — Kubernetes Auth 권장]
    #   VAULT_AUTH_METHOD=kubernetes
    #   VAULT_K8S_ROLE=ido
    vault:
      # Vault 서버 주소 — 환경변수 VAULT_ADDR 우선
      address:      ${VAULT_ADDR:http://vault:8200}

      # Transit 시크릿 엔진 마운트 경로 (vault secrets enable -path=transit transit)
      transit-path: ${VAULT_TRANSIT_PATH:transit}

      # Transit 키 이름 (vault write -f transit/keys/ido-handoff-key)
      key-name:     ${VAULT_TRANSIT_KEY:ido-handoff-key}

      # 인증 방식: token | approle | kubernetes
      # 환경변수 VAULT_AUTH_METHOD로 오버라이드 가능
      auth-method:  ${VAULT_AUTH_METHOD:token}

      # Token 인증 전용 (auth-method=token, 개발용)
      # 운영: 절대 소스 코드에 직접 기재 금지 — K8s Secret VAULT_TOKEN으로 주입
      token:        ${VAULT_TOKEN:}

      # HCP Vault Dedicated 전용 Namespace (자체 호스팅 Vault는 비워둠)
      namespace:    ${VAULT_NAMESPACE:}

      # ── F5.2 Escape Hatch (Sprint α-1) ─────────────────────────────────
      # 토큰 획득 실패 시 startup을 차단할지 여부.
      #   false (기본): 토큰 획득 실패 시 IllegalStateException → startup 차단 → Pod 재시작
      #   true        : 경고만 출력하고 startup 진행 (테스트·일시 격리 전용, 운영 금지)
      # 환경변수: IDO_KMS_VAULT_ALLOW_EMPTY_TOKEN
      allow-empty-token: ${IDO_KMS_VAULT_ALLOW_EMPTY_TOKEN:false}

    # ── LocalKmsClient F5.1 Escape Hatch (Sprint α-1) ─────────────────────
    # @Profile("!prod & !stage") 어노테이션 + matchIfMissing=false 로 1차 가드.
    # @PostConstruct 부팅 가드가 활성 프로파일에 prod/stage 포함 시 fail-fast.
    # 이 escape hatch는 부팅 가드를 우회하지만 평문 키 모드는 그대로이므로
    # 운영 환경 절대 사용 금지.
    local:
      allow-in-prod: ${IDO_KMS_LOCAL_ALLOW_IN_PROD:false}

    # ── NHN Cloud Secure Key Manager (provider=nhn, 레거시) ─────────────
    # 기존 NHN Cloud 운영 환경 유지를 위한 레거시 옵션.
    # 신규 환경은 provider=vault 사용 권장.
    # API: https://docs.nhncloud.com/ko/Security/Secure Key Manager/ko/api-guide-v1.0/
    nhn:
      endpoint:    ${NHN_SKM_ENDPOINT:https://api-keymanager.nhncloudservice.com}
      appkey:      ${NHN_SKM_APPKEY:}
      # mode: secret(기본) | envelope
      # secret:   SKM 기밀 데이터에서 키 재료 직접 조회 (keyId를 DB에 보관)
      # envelope: SKM 대칭 키로 DEK 암/복호화 (ciphertext를 DB에 보관)
      mode:        ${NHN_SKM_MODE:secret}
      aes-key-id:  ${NHN_SKM_AES_KEY_ID:}
      hmac-key-id: ${NHN_SKM_HMAC_KEY_ID:}

# ── Resilience4j (S9-T2: NICE/OACX/통합인증 CB+Retry 추가) ───────────────
resilience4j:
  circuitbreaker:
    instances:
      qim-client:
        register-health-indicator: true
        sliding-window-type: COUNT_BASED
        sliding-window-size: 10
        failure-rate-threshold: 60
        slow-call-rate-threshold: 80
        slow-call-duration-threshold: 3s
        wait-duration-in-open-state: 15s
        permitted-number-of-calls-in-half-open-state: 3
        minimum-number-of-calls: 5
      # P2 수정: qsign-client → keycloak-client (Keycloak HTTP 호출 보호)
      keycloak-client:
        sliding-window-size: 10
        failure-rate-threshold: 50
        slow-call-rate-threshold: 80
        slow-call-duration-threshold: 3s
        wait-duration-in-open-state: 30s
        permitted-number-of-calls-in-half-open-state: 5
        minimum-number-of-calls: 5
      # ── S9-T2 신규: NICE API 클라이언트 CB ────────────────────────────────
      # NICE 서버 장애 시 빠른 Open 전환으로 불필요한 블로킹 방지
      # Half-Open: 3건 탐침 → 실패율 50% 이하이면 Closed 복귀
      nice-api-client:
        register-health-indicator: true
        sliding-window-type: COUNT_BASED
        sliding-window-size: 10
        failure-rate-threshold: 50
        slow-call-rate-threshold: 80
        slow-call-duration-threshold: 8s          # NICE API 평균 응답 ~1s, SLA 기준 8s
        wait-duration-in-open-state: 30s
        permitted-number-of-calls-in-half-open-state: 3
        minimum-number-of-calls: 5
        record-exceptions:
          - java.lang.IllegalStateException
          - java.io.IOException
          - java.util.concurrent.TimeoutException
      # ── S9-T2 신규: 통합인증 서버 CB ─────────────────────────────────────
      # 기업 간편인증 콜백 처리 시 통합인증 서버 장애 격리
      integration-auth-client:
        sliding-window-size: 10
        failure-rate-threshold: 50
        slow-call-duration-threshold: 8s
        wait-duration-in-open-state: 60s           # 통합인증 서버 장애 복구에 더 긴 대기
        permitted-number-of-calls-in-half-open-state: 3
        minimum-number-of-calls: 5
        record-exceptions:
          - java.lang.IllegalStateException
          - java.io.IOException
          - java.util.concurrent.TimeoutException
  retry:
    instances:
      qim-client:
        max-attempts: 3
        wait-duration: 300ms
        retry-exceptions:
          - java.io.IOException
          - java.util.concurrent.TimeoutException
      # P2 수정: qsign-client → keycloak-client
      keycloak-client:
        max-attempts: 3
        wait-duration: 500ms
        retry-exceptions:
          - java.io.IOException
          - java.util.concurrent.TimeoutException
      # ── S9-T2 신규: NICE API Retry ────────────────────────────────────────
      # 최대 2회 재시도 (총 3회 시도): NICE 서버 간헐적 5xx 대응
      # Exponential Backoff: 500ms → 1000ms (jitter 포함)
      nice-api-client:
        max-attempts: 2
        wait-duration: 500ms
        enable-exponential-backoff: true
        exponential-backoff-multiplier: 2.0
        retry-exceptions:
          - java.io.IOException
          - java.util.concurrent.TimeoutException
        ignore-exceptions:
          - java.lang.IllegalArgumentException   # 클라이언트 입력 오류는 재시도 불필요
      # ── S9-T2 신규: 통합인증 서버 Retry ──────────────────────────────────
      integration-auth-client:
        max-attempts: 2
        wait-duration: 500ms
        enable-exponential-backoff: true
        exponential-backoff-multiplier: 2.0
        retry-exceptions:
          - java.io.IOException
          - java.util.concurrent.TimeoutException
  timelimiter:
    instances:
      qim-client:
        timeout-duration: 5s
      # P2 수정: qsign-client → keycloak-client
      keycloak-client:
        timeout-duration: 5s
      # ── S9-T2 신규: NICE/통합인증 TimeLimiter ─────────────────────────────
      # WebClient는 자체 타임아웃이 있으나 Resilience4j TimeLimiter도 추가하여
      # 반응형 파이프라인 외부에서도 시간 제한 보장
      nice-api-client:
        timeout-duration: 12s    # WebClient 타임아웃(10s) + 여유 2s
      integration-auth-client:
        timeout-duration: 12s

# ── Actuator (S9-T4: OTel 추적 설정 포함) ─────────────────────
management:
  endpoints:
    web:
      exposure:
        # features: 현재 기능 플래그 On/Off 상태 조회 (/actuator/features)
        include: health,info,metrics,prometheus,flyway,features
  endpoint:
    health:
      show-details: when-authorized
      probes:
        enabled: true
      # ── Health Group 매핑 (PR-A5: 운영 단순화) ───────────────────────────
      # liveness  : 자체 결함만 (Pod 재시작이 의미 있는 항목)
      # readiness : 핵심 의존성만 — db / redis / kms
      #
      # KMS는 readiness에 포함: KMS 다운 시 ID 핸드오프 암호화 자체가 불가능하므로
      # 트래픽 차단이 정당하다. (VaultKmsHealthIndicator → @Component("kms"))
      #
      # ※ 이외의 모든 비-핵심 지표(Kafka 연결, Outbox 백로그 등)는 readiness에서
      #   제외하고 Prometheus Metric으로 처리한다. 자세한 정책은
      #   docs/OPERATION_INVENTORY.md 참조.
      group:
        liveness:
          include: livenessState
        readiness:
          include: readinessState,db,redis,kms
  metrics:
    tags:
      application: ${spring.application.name}
  # ── Micrometer Tracing (S9-T4) ──────────────────────────────────
  # Spring Boot Actuator 자동 설정: Micrometer Tracing Bridge → OTel SDK → OTLP Exporter
  tracing:
    sampling:
      probability: ${TRACING_SAMPLING_PROBABILITY:1.0}   # 운영: 0.1~0.3 권장 (10%~30% 샘플링)
    # W3C TraceContext 전파 (traceparent 헤더)
    propagation:
      type: W3C
  otlp:
    tracing:
      endpoint: ${OTLP_ENDPOINT:http://localhost:4318/v1/traces}
      timeout: 5s


logging:
  level:
    io.github.hipstermin.idem.hub: INFO
    io.github.hipstermin.idem.hub.fe: INFO
    io.github.hipstermin.idem.hub.webhook: INFO
    io.github.hipstermin.idem.hub.burst: INFO
    io.github.hipstermin.idem.hub.audit: INFO
    org.springframework.kafka: WARN
    org.flywaydb: INFO

