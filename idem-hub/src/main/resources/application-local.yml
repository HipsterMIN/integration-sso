# ⚠️ 2026-09-05: 이 파일에 평문으로 있던 벤더 개발 자격증명(AnyID SSO/PID/KMS, Q-IM AES 공유키, 기관 subject secret)을
#    모두 환경변수 플레이스홀더로 교체했다. 로컬 기동 시 아래 변수를 셸 또는 IDE 실행 구성에 설정한다.
#      ANYID_SSO_SECRET_CODE, ANYID_PID_CLIENT_ID, ANYID_PID_CLIENT_SECRET, ANYID_PID_CLIENT_API_KEY,
#      ANYID_KMS_APP_KEY, QIM_AES_SHARED_KEY, IDO_AGENCY_SUBJECT_SECRET
#    값은 저장소·이슈·채팅에 적지 않는다. 종전 값은 git 히스토리에 남아 있으므로 벤더(AnyID·NICE)에 키 교체를 요청한다.
# ============================================================
# IdO local 프로파일 — 로컬 개발 환경 안전 기본값
# 목적: 외부 의존성(Redis 분산락/Kafka/OTel/SKM) 없이도 앱 기동 가능
# 사용법: --spring.profiles.active=local
#
# 전체 기능 플래그 설명: docs/FEATURE_FLAGS.md 참조
# ============================================================

spring:
  kafka:
    bootstrap-servers: localhost:9092
    listener:
      missing-topics-fatal: false        # Kafka 없어도 기동 허용
    consumer:
      properties:
        metadata.max.age.ms: 5000
  flyway:
    enabled: true
    connect-retries: 3
    connect-retries-interval: 3s

# ── Feature Flags: 로컬 안전 기본값 ─────────────────────────────────────────
ido:

  # F-08: Redisson 분산 락 OFF → Redis 없어도 앱 기동 가능
  # (NiceAuthService는 JVM 내 synchronized 만 사용)
  redisson:
    enabled: false

  # F-01: IP Auth Rate Limiting OFF → 반복 테스트 시 자기 IP 차단 방지
  auth:
    rate-limit:
      enabled: false
    # NICE/OACX 로컬 테스트 설정
    nice:
      client-id: ${NICE_CLIENT_ID:}
      client-secret: ${NICE_CLIENT_SECRET:}
      return-url: ${NICE_RETURN_URL:http://localhost:3000/otp/auth-result}
      timeout-seconds: 15
    oacx:
      provider-key-path: ${OACX_PROVIDER_KEY_PATH:}
      debug-mode: true
    integration:
      base-url: ${INTEGRATION_AUTH_BASE_URL:http://localhost:9292}
      timeout-seconds: 15

  # F-02: 기관 Rate Limiting OFF → 로컬 테스트 중 기관 제한 없음
  rate-limit:
    enabled: false

  # F-03: Kafka 감사 로그 발행 OFF → Kafka 없어도 연결 오류 없음
  # F-04: DB 감사 로그 저장 OFF  → audit_log 테이블 없어도 오류 없음
  audit:
    kafka-publish-enabled: false
    db-save-enabled: false
    retry-interval-ms: 3600000          # 로컬에서 재처리 주기 1시간으로 늘림

  # F-05: OTel 추적 AOP OFF → Jaeger/Tempo 없는 로컬 환경
  tracing:
    auth-aspect-enabled: false

# ── OpenTelemetry / Micrometer Tracing 비활성화 ────────────────────────────────
# 목적: 로컬 개발 시 "localhost:4318 connection refused" OTLP timeout 로그 제거
# 원인: OTLP Exporter가 5초마다 Jaeger/Tempo로 Span 전송 시도 → 수집기 미실행 시 타임아웃
# 비즈니스 로직 영향: 없음 (OTel은 관찰성 기능, 앱 동작과 무관)
# 운영 환경: 환경변수 OTLP_ENDPOINT, TRACING_SAMPLING_PROBABILITY로 오버라이드
management:
  tracing:
    sampling:
      probability: 0.0          # 샘플링 완전 비활성화 → Span 자체를 생성하지 않음
  otlp:
    tracing:
      endpoint: ""               # 빈 값 → OTLP Exporter 전송 시도 자체 비활성화

  # F-10: 보안 헤더 OFF → FE 개발 중 CSP 오류 없음 (필요 시 ON으로 변경)
  security-headers:
    enabled: false

  # F-11: 개인정보 파기 스케줄러 OFF → 개발 DB 데이터 보호 (이중 안전장치)
  retention:
    enabled: false
    dry-run: true                        # 이중 안전장치

  # F-12: 키 로테이션 OFF → 개발 중 키 변경으로 인한 테스트 불안정성 방지
  crypto:
    rotation-enabled: false

  # ⚠️  IDO_BROKER_MODE는 "표준 OIDC(카카오·네이버)" 처리 백엔드만 결정한다.
  # 플러그인 직접 브로커 인증수단(AnyID 모바일신분증·간편인증 등)은 이 값과 무관하게 플러그인이 처리.
  #
  # qsign    : [표준 OIDC] q-sign 위임 (기본)
  # keycloak : [표준 OIDC] Keycloak 직접 연동 → IDO_BROKER_MODE=keycloak 환경변수 설정
  broker:
    mode: ${IDO_BROKER_MODE:qsign}

  # ── Any-ID 설치형 연동: S5b 부터 코어 설정에 없다 — plugins/idem-plugin-anyid 기본값 + 환경변수(ANYID_*) ──
  # ⚠️ 2026-09-11: 이 블록에 남아 있던 KMS client-info 평문(및 config/anyid/*.json·sso-adaptor-conf-local.properties 의
  #    app_key·client_info·PID clientId/Secret/ApiKey·SSO secret)을 저장소에서 제거했다. 히스토리에 남아 있으므로 벤더에 키 교체를 요청한다.

  # F-13: IdO Outbox Relay OFF → Kafka 없는 환경 500ms 폴링 오류 없음
  outbox:
    relay-enabled: false

  # F-14: Webhook Relay OFF → 기관 endpoint 없는 로컬 환경 오류 없음
  webhook:
    relay-enabled: false
    # Sprint α-3 / F4.3 — 로컬은 signing-secret 미설정 허용 (운영은 application.yml에서 강제)
    allow-empty-secret: true

  # Sprint β-2 / F4.8 — 로컬은 internal caller 등록 없이 fe-session 호출 허용
  # (단, 인터셉터는 등록되어 있으므로 헤더가 들어오면 검증함. 헤더가 없으면 401)
  # 운영은 application.yml 에서 강제.
  internal:
    allow-empty-callers: true

  # Sprint γ-1 / F2.1 — 로컬은 keycloak.client-secret 미주입 허용
  # (IDO_BROKER_MODE=qsign 인 경우 실제 사용 안 함. keycloak 모드에서는 실제 secret 필요)
  # 운영은 application.yml 에서 강제 (KEYCLOAK_CLIENT_SECRET 환경변수 필수).
  keycloak:
    allow-empty-client-secret: true

  # F-18: SP 수신 감사 로그 OFF
  qim:
    aes-shared-key: ${QIM_AES_SHARED_KEY:}   # 개인정보·벤더 자격증명 — 환경변수로만 주입 (2026-09-05 평문 제거)
    receiver-audit-enabled: false

  agency-subject-secret: ${IDO_AGENCY_SUBJECT_SECRET:}   # 개인정보·벤더 자격증명 — 환경변수로만 주입 (2026-09-05 평문 제거)

# ── Resilience4j 로컬 완화 설정 (F-06, F-07) ─────────────────────────────────
# NICE/통합인증 서버 없는 로컬에서 CB가 즉시 OPEN되어
# 모든 요청이 fallback 반환하는 현상 방지
resilience4j:
  circuitbreaker:
    instances:
      nice-api-client:
        minimum-number-of-calls: 100    # 100건 쌓여야 CB 집계 시작 (사실상 비활성)
        failure-rate-threshold: 100     # 100% 실패해야 OPEN
        sliding-window-size: 100
      integration-auth-client:
        minimum-number-of-calls: 100
        failure-rate-threshold: 100
        sliding-window-size: 100
  retry:
    instances:
      nice-api-client:
        max-attempts: 1                 # 재시도 없음 (로컬 테스트 속도 향상)
      integration-auth-client:
        max-attempts: 1

# ── 로컬 로그 레벨 ────────────────────────────────────────────────────────────
logging:
  level:
    org.springframework.kafka: ERROR
    org.apache.kafka: ERROR
    io.github.hipstermin.idem.hub.auth: DEBUG          # 인증 흐름 상세 로그
    io.github.hipstermin.idem.hub.crypto: DEBUG        # 암호화 디버그
    io.github.hipstermin.idem.hub.ratelimit: DEBUG     # Rate Limit 디버그
    io.github.hipstermin.idem.hub.config: DEBUG        # FeatureFlags 기동 로그 확인
