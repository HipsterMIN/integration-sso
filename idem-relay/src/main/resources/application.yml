server:
  port: 8090
  shutdown: graceful

spring:
  application:
    name: idem-relay
  lifecycle:
    timeout-per-shutdown-phase: 30s   # 진행 중 Job 완료 대기

  # ── Spring Boot 자동 DataSource/Flyway 비활성 ──────────────────────────────
  # BatchDataSourceConfig 에서 수동 설정. relay 는 스키마를 소유하지 않는다(1.0.1: idem_hub.shedlock 은 hub V27 이 만든다)
  autoconfigure:
    exclude:
      - org.springframework.boot.autoconfigure.jdbc.DataSourceAutoConfiguration
      - org.springframework.boot.autoconfigure.orm.jpa.HibernateJpaAutoConfiguration
      - org.springframework.boot.autoconfigure.flyway.FlywayAutoConfiguration

  # ── Redis (ShedLock Primary Provider) ──────────────────────────────────────
  data:
    redis:
      host: ${REDIS_HOST:localhost}
      port: ${REDIS_PORT:6379}
      password: ${REDIS_PASSWORD:}
      timeout: 2000ms
      lettuce:
        pool:
          max-active: 5
          max-idle: 3
          min-idle: 1
          max-wait: 1000ms

  # ── Kafka Producer ──────────────────────────────────────────────────────────
  kafka:
    bootstrap-servers: ${KAFKA_SERVERS:localhost:9092}
    properties:
      security.protocol: PLAINTEXT


  # ── Flyway (ido DataSource 전용 — V19 shedlock 테이블) ──────────────────────
  # relay 는 Flyway 를 돌리지 않는다(1.0.1, 3차 점검 H3: relay 의 repair 가 hub 의 마이그레이션 이력을 지웠다). 자동 설정은 autoconfigure.exclude 로 비활성.
  flyway:
    enabled: false
# ═══════════════════════════════════════════════════════════════════════════════
# 배치 서비스 전용 설정
# ═══════════════════════════════════════════════════════════════════════════════

idem.relay:

  # ── 멀티 DataSource ─────────────────────────────────────────────────────────
  datasource:

    # ── ido PostgreSQL (Primary) ───────────────────────────────────────────────
    # 대상: idem_hub.outbox, idem_hub.provisioning_outbox, idem_hub.webhook_dispatch_outbox, idem_hub.shedlock
    hub:
      jdbc-url: jdbc:postgresql://${IDEM_HUB_DB_HOST:localhost}:${IDEM_HUB_DB_PORT:5432}/${IDEM_HUB_DB_NAME:idem}?currentSchema=idem_hub
      username: ${IDEM_HUB_DB_USERNAME:idem}
      password: ${IDEM_HUB_DB_PASSWORD:idem}
      driver-class-name: org.postgresql.Driver
      # 배치는 순차 폴링 — 풀 크기 작게 유지
      maximum-pool-size: 5
      minimum-idle: 2
      idle-timeout: 300000
      connection-timeout: 30000
      max-lifetime: 1800000
      connection-test-query: SELECT 1

    # ── q-im PostgreSQL (D1: MariaDB → PostgreSQL, 스키마 qim) ─────────────────
    # 대상: idem.registry.outbox. 종전 MariaDB 설치는 IDEM_REGISTRY_DB_URL/IDEM_REGISTRY_DB_DRIVER 로 jdbc:mariadb://… 를 주입해 1 릴리스 동안 유지
    registry:
      jdbc-url: ${IDEM_REGISTRY_DB_URL:jdbc:postgresql://${IDEM_REGISTRY_DB_HOST:localhost}:${IDEM_REGISTRY_DB_PORT:5432}/${IDEM_REGISTRY_DB_NAME:idem}?currentSchema=${IDEM_REGISTRY_DB_SCHEMA:idem_registry}}
      username: ${IDEM_REGISTRY_DB_USERNAME:idem}
      password: ${IDEM_REGISTRY_DB_PASSWORD:idem}
      driver-class-name: ${IDEM_REGISTRY_DB_DRIVER:org.postgresql.Driver}
      maximum-pool-size: 5
      minimum-idle: 1
      idle-timeout: 300000
      connection-timeout: 30000
      max-lifetime: 1800000
      connection-test-query: SELECT 1

    # ── q-sign PostgreSQL ───────────────────────────────────────────────────────
    # 대상: idem_gate.outbox
    gate:
      jdbc-url: jdbc:postgresql://${IDEM_GATE_DB_HOST:localhost}:${IDEM_GATE_DB_PORT:5432}/${IDEM_GATE_DB_NAME:idem}?currentSchema=idem_gate
      username: ${IDEM_GATE_DB_USERNAME:idem}
      password: ${IDEM_GATE_DB_PASSWORD:idem}
      driver-class-name: org.postgresql.Driver
      maximum-pool-size: 5
      minimum-idle: 1
      idle-timeout: 300000
      connection-timeout: 30000
      max-lifetime: 1800000
      connection-test-query: SELECT 1

    # ── q-authz PostgreSQL ──────────────────────────────────────────────────────
    # 대상: idem_authz.authz_outbox (인가 부여/회수/만료 이벤트)
    authz:
      jdbc-url: jdbc:postgresql://${IDEM_AUTHZ_DB_HOST:localhost}:${IDEM_AUTHZ_DB_PORT:5432}/${IDEM_AUTHZ_DB_NAME:idem}?currentSchema=idem_authz
      username: ${IDEM_AUTHZ_DB_USERNAME:idem}
      password: ${IDEM_AUTHZ_DB_PASSWORD:idem}
      driver-class-name: org.postgresql.Driver
      maximum-pool-size: 5
      minimum-idle: 1
      idle-timeout: 300000
      connection-timeout: 30000
      max-lifetime: 1800000
      connection-test-query: SELECT 1

  # ── HTTP 클라이언트 ─────────────────────────────────────────────────────────
  http:
    connect-timeout-ms: 3000
    read-timeout-ms: 8000
    max-connections-total: 100
    max-connections-per-route: 20

    # ── mTLS 클라이언트 인증서 설정 ─────────────────────────────────────────────
    # MTLS 인증 방식 기관과의 통신에 필요한 클라이언트 인증서(PKCS12) 설정.
    # K8s Secret envFrom으로 주입 권장.
    #
    # 등록 방법:
    #   kubectl create secret generic batch-mtls-cert \
    #     --from-literal=IDEM_RELAY_MTLS_KEYSTORE_BASE64=$(base64 -w0 /path/to/client.p12) \
    #     --from-literal=IDEM_RELAY_MTLS_KEYSTORE_PASS=<keystore-password> \
    #     -n production
    #
    # 미설정 시: mtlsProvisioningRestTemplate 이 일반 TLS로 Fallback (WARN 로그 발생)
    mtls:
      keystore-base64: ${IDEM_RELAY_MTLS_KEYSTORE_BASE64:}
      keystore-password: ${IDEM_RELAY_MTLS_KEYSTORE_PASS:}
      keystore-type: ${IDEM_RELAY_MTLS_KEYSTORE_TYPE:PKCS12}

  # ── 릴레이 Job 설정 ─────────────────────────────────────────────────────────
  jobs:

    # ── ido → Kafka (idem.gate.auth.events, 기타 토픽) ─────────────────────────────
    hub:
      kafka:
        enabled: ${IDEM_RELAY_HUB_KAFKA_RELAY_ENABLED:true}
        interval-ms: ${IDEM_RELAY_HUB_KAFKA_INTERVAL_MS:500}
        batch-size: ${IDEM_RELAY_HUB_KAFKA_BATCH_SIZE:100}
        max-retry: ${IDEM_RELAY_HUB_KAFKA_MAX_RETRY:3}
        lock-at-most: ${IDEM_RELAY_HUB_KAFKA_LOCK_MOST:10s}
        lock-at-least: ${IDEM_RELAY_HUB_KAFKA_LOCK_LEAST:400ms}

      # ── ido → idem.registry.user.events ──────────────────────────────────────────────
      qim:
        enabled: ${IDEM_RELAY_HUB_REGISTRY_RELAY_ENABLED:true}
        interval-ms: ${IDEM_RELAY_HUB_REGISTRY_INTERVAL_MS:1000}
        batch-size: ${IDEM_RELAY_HUB_REGISTRY_BATCH_SIZE:50}
        max-retry: ${IDEM_RELAY_HUB_REGISTRY_MAX_RETRY:5}
        lock-at-most: ${IDEM_RELAY_HUB_REGISTRY_LOCK_MOST:15s}
        lock-at-least: ${IDEM_RELAY_HUB_REGISTRY_LOCK_LEAST:800ms}

    # ── q-im → Kafka (idem.registry.user.events) ─────────────────────────────────────────
    registry:
      kafka:
        enabled: ${IDEM_RELAY_REGISTRY_KAFKA_RELAY_ENABLED:true}
        interval-ms: ${IDEM_RELAY_REGISTRY_KAFKA_INTERVAL_MS:500}
        batch-size: ${IDEM_RELAY_REGISTRY_KAFKA_BATCH_SIZE:100}
        max-retry: ${IDEM_RELAY_REGISTRY_KAFKA_MAX_RETRY:5}
        lock-at-most: ${IDEM_RELAY_REGISTRY_KAFKA_LOCK_MOST:10s}
        lock-at-least: ${IDEM_RELAY_REGISTRY_KAFKA_LOCK_LEAST:400ms}
        retry-interval-ms: ${IDEM_RELAY_REGISTRY_KAFKA_RETRY_INTERVAL_MS:30000}

    # ── q-sign → Kafka (idem.gate.auth.events) ─────────────────────────────────────
    gate:
      kafka:
        enabled: ${IDEM_RELAY_GATE_KAFKA_RELAY_ENABLED:true}
        interval-ms: ${IDEM_RELAY_GATE_KAFKA_INTERVAL_MS:500}
        batch-size: ${IDEM_RELAY_GATE_KAFKA_BATCH_SIZE:100}
        max-retry: ${IDEM_RELAY_GATE_KAFKA_MAX_RETRY:3}
        topic: ${IDEM_GATE_AUTH_EVENTS_TOPIC:idem.gate.auth.events}
        lock-at-most: ${IDEM_RELAY_GATE_KAFKA_LOCK_MOST:10s}
        lock-at-least: ${IDEM_RELAY_GATE_KAFKA_LOCK_LEAST:400ms}

    # ── q-authz → Kafka (idem.authz.assignment.events) ─────────────────────────────
    authz:
      kafka:
        enabled: ${IDEM_RELAY_AUTHZ_KAFKA_RELAY_ENABLED:true}
        interval-ms: ${IDEM_RELAY_AUTHZ_KAFKA_INTERVAL_MS:500}
        batch-size: ${IDEM_RELAY_AUTHZ_KAFKA_BATCH_SIZE:100}
        max-retry: ${IDEM_RELAY_AUTHZ_KAFKA_MAX_RETRY:5}
        topic: ${IDEM_AUTHZ_ASSIGNMENT_EVENTS_TOPIC:idem.authz.assignment.events}
        lock-at-most: ${IDEM_RELAY_AUTHZ_KAFKA_LOCK_MOST:10s}
        lock-at-least: ${IDEM_RELAY_AUTHZ_KAFKA_LOCK_LEAST:400ms}
        retry-interval-ms: ${IDEM_RELAY_AUTHZ_KAFKA_RETRY_INTERVAL_MS:30000}

    # (S4b) 프로비저닝 릴레이 제거 — 전 기관 프로비저닝 흐름은 코어에서 삭제되었다 (docs/generalization-plan.md §2.0)

    # ── Webhook HTTPS POST 릴레이 ──────────────────────────────────────────────
    webhook:
      enabled: ${IDEM_RELAY_WEBHOOK_RELAY_ENABLED:true}
      interval-ms: ${IDEM_RELAY_WEBHOOK_INTERVAL_MS:500}
      batch-size: ${IDEM_RELAY_WEBHOOK_BATCH_SIZE:50}
      max-retry: ${IDEM_RELAY_WEBHOOK_MAX_RETRY:3}
      signing-secret: ${IDEM_HUB_WEBHOOK_SIGNING_SECRET:}
      lock-at-most: ${IDEM_RELAY_WEBHOOK_LOCK_MOST:10s}
      lock-at-least: ${IDEM_RELAY_WEBHOOK_LOCK_LEAST:400ms}

  # ── DEAD_LETTER 알림 채널 (D-06) ────────────────────────────────────────────
  # provisioning_outbox DEAD_LETTER 전환 시 Slack/PagerDuty 알림 발송.
  # 두 채널은 독립적으로 활성화 가능 — 하나 실패해도 나머지 발송 시도.
  #
  # Slack 설정:
  #   kubectl create secret generic batch-alert-slack \
  #     --from-literal=IDEM_RELAY_ALERT_SLACK_WEBHOOK_URL=https://hooks.slack.com/services/T.../B.../... \
  #     -n production
  #
  # PagerDuty 설정 (Events API v2 Routing Key):
  #   kubectl create secret generic batch-alert-pagerduty \
  #     --from-literal=IDEM_RELAY_ALERT_PAGERDUTY_ROUTING_KEY=<integration-key> \
  #     -n production
  alert:
    slack:
      enabled: ${IDEM_RELAY_ALERT_SLACK_ENABLED:false}
      webhook-url: ${IDEM_RELAY_ALERT_SLACK_WEBHOOK_URL:}
    pagerduty:
      enabled: ${IDEM_RELAY_ALERT_PAGERDUTY_ENABLED:false}
      routing-key: ${IDEM_RELAY_ALERT_PAGERDUTY_ROUTING_KEY:}
      dashboard-url: ${IDEM_RELAY_ALERT_PAGERDUTY_DASHBOARD_URL:}   # D3: 이벤트 links 에 실을 운영 대시보드 (비면 생략)

# ── ido 플랫폼 설정 (Webhook 헤더용) ────────────────────────────────────────
idem.hub:
  platform-version: ${IDEM_HUB_PLATFORM_VERSION:1.0}

# ── Actuator ─────────────────────────────────────────────────────────────────
management:
  # 1.0.1 (3차 점검 M7): actuator 를 별도 관리 포트로 뗄 수 있다 — Helm 은 IDEM_MANAGEMENT_PORT=9090 을 주고 Service/Ingress 는 앱 포트만 내보낸다.
  # 비어 있거나 앱 포트와 같으면 종전처럼 앱 포트에 함께 뜬다(compose·로컬).
  server:
    port: ${IDEM_MANAGEMENT_PORT:${server.port}}
  endpoints:
    web:
      exposure:
        include: health,info,metrics,prometheus
  endpoint:
    health:
      show-details: when-authorized
      probes:
        enabled: true   # K8s liveness/readiness probe
      # ── Health Group 매핑 (PR-A5: 운영 단순화 — readiness 슬림화) ────────
      # liveness  : 자체 결함만 — Pod 재시작이 도움 되는 항목
      # readiness : 트래픽/잡 처리 가능 상태 — 핵심 의존성(DB/Redis)만 포함
      #
      # ※ PR-A5에서 다음을 readiness에서 제거:
      #   - kafka         : Spring Boot 기본 KafkaHealthIndicator는 그대로 노출되지만,
      #                     readiness 차단은 하지 않는다. Kafka 일시 단절 시 batch는
      #                     retry 로직으로 자체 복구하므로 트래픽 차단은 오히려 해롭다.
      #   - outboxBacklog : Health(2진) → Metric(연속값)으로 강등.
      #                     백로그 적체 시 readiness DOWN으로 트래픽을 차단하면
      #                     처리 자체가 멎어 악순환을 만든다. Prometheus 알람이 정답.
      #                     OutboxBacklogMetrics(@Component)가 Gauge로 노출:
      #                     idem_outbox_pending_total / idem_outbox_failed_total
      group:
        liveness:
          include: livenessState
        readiness:
          include: readinessState,db,redis
  metrics:
    tags:
      application: ${spring.application.name}

# ── 로깅 ─────────────────────────────────────────────────────────────────────
logging:
  level:
    io.github.hipstermin.idem.relay: INFO
    net.javacrumbs.shedlock: INFO
    org.springframework.kafka: WARN
    org.springframework.jdbc: WARN
    org.flywaydb: INFO

---
# ── 로컬 개발 프로파일 ────────────────────────────────────────────────────────
spring:
  config:
    activate:
      on-profile: local

  # 로컬: Redis 없는 환경 — JDBC LockProvider로 전환 (ShedLockConfig Bean 순서 변경 불필요)
  # IDEM_RELAY_HUB_KAFKA_RELAY_ENABLED=false 등으로 특정 Job만 활성화 가능

logging:
  level:
    io.github.hipstermin.idem.relay: DEBUG
    net.javacrumbs.shedlock: DEBUG
