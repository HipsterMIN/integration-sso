# =============================================================================
# ido-configmap-local.yml — Minikube 로컬 시뮬레이션 전용 ConfigMap 오버레이
#
# 목적:
#   운영(infra/k8s/configmaps/ido-configmap.yml)과 다른 로컬 전용 설정값 적용.
#   운영에서는 이 파일을 절대 사용하지 않는다.
#
# 주요 차이점:
#   - SPRING_PROFILES_ACTIVE: local (운영: prod)
#   - OTel 비활성화 (Jaeger/Tempo 없는 환경)
#   - Rate Limit 완화 (로컬 테스트 편의)
#   - 리텐션 DryRun 강제 (실수로 데이터 삭제 방지)
# =============================================================================
apiVersion: v1
kind: ConfigMap
metadata:
  name: ido-config
  namespace: smes
  labels:
    app: ido
    environment: local-minikube
data:
  # ── 서버 기본 ────────────────────────────────────────────────────────────────
  SERVER_PORT: "8083"
  SPRING_PROFILES_ACTIVE: "local"

  # ── 연동 URL (Minikube → Docker Compose 호스트 접근) ──────────────────────
  # host.minikube.internal: Minikube 내부에서 호스트(Windows/Mac/Linux)에 접근
  QIM_BASE_URL: "http://host.minikube.internal:8082"
  INTEGRATION_AUTH_BASE_URL: "http://host.minikube.internal:8083"

  # ── Keycloak (로컬 Docker Compose) ────────────────────────────────────────
  KEYCLOAK_BASE_URL: "http://host.minikube.internal:8088"
  KEYCLOAK_REALM: "onepass"
  KEYCLOAK_REDIRECT_URI: "http://localhost:8083/api/v1/broker/callback"

  # ── CORS (로컬 React 개발 서버) ───────────────────────────────────────────
  CORS_ORIGIN_DEV: "http://localhost:3000"
  CORS_ORIGIN_PROD: "http://localhost:3001"

  # ── OpenTelemetry 비활성화 (로컬: Jaeger/Tempo 없음) ─────────────────────
  # 운영에서는 OTLP_ENDPOINT를 실제 수집기 주소로 설정
  OTLP_ENDPOINT: ""
  TRACING_SAMPLING_PROBABILITY: "0.0"
  IDO_TRACING_AUTH_ASPECT_ENABLED: "false"

  # ── NICE API (로컬: 더미 처리) ────────────────────────────────────────────
  NICE_RETURN_URL: "http://localhost:8083/auth/nice/callback"
  NICE_TIMEOUT_SECONDS: "10"

  # ── Rate Limiting (로컬: 완화) ────────────────────────────────────────────
  IDO_RATE_LIMIT_ENABLED: "true"
  IDO_RATE_LIMIT_DEFAULT_TPS: "1000"
  IDO_RATE_LIMIT_DEFAULT_DAILY: "999999"
  IDO_AUTH_RL_ENABLED: "false"

  # ── 감사 로그 ─────────────────────────────────────────────────────────────
  IDO_AUDIT_KAFKA_ENABLED: "true"
  IDO_AUDIT_DB_ENABLED: "true"
  IDO_AUDIT_EXECUTOR_CORE: "1"
  IDO_AUDIT_EXECUTOR_MAX: "4"
  IDO_AUDIT_EXECUTOR_QUEUE: "50"

  # ── Kafka 토픽 설정 ───────────────────────────────────────────────────────
  IDO_KAFKA_TOPIC_AUTH_EVENTS: "platform.auth.events"
  IDO_KAFKA_PARTITION_COUNT_MAIN: "6"
  IDO_KAFKA_PARTITION_COUNT_DLQ: "3"
  IDO_KAFKA_REPLICATION_FACTOR: "1"       # 로컬: 단일 브로커
  IDO_KAFKA_MIN_INSYNC_REPLICAS: "1"      # 로컬: 단일 브로커

  # ── Webhook ───────────────────────────────────────────────────────────────
  IDO_WEBHOOK_EXECUTOR_CORE: "1"
  IDO_WEBHOOK_EXECUTOR_MAX: "4"
  IDO_WEBHOOK_EXECUTOR_QUEUE: "50"

  # ── 암호화 정책 ───────────────────────────────────────────────────────────
  IDO_CRYPTO_ROTATION_ENABLED: "false"    # 로컬: 키 로테이션 비활성
  IDO_DEFAULT_POLICY_VERSION: "v1"
  IDO_PROVIDER_CIRCUIT_CACHE_TTL: "300"
  IDO_BROKER_MODE: "KAFKA"

  # ── Redisson (로컬 단일 Pod — 분산 락 활성) ──────────────────────────────
  IDO_REDISSON_ENABLED: "true"

  # ── Security Headers ──────────────────────────────────────────────────────
  IDO_SECURITY_HEADERS_ENABLED: "false"   # 로컬: 브라우저 테스트 편의

  # ── 개인정보 파기 (로컬: 절대 실제 삭제 금지) ────────────────────────────
  IDO_RETENTION_ENABLED: "true"
  IDO_RETENTION_DRY_RUN: "true"           # 로컬: 반드시 true 유지
  IDO_RETENTION_PERSONAL_DATA_DAYS: "1825"
  IDO_RETENTION_BATCH_SIZE: "10"

  # ── Outbox Relay ──────────────────────────────────────────────────────────
  IDO_OUTBOX_RELAY_ENABLED: "true"
  IDO_WEBHOOK_RELAY_ENABLED: "true"

  # ── Phase-Gate Feature Flags (로컬: 전부 OFF) ─────────────────────────────
  IDO_PROVISIONING_ENABLED: "false"
  IDO_PROVISIONING_DRY_RUN: "true"
  IDO_PROVISIONING_RELAY_ENABLED: "false"
  IDO_GATEWAY_INBOUND_ENABLED: "false"
  IDO_GATEWAY_OUTBOUND_ENABLED: "false"
  IDO_GATEWAY_IDEMPOTENCY_ENABLED: "true"
  IDO_HMAC_SIG_REQUIRED: "false"
  IDO_AGENCY_KEY_AUDIT_LOG: "true"

  # ── 플랫폼 버전 ───────────────────────────────────────────────────────────
  IDO_PLATFORM_VERSION: "local-dev"
  OACX_DEBUG_MODE: "true"
  OACX_PROVIDER_KEY_PATH: "/app/config/oacx"
