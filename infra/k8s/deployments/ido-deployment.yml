# =============================================================================
# ido-deployment.yml — IdO 서비스 K8s Deployment (S9-T6)
#
# 주요 설계 포인트:
#   - envFrom: ConfigMap + Secret 분리 마운트
#   - readinessProbe / livenessProbe: Spring Actuator /actuator/health
#   - resources: requests/limits (JVM 힙 최적화 포함)
#   - securityContext: non-root 실행, readOnlyRootFilesystem
#   - topologySpreadConstraints: Multi-AZ 배포
# =============================================================================
apiVersion: apps/v1
kind: Deployment
metadata:
  name: ido
  namespace: smes
  labels:
    app: ido
    version: "2.2.0"
    component: auth
spec:
  replicas: 2
  selector:
    matchLabels:
      app: ido
  strategy:
    type: RollingUpdate
    rollingUpdate:
      maxUnavailable: 0
      maxSurge: 1
  template:
    metadata:
      labels:
        app: ido
        version: "2.2.0"
      annotations:
        # Prometheus 스크레이핑
        prometheus.io/scrape: "true"
        prometheus.io/path: "/actuator/prometheus"
        prometheus.io/port: "8083"
        # Vault Agent Injector (ExternalSecret 미사용 시)
        # vault.hashicorp.com/agent-inject: "true"
        # vault.hashicorp.com/role: "ido-service"
    spec:
      serviceAccountName: ido-sa

      # ── 보안 컨텍스트 (Pod 레벨) ──────────────────────────────────────────
      securityContext:
        runAsNonRoot: true
        runAsUser: 1000
        runAsGroup: 1000
        fsGroup: 1000

      # ── 초기화 컨테이너: DB 마이그레이션 ────────────────────────────────
      # initContainers:
      #   - name: flyway-migrate
      #     image: flyway/flyway:10-alpine
      #     command: ["flyway", "migrate"]
      #     envFrom:
      #       - secretRef:
      #           name: ido-secrets
      #       - configMapRef:
      #           name: ido-config

      containers:
        - name: ido
          image: "smes/ido:2.2.0"   # CI/CD에서 이미지 태그 치환
          imagePullPolicy: IfNotPresent
          ports:
            - name: http
              containerPort: 8083
              protocol: TCP

          # ── 환경변수: ConfigMap + Secret 분리 마운트 ──────────────────────
          envFrom:
            - configMapRef:
                name: ido-config          # 비민감 설정 (S9-T6: ido-configmap.yml)
            - secretRef:
                name: ido-secrets         # 민감 자격증명 (S9-T6: ido-secrets-template.yml)

          # ── 추가 환경변수 (Pod 메타데이터) ───────────────────────────────
          env:
            - name: POD_NAME
              valueFrom:
                fieldRef:
                  fieldPath: metadata.name
            - name: POD_NAMESPACE
              valueFrom:
                fieldRef:
                  fieldPath: metadata.namespace
            - name: POD_IP
              valueFrom:
                fieldRef:
                  fieldPath: status.podIP
            # JVM 힙 설정 (컨테이너 메모리 75%)
            - name: JAVA_OPTS
              value: >-
                -XX:+UseContainerSupport
                -XX:MaxRAMPercentage=75.0
                -XX:+UseG1GC
                -XX:+OptimizeStringConcat
                -Djava.security.egd=file:/dev/./urandom
                -Dspring.profiles.active=$(SPRING_PROFILES_ACTIVE)

          # ── 리소스 요청/제한 ─────────────────────────────────────────────
          resources:
            requests:
              memory: "512Mi"
              cpu: "250m"
            limits:
              memory: "1Gi"
              cpu: "1000m"

          # ── 헬스 체크 ────────────────────────────────────────────────────
          readinessProbe:
            httpGet:
              path: /actuator/health/readiness
              port: 8083
            initialDelaySeconds: 30
            periodSeconds: 10
            failureThreshold: 3
            successThreshold: 1
          livenessProbe:
            httpGet:
              path: /actuator/health/liveness
              port: 8083
            initialDelaySeconds: 60
            periodSeconds: 20
            failureThreshold: 3
          startupProbe:
            httpGet:
              path: /actuator/health
              port: 8083
            initialDelaySeconds: 10
            periodSeconds: 5
            failureThreshold: 12   # 최대 60초 대기

          # ── 컨테이너 보안 컨텍스트 ───────────────────────────────────────
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: false  # Spring 임시 파일 필요 시 false
            capabilities:
              drop:
                - ALL

          # ── 볼륨 마운트 (OACX 제공자 키, 임시 디렉토리) ─────────────────
          volumeMounts:
            - name: tmp-dir
              mountPath: /tmp
            - name: oacx-keys
              mountPath: /app/config/oacx
              readOnly: true

      # ── 볼륨 정의 ──────────────────────────────────────────────────────────
      volumes:
        - name: tmp-dir
          emptyDir: {}
        - name: oacx-keys
          secret:
            secretName: ido-oacx-keys    # OACX 제공자별 RSA 키 (별도 Secret)
            optional: true               # 개발 환경: 없어도 기동 가능

      # ── Pod 분산 배치 (Multi-AZ) ───────────────────────────────────────────
      topologySpreadConstraints:
        - maxSkew: 1
          topologyKey: topology.kubernetes.io/zone
          whenUnsatisfiable: ScheduleAnyway
          labelSelector:
            matchLabels:
              app: ido

      # ── 친화성 규칙 (동일 노드 중복 배치 억제) ───────────────────────────
      affinity:
        podAntiAffinity:
          preferredDuringSchedulingIgnoredDuringExecution:
            - weight: 100
              podAffinityTerm:
                labelSelector:
                  matchLabels:
                    app: ido
                topologyKey: kubernetes.io/hostname

      # ── 이미지 풀 시크릿 ──────────────────────────────────────────────────
      # imagePullSecrets:
      #   - name: harbor-registry-secret

---
apiVersion: v1
kind: Service
metadata:
  name: ido-service
  namespace: smes
  labels:
    app: ido
spec:
  selector:
    app: ido
  ports:
    - name: http
      protocol: TCP
      port: 8083
      targetPort: 8083
  type: ClusterIP

---
apiVersion: v1
kind: ServiceAccount
metadata:
  name: ido-sa
  namespace: smes
  labels:
    app: ido
  annotations:
    # AWS IRSA (IAM Role for Service Account) — KMS 권한 연동 (S9-T8)
    # eks.amazonaws.com/role-arn: "arn:aws:iam::123456789:role/ido-kms-role"
    # GCP Workload Identity
    # iam.gke.io/gcp-service-account: "ido-sa@project.iam.gserviceaccount.com"
    {}
