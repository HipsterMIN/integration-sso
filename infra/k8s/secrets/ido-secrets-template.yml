# =============================================================================
# ido-secrets-template.yml — IdO 서비스 K8s Secret 템플릿 (S9-T6)
#
# 목적:
#   운영 환경에서 민감 정보를 K8s Secret 또는 Vault 연동으로 관리.
#   이 파일은 Secret 구조 템플릿이며, 실제 값은 절대 커밋하지 않는다.
#
# 사용법 (Vault Agent Injector 연동):
#   1. vault kv put secret/smes/ido/nice client-id=XXX client-secret=YYY
#   2. vault kv put secret/smes/ido/db   username=XXX password=YYY
#   3. kubectl apply -f ido-secrets-template.yml  # Vault annotation 적용 후
#
# 사용법 (K8s Secret 직접 관리):
#   1. 아래 stringData 필드에 실제 값을 채운다 (base64 인코딩 불필요)
#   2. kubectl apply -f ido-secrets-template.yml
#   3. 커밋 전 반드시 실제 값 제거 또는 .gitignore 처리
#
# GitOps(ArgoCD / Flux) + Sealed Secrets 권장:
#   kubeseal --cert=seal.pem -o yaml < ido-secrets-template.yml \
#     > ido-sealed-secrets.yml
#
# 참고:
#   - 설계서 11.6.6절 K8s Secret 관리
#   - NICE API 키: https://www.niceid.co.kr/
# =============================================================================
apiVersion: v1
kind: Secret
metadata:
  name: ido-secrets
  namespace: smes
  labels:
    app: ido
    component: auth
    managed-by: "vault-agent"          # vault-agent | kustomize | manual
  annotations:
    # Vault Agent Injector 사용 시 아래 annotation 활성화
    # vault.hashicorp.com/agent-inject: "true"
    # vault.hashicorp.com/role: "ido-service"
    # vault.hashicorp.com/agent-inject-secret-nice: "secret/smes/ido/nice"
    # vault.hashicorp.com/agent-inject-secret-db: "secret/smes/ido/db"
    # vault.hashicorp.com/agent-inject-secret-redis: "secret/smes/ido/redis"
    rotation-policy: "30d"             # 비밀 교체 주기 (운영 정책)
type: Opaque
stringData:
  # ── NICE 본인인증 API 자격증명 ───────────────────────────────────────────
  # 출처: NICE 개발자센터 → 애플리케이션 → API Key 관리
  NICE_CLIENT_ID: "REPLACE_WITH_NICE_CLIENT_ID"
  NICE_CLIENT_SECRET: "REPLACE_WITH_NICE_CLIENT_SECRET"

  # ── PostgreSQL 데이터베이스 자격증명 ─────────────────────────────────────
  DB_HOST: "REPLACE_WITH_DB_HOST"
  DB_PORT: "5432"
  DB_NAME: "ido_db"
  DB_USERNAME: "REPLACE_WITH_DB_USERNAME"
  DB_PASSWORD: "REPLACE_WITH_DB_PASSWORD"

  # ── Redis 자격증명 ────────────────────────────────────────────────────────
  REDIS_HOST: "REPLACE_WITH_REDIS_HOST"
  REDIS_PORT: "6379"
  REDIS_PASSWORD: "REPLACE_WITH_REDIS_PASSWORD"

  # ── Kafka SASL 자격증명 (MSK 또는 Confluent Cloud) ───────────────────────
  KAFKA_SERVERS: "REPLACE_WITH_KAFKA_BOOTSTRAP_SERVERS"
  # KAFKA_SASL_USERNAME: "REPLACE_WITH_KAFKA_SASL_USERNAME"
  # KAFKA_SASL_PASSWORD: "REPLACE_WITH_KAFKA_SASL_PASSWORD"

  # ── Keycloak OAuth2 클라이언트 ────────────────────────────────────────────
  KEYCLOAK_CLIENT_ID: "REPLACE_WITH_KEYCLOAK_CLIENT_ID"
  KEYCLOAK_CLIENT_SECRET: "REPLACE_WITH_KEYCLOAK_CLIENT_SECRET"

  # ── 암호화 키 (Handoff 토큰 AES-GCM / HMAC) ─────────────────────────────
  # 생성: openssl rand -hex 32
  IDO_HANDOFF_AES_KEY: "REPLACE_WITH_32BYTE_HEX_AES_KEY"
  # 생성: openssl rand -hex 32
  IDO_HANDOFF_HMAC_KEY: "REPLACE_WITH_32BYTE_HEX_HMAC_KEY"

  # ── 내부 서명 시크릿 (IdO → Q-IM 내부 API 서명) ─────────────────────────
  IDO_INTERNAL_SIG_SECRET: "REPLACE_WITH_INTERNAL_SIG_SECRET"

  # ── Webhook 서명 시크릿 ───────────────────────────────────────────────────
  IDO_WEBHOOK_SIGNING_SECRET: "REPLACE_WITH_WEBHOOK_SIGNING_SECRET"

  # ── Q-IM 연동 AES 키 / API 키 ────────────────────────────────────────────
  QIM_AES_SHARED_KEY: "REPLACE_WITH_QIM_AES_SHARED_KEY"
  QIM_INBOUND_API_KEY_HASH: "REPLACE_WITH_QIM_INBOUND_API_KEY_HASH"
  # Q-IM 외부(기관) API 인증 키 (application.yml: IDO_QIM_EXT_API_KEY)
  IDO_QIM_EXT_API_KEY: "REPLACE_WITH_QIM_EXT_API_KEY"
  # Q-IM 내부(IdO 서비스 간) API 인증 키 (application.yml: IDO_QIM_INTERNAL_API_KEY)
  IDO_QIM_INTERNAL_API_KEY: "REPLACE_WITH_QIM_INTERNAL_API_KEY"

  # ── FE 세션 AES-GCM 암호화 키 ────────────────────────────────────────────
  # 회원전환 CI 암호화(aesGcm.ts) 및 FE 세션 토큰 암호화에 사용
  # 생성: openssl rand -base64 32
  # FE 환경변수: AES_GCM_KEY (aesGcm.ts process.env.AES_GCM_KEY)
  # BE 환경변수: FE_AES_GCM_KEY (application.yml)
  FE_AES_GCM_KEY: "REPLACE_WITH_BASE64_32BYTE_AES_GCM_KEY"

  # ── KMS 연동 (S9-T8 — NHN Cloud Secure Key Manager) ─────────────────────
  # NHN SKM 콘솔 > Security > Secure Key Manager > Appkey
  NHN_SKM_APPKEY: "REPLACE_WITH_NHN_SKM_APPKEY"
  # 운영 모드: secret(권장) | envelope
  NHN_SKM_MODE: "secret"
  # Handoff AES 키 재료를 보관한 SKM keyId (기밀 데이터 또는 대칭 키 UUID)
  # application.yml 참조 키: NHN_SKM_AES_KEY_ID (별칭: NHN_SKM_AES_SECRET_ID)
  NHN_SKM_AES_KEY_ID: "REPLACE_WITH_SKM_AES_KEY_ID"
  NHN_SKM_AES_SECRET_ID: "REPLACE_WITH_SKM_AES_KEY_ID"   # application.yml 호환 alias
  # Handoff HMAC 키 재료를 보관한 SKM keyId
  # application.yml 참조 키: NHN_SKM_HMAC_KEY_ID (별칭: NHN_SKM_HMAC_SECRET_ID)
  NHN_SKM_HMAC_KEY_ID: "REPLACE_WITH_SKM_HMAC_KEY_ID"
  NHN_SKM_HMAC_SECRET_ID: "REPLACE_WITH_SKM_HMAC_KEY_ID" # application.yml 호환 alias

---
