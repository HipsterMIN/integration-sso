# =============================================================================
# kms-config.yml — NHN Cloud Secure Key Manager 연동 K8s 설정 (S9-T8)
#
# 목적:
#   NHN Cloud SKM을 이용한 Handoff AES/HMAC 키 재료 보호.
#   민감 정보(Appkey, keyId)는 infra/k8s/secrets/ido-secrets-template.yml 참조.
#
# NHN Cloud SKM 사전 준비:
#   1. NHN Cloud 콘솔 > Security > Secure Key Manager 활성화
#   2. 키 저장소 생성 (IP 인증: K8s Node IP 대역 등록)
#   3. [secret 모드] 기밀 데이터 생성:
#      - 이름: ido-handoff-aes-key
#      - 데이터: openssl rand 32 | base64  (32바이트 AES 키 Base64)
#      - 복사한 keyId → K8s Secret NHN_SKM_AES_KEY_ID에 저장
#   4. [secret 모드] 기밀 데이터 생성:
#      - 이름: ido-handoff-hmac-key
#      - 데이터: openssl rand 32 | base64
#      - 복사한 keyId → K8s Secret NHN_SKM_HMAC_KEY_ID에 저장
#   5. [envelope 모드 선택 시] 대칭 키(AES-256) 생성 후 keyId 등록
#
# IP 인증 등록 (NHN Cloud 콘솔):
#   키 저장소 > 인증 > IPv4 추가 → K8s Worker Node IP 대역 입력
#   예: 10.100.0.0/24 (K8s Node CIDR)
#
# 적용:
#   kubectl apply -f kms-config.yml
#
# API 문서: https://docs.nhncloud.com/ko/Security/Secure Key Manager/ko/api-guide-v1.0/
# =============================================================================
apiVersion: v1
kind: ConfigMap
metadata:
  name: ido-kms-config
  namespace: smes
  labels:
    app: ido
    component: kms
data:
  # ── NHN SKM 설정 ──────────────────────────────────────────────────────────
  # API 엔드포인트 (Global — 변경 불필요)
  NHN_SKM_ENDPOINT: "https://api-keymanager.nhncloudservice.com"

  # 운영 모드: secret(권장) | envelope
  # secret:   SKM 기밀 데이터 직접 조회 (키 재료가 SKM에 저장됨)
  # envelope: SKM 대칭 키로 DEK 암/복호화 (DB에 암호문 저장)
  NHN_SKM_MODE: "secret"

  # KMS 연결 타임아웃
  KMS_CONNECTION_TIMEOUT_MS: "3000"
  KMS_REQUEST_TIMEOUT_MS: "5000"

---
# =============================================================================
# NetworkPolicy: ido Pod → NHN SKM API 외부 통신 허용
# NHN SKM IP: api-keymanager.nhncloudservice.com (DNS 기반)
# =============================================================================
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: ido-allow-nhn-skm
  namespace: smes
spec:
  podSelector:
    matchLabels:
      app: ido
  policyTypes:
    - Egress
  egress:
    # NHN SKM API (HTTPS 443)
    - ports:
        - protocol: TCP
          port: 443
    # DNS 조회 허용
    - ports:
        - protocol: UDP
          port: 53

---
# =============================================================================
# RBAC: ido ServiceAccount에 Secret 읽기 권한
# =============================================================================
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: ido-secret-reader
  namespace: smes
rules:
  - apiGroups: [""]
    resources: ["secrets"]
    resourceNames: ["ido-secrets"]
    verbs: ["get"]

---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: ido-secret-reader-binding
  namespace: smes
subjects:
  - kind: ServiceAccount
    name: ido-sa
    namespace: smes
roleRef:
  kind: Role
  apiGroup: rbac.authorization.k8s.io
  name: ido-secret-reader
