# =============================================================================
# ido-configmap.yml — IdO 서비스 K8s ConfigMap (S9-T6 + Feature Flags)
#
# 목적:
#   민감하지 않은 설정값을 K8s ConfigMap으로 관리.
#   민감 정보(비밀번호, API 키 등)는 절대 ConfigMap에 포함하지 않는다.
#
# 사용법:
#   kubectl apply -f ido-configmap.yml
#   kubectl rollout restart deployment/ido -n smes
#
# 참고:
#   - 민감 정보는 infra/k8s/secrets/ido-secrets-template.yml 참조
#   - 설계서 11.6.6절 K8s 설정 관리
# =============================================================================
apiVersion: v1
kind: ConfigMap
metadata:
  name: ido-config
  namespace: smes
  labels:
    app: ido
    component: auth
data:
  # ── 서버 기본 설정 ─────────────────────────────────────────────────────────
  SERVER_PORT: "8083"
  SPRING_PROFILES_ACTIVE: "prod"

  # ── NICE API 설정 (비민감) ───────────────────────────────────────────────
  NICE_RETURN_URL: "https://smes.go.kr/auth/nice/callback"
  NICE_TIMEOUT_SECONDS: "10"

  # ── OACX 설정 ──────────────────────────────────────────────────────────────
  OACX_DEBUG_MODE: "false"
  OACX_PROVIDER_KEY_PATH: "/app/config/oacx"

  # ── Q-IM 연동 설정 ────────────────────────────────────────────────────────
  QIM_BASE_URL: "http://q-im-service:8082"
  QIM_AES_IV_LENGTH: "12"
  QIM_AES_TRANSFORMATION: "AES/GCM/NoPadding"
  QIM_RECEIVER_AUDIT: "true"
  QIM_SP_MEMBER_TOPIC: "qim.sp.member.events"

  # ── 통합인증 서버 연동 ────────────────────────────────────────────────────
  INTEGRATION_AUTH_BASE_URL: "https://auth.smes.go.kr"
  INTEGRATION_AUTH_TIMEOUT_SECONDS: "10"

  # ── Keycloak 설정 ─────────────────────────────────────────────────────────
  KEYCLOAK_BASE_URL: "https://keycloak.smes.go.kr"
  KEYCLOAK_REALM: "smes"
  KEYCLOAK_REDIRECT_URI: "https://smes.go.kr/auth/callback"

  # ── CORS 설정 ─────────────────────────────────────────────────────────────
  CORS_ORIGIN_DEV: "http://localhost:3000"
  CORS_ORIGIN_PROD: "https://smes.go.kr"

  # ── OpenTelemetry 분산 추적 (S9-T4) ──────────────────────────────────────
  OTLP_ENDPOINT: "http://otel-collector:4318/v1/traces"
  TRACING_SAMPLING_PROBABILITY: "0.1"    # 운영: 10% 샘플링
  IDO_TRACING_AUTH_ASPECT_ENABLED: "true" # F-05: 인증 흐름 분산 추적 Aspect
  IDO_AUTH_TRACING_ENABLED: "true"        # application.yml alias (IDO_TRACING_AUTH_ASPECT_ENABLED 동의어)

  # ── Rate Limiting (S9-T7) ─────────────────────────────────────────────────
  IDO_RATE_LIMIT_ENABLED: "true"           # F-02: 기관별 API Rate Limit (Bucket4j)
  IDO_RATE_LIMIT_DEFAULT_TPS: "20"
  IDO_RATE_LIMIT_DEFAULT_DAILY: "1000"
  IDO_AUTH_RL_ENABLED: "true"              # F-01: IP 기반 Auth 엔드포인트 Rate Limit (독립)
  IDO_AUTH_RL_TPS: "10"                    # F-01: Auth 엔드포인트 TPS 한도 (기본 10/s)
  IDO_AUTH_RL_PER_MIN: "200"               # F-01: Auth 엔드포인트 분당 한도
  IDO_AUTH_RL_DAILY: "5000"               # F-01: Auth 엔드포인트 일일 한도

  # ── 감사 로그 설정 (S9-T5) ───────────────────────────────────────────────
  IDO_AUDIT_KAFKA_ENABLED: "true"          # F-03: 감사 로그 Kafka 발행
  IDO_AUDIT_DB_ENABLED: "true"             # F-04: 감사 로그 DB 저장 (독립 제어)
  IDO_AUDIT_EXECUTOR_CORE: "2"
  IDO_AUDIT_EXECUTOR_MAX: "8"
  IDO_AUDIT_EXECUTOR_QUEUE: "200"

  # ── Kafka 토픽 설정 ───────────────────────────────────────────────────────
  IDO_KAFKA_TOPIC_AUTH_EVENTS: "qsign.auth.events"
  IDO_KAFKA_PARTITION_COUNT_MAIN: "6"
  IDO_KAFKA_PARTITION_COUNT_DLQ: "3"
  IDO_KAFKA_REPLICATION_FACTOR: "3"
  IDO_KAFKA_MIN_INSYNC_REPLICAS: "2"
  QIM_USER_EVENTS_TOPIC: "qim.user.events"         # qim.kafka.topic-user-events
  QIM_AGENCY_EVENTS_TOPIC: "qim.agency.events"     # ido.kafka.topic-qim-agency-events

  # ── Webhook 실행기 설정 ───────────────────────────────────────────────────
  IDO_WEBHOOK_EXECUTOR_CORE: "2"
  IDO_WEBHOOK_EXECUTOR_MAX: "10"
  IDO_WEBHOOK_EXECUTOR_QUEUE: "100"

  # ── 암호화 정책 설정 ─────────────────────────────────────────────────────
  IDO_CRYPTO_ROTATION_ENABLED: "true"     # F-06: 암호화 키 자동 로테이션
  IDO_DEFAULT_POLICY_VERSION: "v1"
  IDO_PROVIDER_CIRCUIT_CACHE_TTL: "300"
  IDO_BROKER_MODE: "KAFKA"

  # ── Redisson 분산 락 (F-08) ───────────────────────────────────────────────
  # false 시 NoOpRedissonConfig 활성화 → JVM synchronized 폴백 (단일 Pod 환경용)
  # 운영(K8s 다중 Pod) 환경에서는 반드시 true 유지
  IDO_REDISSON_ENABLED: "true"            # F-08: Redisson 분산 락 (NICE 토큰 중복 방지)

  # ── Security Headers (F-10) ───────────────────────────────────────────────
  IDO_SECURITY_HEADERS_ENABLED: "true"    # F-10: CSP·HSTS 등 보안 응답 헤더

  # ── 개인정보 파기 스케줄러 (F-11) ────────────────────────────────────────
  # ⚠️  운영 적용 전 반드시 법무·보안팀 승인 필요
  # ⚠️  IDO_RETENTION_DRY_RUN=false 전환은 별도 배포 티켓으로 관리
  IDO_RETENTION_ENABLED: "true"           # F-11: 개인정보 파기 스케줄러 활성화
  IDO_RETENTION_DRY_RUN: "true"          # F-11b: 파기 시뮬레이션 (false여야 실제 삭제)
  IDO_RETENTION_PERSONAL_DATA_DAYS: "1825" # 5년 = 1825일
  IDO_RETENTION_DAYS: "1825"              # application.yml alias (IDO_RETENTION_PERSONAL_DATA_DAYS 동의어)
  IDO_RETENTION_BATCH_SIZE: "100"

  # ── Transactional Outbox Relay (F-13 / F-14) ──────────────────────────────
  IDO_OUTBOX_RELAY_ENABLED: "true"        # F-13: IdO → Kafka Outbox 릴레이 (500ms 폴링)
  IDO_WEBHOOK_RELAY_ENABLED: "true"       # F-14: 기관 Webhook Outbox 릴레이 (500ms 폴링)

  # ════════════════════════════════════════════════════════════════════════
  # Sprint 14~16 신규 기능 — Phase-Gate Feature Flags
  # 📖 상세: docs/phased-rollout-strategy.md
  #
  # ⚠️  현재 파일: Phase 1 설정 (신규 기능 전부 OFF — 안전 기본값)
  # ⚠️  Phase 전환 시: docs/phased-rollout-strategy.md의 Gate 체크리스트 통과 후
  #      kubectl apply -f ido-configmap-phase{N}.yml 로 전환
  #
  # Phase 1 → Phase 2: IDO_PROVISIONING_ENABLED=true (Gate 1 통과 후)
  # Phase 2 → Phase 3: IDO_GATEWAY_INBOUND_ENABLED=true (Gate 2 통과 후)
  # Phase 3 → Phase 4: IDO_HMAC_SIG_REQUIRED=true (Gate 3 통과 후)
  # ════════════════════════════════════════════════════════════════════════

  # ── F-20: 전 기관 프로비저닝 (Sprint 14) ─────────────────────────────────
  # Phase 1: false (현재)
  # Phase 2-A: true + IDO_PROVISIONING_DRY_RUN=true (2주 관찰)
  # Phase 2-B: true + IDO_PROVISIONING_DRY_RUN=false (실제 발행)
  IDO_PROVISIONING_ENABLED: "true"         # F-20: Phase 2↑ (현재: OFF)
  IDO_PROVISIONING_DRY_RUN: "false"          # F-22: Phase 2-A=true, 2-B=false
  IDO_PROVISIONING_RELAY_ENABLED: "true"   # F-21: Phase 2-B↑ (현재: OFF)
  IDO_PROVISIONING_RELAY_INTERVAL_MS: "30000"
  IDO_PROVISIONING_RELAY_BATCH_SIZE: "50"
  IDO_PROVISIONING_TIMEOUT_MS: "10000"
  IDO_PROVISIONING_MAX_PARALLEL: "100"

  # ── F-23/F-24: Agency Gateway API (Sprint 15) ────────────────────────────
  # Phase 1~2: false (현재)
  # Phase 3-A: IDO_GATEWAY_INBOUND_ENABLED=true (인바운드 먼저)
  # Phase 3-B: IDO_GATEWAY_OUTBOUND_ENABLED=true (아웃바운드 추가)
  IDO_GATEWAY_INBOUND_ENABLED: "false"      # F-23: Phase 3-A↑ (현재: OFF)
  IDO_GATEWAY_OUTBOUND_ENABLED: "false"     # F-24: Phase 3-B↑ (현재: OFF)
  IDO_GATEWAY_IDEMPOTENCY_ENABLED: "true"   # F-25: 항상 ON (보안 필수)
  IDO_HMAC_SIG_REQUIRED: "false"            # F-26: Phase 4↑ Sprint 17 (현재: OFF)
  IDO_AGENCY_KEY_AUDIT_LOG: "true"          # F-27: 항상 ON (감사 필수)

  # ── 플랫폼 버전 ───────────────────────────────────────────────────────────
  IDO_PLATFORM_VERSION: "2.3.0"
