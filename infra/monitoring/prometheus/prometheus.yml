global:
  scrape_interval:     15s
  evaluation_interval: 15s
  external_labels:
    cluster: 'onepass-local'
    env:     'development'

rule_files:
  - 'alert_rules.yml'

alerting:
  alertmanagers:
    - static_configs:
        - targets: []   # 운영: alertmanager:9093

# ──────────────────────────────────────────────────────────────────────────────
# Scrape Configs
#
# [환경별 타겟 전략]
#   Docker Compose (profile=app):
#     - 앱 서비스들이 onepass-net 브리지 네트워크 내 컨테이너명으로 접근 가능
#     - Prometheus 컨테이너도 동일 네트워크(172.20.0.50) → 컨테이너명 직접 사용
#     - extra_hosts: host.docker.internal:host-gateway 로 호스트 접근도 가능
#
#   로컬 IDE 직접 실행 (Compose 앱 미사용):
#     - 앱이 localhost:{port}에서 기동
#     - host.docker.internal:{port} 로 접근
#
# [현재 설정] Docker Compose app 프로파일 기준 컨테이너명 타겟
# ──────────────────────────────────────────────────────────────────────────────
scrape_configs:

  # Prometheus 자체 메트릭
  - job_name: 'prometheus'
    static_configs:
      - targets: ['localhost:9090']

  # Q-Sign (Docker Compose: onepass-qsign:8081 / 로컬 IDE: host.docker.internal:8081)
  - job_name: 'q-sign'
    metrics_path: '/actuator/prometheus'
    static_configs:
      - targets:
          - 'onepass-qsign:8081'    # Docker Compose app 프로파일
    relabel_configs:
      - target_label: service
        replacement: 'q-sign'
      - target_label: module
        replacement: 'auth'

  # Q-IM (Docker Compose: onepass-qim:8082 / 로컬 IDE: host.docker.internal:8082)
  - job_name: 'q-im'
    metrics_path: '/actuator/prometheus'
    static_configs:
      - targets:
          - 'onepass-qim:8082'
    relabel_configs:
      - target_label: service
        replacement: 'q-im'
      - target_label: module
        replacement: 'identity'

  # IdO (Docker Compose: onepass-ido:8083 / 로컬 IDE: host.docker.internal:8083)
  - job_name: 'ido'
    metrics_path: '/actuator/prometheus'
    static_configs:
      - targets:
          - 'onepass-ido:8083'
    relabel_configs:
      - target_label: service
        replacement: 'ido'
      - target_label: module
        replacement: 'handoff'

  # Agency-Stub (Docker Compose: onepass-agency-stub:8084)
  - job_name: 'agency-stub'
    metrics_path: '/actuator/prometheus'
    static_configs:
      - targets:
          - 'onepass-agency-stub:8084'
    relabel_configs:
      - target_label: service
        replacement: 'agency-stub'
      - target_label: module
        replacement: 'simulation'

  # ── 로컬 IDE 직접 실행 시 아래 주석 해제하고 위 컨테이너명 타겟 주석 처리 ──
  # - job_name: 'q-sign-local'
  #   metrics_path: '/actuator/prometheus'
  #   static_configs:
  #     - targets: ['host.docker.internal:8081']
  # - job_name: 'q-im-local'
  #   metrics_path: '/actuator/prometheus'
  #   static_configs:
  #     - targets: ['host.docker.internal:8082']
  # - job_name: 'ido-local'
  #   metrics_path: '/actuator/prometheus'
  #   static_configs:
  #     - targets: ['host.docker.internal:8083']
  # - job_name: 'agency-stub-local'
  #   metrics_path: '/actuator/prometheus'
  #   static_configs:
  #     - targets: ['host.docker.internal:8084']

  # ── 인프라 Exporter (운영 추가 권장) ─────────────────────────────────────
  # Redis Exporter (별도 컨테이너 필요)
