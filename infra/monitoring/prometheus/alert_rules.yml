groups:
  # ══════════════════════════════════════════════════════════════════════════
  # [1] 서비스 가용성 — 가장 중요한 알람
  # ══════════════════════════════════════════════════════════════════════════
  - name: onepass_service_availability
    interval: 15s
    rules:

      - alert: IdoServiceDown
        expr: up{job="ido"} == 0
        for: 30s
        labels:
          severity: critical
          service:  ido
        annotations:
          summary:     "IdO 서비스 다운"
          description: "IdO(핸드오프 오케스트레이터)가 30초 이상 응답하지 않습니다. Handoff 발급 불가."

      - alert: QimServiceDown
        expr: up{job="q-im"} == 0
        for: 30s
        labels:
          severity: critical
          service:  q-im
        annotations:
          summary:     "Q-IM 서비스 다운"
          description: "Q-IM(식별·매핑 SoR)이 30초 이상 응답하지 않습니다. IdO 핸드오프 불가."

      - alert: QSignServiceDown
        expr: up{job="q-sign"} == 0
        for: 30s
        labels:
          severity: critical
          service:  q-sign
        annotations:
          summary:     "Q-Sign 서비스 다운"
          description: "Q-Sign(인증 SoR)이 30초 이상 응답하지 않습니다. 신규 인증 불가."

  # ══════════════════════════════════════════════════════════════════════════
  # [2] API 오류율 / 응답 지연 — divide-by-zero 방어 적용
  # ══════════════════════════════════════════════════════════════════════════
  - name: onepass_platform_alerts
    interval: 30s
    rules:

      # ── IdO Handoff 발급 오류율 (5분 윈도우 > 5%) ─────────────────────────
      # divide-by-zero 방어: 분모 > 0 조건 추가
      - alert: IdoHandoffErrorRateHigh
        expr: |
          (
            rate(http_server_requests_seconds_count{job="ido",uri=~".*/handoff/issue.*",status=~"5.."}[5m])
            /
            rate(http_server_requests_seconds_count{job="ido",uri=~".*/handoff/issue.*"}[5m])
          ) > 0.05
          and
          rate(http_server_requests_seconds_count{job="ido",uri=~".*/handoff/issue.*"}[5m]) > 0
        for: 2m
        labels:
          severity: critical
          service:  ido
        annotations:
          summary:     "IdO Handoff 발급 오류율 급증"
          description: "Handoff 발급 5xx 오류율 {{ $value | humanizePercentage }} (임계값: 5%)"

      # ── IdO API 응답 지연 (P95 > 500ms) ─────────────────────────────────
      # histogram_quantile: sum by (le) 집계 적용
      - alert: IdoApiLatencyHigh
        expr: |
          histogram_quantile(0.95,
            sum by (le, job) (
              rate(http_server_requests_seconds_bucket{job="ido"}[5m])
            )
          ) > 0.5
        for: 3m
        labels:
          severity: warning
          service:  ido
        annotations:
          summary:     "IdO API P95 응답 지연"
          description: "IdO P95 응답시간 {{ $value | humanizeDuration }} (임계값: 500ms)"

      # ── Q-IM API 응답 지연 (P95 > 300ms) ────────────────────────────────
      - alert: QimApiLatencyHigh
        expr: |
          histogram_quantile(0.95,
            sum by (le, job) (
              rate(http_server_requests_seconds_bucket{job="q-im"}[5m])
            )
          ) > 0.3
        for: 3m
        labels:
          severity: warning
          service:  q-im
        annotations:
          summary:     "Q-IM API P95 응답 지연"
          description: "Q-IM P95 응답시간 {{ $value | humanizeDuration }} (임계값: 300ms)"

      # ── Rate Limit 초과 급증 (분당 100회 이상) ───────────────────────────
      - alert: RateLimitExceeded
        expr: |
          increase(http_server_requests_seconds_count{job="ido",status="429"}[1m]) > 100
        for: 1m
        labels:
          severity: warning
          service:  ido
        annotations:
          summary:     "Rate Limit 초과 급증"
          description: "분당 429 응답 {{ $value }}회 — 기관 DDoS 또는 오동작 의심"

      # ── IdO 전체 5xx 오류율 (5분 윈도우 > 1%) ────────────────────────────
      - alert: IdoHighErrorRate
        expr: |
          (
            rate(http_server_requests_seconds_count{job="ido",status=~"5.."}[5m])
            /
            rate(http_server_requests_seconds_count{job="ido"}[5m])
          ) > 0.01
          and
          rate(http_server_requests_seconds_count{job="ido"}[5m]) > 0
        for: 3m
        labels:
          severity: warning
          service:  ido
        annotations:
          summary:     "IdO 전체 5xx 오류율 상승"
          description: "IdO 5xx 오류율 {{ $value | humanizePercentage }} (임계값: 1%)"

      # ── Q-IM 5xx 오류율 (5분 윈도우 > 1%) ───────────────────────────────
      - alert: QimHighErrorRate
        expr: |
          (
            rate(http_server_requests_seconds_count{job="q-im",status=~"5.."}[5m])
            /
            rate(http_server_requests_seconds_count{job="q-im"}[5m])
          ) > 0.01
          and
          rate(http_server_requests_seconds_count{job="q-im"}[5m]) > 0
        for: 3m
        labels:
          severity: warning
          service:  q-im
        annotations:
          summary:     "Q-IM 5xx 오류율 상승"
          description: "Q-IM 5xx 오류율 {{ $value | humanizePercentage }} (임계값: 1%)"

  # ══════════════════════════════════════════════════════════════════════════
  # [3] 인프라 — Redis / Kafka
  # ══════════════════════════════════════════════════════════════════════════
  - name: onepass_infra_alerts
    interval: 30s
    rules:

      # ── Redis 메모리 사용률 > 80% ─────────────────────────────────────────
      # redis_memory_max_bytes가 0인 경우(maxmemory 미설정) divide-by-zero 방어
      - alert: RedisMemoryHigh
        expr: |
          (redis_memory_used_bytes / redis_memory_max_bytes > 0.8)
          and
          redis_memory_max_bytes > 0
        for: 5m
        labels:
          severity: warning
          service:  redis
        annotations:
          summary:     "Redis 메모리 사용률 높음"
          description: "Redis 메모리 사용률 {{ $value | humanizePercentage }} (임계값: 80%)"

      # ── Redis 다운 ───────────────────────────────────────────────────────
      - alert: RedisDown
        expr: up{job="redis"} == 0
        for: 30s
        labels:
          severity: critical
          service:  redis
        annotations:
          summary:     "Redis 다운"
          description: "Redis가 30초 이상 응답하지 않습니다. 세션/캐시/Rate Limit 불가."

      # ── Kafka Consumer Lag 급증 (ido-handoff-consumer > 10000) ───────────
      - alert: KafkaConsumerLagHigh
        expr: |
          kafka_consumergroup_lag{consumergroup="ido-handoff-consumer"} > 10000
        for: 2m
        labels:
          severity: warning
          service:  kafka
        annotations:
          summary:     "Kafka Consumer Lag 급증"
          description: "ido-handoff-consumer Lag: {{ $value }} (임계값: 10000)"

      # ── Kafka 브로커 다운 ─────────────────────────────────────────────────
      - alert: KafkaDown
        expr: up{job="kafka"} == 0
        for: 30s
        labels:
          severity: critical
          service:  kafka
        annotations:
          summary:     "Kafka 브로커 다운"
          description: "Kafka가 30초 이상 응답하지 않습니다. 이벤트 발행/소비 불가."

      # ── PostgreSQL 다운 ───────────────────────────────────────────────────
      - alert: PostgresDown
        expr: up{job="postgres"} == 0
        for: 30s
        labels:
          severity: critical
          service:  postgres
        annotations:
          summary:     "PostgreSQL 다운"
          description: "PostgreSQL이 30초 이상 응답하지 않습니다. Q-Sign/IdO DB 불가."

  # ══════════════════════════════════════════════════════════════════════════
  # [4] 비즈니스 이상 징후
  # ══════════════════════════════════════════════════════════════════════════
  - name: onepass_business_alerts
    interval: 60s
    rules:

      # ── Webhook 발송 실패 누적 (10분 > 50건) ─────────────────────────────
      - alert: WebhookDispatchFailureHigh
        expr: |
          increase(http_server_requests_seconds_count{job="ido",uri=~".*webhook.*",status=~"5.."}[10m]) > 50
        for: 5m
        labels:
          severity: warning
          service:  ido
        annotations:
          summary:     "Webhook 발송 실패 급증"
          description: "10분간 Webhook 5xx 오류 {{ $value }}건"

      # ── JVM 힙 사용률 > 90% (GC 압박 징후) ──────────────────────────────
      - alert: JvmHeapUsageHigh
        expr: |
          (
            jvm_memory_used_bytes{area="heap"}
            /
            jvm_memory_max_bytes{area="heap"}
          ) > 0.9
          and
          jvm_memory_max_bytes{area="heap"} > 0
        for: 5m
        labels:
          severity: warning
        annotations:
          summary:     "JVM 힙 사용률 높음"
          description: "{{ $labels.job }} 힙 사용률 {{ $value | humanizePercentage }} (임계값: 90%)"
