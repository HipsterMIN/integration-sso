groups:
  # ══════════════════════════════════════════════════════════════════════════
  # OnePass Platform — Prometheus 알람 룰 (PR-B2-new 축소판: 16 → 8)
  #
  # 설계 원칙 (회고 정책 PR-A5 + PR-B1-new 본질 메트릭 정렬):
  #   1. 새벽 3시 호출(critical)은 SSO/IM 본질이 깨졌을 때만 (5개 이내)
  #   2. warning은 Slack 채널만 — 페이지/전화 없음 (3개 이내)
  #   3. 메트릭 출처가 명확한 알람만 — 유령 알람 금지
  #   4. PR-B1-new 본질 메트릭 3종(인증 성공률 / Handoff p95 / KMS Healthy) 정렬
  #
  # 폐기된 알람 (8개):
  #   - IdoApiLatencyHigh, QimApiLatencyHigh : 전체 endpoint 평균 → handoff 한정으로 재정의
  #   - IdoHighErrorRate                     : IdoHandoffErrorRateHigh와 중복
  #   - QimHighErrorRate                     : ServiceDown으로 본질 커버, 대시보드로 충분
  #   - WebhookDispatchFailureHigh           : 비핵심 → 대시보드
  #   - JvmHeapUsageHigh                     : OOM kill 시 ServiceDown으로 발화됨
  #   - RedisDown/RedisMemoryHigh            : 유령 알람 (redis-exporter 미스크레이프)
  #   - KafkaDown/KafkaConsumerLagHigh       : 유령 알람 (kafka-exporter 미스크레이프)
  #   - PostgresDown                         : 유령 알람 (postgres-exporter 미스크레이프)
  #
  # 인프라 알람 부활 시점: 별도 PR(B5-infra-exporter)에서 exporter scrape 활성화 후
  # ══════════════════════════════════════════════════════════════════════════

  # ──────────────────────────────────────────────────────────────────────────
  # [CRITICAL] 5개 — 새벽 호출 1티어 (SSO/IM 본질이 깨졌을 때)
  # ──────────────────────────────────────────────────────────────────────────
  - name: onepass_critical
    interval: 15s
    rules:

      # ── 1. IdO 다운 (핸드오프 오케스트레이터 정지) ─────────────────────────
      # for: 30s → 2m 로 완화 (롤링 업데이트 시 거짓경보 방지)
      - alert: IdoServiceDown
        expr: up{job="ido"} == 0
        for: 2m
        labels:
          severity: critical
          service:  ido
          essence:  handoff
        annotations:
          summary:     "IdO 서비스 다운"
          description: "IdO(핸드오프 오케스트레이터)가 2분 이상 응답하지 않습니다. 기관 연계 전면 중단."
          runbook:     "docs/RUNBOOK_SSO_METRICS.md §1.2"

      # ── 2. Q-Sign 다운 (인증 SoR 정지) ───────────────────────────────────
      - alert: QSignServiceDown
        expr: up{job="q-sign"} == 0
        for: 2m
        labels:
          severity: critical
          service:  q-sign
          essence:  authentication
        annotations:
          summary:     "Q-Sign 서비스 다운"
          description: "Q-Sign(인증 SoR)이 2분 이상 응답하지 않습니다. 신규 인증 불가."
          runbook:     "docs/RUNBOOK_SSO_METRICS.md §1.1"

      # ── 3. Q-IM 다운 (식별·매핑 SoR 정지) ────────────────────────────────
      - alert: QimServiceDown
        expr: up{job="q-im"} == 0
        for: 2m
        labels:
          severity: critical
          service:  q-im
          essence:  identity
        annotations:
          summary:     "Q-IM 서비스 다운"
          description: "Q-IM(식별·매핑 SoR)이 2분 이상 응답하지 않습니다. IdO 핸드오프 식별 불가."

      # ── 4. 인증 성공률 저하 (PR-B1-new 본질 메트릭 §1.1) ─────────────────
      # divide-by-zero 방어: 분모 > 0 조건 추가 (트래픽 없을 때 거짓경보 방지)
      - alert: AuthSuccessRateLow
        expr: |
          (
            sum(rate(auth_success_total[5m]))
            /
            ( sum(rate(auth_success_total[5m])) + sum(rate(auth_failure_total[5m])) )
          ) < 0.90
          and
          ( sum(rate(auth_success_total[5m])) + sum(rate(auth_failure_total[5m])) ) > 0
        for: 5m
        labels:
          severity: critical
          service:  q-sign
          essence:  authentication
        annotations:
          summary:     "인증 성공률 저하 (< 90%)"
          description: "5분 평균 인증 성공률 {{ $value | humanizePercentage }} (임계값: 90%). IdP/Provider 장애 가능성."
          runbook:     "docs/RUNBOOK_SSO_METRICS.md §1.1"

      # ── 5. KMS 가용 불가 (PR-B1-new 본질 메트릭 §1.3) ────────────────────
      # onepass_kms_healthy = 0 (DOWN) 상태가 2분 지속 시
      - alert: KmsUnavailable
        expr: onepass_kms_healthy == 0
        for: 2m
        labels:
          severity: critical
          service:  ido
          essence:  privacy
        annotations:
          summary:     "KMS(Vault Transit) 가용 불가"
          description: "ID 핸드오프 암호화 불가 상태가 2분 이상 지속. Vault/KMS 즉시 점검 필요."
          runbook:     "docs/RUNBOOK_SSO_METRICS.md §1.3"

  # ──────────────────────────────────────────────────────────────────────────
  # [WARNING] 3개 — Slack 채널만 (전화/페이지 없음)
  # ──────────────────────────────────────────────────────────────────────────
  - name: onepass_warning
    interval: 30s
    rules:

      # ── 6. Handoff 발급 지연 (PR-B1-new 본질 메트릭 §1.2) ────────────────
      # SLO: p95 < 2s. 5분 이상 위반 시 warning (10분 지속 시 발화)
      - alert: HandoffLatencyHigh
        expr: |
          histogram_quantile(0.95,
            sum by (le) (
              rate(http_server_requests_seconds_bucket{job="ido",uri="/api/v1/handoff/issue"}[5m])
            )
          ) > 2.0
        for: 10m
        labels:
          severity: warning
          service:  ido
          essence:  handoff
        annotations:
          summary:     "Handoff 발급 p95 지연 (> 2s)"
          description: "Handoff Issue p95 응답시간 {{ $value | humanizeDuration }} (SLO: 2s). KMS/DB/Redis 응답성 확인."
          runbook:     "docs/RUNBOOK_SSO_METRICS.md §1.2"

      # ── 7. Handoff 발급 5xx 오류율 (보조 신호 — Critical AuthSuccessRate가
      #     인증 본질을 커버하므로 이 알람은 warning으로 격하) ──────────────
      - alert: IdoHandoffErrorRateHigh
        expr: |
          (
            rate(http_server_requests_seconds_count{job="ido",uri=~".*/handoff/issue.*",status=~"5.."}[5m])
            /
            rate(http_server_requests_seconds_count{job="ido",uri=~".*/handoff/issue.*"}[5m])
          ) > 0.05
          and
          rate(http_server_requests_seconds_count{job="ido",uri=~".*/handoff/issue.*"}[5m]) > 0
        for: 5m
        labels:
          severity: warning
          service:  ido
          essence:  handoff
        annotations:
          summary:     "Handoff 발급 5xx 오류율 상승 (> 5%)"
          description: "Handoff 발급 5xx 오류율 {{ $value | humanizePercentage }} (임계값: 5%). KmsUnavailable/ServiceDown 동시 확인."

      # ── 8. Rate Limit 초과 급증 (보안 신호 — DDoS/기관 오동작) ────────────
      - alert: RateLimitExceeded
        expr: increase(http_server_requests_seconds_count{job="ido",status="429"}[1m]) > 100
        for: 1m
        labels:
          severity: warning
          service:  ido
          essence:  security
        annotations:
          summary:     "Rate Limit 초과 급증"
          description: "분당 429 응답 {{ $value }}회 — 기관 DDoS 또는 클라이언트 오동작 의심."
