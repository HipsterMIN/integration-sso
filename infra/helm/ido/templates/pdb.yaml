{{- if .Values.pdb.enabled }}
apiVersion: policy/v1
kind: PodDisruptionBudget
metadata:
  name: ido-pdb
  namespace: {{ .Values.namespace }}
  labels:
    {{- include "ido.labels" . | nindent 4 }}
spec:
  minAvailable: {{ .Values.pdb.minAvailable }}
  selector:
    matchLabels:
      {{- include "ido.selectorLabels" . | nindent 6 }}
{{- end }}
