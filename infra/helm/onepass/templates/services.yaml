# ── Q-Sign Service ─────────────────────────────────────────────────
{{- if .Values.qsign.enabled }}
apiVersion: v1
kind: Service
metadata:
  name: onepass-qsign
  namespace: {{ .Values.global.namespace }}
  labels:
    {{- include "onepass.labels" . | nindent 4 }}
    app.kubernetes.io/component: q-sign
spec:
  type: {{ .Values.qsign.service.type }}
  selector:
    app: onepass-qsign
  ports:
    - name: http
      port: {{ .Values.qsign.service.port }}
      targetPort: http
      protocol: TCP
{{- end }}
---
