# ============================================================
# ServiceAccount — onepass-ido
#
# 목적:
#   1. Vault Kubernetes Auth — VAULT_AUTH_METHOD=kubernetes 일 때
#      Pod 안의 /var/run/secrets/kubernetes.io/serviceaccount/token (SA JWT)을
#      Vault Server가 K8s API로 검증 후 client_token 발급.
#
#   2. Vault 정책 바인딩:
#        vault write auth/kubernetes/role/ido \
#          bound_service_account_names={{ .Values.ido.serviceAccount.name }} \
#          bound_service_account_namespaces={{ .Values.global.namespace }} \
#          policies=ido-kms-policy \
#          ttl=1h
#
#   3. ido는 K8s API 직접 호출하지 않으므로 RBAC(ClusterRole/RoleBinding) 불필요.
#      향후 leader election 등에서 필요해지면 Role+RoleBinding 추가.
#
# 참고: PR-A3에서 q-sign/q-im/batch까지 포함하는 통합 serviceaccount.yaml로 리팩토링 예정.
# ============================================================
{{- if .Values.ido.enabled }}
{{- if .Values.ido.serviceAccount }}
{{- if .Values.ido.serviceAccount.create }}
apiVersion: v1
kind: ServiceAccount
metadata:
  name: {{ .Values.ido.serviceAccount.name | default "onepass-ido" }}
  namespace: {{ .Values.global.namespace }}
  labels:
    {{- include "onepass.labels" . | nindent 4 }}
    app.kubernetes.io/component: ido
  {{- with .Values.ido.serviceAccount.annotations }}
  annotations:
    {{- toYaml . | nindent 4 }}
  {{- end }}
# automountServiceAccountToken: true (기본값)
# Vault K8s Auth가 /var/run/secrets/.../token 파일을 읽으므로 토큰 자동 마운트 필수.
{{- end }}
{{- end }}
{{- end }}
