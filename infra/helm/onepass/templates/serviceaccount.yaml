# ============================================================
# ServiceAccount — Q-Sign / Q-IM / IdO / Outbox Relay Batch
#
# 목적:
#   1. Vault Kubernetes Auth — VAULT_AUTH_METHOD=kubernetes 일 때
#      Pod 안의 /var/run/secrets/kubernetes.io/serviceaccount/token (SA JWT)을
#      Vault Server가 K8s API로 검증 후 client_token 발급.
#      (현재는 ido만 KMS 사용 — 추후 q-sign/q-im/batch도 KMS 필요 시 동일 패턴)
#
#   2. 향후 RBAC 확장 시 SA 단위 정책 부여 (Leader Election, ConfigMap Watch 등)
#
#   3. 명시적 SA 사용은 보안 모범 사례 — default SA 사용 회피
#
# Vault role 등록 예시 (운영):
#   vault write auth/kubernetes/role/ido \
#     bound_service_account_names=onepass-ido \
#     bound_service_account_namespaces=onepass \
#     policies=ido-kms-policy ttl=1h
# ============================================================

# ── Q-Sign ServiceAccount ─────────────────────────────────────
{{- if and .Values.qsign.enabled .Values.qsign.serviceAccount .Values.qsign.serviceAccount.create }}
apiVersion: v1
kind: ServiceAccount
metadata:
  name: {{ .Values.qsign.serviceAccount.name | default "onepass-qsign" }}
  namespace: {{ .Values.global.namespace }}
  labels:
    {{- include "onepass.labels" . | nindent 4 }}
    app.kubernetes.io/component: q-sign
  {{- with .Values.qsign.serviceAccount.annotations }}
  annotations:
    {{- toYaml . | nindent 4 }}
  {{- end }}
{{- end }}
---
# ── Q-IM ServiceAccount ───────────────────────────────────────
{{- if and .Values.qim.enabled .Values.qim.serviceAccount .Values.qim.serviceAccount.create }}
apiVersion: v1
kind: ServiceAccount
metadata:
  name: {{ .Values.qim.serviceAccount.name | default "onepass-qim" }}
  namespace: {{ .Values.global.namespace }}
  labels:
    {{- include "onepass.labels" . | nindent 4 }}
    app.kubernetes.io/component: q-im
  {{- with .Values.qim.serviceAccount.annotations }}
  annotations:
    {{- toYaml . | nindent 4 }}
  {{- end }}
{{- end }}
---
# ── IdO ServiceAccount (Vault Kubernetes Auth 필수) ───────────
{{- if and .Values.ido.enabled .Values.ido.serviceAccount .Values.ido.serviceAccount.create }}
apiVersion: v1
kind: ServiceAccount
metadata:
  name: {{ .Values.ido.serviceAccount.name | default "onepass-ido" }}
  namespace: {{ .Values.global.namespace }}
  labels:
    {{- include "onepass.labels" . | nindent 4 }}
    app.kubernetes.io/component: ido
  {{- with .Values.ido.serviceAccount.annotations }}
  annotations:
    {{- toYaml . | nindent 4 }}
  {{- end }}
# automountServiceAccountToken: true (기본값)
# Vault K8s Auth가 SA 토큰 파일을 읽으므로 토큰 자동 마운트 필수.
{{- end }}
---
# ── Outbox Relay Batch ServiceAccount ─────────────────────────
{{- if and .Values.batch.enabled .Values.batch.serviceAccount .Values.batch.serviceAccount.create }}
apiVersion: v1
kind: ServiceAccount
metadata:
  name: {{ .Values.batch.serviceAccount.name | default "onepass-batch" }}
  namespace: {{ .Values.global.namespace }}
  labels:
    {{- include "onepass.labels" . | nindent 4 }}
    app.kubernetes.io/component: batch
  {{- with .Values.batch.serviceAccount.annotations }}
  annotations:
    {{- toYaml . | nindent 4 }}
  {{- end }}
{{- end }}
