# ============================================================
# values-stage.yaml — 스테이징 환경
# 적용: helm upgrade --install onepass ./infra/helm/onepass \
#         -f infra/helm/onepass/values.yaml \
#         -f infra/helm/onepass/values-stage.yaml \
#         --namespace onepass-stage
# ============================================================
global:
  namespace: onepass-stage
  env: stage

qsign:
  replicaCount: 2
  config:
    QSIGN_INTERNAL_SIG_STRICT: "true"

qim:
  replicaCount: 2

ido:
  replicaCount: 2
  config:
    IDO_BROKER_MODE: qsign
    IDO_RATE_LIMIT_ENABLED: "true"
    IDO_RATE_LIMIT_DEFAULT_TPS: "100"    # 스테이징: 운영보다 낮은 TPS
    IDO_KAFKA_REPLICATION_FACTOR: "1"   # 스테이징: 단일 브로커
    IDO_KAFKA_MIN_INSYNC_REPLICAS: "1"
    # ── KMS On (스테이징: AppRole 인증으로 운영 시나리오 검증) ───────
    IDO_KMS_ENABLED: "true"
    IDO_KMS_PROVIDER: "vault"
    VAULT_ADDR: "http://vault.vault.svc.cluster.local:8200"
    VAULT_AUTH_METHOD: "approle"

batch:
  replicaCount: 2
  config:
    SPRING_PROFILES_ACTIVE: k8s
    # 스테이징: 모든 릴레이 활성 (운영과 동일 시나리오 테스트)
    BATCH_PROVISIONING_RELAY_ENABLED: "true"
    BATCH_WEBHOOK_RELAY_ENABLED: "true"
    # 스테이징은 외부 알림 채널 비활성
    BATCH_ALERT_SLACK_ENABLED: "false"
    BATCH_ALERT_PAGERDUTY_ENABLED: "false"
  resources:
    requests:
      cpu: 200m
      memory: 512Mi
    limits:
      cpu: 1000m
      memory: 1Gi

agencyStub:
  replicaCount: 1

networkPolicy:
  enabled: true

ingress:
  enabled: true
  hosts:
    - host: onepass-stage.example.com
      paths:
        - path: /
          pathType: Prefix
          service: ido
          port: 8083
  tls:
    - secretName: onepass-stage-tls
      hosts:
        - onepass-stage.example.com
