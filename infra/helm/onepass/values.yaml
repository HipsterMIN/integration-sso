# ============================================================
# OnePass Helm Chart — 기본값 (values.yaml)
# 환경별 오버라이드:
#   values-dev.yaml   : 개발 (Minikube / 내부 QA)
#   values-stage.yaml : 스테이징
#   values-prod.yaml  : 운영
#
# 적용 예:
#   helm upgrade --install onepass ./infra/helm/onepass \
#     -f infra/helm/onepass/values-prod.yaml \
#     --namespace onepass \
#     --create-namespace
# ============================================================

global:
  # 네임스페이스
  namespace: onepass
  # 이미지 레지스트리 (운영: 고객사 사설 레지스트리로 교체)
  imageRegistry: ""
  # 이미지 풀 시크릿 (사설 레지스트리 인증 시)
  imagePullSecrets: []
  # 환경 레이블 (dev / stage / prod)
  env: dev

# ── 인프라 의존성 (외부 서비스 엔드포인트) ─────────────────────────
infra:
  postgres:
    host: postgres-service
    port: 5432
    database: onepass
    # Secret: onepass-db-secret 에서 username/password 참조
    existingSecret: onepass-db-secret
    usernameKey: username
    passwordKey: password
  mariadb:
    host: mariadb-service
    port: 3306
    database: qim
    existingSecret: onepass-mariadb-secret
    usernameKey: username
    passwordKey: password
  redis:
    host: redis-service
    port: 6379
    # Secret: onepass-redis-secret (password 없으면 빈값)
    existingSecret: onepass-redis-secret
    passwordKey: password
  kafka:
    bootstrapServers: kafka-service:9092

# ── Q-Sign ──────────────────────────────────────────────────────────
qsign:
  enabled: true
  replicaCount: 2
  image:
    repository: onepass-qsign
    tag: latest
    pullPolicy: IfNotPresent
  service:
    type: ClusterIP
    port: 8081
  resources:
    requests:
      cpu: 250m
      memory: 512Mi
    limits:
      cpu: 1000m
      memory: 1Gi
  # 환경변수 (비민감 — ConfigMap으로 관리)
  config:
    SPRING_PROFILES_ACTIVE: k8s
    DB_NAME: onepass
    DB_PORT: "5432"
    REDIS_PORT: "6379"
    KEYCLOAK_REALM: onepass
    QSIGN_KEYCLOAK_CLIENT_ID: q-sign-client
    QSIGN_PKCE_ENABLED: "true"
    QSIGN_PKCE_TTL: "300"
    QSIGN_INTERNAL_SIG_STRICT: "false"
  # 민감정보 — Secret 이름 참조 (실제 값은 Secret에 있음)
  secretRef:
    name: onepass-qsign-secret
  # 헬스체크
  livenessProbe:
    httpGet:
      path: /actuator/health/liveness
      port: 8081
    initialDelaySeconds: 60
    periodSeconds: 15
    failureThreshold: 3
  readinessProbe:
    httpGet:
      path: /actuator/health/readiness
      port: 8081
    initialDelaySeconds: 30
    periodSeconds: 10
    failureThreshold: 3
  # Pod 재시작 트리거 (Secret 변경 감지용 checksum annotation)
  podAnnotations:
    checksum/secret: ""   # Helm 렌더링 시 자동 계산

# ── Q-IM ────────────────────────────────────────────────────────────
qim:
  enabled: true
  replicaCount: 2
  image:
    repository: onepass-qim
    tag: latest
    pullPolicy: IfNotPresent
  service:
    type: ClusterIP
    port: 8082
  resources:
    requests:
      cpu: 250m
      memory: 512Mi
    limits:
      cpu: 1000m
      memory: 1Gi
  config:
    SPRING_PROFILES_ACTIVE: k8s
    QIM_DB_PORT: "3306"
    QIM_DB_NAME: qim
    QIM_DB_SSL: "false"
    REDIS_PORT: "6379"
    QIM_CI_CURRENT_VERSION: v1
    QIM_RECEIVER_AUDIT: "true"
  secretRef:
    name: onepass-qim-secret
  livenessProbe:
    httpGet:
      path: /actuator/health/liveness
      port: 8082
    initialDelaySeconds: 45
    periodSeconds: 15
    failureThreshold: 3
  readinessProbe:
    httpGet:
      path: /actuator/health/readiness
      port: 8082
    initialDelaySeconds: 20
    periodSeconds: 10
    failureThreshold: 3

# ── IdO ─────────────────────────────────────────────────────────────
ido:
  enabled: true
  replicaCount: 2
  image:
    repository: onepass-ido
    tag: latest
    pullPolicy: IfNotPresent
  service:
    type: ClusterIP
    port: 8083
  resources:
    requests:
      cpu: 500m
      memory: 1Gi
    limits:
      cpu: 2000m
      memory: 2Gi
  config:
    SPRING_PROFILES_ACTIVE: k8s
    DB_NAME: onepass
    DB_PORT: "5432"
    REDIS_PORT: "6379"
    IDO_BROKER_MODE: qsign
    KEYCLOAK_REALM: onepass
    KEYCLOAK_CLIENT_ID: ido-client
    IDO_PLATFORM_VERSION: "1.0"
    IDO_RATE_LIMIT_ENABLED: "true"
    IDO_RATE_LIMIT_DEFAULT_TPS: "200"
    IDO_RATE_LIMIT_DEFAULT_DAILY: "1000000"
    IDO_AUDIT_KAFKA_ENABLED: "true"
    IDO_KAFKA_PARTITION_COUNT_MAIN: "12"
    IDO_KAFKA_PARTITION_COUNT_DLQ: "6"
    IDO_KAFKA_REPLICATION_FACTOR: "1"
    IDO_KAFKA_MIN_INSYNC_REPLICAS: "1"
  secretRef:
    name: onepass-ido-secret
  livenessProbe:
    httpGet:
      path: /actuator/health/liveness
      port: 8083
    initialDelaySeconds: 60
    periodSeconds: 15
    failureThreshold: 3
  readinessProbe:
    httpGet:
      path: /actuator/health/readiness
      port: 8083
    initialDelaySeconds: 45
    periodSeconds: 10
    failureThreshold: 3

# ── Agency-Stub ─────────────────────────────────────────────────────
agencyStub:
  enabled: true
  replicaCount: 1
  image:
    repository: onepass-agency-stub
    tag: latest
    pullPolicy: IfNotPresent
  service:
    type: ClusterIP
    port: 8084
  resources:
    requests:
      cpu: 100m
      memory: 256Mi
    limits:
      cpu: 500m
      memory: 512Mi
  config:
    SPRING_PROFILES_ACTIVE: k8s
    DB_NAME: onepass
    DB_PORT: "5432"
    REDIS_PORT: "6379"
  secretRef:
    name: onepass-agency-stub-secret

# ── Ingress ─────────────────────────────────────────────────────────
ingress:
  enabled: false
  className: nginx
  annotations:
    nginx.ingress.kubernetes.io/ssl-redirect: "true"
  hosts:
    - host: onepass.example.com
      paths:
        - path: /api/qsign
          pathType: Prefix
          service: qsign
          port: 8081
        - path: /api/qim
          pathType: Prefix
          service: qim
          port: 8082
        - path: /api/ido
          pathType: Prefix
          service: ido
          port: 8083
  tls:
    - secretName: onepass-tls
      hosts:
        - onepass.example.com

# ── Kafka Topic 설정 (ConfigMap용 레퍼런스) ─────────────────────────
kafka:
  topics:
    authEvents: qsign.auth.events
    handoffEvents: ido.handoff.events
    sessionAdvisory: platform.session.advisory
    auditLog: platform.audit.log
    qimUserEvents: qim.user.events
    qimUserSnapshot: qim.user.snapshot
    qimSpMemberEvents: qim.sp.member.events
    # DLT (Dead Letter Topics)
    authEventsDlt: qsign.auth.events.dlt
    handoffEventsDlt: ido.handoff.events.dlt
    sessionAdvisoryDlt: platform.session.advisory.dlt
    qimUserEventsDlt: qim.user.events.dlt
    qimSpMemberEventsDlt: qim.sp.member.events.dlt

# ── NetworkPolicy ───────────────────────────────────────────────────
networkPolicy:
  enabled: false
