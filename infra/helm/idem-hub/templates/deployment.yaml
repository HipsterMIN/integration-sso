apiVersion: apps/v1
kind: Deployment
metadata:
  name: ido
  namespace: {{ .Values.namespace }}
  labels:
    {{- include "ido.labels" . | nindent 4 }}
  annotations:
    # 배포 메타데이터
    onepass.idem-hub/phase: {{ .Values.phase | default "1" | quote }}
    onepass.idem-hub/deployed-at: {{ now | date "2006-01-02T15:04:05Z" | quote }}
spec:
  replicas: {{ .Values.replicaCount }}
  selector:
    matchLabels:
      {{- include "ido.selectorLabels" . | nindent 6 }}
  strategy:
    type: {{ .Values.strategy.type }}
    rollingUpdate:
      maxUnavailable: {{ .Values.strategy.rollingUpdate.maxUnavailable }}
      maxSurge: {{ .Values.strategy.rollingUpdate.maxSurge }}
  template:
    metadata:
      labels:
        {{- include "ido.selectorLabels" . | nindent 8 }}
        version: {{ .Chart.AppVersion | quote }}
      annotations:
        # ConfigMap/Secret 변경 시 Pod 자동 재시작 (Checksum)
        checksum/configmap: {{ include (print $.Template.BasePath "/configmap.yaml") . | sha256sum }}
        # Prometheus 스크레이핑
        {{- if .Values.prometheus.enabled }}
        prometheus.io/scrape: "true"
        prometheus.io/path: {{ .Values.prometheus.path | quote }}
        prometheus.io/port: {{ .Values.prometheus.port | quote }}
        {{- end }}
    spec:
      serviceAccountName: {{ .Values.serviceAccount.name }}

      {{- include "ido.imagePullSecrets" . | nindent 6 }}

      # ── 보안 컨텍스트 (Pod) ────────────────────────────────────────────
      securityContext:
        runAsNonRoot: {{ .Values.securityContext.runAsNonRoot }}
        runAsUser: {{ .Values.securityContext.runAsUser }}
        runAsGroup: {{ .Values.securityContext.runAsGroup }}
        fsGroup: {{ .Values.securityContext.fsGroup }}

      containers:
        - name: ido
          image: "{{ .Values.image.repository }}:{{ .Values.image.tag }}"
          imagePullPolicy: {{ .Values.image.pullPolicy }}
          ports:
            - name: http
              containerPort: {{ .Values.service.port }}
              protocol: TCP

          # ── 환경변수: ConfigMap + Secret 마운트 ──────────────────────
          envFrom:
            - configMapRef:
                name: {{ .Values.configMap.name }}
            - secretRef:
                name: {{ .Values.secrets.main }}
            # Sprint 17: 기관별 HMAC 서명 키 (IDO_GATEWAY_HMAC_KEY_* 패턴)
            - secretRef:
                name: {{ .Values.secrets.hmacKeys }}
                optional: true   # 키 없어도 기동 가능 (F-26=false이면 검증 미수행)

          # ── Pod 메타데이터 + JVM 환경변수 ────────────────────────────
          env:
            - name: POD_NAME
              valueFrom:
                fieldRef:
                  fieldPath: metadata.name
            - name: POD_NAMESPACE
              valueFrom:
                fieldRef:
                  fieldPath: metadata.namespace
            - name: POD_IP
              valueFrom:
                fieldRef:
                  fieldPath: status.podIP
            - name: JAVA_OPTS
              value: >-
                {{ .Values.jvm.opts }}
                -Dspring.profiles.active=$(SPRING_PROFILES_ACTIVE)
            # Phase 프리셋 환경변수 (--set phase=2a 시 자동 오버라이드)
            {{- include "ido.phaseEnvVars" . | nindent 12 }}

          # ── 리소스 요청/제한 ──────────────────────────────────────────
          resources:
            requests:
              memory: {{ .Values.resources.requests.memory | quote }}
              cpu: {{ .Values.resources.requests.cpu | quote }}
            limits:
              memory: {{ .Values.resources.limits.memory | quote }}
              cpu: {{ .Values.resources.limits.cpu | quote }}

          # ── 헬스 체크 ──────────────────────────────────────────────────
          readinessProbe:
            httpGet:
              path: {{ .Values.probes.readiness.path }}
              port: {{ .Values.service.port }}
            initialDelaySeconds: {{ .Values.probes.readiness.initialDelaySeconds }}
            periodSeconds: {{ .Values.probes.readiness.periodSeconds }}
            failureThreshold: {{ .Values.probes.readiness.failureThreshold }}
            successThreshold: 1
          livenessProbe:
            httpGet:
              path: {{ .Values.probes.liveness.path }}
              port: {{ .Values.service.port }}
            initialDelaySeconds: {{ .Values.probes.liveness.initialDelaySeconds }}
            periodSeconds: {{ .Values.probes.liveness.periodSeconds }}
            failureThreshold: {{ .Values.probes.liveness.failureThreshold }}
          startupProbe:
            httpGet:
              path: {{ .Values.probes.startup.path }}
              port: {{ .Values.service.port }}
            initialDelaySeconds: {{ .Values.probes.startup.initialDelaySeconds }}
            periodSeconds: {{ .Values.probes.startup.periodSeconds }}
            failureThreshold: {{ .Values.probes.startup.failureThreshold }}

          # ── 컨테이너 보안 컨텍스트 ────────────────────────────────────
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: false
            capabilities:
              drop:
                - ALL

          # ── 볼륨 마운트 ───────────────────────────────────────────────
          volumeMounts:
            - name: tmp-dir
              mountPath: /tmp
            - name: oacx-keys
              mountPath: /app/config/oacx
              readOnly: true

      # ── 볼륨 ────────────────────────────────────────────────────────────
      volumes:
        - name: tmp-dir
          emptyDir: {}
        - name: oacx-keys
          secret:
            secretName: {{ .Values.secrets.oacx }}
            optional: true

      # ── Pod 분산 배치 (Multi-AZ) ────────────────────────────────────────
      {{- if .Values.topologySpread.enabled }}
      topologySpreadConstraints:
        - maxSkew: {{ .Values.topologySpread.maxSkew }}
          topologyKey: {{ .Values.topologySpread.topologyKey }}
          whenUnsatisfiable: ScheduleAnyway
          labelSelector:
            matchLabels:
              {{- include "ido.selectorLabels" . | nindent 14 }}
      {{- end }}

      # ── Pod 반-친화성 (동일 노드 중복 배치 억제) ──────────────────────
      affinity:
        podAntiAffinity:
          preferredDuringSchedulingIgnoredDuringExecution:
            - weight: 100
              podAffinityTerm:
                labelSelector:
                  matchLabels:
                    {{- include "ido.selectorLabels" . | nindent 20 }}
                topologyKey: kubernetes.io/hostname
