# ============================================================
# values-stage.yaml — 스테이징 환경
# 적용: helm upgrade --install onepass ./infra/helm/idem \
#         -f infra/helm/idem/values.yaml \
#         -f infra/helm/idem/values-stage.yaml \
#         --namespace idem-stage
# ============================================================
global:
  namespace: idem-stage
  env: stage

gate:
  replicaCount: 2
  config:
    IDEM_GATE_INTERNAL_SIG_STRICT: "true"

registry:
  replicaCount: 2

hub:
  replicaCount: 2
  config:
    IDEM_HUB_BROKER_MODE: qsign
    IDEM_HUB_RATE_LIMIT_ENABLED: "true"
    IDEM_HUB_RATE_LIMIT_DEFAULT_TPS: "100"    # 스테이징: 운영보다 낮은 TPS
    IDEM_HUB_KAFKA_REPLICATION_FACTOR: "1"   # 스테이징: 단일 브로커
    IDEM_HUB_KAFKA_MIN_INSYNC_REPLICAS: "1"
    # ── KMS On (스테이징: AppRole 인증으로 운영 시나리오 검증) ───────
    IDEM_HUB_KMS_ENABLED: "true"
    IDEM_HUB_KMS_PROVIDER: "vault"
    VAULT_ADDR: "http://vault.vault.svc.cluster.local:8200"
    VAULT_AUTH_METHOD: "approle"

relay:
  replicaCount: 2
  config:
    SPRING_PROFILES_ACTIVE: k8s
    # 스테이징: 모든 릴레이 활성 (운영과 동일 시나리오 테스트)
    IDEM_RELAY_PROVISIONING_RELAY_ENABLED: "true"
    IDEM_RELAY_WEBHOOK_RELAY_ENABLED: "true"
    # 스테이징은 외부 알림 채널 비활성
    IDEM_RELAY_ALERT_SLACK_ENABLED: "false"
    IDEM_RELAY_ALERT_PAGERDUTY_ENABLED: "false"
  resources:
    requests:
      cpu: 200m
      memory: 512Mi
    limits:
      cpu: 1000m
      memory: 1Gi

sample:
  replicaCount: 1

networkPolicy:
  enabled: true

ingress:
  enabled: true
  hosts:
    - host: idem-stage.example.com
      paths:
        - path: /
          pathType: Prefix
          service: idem-hub
          port: 8083
  tls:
    - secretName: idem-stage-tls
      hosts:
        - idem-stage.example.com
