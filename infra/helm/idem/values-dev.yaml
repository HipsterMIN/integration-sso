# ============================================================
# values-dev.yaml — 개발 환경 (Minikube / 내부 QA)
# 적용: helm upgrade --install onepass ./infra/helm/idem \
#         -f infra/helm/idem/values.yaml \
#         -f infra/helm/idem/values-dev.yaml \
#         --namespace idem-dev
# ============================================================
global:
  namespace: idem-dev
  env: dev

gate:
  replicaCount: 1
  config:
    IDEM_GATE_INTERNAL_SIG_STRICT: "false"   # 개발: 서명 검증 느슨하게
  resources:
    requests:
      cpu: 100m
      memory: 256Mi
    limits:
      cpu: 500m
      memory: 512Mi

registry:
  replicaCount: 1
  resources:
    requests:
      cpu: 100m
      memory: 256Mi
    limits:
      cpu: 500m
      memory: 512Mi

hub:
  replicaCount: 1
  hpa:
    enabled: false
  pdb:
    enabled: false
  config:
    IDEM_HUB_BROKER_MODE: qsign
    IDEM_HUB_RATE_LIMIT_ENABLED: "false"     # 개발: rate limit 비활성
    IDEM_HUB_KAFKA_REPLICATION_FACTOR: "1"
    IDEM_HUB_KAFKA_MIN_INSYNC_REPLICAS: "1"
    # ── KMS Off (개발: LocalKmsClient 사용 — Vault 의존성 없음) ──────
    IDEM_HUB_KMS_ENABLED: "false"
  resources:
    requests:
      cpu: 200m
      memory: 512Mi
    limits:
      cpu: 1000m
      memory: 1Gi

# 개발 환경: HPA/PDB 모두 비활성 (리소스 최소화)
gate:
  hpa:
    enabled: false
  pdb:
    enabled: false

registry:
  hpa:
    enabled: false
  pdb:
    enabled: false

relay:
  pdb:
    enabled: false
  # 개발: 단일 인스턴스로 운영 (ShedLock 분산락 불필요)
  replicaCount: 1
  config:
    SPRING_PROFILES_ACTIVE: local
    # 개발: 외부 Webhook/Provisioning 릴레이 비활성 (외부 의존성 없음)
    IDEM_RELAY_PROVISIONING_RELAY_ENABLED: "false"
    IDEM_RELAY_WEBHOOK_RELAY_ENABLED: "false"
  resources:
    requests:
      cpu: 100m
      memory: 256Mi
    limits:
      cpu: 500m
      memory: 512Mi

sample:
  replicaCount: 1

kafka:
  topics:
    # 개발 환경: 기본 토픽 이름 동일
    authEvents: idem.gate.auth.events

networkPolicy:
  enabled: false

ingress:
  enabled: true
  hosts:
    - host: onepass.dev.local
      paths:
        - path: /
          pathType: Prefix
          service: idem-hub
          port: 8083
