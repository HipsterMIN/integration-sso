# ============================================================
# OnePass Helm Chart — 기본값 (values.yaml)
# 환경별 오버라이드:
#   values-dev.yaml   : 개발 (Minikube / 내부 QA)
#   values-stage.yaml : 스테이징
#   values-prod.yaml  : 운영
#
# 적용 예:
#   helm upgrade --install onepass ./infra/helm/idem \
#     -f infra/helm/idem/values-prod.yaml \
#     --namespace onepass \
#     --create-namespace
# ============================================================

global:
  # 네임스페이스
  namespace: onepass
  # 이미지 레지스트리 (운영: 고객사 사설 레지스트리로 교체)
  imageRegistry: ""
  # 이미지 풀 시크릿 (사설 레지스트리 인증 시)
  imagePullSecrets: []
  # 환경 레이블 (dev / stage / prod)
  env: dev

# ── 인프라 의존성 (외부 서비스 엔드포인트) ─────────────────────────
infra:
  postgres:
    host: postgres-service
    port: 5432
    database: onepass
    # Secret: idem-db-secret 에서 username/password 참조
    existingSecret: idem-db-secret
    usernameKey: username
    passwordKey: password
  mariadb:
    host: mariadb-service
    port: 3306
    database: qim
    existingSecret: idem-mariadb-secret
    usernameKey: username
    passwordKey: password
  redis:
    host: redis-service
    port: 6379
    # Secret: idem-redis-secret (password 없으면 빈값)
    existingSecret: idem-redis-secret
    passwordKey: password
  kafka:
    bootstrapServers: kafka-service:9092

# ── Q-Sign ──────────────────────────────────────────────────────────
gate:
  enabled: true
  replicaCount: 2
  image:
    repository: idem-gate
    tag: latest
    pullPolicy: IfNotPresent
  service:
    type: ClusterIP
    port: 8081
  resources:
    requests:
      cpu: 250m
      memory: 512Mi
    limits:
      cpu: 1000m
      memory: 1Gi
  # 환경변수 (비민감 — ConfigMap으로 관리)
  config:
    IDEM_KAFKA_ENABLED: "true"   # D1-b: 차트는 Kafka 를 전제로 한다. 브로커 없이 배포하려면 "false" (docs/install.md)
    SPRING_PROFILES_ACTIVE: k8s
    DB_NAME: onepass
    DB_PORT: "5432"
    REDIS_PORT: "6379"
    KEYCLOAK_REALM: onepass
    IDEM_GATE_KEYCLOAK_CLIENT_ID: q-sign-client
    IDEM_GATE_PKCE_ENABLED: "true"
    IDEM_GATE_PKCE_TTL: "300"
    IDEM_GATE_INTERNAL_SIG_STRICT: "false"
  # 민감정보 — Secret 이름 참조 (실제 값은 Secret에 있음)
  secretRef:
    name: idem-gate-secret
  # 헬스체크
  livenessProbe:
    httpGet:
      path: /actuator/health/liveness
      port: 8081
    initialDelaySeconds: 60
    periodSeconds: 15
    failureThreshold: 3
  readinessProbe:
    httpGet:
      path: /actuator/health/readiness
      port: 8081
    initialDelaySeconds: 30
    periodSeconds: 10
    failureThreshold: 3
  # Pod 재시작 트리거 (Secret 변경 감지용 checksum annotation)
  podAnnotations:
    checksum/secret: ""   # Helm 렌더링 시 자동 계산
  # ── startupProbe: 초기 부팅 느림 대응 (Spring Boot 30~60s) ───────
  startupProbe:
    httpGet:
      path: /actuator/health/liveness
      port: 8081
    failureThreshold: 30
    periodSeconds: 5
  # ── HPA: CPU/Memory 기반 오토스케일링 ──────────────────────────
  hpa:
    enabled: false                     # 기본은 비활성 — 운영(prod)에서 true
    minReplicas: 2
    maxReplicas: 10
    targetCPUUtilizationPercentage: 70
    targetMemoryUtilizationPercentage: 80
  # ── PDB: 노드 드레인/업그레이드 시 가용성 보장 ────────────────
  pdb:
    enabled: true
    minAvailable: 1
  # ── ServiceAccount ────────────────────────────────────────────
  serviceAccount:
    create: true
    name: idem-gate
    annotations: {}

# ── Q-AuthZ (연합 인가 — 역할 부여 SoR / SCIM) ──────────────────────
authz:
  enabled: true
  replicaCount: 2
  image:
    repository: idem-authz
    tag: latest
    pullPolicy: IfNotPresent
  service:
    type: ClusterIP
    port: 8086
  resources:
    requests:
      cpu: 200m
      memory: 384Mi
    limits:
      cpu: 1000m
      memory: 1Gi
  config:
    SPRING_PROFILES_ACTIVE: k8s
    IDEM_AUTHZ_DB_PORT: "5432"
    IDEM_AUTHZ_DB_NAME: onepass
    IDEM_AUTHZ_DB_SSLMODE: disable
    IDEM_AUTHZ_EXPIRY_ENABLED: "true"
    IDEM_AUTHZ_EXPIRY_SCAN_INTERVAL_MS: "60000"
    IDEM_AUTHZ_EXPIRY_BATCH_SIZE: "500"
  secretRef:
    name: idem-authz-secret
  livenessProbe:
    httpGet:
      path: /actuator/health/liveness
      port: 8086
    initialDelaySeconds: 45
    periodSeconds: 15
    failureThreshold: 3
  readinessProbe:
    httpGet:
      path: /actuator/health/readiness
      port: 8086
    initialDelaySeconds: 20
    periodSeconds: 10
    failureThreshold: 3
  startupProbe:
    httpGet:
      path: /actuator/health/liveness
      port: 8086
    failureThreshold: 30
    periodSeconds: 5
  hpa:
    enabled: false
    minReplicas: 2
    maxReplicas: 6
    targetCPUUtilizationPercentage: 70
    targetMemoryUtilizationPercentage: 80
  pdb:
    enabled: true
    minAvailable: 1
  serviceAccount:
    create: true
    name: idem-authz
    annotations: {}

# ── Q-IM ────────────────────────────────────────────────────────────
registry:
  enabled: true
  replicaCount: 2
  image:
    repository: idem-registry
    tag: latest
    pullPolicy: IfNotPresent
  service:
    type: ClusterIP
    port: 8082
  resources:
    requests:
      cpu: 250m
      memory: 512Mi
    limits:
      cpu: 1000m
      memory: 1Gi
  config:
    IDEM_KAFKA_ENABLED: "true"   # D1-b: 차트는 Kafka 를 전제로 한다. 브로커 없이 배포하려면 "false" (docs/install.md)
    SPRING_PROFILES_ACTIVE: k8s
    IDEM_REGISTRY_DB_PORT: "3306"
    IDEM_REGISTRY_DB_NAME: qim
    IDEM_REGISTRY_DB_SSL: "false"
    REDIS_PORT: "6379"
    IDEM_REGISTRY_CI_CURRENT_VERSION: v1
    IDEM_REGISTRY_RECEIVER_AUDIT: "true"
  secretRef:
    name: idem-registry-secret
  livenessProbe:
    httpGet:
      path: /actuator/health/liveness
      port: 8082
    initialDelaySeconds: 45
    periodSeconds: 15
    failureThreshold: 3
  readinessProbe:
    httpGet:
      path: /actuator/health/readiness
      port: 8082
    initialDelaySeconds: 20
    periodSeconds: 10
    failureThreshold: 3
  startupProbe:
    httpGet:
      path: /actuator/health/liveness
      port: 8082
    failureThreshold: 30
    periodSeconds: 5
  hpa:
    enabled: false
    minReplicas: 2
    maxReplicas: 8
    targetCPUUtilizationPercentage: 70
    targetMemoryUtilizationPercentage: 80
  pdb:
    enabled: true
    minAvailable: 1
  serviceAccount:
    create: true
    name: idem-registry
    annotations: {}

# ── IdO ─────────────────────────────────────────────────────────────
hub:
  enabled: true
  replicaCount: 2
  image:
    repository: idem-hub
    tag: latest
    pullPolicy: IfNotPresent
  service:
    type: ClusterIP
    port: 8083
  resources:
    requests:
      cpu: 500m
      memory: 1Gi
    limits:
      cpu: 2000m
      memory: 2Gi
  config:
    IDEM_HUB_AUTHZ_ENABLED: "true"   # D2: authz 조회 실패 = 거부(503). authz 를 배포하지 않으면 "false" 로 명시
    IDEM_KAFKA_ENABLED: "true"   # D1-b: 차트는 Kafka 를 전제로 한다. 브로커 없이 배포하려면 "false" (docs/install.md)
    SPRING_PROFILES_ACTIVE: k8s
    DB_NAME: onepass
    DB_PORT: "5432"
    REDIS_PORT: "6379"
    IDEM_HUB_BROKER_MODE: qsign
    KEYCLOAK_REALM: onepass
    KEYCLOAK_CLIENT_ID: ido-client
    IDEM_HUB_PLATFORM_VERSION: "1.0"
    IDEM_HUB_RATE_LIMIT_ENABLED: "true"
    IDEM_HUB_RATE_LIMIT_DEFAULT_TPS: "200"
    IDEM_HUB_RATE_LIMIT_DEFAULT_DAILY: "1000000"
    IDEM_HUB_AUDIT_KAFKA_ENABLED: "true"
    IDEM_HUB_KAFKA_PARTITION_COUNT_MAIN: "12"
    IDEM_HUB_KAFKA_PARTITION_COUNT_DLQ: "6"
    IDEM_HUB_KAFKA_REPLICATION_FACTOR: "1"
    IDEM_HUB_KAFKA_MIN_INSYNC_REPLICAS: "1"
    # ── KMS / Vault Transit Engine ────────────────────────────────────
    # 기본값(values.yaml): KMS Off — LocalKmsClient(Base64 패스스루) 사용
    # 운영(values-prod.yaml): IDEM_HUB_KMS_ENABLED=true, IDEM_HUB_KMS_PROVIDER=vault
    IDEM_HUB_KMS_ENABLED: "false"
    IDEM_HUB_KMS_PROVIDER: "vault"
    IDEM_HUB_KMS_CONN_TIMEOUT_MS: "3000"
    IDEM_HUB_KMS_REQ_TIMEOUT_MS: "5000"
    # Vault 접속 정보 (provider=vault 시)
    VAULT_ADDR: "http://vault:8200"
    VAULT_TRANSIT_PATH: "transit"
    VAULT_TRANSIT_KEY: "idem-handoff-key"
    # 인증 방식: token(개발) | approle(CI/CD) | kubernetes(운영 권장)
    VAULT_AUTH_METHOD: "token"
    # K8s Auth 사용 시 — Vault에 등록된 role 이름
    VAULT_K8S_ROLE: "idem-hub"
    # HCP Vault Dedicated 전용 Namespace (자체 호스팅 시 빈 값)
    VAULT_NAMESPACE: ""
  # ── ServiceAccount (Vault Kubernetes Auth 사용 시 필요) ────────────
  # auth-method=kubernetes 일 때 Vault가 K8s API로 검증할 SA.
  # vault write auth/kubernetes/role/idem-hub \
  #   bound_service_account_names=idem-hub \
  #   bound_service_account_namespaces=onepass \
  #   policies=idem-hub-kms-policy
  serviceAccount:
    create: true
    name: idem-hub
    annotations: {}
  secretRef:
    name: idem-hub-secret
  livenessProbe:
    httpGet:
      path: /actuator/health/liveness
      port: 8083
    initialDelaySeconds: 60
    periodSeconds: 15
    failureThreshold: 3
  readinessProbe:
    httpGet:
      path: /actuator/health/readiness
      port: 8083
    initialDelaySeconds: 45
    periodSeconds: 10
    failureThreshold: 3
  # ── startupProbe: KMS 부팅(Vault 토큰 획득) 포함하여 더 긴 대기 ──
  # failureThreshold * periodSeconds = 30 * 5s = 150s (KMS 통신 실패 재시도 대비)
  startupProbe:
    httpGet:
      path: /actuator/health/liveness
      port: 8083
    failureThreshold: 30
    periodSeconds: 5
  hpa:
    enabled: false                     # 운영(prod)에서 true
    minReplicas: 3
    maxReplicas: 12
    targetCPUUtilizationPercentage: 65    # ido는 SLO p95 < 2s 보장 → 보수적
    targetMemoryUtilizationPercentage: 80
  pdb:
    enabled: true
    minAvailable: 2                     # ido는 최소 2개 유지 (rate limiter 일관성)

# ── Outbox Relay Batch ──────────────────────────────────────────────
# Transactional Outbox 분산 릴레이 배치 서비스
#  - ShedLock 분산 락 → 다중 Pod에서도 단일 인스턴스만 Job 실행
#  - replicaCount 2 권장 (HA 페일오버) — replicaCount 1로 운영해도 동작은 함
#  - idem-hub(PostgreSQL) / idem-registry(MariaDB) / idem-gate(PostgreSQL) 멀티 DataSource
relay:
  enabled: true
  # ShedLock으로 중복 실행 방지 — 2개로 운영하여 HA(파드 장애 시 즉시 페일오버) 확보
  replicaCount: 2
  image:
    repository: idem-relay
    tag: latest
    pullPolicy: IfNotPresent
  service:
    # 외부 노출 불필요 — Prometheus scrape용 ClusterIP만
    type: ClusterIP
    port: 8090
  resources:
    requests:
      cpu: 200m
      memory: 512Mi
    limits:
      cpu: 1000m
      memory: 1Gi
  # 비민감 환경변수 (ConfigMap)
  config:
    SPRING_PROFILES_ACTIVE: k8s
    # DB 포트 (드라이버별)
    IDEM_HUB_DB_PORT: "5432"
    IDEM_HUB_DB_NAME: onepass
    IDEM_REGISTRY_DB_PORT: "3306"
    IDEM_REGISTRY_DB_NAME: qim
    IDEM_GATE_DB_PORT: "5432"
    IDEM_GATE_DB_NAME: onepass
    REDIS_PORT: "6379"
    # Webhook 헤더용
    IDEM_HUB_PLATFORM_VERSION: "1.0"
    # 릴레이 Job ON/OFF
    IDEM_RELAY_HUB_KAFKA_RELAY_ENABLED: "true"
    IDEM_RELAY_HUB_REGISTRY_RELAY_ENABLED: "true"
    IDEM_RELAY_REGISTRY_KAFKA_RELAY_ENABLED: "true"
    IDEM_RELAY_GATE_KAFKA_RELAY_ENABLED: "true"
    IDEM_RELAY_PROVISIONING_RELAY_ENABLED: "true"
    IDEM_RELAY_WEBHOOK_RELAY_ENABLED: "true"
    # DEAD_LETTER 알림 채널 (운영에서 enable + Secret 주입)
    IDEM_RELAY_ALERT_SLACK_ENABLED: "false"
    IDEM_RELAY_ALERT_PAGERDUTY_ENABLED: "false"
  secretRef:
    name: idem-relay-secret
  # 헬스체크
  #  - Liveness: ShedLock 상태와 무관하게 프로세스 생존만 확인
  #  - Readiness: DataSource 3개 + Redis 모두 UP인 경우만 트래픽 처리 가능
  livenessProbe:
    httpGet:
      path: /actuator/health/liveness
      port: 8090
    initialDelaySeconds: 90    # 멀티 DS 초기화 + Flyway V19 마이그레이션 대기
    periodSeconds: 20
    failureThreshold: 3
  readinessProbe:
    httpGet:
      path: /actuator/health/readiness
      port: 8090
    initialDelaySeconds: 45
    periodSeconds: 10
    failureThreshold: 3
  # ── startupProbe: 멀티 DataSource(PG/MariaDB/PG) + Flyway V19 마이그레이션 ─
  # failureThreshold * periodSeconds = 60 * 5s = 300s (가장 보수적)
  startupProbe:
    httpGet:
      path: /actuator/health/liveness
      port: 8090
    failureThreshold: 60
    periodSeconds: 5
  # ── PDB: 노드 드레인 시 최소 1개 Pod 유지 (ShedLock 페일오버 보장) ──
  # ⚠️ HPA는 ShedLock 특성상 무의미 → 의도적으로 미설정
  pdb:
    enabled: true
    minAvailable: 1
  # ── ServiceAccount ────────────────────────────────────────────
  serviceAccount:
    create: true
    name: idem-relay
    annotations: {}
  podAnnotations:
    # Prometheus scrape (annotation 기반 디스커버리 사용 시)
    prometheus.io/scrape: "true"
    prometheus.io/port: "8090"
    prometheus.io/path: "/actuator/prometheus"

# ── Agency-Stub ─────────────────────────────────────────────────────
sample:
  enabled: true
  replicaCount: 1
  image:
    repository: idem-tenant-sample
    tag: latest
    pullPolicy: IfNotPresent
  service:
    type: ClusterIP
    port: 8084
  resources:
    requests:
      cpu: 100m
      memory: 256Mi
    limits:
      cpu: 500m
      memory: 512Mi
  config:
    SPRING_PROFILES_ACTIVE: k8s
    DB_NAME: onepass
    DB_PORT: "5432"
    REDIS_PORT: "6379"
  secretRef:
    name: idem-tenant-sample-secret

# ── Ingress ─────────────────────────────────────────────────────────
ingress:
  enabled: false
  className: nginx
  annotations:
    nginx.ingress.kubernetes.io/ssl-redirect: "true"
  hosts:
    - host: onepass.example.com
      paths:
        - path: /api/idem-gate
          pathType: Prefix
          service: idem-gate
          port: 8081
        - path: /api/idem-registry
          pathType: Prefix
          service: idem-registry
          port: 8082
        - path: /api/idem-hub
          pathType: Prefix
          service: idem-hub
          port: 8083
  tls:
    - secretName: idem-tls
      hosts:
        - onepass.example.com

# ── Kafka Topic 설정 (ConfigMap용 레퍼런스) ─────────────────────────
kafka:
  topics:
    authEvents: idem.gate.auth.events
    handoffEvents: idem.hub.handoff.events
    sessionAdvisory: platform.session.advisory
    auditLog: platform.audit.log
    qimUserEvents: idem.registry.user.events
    qimUserSnapshot: idem.registry.user.snapshot
    qimSpMemberEvents: idem.registry.sp.member.events
    # DLT (Dead Letter Topics)
    authEventsDlt: idem.gate.auth.events.dlt
    handoffEventsDlt: idem.hub.handoff.events.dlt
    sessionAdvisoryDlt: platform.session.advisory.dlt
    qimUserEventsDlt: idem.registry.user.events.dlt
    qimSpMemberEventsDlt: idem.registry.sp.member.events.dlt

# ── NetworkPolicy ───────────────────────────────────────────────────
networkPolicy:
  enabled: false
