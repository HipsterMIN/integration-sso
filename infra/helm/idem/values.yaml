# ═══════════════════════════════════════════════════════════════════════════
# Idem Helm 차트 — 기본값 (S9 PR-3)
#
# 이 차트는 단일 설치본(infra/docker/compose.install.yml · docs/install.md)과 같은 계약을 K8s 로 옮긴 것이다.
#   · 앱: idem-gate · idem-hub · idem-registry · idem-authz · idem-console-admin (+ KR 에디션 idem-kr-portal)
#   · 숨긴 Keycloak(realm `idem` import) 을 차트가 같이 올린다(keycloak.enabled). 밖의 Keycloak 을 쓰면 externalUrl 로.
#   · PostgreSQL · Redis 는 바깥 서비스(infra.*). 스키마는 pre-install Job(files/init-db.sql) 이 만든다.
#   · Kafka 없음이 기본(infra.kafka.enabled=false). 아웃박스·감사는 DB 만으로 완결된다(D1).
#   · 비밀은 Secret 한 벌(secrets.existingSecret) — 키 이름은 install.env 와 같다(docs/install-inputs.md).
#
# 에디션(global.edition): core | kr
#   core = Idem SSO + IM 코어.   kr = 코어 + KR 에디션(idem-kr-hub·idem-kr-registry 이미지, idem-kr-portal, KR 플러그인 켬).
#   이미지 태그는 <tag>-<edition> (예: idem-hub:1.0.0-kr) — CI docker-build 가 두 변형을 다 민다. values-kr.yaml 을 겹쳐 쓴다.
#
#   helm upgrade --install idem infra/helm/idem -n idem --create-namespace \
#     -f my-values.yaml                       # publicUrl·infra·ingress
#     [-f infra/helm/idem/values-kr.yaml]     # KR 에디션
# ═══════════════════════════════════════════════════════════════════════════

global:
  edition: core                 # core | kr
  imageRegistry: ""             # 예: ghcr.io/hipstermin — 비면 로컬 이미지 이름 그대로
  imagePullSecrets: []
  imageTag: latest              # 각 컴포넌트 image.tag 가 비어 있을 때 쓰는 태그
  env: prod                     # 레이블 environment
  timezone: Asia/Seoul          # 컨테이너 TZ = hub 의 idem.hub.zone
  platformCode: IDEM            # 기관 간 SSO(CAST) 의 sourceAgency
  # 브라우저가 접근하는 공개 URL (리버스 프록시·Ingress 주소). gate URL 은 표준 OIDC issuer 의 베이스 — 기관 RP 가 보는 issuer = {gate}/realms/idem
  publicUrl:
    gate: https://sso.example.org
    hub: https://hub.example.org
    console: https://console.example.org
    krPortal: https://portal.example.org

# ── 바깥 인프라 ────────────────────────────────────────────────────────────
infra:
  postgres:
    host: postgres.example.svc.cluster.local
    port: 5432
    database: idem
    # Secret(키 username/password). 이 사용자로 모든 앱·Keycloak 이 붙는다 — compose 의 idem 사용자와 같다
    existingSecret: idem-db-secret
    usernameKey: username
    passwordKey: password
    sslMode: disable            # registry 의 IDEM_REGISTRY_DB_SSL — require 면 "true"
  redis:
    host: redis.example.svc.cluster.local
    port: 6379
    # 비밀번호가 있으면 Secret(키 password) 이름. 없으면 빈값
    existingSecret: ""
    passwordKey: password
  kafka:
    enabled: false              # true 면 IDEM_KAFKA_ENABLED=true + bootstrapServers 를 앱에 준다 (docs/install.md §6)
    bootstrapServers: ""

# ── 앱 비밀 한 벌 (docs/install-inputs.md 의 키 이름 그대로) ─────────────────
secrets:
  # 미리 만든 Secret 이름. 키: IDEM_HUB_INTERNAL_SIG_SECRET, IDEM_HUB_INTERNAL_API_KEY_GATE, IDEM_HUB_INTERNAL_API_KEY_RELAY,
  #   IDEM_REGISTRY_INTERNAL_API_KEY, IDEM_AUTHZ_INTERNAL_API_KEY, IDEM_GATE_KEYCLOAK_CLIENT_SECRET, KEYCLOAK_CLIENT_SECRET,
  #   KEYCLOAK_PROVISIONER_CLIENT_SECRET, KEYCLOAK_SESSION_MANAGER_CLIENT_SECRET, KEYCLOAK_ADMIN_PASSWORD,
  #   IDEM_HUB_HANDOFF_AES_KEY, IDEM_HUB_HANDOFF_HMAC_KEY, IDEM_HUB_WEBHOOK_SIGNING_SECRET, IDEM_REGISTRY_AES_SHARED_KEY,
  #   IDEM_REGISTRY_DI_SECRET, IDEM_REGISTRY_CI_AES_KEY_V1, IDEM_HUB_ADMIN_BOOTSTRAP_PASSWORD, IDEM_HUB_ADMIN_SECRET_KEY,
  #   IDEM_HUB_CAST_PRIVATE_KEY, IDEM_HUB_CAST_PUBLIC_KEY
  existingSecret: idem-app-secrets
  # true 면 아래 values 로 Secret 을 차트가 만든다 — 개발·시험용. 운영은 External Secrets 등 바깥 도구로 만들고 false.
  create: false
  values: {}

# ── 숨긴 Keycloak ──────────────────────────────────────────────────────────
keycloak:
  enabled: true
  image:
    repository: quay.io/keycloak/keycloak
    tag: "24.0"
    pullPolicy: IfNotPresent
  # enabled=false 일 때 앱이 부를 Keycloak 주소 (realm idem 과 client 4개가 이미 있어야 한다 — files/realm-export.json)
  externalUrl: ""
  realmImport: true             # files/realm-export.json 을 ConfigMap 으로 마운트해 --import-realm
  adminUser: admin              # 관리 콘솔(설치자 전용) 계정 — 비밀번호는 Secret 의 KEYCLOAK_ADMIN_PASSWORD
  # 관리 콘솔 주소: 기본은 클러스터 안에서만(port-forward). 공개하려면 ingress 에 따로 host 를 붙이고 여기에 그 URL
  adminUrl: ""
  replicaCount: 1
  resources:
    requests: { cpu: 250m, memory: 768Mi }
    limits:   { cpu: "1",  memory: 1536Mi }
  extraEnv: {}
  javaOpts: "-XX:MaxRAMPercentage=75.0"

# ── 앱 공통 기본값 (각 컴포넌트가 덮어쓸 수 있다) ───────────────────────────
appDefaults:
  replicaCount: 2
  javaOpts: "-XX:+UseG1GC -XX:MaxRAMPercentage=75.0 -XX:+ExitOnOutOfMemoryError -Dfile.encoding=UTF-8"
  imagePullPolicy: IfNotPresent
  terminationGracePeriodSeconds: 30
  startupProbe:   { failureThreshold: 30, periodSeconds: 5 }     # Spring Boot 부팅 최대 150s
  livenessProbe:  { periodSeconds: 15, failureThreshold: 3 }
  readinessProbe: { periodSeconds: 10, failureThreshold: 3 }
  podAntiAffinity: soft         # soft | hard | none
  pdb:
    enabled: true
    minAvailable: 1
  hpa:
    enabled: false
    minReplicas: 2
    maxReplicas: 6
    targetCPUUtilizationPercentage: 70

# ── 제품 1: Idem SSO ───────────────────────────────────────────────────────
gate:
  enabled: true
  image: { repository: idem-gate, tag: "" }
  resources:
    requests: { cpu: 250m, memory: 512Mi }
    limits:   { cpu: "1",  memory: 1Gi }
  config:                       # 비민감 환경변수 (ConfigMap). 필요한 것만 더한다
    IDEM_GATE_INTERNAL_SIG_STRICT: "true"
  extraEnv: {}

hub:
  enabled: true
  image: { repository: idem-hub, tag: "" }   # 에디션 접미가 붙는다: <tag>-<edition>
  resources:
    requests: { cpu: 500m, memory: 1Gi }
    limits:   { cpu: "2",  memory: 2Gi }
  brokerMode: qsign             # qsign(본인확인 SPI 경로) | keycloak(표준 OIDC 로그인)
  adminBootstrapUsername: admin
  adminCookieSecure: "true"
  config:
    IDEM_HUB_AUTHZ_ENABLED: "true"          # D2: authz 조회 실패 = 거부. authz.enabled=false 면 "false"
    IDEM_PLUGINS_MOCK_AUTH_ENABLED: "false"  # 설치 검증(docs/install.md §5)에만 잠시 true
  # KMS(Vault Transit) 는 기본 Off — 켜려면 config 에 IDEM_HUB_KMS_ENABLED/PROVIDER 와 VAULT_* 를 넣고 Secret 에 VAULT_TOKEN 등
  extraEnv: {}
  serviceAccount:
    create: true
    annotations: {}

# ── 제품 2: Idem IM ────────────────────────────────────────────────────────
registry:
  enabled: true
  image: { repository: idem-registry, tag: "" }   # 에디션 접미가 붙는다
  resources:
    requests: { cpu: 250m, memory: 768Mi }
    limits:   { cpu: "1",  memory: 1536Mi }
  dbSchema: idem_registry
  config: {}
  extraEnv: {}

authz:
  enabled: true
  image: { repository: idem-authz, tag: "" }
  resources:
    requests: { cpu: 200m, memory: 512Mi }
    limits:   { cpu: "1",  memory: 1Gi }
  config: {}
  extraEnv: {}

# ── 관리 콘솔 (React + Nginx, /api/v1/admin → idem-hub 같은 출처) ──────────
consoleAdmin:
  enabled: true
  replicaCount: 1
  image: { repository: idem-console-admin, tag: "" }
  resources:
    requests: { cpu: 50m,  memory: 64Mi }
    limits:   { cpu: 200m, memory: 128Mi }

# ── KR 에디션 회원 포털 (global.edition=kr 일 때만) ────────────────────────
krPortal:
  enabled: false                # values-kr.yaml 이 true 로
  replicaCount: 1
  image: { repository: idem-kr-portal, tag: "" }
  resources:
    requests: { cpu: 50m,  memory: 64Mi }
    limits:   { cpu: 200m, memory: 128Mi }

# ── KR 벤더 플러그인 (kr 에디션 이미지에만 들어 있다) ─────────────────────
plugins:
  niceOacx: false
  anyid: false

# ── 선택: 아웃박스 릴레이 (Kafka 를 쓰는 배포에서만) ────────────────────────
relay:
  enabled: false
  replicaCount: 1
  image: { repository: idem-relay, tag: "" }
  resources:
    requests: { cpu: 200m, memory: 512Mi }
    limits:   { cpu: "1",  memory: 1Gi }
  config: {}
  extraEnv: {}

# ── Ingress ────────────────────────────────────────────────────────────────
ingress:
  enabled: false
  className: nginx
  annotations: {}
  # 호스트는 global.publicUrl 에서 뽑는다. TLS Secret 이름만 준다 (비면 TLS 블록 없음)
  tlsSecretName: ""
  # true 면 Keycloak 관리 콘솔도 keycloak.adminUrl 호스트로 노출 — 설치자만 접근하도록 IP 제한 등을 annotations 로
  exposeKeycloakAdmin: false

# ── NetworkPolicy (같은 네임스페이스 안 컴포넌트 간 통신만 허용) ─────────────
networkPolicy:
  enabled: false
  # Ingress 컨트롤러 네임스페이스 레이블 (gate·hub·console·portal 로 들어오는 트래픽 허용)
  ingressNamespaceSelector:
    kubernetes.io/metadata.name: ingress-nginx

# ── DB 스키마 초기화 Job (pre-install/pre-upgrade 훅, files/init-db.sql) ──────
dbInit:
  enabled: true
  image: { repository: postgres, tag: 16-alpine }
