{{- /* 컴포넌트별 비민감 설정 — 값은 values 의 <컴포넌트>.config 맵. 비밀은 Secret(secrets.existingSecret) 로만 */ -}}
{{- range $name, $c := dict "idem-gate" .Values.gate "idem-hub" .Values.hub "idem-registry" .Values.registry "idem-authz" .Values.authz "idem-relay" .Values.relay }}
{{- if $c.enabled }}
apiVersion: v1
kind: ConfigMap
metadata:
  name: {{ $name }}-config
  namespace: {{ $.Release.Namespace }}
  labels:
    {{- include "idem.labels" $ | nindent 4 }}
    {{- include "idem.selectorLabels" $name | nindent 4 }}
data:
  {{- range $k, $v := $c.config }}
  {{ $k }}: {{ $v | quote }}
  {{- end }}
---
{{- end }}
{{- end }}
{{- if and .Values.keycloak.enabled .Values.keycloak.realmImport }}
apiVersion: v1
kind: ConfigMap
metadata:
  name: idem-keycloak-realm
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "idem.labels" . | nindent 4 }}
    {{- include "idem.selectorLabels" "idem-keycloak" | nindent 4 }}
data:
  # infra/docker/keycloak/realm-export.json 과 같은 파일 (CI helm-lint 가 두 사본이 같은지 대조한다)
  realm-export.json: |-
{{ .Files.Get "files/realm-export.json" | indent 4 }}
{{- end }}
{{- if .Values.dbInit.enabled }}
---
apiVersion: v1
kind: ConfigMap
metadata:
  name: idem-db-init
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "idem.labels" . | nindent 4 }}
    {{- include "idem.selectorLabels" "idem-db-init" | nindent 4 }}
  annotations:
    helm.sh/hook: pre-install,pre-upgrade
    helm.sh/hook-weight: "-10"
    helm.sh/hook-delete-policy: before-hook-creation
data:
  init-db.sql: |-
{{ .Files.Get "files/init-db.sql" | indent 4 }}
{{- end }}
