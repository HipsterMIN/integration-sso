{{- if .Values.hub.enabled }}
apiVersion: apps/v1
kind: Deployment
metadata:
  name: idem-hub
  namespace: {{ .Values.global.namespace }}
  labels:
    {{- include "onepass.labels" . | nindent 4 }}
    app.kubernetes.io/component: idem-hub
  annotations:
    checksum/secret: {{ include (print $.Template.BasePath "/secrets.yaml") . | sha256sum }}
spec:
  replicas: {{ .Values.hub.replicaCount }}
  selector:
    matchLabels:
      app: idem-hub
  strategy:
    type: RollingUpdate
    rollingUpdate:
      maxUnavailable: 0
      maxSurge: 1
  template:
    metadata:
      labels:
        app: idem-hub
        {{- include "onepass.labels" . | nindent 8 }}
        app.kubernetes.io/component: idem-hub
    spec:
      {{- if .Values.global.imagePullSecrets }}
      imagePullSecrets:
        {{- toYaml .Values.global.imagePullSecrets | nindent 8 }}
      {{- end }}
      # Vault Kubernetes Auth(VAULT_AUTH_METHOD=kubernetes) 사용 시 필수.
      # 다른 인증 방식(token/approle)에서는 SA JWT를 읽지 않으므로 무해.
      {{- if .Values.hub.serviceAccount }}
      {{- if .Values.hub.serviceAccount.create }}
      serviceAccountName: {{ .Values.hub.serviceAccount.name | default "idem-hub" }}
      {{- end }}
      {{- end }}
      terminationGracePeriodSeconds: 30
      containers:
        - name: idem-hub
          image: {{ include "onepass.image" .Values.hub.image }}
          imagePullPolicy: {{ .Values.hub.image.pullPolicy }}
          ports:
            - name: http
              containerPort: 8083
              protocol: TCP
          envFrom:
            - configMapRef:
                name: idem-hub-config
            - configMapRef:
                name: idem-common-config
            - secretRef:
                name: {{ .Values.hub.secretRef.name }}
          {{- if .Values.hub.startupProbe }}
          startupProbe:
            {{- toYaml .Values.hub.startupProbe | nindent 12 }}
          {{- end }}
          livenessProbe:
            {{- toYaml .Values.hub.livenessProbe | nindent 12 }}
          readinessProbe:
            {{- toYaml .Values.hub.readinessProbe | nindent 12 }}
          resources:
            {{- toYaml .Values.hub.resources | nindent 12 }}
      affinity:
        podAntiAffinity:
          preferredDuringSchedulingIgnoredDuringExecution:
            - weight: 100
              podAffinityTerm:
                labelSelector:
                  matchLabels:
                    app: idem-hub
                topologyKey: kubernetes.io/hostname
{{- end }}
