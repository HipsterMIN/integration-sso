# ── Q-Sign Service ─────────────────────────────────────────────────
{{- if .Values.gate.enabled }}
apiVersion: v1
kind: Service
metadata:
  name: idem-gate
  namespace: {{ .Values.global.namespace }}
  labels:
    {{- include "onepass.labels" . | nindent 4 }}
    app.kubernetes.io/component: idem-gate
spec:
  type: {{ .Values.gate.service.type }}
  selector:
    app: idem-gate
  ports:
    - name: http
      port: {{ .Values.gate.service.port }}
      targetPort: http
      protocol: TCP
{{- end }}
---
# ── Q-IM Service ───────────────────────────────────────────────────
{{- if .Values.registry.enabled }}
apiVersion: v1
kind: Service
metadata:
  name: idem-registry
  namespace: {{ .Values.global.namespace }}
  labels:
    {{- include "onepass.labels" . | nindent 4 }}
    app.kubernetes.io/component: idem-registry
spec:
  type: {{ .Values.registry.service.type }}
  selector:
    app: idem-registry
  ports:
    - name: http
      port: {{ .Values.registry.service.port }}
      targetPort: http
      protocol: TCP
{{- end }}
---
# ── IdO Service ────────────────────────────────────────────────────
{{- if .Values.hub.enabled }}
apiVersion: v1
kind: Service
metadata:
  name: idem-hub
  namespace: {{ .Values.global.namespace }}
  labels:
    {{- include "onepass.labels" . | nindent 4 }}
    app.kubernetes.io/component: idem-hub
spec:
  type: {{ .Values.hub.service.type }}
  selector:
    app: idem-hub
  ports:
    - name: http
      port: {{ .Values.hub.service.port }}
      targetPort: http
      protocol: TCP
{{- end }}
---
# ── Outbox Relay Batch Service (Prometheus scrape용) ──────────────
{{- if .Values.relay.enabled }}
apiVersion: v1
kind: Service
metadata:
  name: idem-relay
  namespace: {{ .Values.global.namespace }}
  labels:
    {{- include "onepass.labels" . | nindent 4 }}
    app.kubernetes.io/component: batch
  annotations:
    # Prometheus annotation-based discovery
    prometheus.io/scrape: "true"
    prometheus.io/port: "8090"
    prometheus.io/path: "/actuator/prometheus"
spec:
  type: {{ .Values.relay.service.type }}
  selector:
    app: idem-relay
  ports:
    - name: http
      port: {{ .Values.relay.service.port }}
      targetPort: http
      protocol: TCP
{{- end }}
---
