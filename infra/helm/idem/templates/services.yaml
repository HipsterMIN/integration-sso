{{- /* 컴포넌트 Service — 이름은 compose 서비스 이름과 같다(앱 간 URL http://idem-hub:8083 등이 그대로 통한다) */ -}}
{{- $svcs := list }}
{{- if .Values.keycloak.enabled }}{{ $svcs = append $svcs (dict "name" "idem-keycloak" "port" 8080) }}{{ end }}
{{- if .Values.gate.enabled }}{{ $svcs = append $svcs (dict "name" "idem-gate" "port" 8081) }}{{ end }}
{{- if .Values.registry.enabled }}{{ $svcs = append $svcs (dict "name" "idem-registry" "port" 8082) }}{{ end }}
{{- if .Values.hub.enabled }}{{ $svcs = append $svcs (dict "name" "idem-hub" "port" 8083) }}{{ end }}
{{- if .Values.authz.enabled }}{{ $svcs = append $svcs (dict "name" "idem-authz" "port" 8086) }}{{ end }}
{{- if .Values.relay.enabled }}{{ $svcs = append $svcs (dict "name" "idem-relay" "port" 8090) }}{{ end }}
{{- if .Values.consoleAdmin.enabled }}{{ $svcs = append $svcs (dict "name" "idem-console-admin" "port" 80) }}{{ end }}
{{- if .Values.krPortal.enabled }}{{ $svcs = append $svcs (dict "name" "idem-kr-portal" "port" 80) }}{{ end }}
{{- range $svcs }}
apiVersion: v1
kind: Service
metadata:
  name: {{ .name }}
  namespace: {{ $.Release.Namespace }}
  labels:
    {{- include "idem.labels" $ | nindent 4 }}
    {{- include "idem.selectorLabels" .name | nindent 4 }}
spec:
  type: ClusterIP
  selector:
    app: {{ .name }}
  ports:
    - name: http
      port: {{ .port }}
      targetPort: http
---
{{- end }}
