{{- /*
NetworkPolicy — 기본 차단 + 필요한 경로만:
  · 같은 릴리스의 컴포넌트끼리(app.kubernetes.io/instance) 는 서로 통한다 (gate→hub, hub→registry/authz/keycloak, console→hub …)
  · Ingress 컨트롤러 네임스페이스에서 gate·hub·console·portal(·keycloak admin) 로 들어오는 트래픽 허용
  · egress 는 DNS + 클러스터 밖(PostgreSQL·Redis·기관 콜백·벤더 API) 을 막지 않는다 — 기관 웹훅·본인확인 벤더 호출이 나가야 한다
*/ -}}
{{- if .Values.networkPolicy.enabled }}
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: idem-default
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "idem.labels" . | nindent 4 }}
spec:
  podSelector:
    matchLabels:
      app.kubernetes.io/instance: {{ .Release.Name }}
  policyTypes: [Ingress]
  ingress:
    - from:
        - podSelector:
            matchLabels:
              app.kubernetes.io/instance: {{ .Release.Name }}
---
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: idem-from-ingress
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "idem.labels" . | nindent 4 }}
spec:
  podSelector:
    matchExpressions:
      - key: app
        operator: In
        values: [idem-gate, idem-hub, idem-console-admin, idem-kr-portal{{ if .Values.ingress.exposeKeycloakAdmin }}, idem-keycloak{{ end }}]
  policyTypes: [Ingress]
  ingress:
    - from:
        - namespaceSelector:
            matchLabels:
              {{- toYaml .Values.networkPolicy.ingressNamespaceSelector | nindent 14 }}
{{- end }}
