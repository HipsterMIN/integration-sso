{{- if .Values.networkPolicy.enabled }}
# ============================================================
# NetworkPolicy — 서비스 간 허용 트래픽 정책
#
# 설계 원칙:
#   - 기본 deny-all (포함되지 않은 트래픽 차단)
#   - 필요한 방향만 명시적 허용
#   - KMS/Vault egress가 내부 통신(Q-IM, Q-Sign, DB, Redis, Kafka)을 막지 않도록 주의
#
# 통신 흐름:
#   ingress → idem-hub (8083)
#   idem-hub → idem-gate (8081), idem-hub → idem-registry (8082)
#   idem-gate → postgres, idem-gate → redis, idem-gate → kafka
#   idem-registry → mariadb, idem-registry → redis, idem-registry → kafka
#   idem-hub → postgres, idem-hub → redis, idem-hub → kafka
# ============================================================

# ── Q-Sign NetworkPolicy ──────────────────────────────────────────
{{- if .Values.gate.enabled }}
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: netpol-idem-gate
  namespace: {{ .Values.global.namespace }}
  labels:
    {{- include "onepass.labels" . | nindent 4 }}
spec:
  podSelector:
    matchLabels:
      app: idem-gate
  policyTypes:
    - Ingress
    - Egress
  ingress:
    # IdO → Q-Sign (내부 API 호출)
    - from:
        - podSelector:
            matchLabels:
              app: idem-hub
      ports:
        - port: 8081
    # Prometheus scrape
    - from:
        - podSelector:
            matchLabels:
              app: idem-prometheus
      ports:
        - port: 8081
  egress:
    # PostgreSQL
    - to: []
      ports:
        - port: 5432
    # Redis
    - to: []
      ports:
        - port: 6379
    # Kafka
    - to: []
      ports:
        - port: 9092
        - port: 29092
    # Keycloak (OIDC)
    - to: []
      ports:
        - port: 8080
        - port: 443
    # DNS
    - to: []
      ports:
        - port: 53
          protocol: UDP
{{- end }}
---
# ── Q-IM NetworkPolicy ────────────────────────────────────────────
{{- if .Values.registry.enabled }}
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: netpol-idem-registry
  namespace: {{ .Values.global.namespace }}
  labels:
    {{- include "onepass.labels" . | nindent 4 }}
spec:
  podSelector:
    matchLabels:
      app: idem-registry
  policyTypes:
    - Ingress
    - Egress
  ingress:
    # IdO → Q-IM (내부 API 호출)
    - from:
        - podSelector:
            matchLabels:
              app: idem-hub
      ports:
        - port: 8082
    # Prometheus scrape
    - from:
        - podSelector:
            matchLabels:
              app: idem-prometheus
      ports:
        - port: 8082
  egress:
    # MariaDB
    - to: []
      ports:
        - port: 3306
    # Redis
    - to: []
      ports:
        - port: 6379
    # Kafka
    - to: []
      ports:
        - port: 9092
        - port: 29092
    # DNS
    - to: []
      ports:
        - port: 53
          protocol: UDP
{{- end }}
---
# ── IdO NetworkPolicy ─────────────────────────────────────────────
{{- if .Values.hub.enabled }}
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: netpol-idem-hub
  namespace: {{ .Values.global.namespace }}
  labels:
    {{- include "onepass.labels" . | nindent 4 }}
spec:
  podSelector:
    matchLabels:
      app: idem-hub
  policyTypes:
    - Ingress
    - Egress
  ingress:
    # Ingress Controller → IdO
    - from:
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: ingress-nginx
      ports:
        - port: 8083
    # Agency-Stub → IdO (PoC 내부 테스트)
    - from:
        - podSelector:
            matchLabels:
              app: idem-tenant-sample
      ports:
        - port: 8083
    # Prometheus scrape
    - from:
        - podSelector:
            matchLabels:
              app: idem-prometheus
      ports:
        - port: 8083
  egress:
    # Q-Sign
    - to:
        - podSelector:
            matchLabels:
              app: idem-gate
      ports:
        - port: 8081
    # Q-IM
    - to:
        - podSelector:
            matchLabels:
              app: idem-registry
      ports:
        - port: 8082
    # PostgreSQL
    - to: []
      ports:
        - port: 5432
    # Redis
    - to: []
      ports:
        - port: 6379
    # Kafka
    - to: []
      ports:
        - port: 9092
        - port: 29092
    # Keycloak (mode=keycloak 전환 시)
    - to: []
      ports:
        - port: 8080
        - port: 443
    # 기관 외부 Webhook (HTTPS)
    - to: []
      ports:
        - port: 443
    # HashiCorp Vault (Transit Engine — KMS)
    #  - 자체 호스팅 Vault: 동일 클러스터 내 vault 네임스페이스
    #  - HCP Vault Dedicated/외부 Vault: 외부 라우팅 필요 (port 8200 또는 443)
    - to: []
      ports:
        - port: 8200
    # DNS
    - to: []
      ports:
        - port: 53
          protocol: UDP
{{- end }}
---
# ── Outbox Relay Batch NetworkPolicy ──────────────────────────────
# Egress 정책:
#  - PostgreSQL(idem-hub, idem-gate), MariaDB(idem-registry), Redis(ShedLock), Kafka
#  - 외부 기관 Webhook/Provisioning (HTTPS 443)
#  - Slack/PagerDuty 알림 (HTTPS 443) — 위 외부 443과 동일 룰로 포함
{{- if .Values.relay.enabled }}
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: netpol-batch
  namespace: {{ .Values.global.namespace }}
  labels:
    {{- include "onepass.labels" . | nindent 4 }}
spec:
  podSelector:
    matchLabels:
      app: idem-relay
  policyTypes:
    - Ingress
    - Egress
  ingress:
    # Prometheus scrape만 허용 — 배치는 외부 호출 대상이 아님
    - from:
        - podSelector:
            matchLabels:
              app: idem-prometheus
      ports:
        - port: 8090
  egress:
    # PostgreSQL (idem-hub, idem-gate 공용)
    - to: []
      ports:
        - port: 5432
    # MariaDB (idem-registry)
    - to: []
      ports:
        - port: 3306
    # Redis (ShedLock Primary)
    - to: []
      ports:
        - port: 6379
    # Kafka (모든 outbox → 토픽 릴레이)
    - to: []
      ports:
        - port: 9092
        - port: 29092
    # 외부 기관 Webhook / Provisioning HTTPS + Slack/PagerDuty
    - to: []
      ports:
        - port: 443
    # DNS
    - to: []
      ports:
        - port: 53
          protocol: UDP
{{- end }}
{{- end }}
