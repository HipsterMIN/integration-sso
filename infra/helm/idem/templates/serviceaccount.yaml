# ============================================================
# ServiceAccount — Q-Sign / Q-IM / IdO / Outbox Relay Batch
#
# 목적:
#   1. Vault Kubernetes Auth — VAULT_AUTH_METHOD=kubernetes 일 때
#      Pod 안의 /var/run/secrets/kubernetes.io/serviceaccount/token (SA JWT)을
#      Vault Server가 K8s API로 검증 후 client_token 발급.
#      (현재는 ido만 KMS 사용 — 추후 idem-gate/idem-registry/batch도 KMS 필요 시 동일 패턴)
#
#   2. 향후 RBAC 확장 시 SA 단위 정책 부여 (Leader Election, ConfigMap Watch 등)
#
#   3. 명시적 SA 사용은 보안 모범 사례 — default SA 사용 회피
#
# Vault role 등록 예시 (운영):
#   vault write auth/kubernetes/role/idem-hub \
#     bound_service_account_names=idem-hub \
#     bound_service_account_namespaces=onepass \
#     policies=idem-hub-kms-policy ttl=1h
# ============================================================

# ── Q-Sign ServiceAccount ─────────────────────────────────────
{{- if and .Values.gate.enabled .Values.gate.serviceAccount .Values.gate.serviceAccount.create }}
apiVersion: v1
kind: ServiceAccount
metadata:
  name: {{ .Values.gate.serviceAccount.name | default "idem-gate" }}
  namespace: {{ .Values.global.namespace }}
  labels:
    {{- include "onepass.labels" . | nindent 4 }}
    app.kubernetes.io/component: idem-gate
  {{- with .Values.gate.serviceAccount.annotations }}
  annotations:
    {{- toYaml . | nindent 4 }}
  {{- end }}
{{- end }}
---
# ── Q-IM ServiceAccount ───────────────────────────────────────
{{- if and .Values.registry.enabled .Values.registry.serviceAccount .Values.registry.serviceAccount.create }}
apiVersion: v1
kind: ServiceAccount
metadata:
  name: {{ .Values.registry.serviceAccount.name | default "idem-registry" }}
  namespace: {{ .Values.global.namespace }}
  labels:
    {{- include "onepass.labels" . | nindent 4 }}
    app.kubernetes.io/component: idem-registry
  {{- with .Values.registry.serviceAccount.annotations }}
  annotations:
    {{- toYaml . | nindent 4 }}
  {{- end }}
{{- end }}
---
# ── IdO ServiceAccount (Vault Kubernetes Auth 필수) ───────────
{{- if and .Values.hub.enabled .Values.hub.serviceAccount .Values.hub.serviceAccount.create }}
apiVersion: v1
kind: ServiceAccount
metadata:
  name: {{ .Values.hub.serviceAccount.name | default "idem-hub" }}
  namespace: {{ .Values.global.namespace }}
  labels:
    {{- include "onepass.labels" . | nindent 4 }}
    app.kubernetes.io/component: idem-hub
  {{- with .Values.hub.serviceAccount.annotations }}
  annotations:
    {{- toYaml . | nindent 4 }}
  {{- end }}
# automountServiceAccountToken: true (기본값)
# Vault K8s Auth가 SA 토큰 파일을 읽으므로 토큰 자동 마운트 필수.
{{- end }}
---
# ── Outbox Relay Batch ServiceAccount ─────────────────────────
{{- if and .Values.relay.enabled .Values.relay.serviceAccount .Values.relay.serviceAccount.create }}
apiVersion: v1
kind: ServiceAccount
metadata:
  name: {{ .Values.relay.serviceAccount.name | default "idem-relay" }}
  namespace: {{ .Values.global.namespace }}
  labels:
    {{- include "onepass.labels" . | nindent 4 }}
    app.kubernetes.io/component: batch
  {{- with .Values.relay.serviceAccount.annotations }}
  annotations:
    {{- toYaml . | nindent 4 }}
  {{- end }}
{{- end }}
