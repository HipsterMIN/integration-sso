{{- /* hub ServiceAccount — Vault Kubernetes Auth(IDEM_HUB_KMS_PROVIDER=vault, VAULT_AUTH_METHOD=kubernetes) 때 SA JWT 로 인증한다. 다른 방식에서는 무해. */ -}}
{{- if and .Values.hub.enabled .Values.hub.serviceAccount.create }}
apiVersion: v1
kind: ServiceAccount
metadata:
  name: idem-hub
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "idem.labels" . | nindent 4 }}
    {{- include "idem.selectorLabels" "idem-hub" | nindent 4 }}
  {{- with .Values.hub.serviceAccount.annotations }}
  annotations:
    {{- toYaml . | nindent 4 }}
  {{- end }}
automountServiceAccountToken: true
{{- end }}
