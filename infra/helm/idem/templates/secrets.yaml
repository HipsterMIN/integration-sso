# ============================================================
# Secret 템플릿
#
# [보안 정책]
#   - 이 파일은 Secret 구조(키 이름)만 정의한다.
#   - 실제 값은 helm install 시 --set 또는 외부 Secret 관리 도구로 주입한다.
#   - 운영 배포 시 이 파일을 직접 사용하지 말고
#     외부 Secret 스토어(Vault, AWS Secrets Manager 등)에서 주입한다.
#
# [주입 방법 1] helm --set 사용 (CI/CD 파이프라인에서 시크릿 환경변수로):
#   helm upgrade --install onepass ./infra/helm/idem \
#     --set qsignSecret.keycloakClientSecret="${QSIGN_KEYCLOAK_CLIENT_SECRET}" \
#     ...
#
# [주입 방법 2] kubectl create secret (사전 생성):
#   kubectl create secret generic idem-gate-secret \
#     --from-literal=QSIGN_KEYCLOAK_CLIENT_SECRET=<value> \
#     --from-literal=IDO_INTERNAL_SIG_SECRET=<value> \
#     -n onepass
#   → 이후 secretRef.name 참조로 Pod에 주입
# ============================================================

# ── Q-Sign Secret ─────────────────────────────────────────────────
apiVersion: v1
kind: Secret
metadata:
  name: {{ .Values.qsign.secretRef.name }}
  namespace: {{ .Values.global.namespace }}
  labels:
    {{- include "onepass.labels" . | nindent 4 }}
    app.kubernetes.io/component: q-sign
  annotations:
    # 이 Secret을 변경하면 반드시 q-sign Pod를 rollout restart해야 함
    onepass/managed-by: helm
type: Opaque
stringData:
  # PostgreSQL — infra.postgres.existingSecret 에서 분리 (앱별 설정)
  DB_HOST: {{ .Values.infra.postgres.host | quote }}
  DB_USERNAME: ""    # 운영: --set 또는 외부 Secret으로 주입
  DB_PASSWORD: ""    # 운영: --set 또는 외부 Secret으로 주입
  # Keycloak
  KEYCLOAK_URL: ""                  # 예: https://keycloak.example.com
  QSIGN_KEYCLOAK_CLIENT_SECRET: ""  # 운영: Keycloak Admin에서 재생성
  # IdO 내부 서명 (q-sign ↔ ido 동일 값)
  IDO_BASE_URL: ""
  IDO_INTERNAL_SIG_SECRET: ""       # 운영: openssl rand -hex 32
  # Redis
  REDIS_HOST: {{ .Values.infra.redis.host | quote }}
  REDIS_PASSWORD: ""
  # Kafka
  KAFKA_SERVERS: {{ .Values.infra.kafka.bootstrapServers | quote }}
---
# ── Q-IM Secret ───────────────────────────────────────────────────
apiVersion: v1
kind: Secret
metadata:
  name: {{ .Values.qim.secretRef.name }}
  namespace: {{ .Values.global.namespace }}
  labels:
    {{- include "onepass.labels" . | nindent 4 }}
    app.kubernetes.io/component: q-im
  annotations:
    onepass/managed-by: helm
type: Opaque
stringData:
  # MariaDB
  QIM_DB_HOST: {{ .Values.infra.mariadb.host | quote }}
  QIM_DB_USERNAME: ""
  QIM_DB_PASSWORD: ""
  # Q-IM 내부 API 키 (IdO → Q-IM X-Internal-Api-Key)
  QIM_INTERNAL_API_KEY: ""          # 운영: openssl rand -hex 32 (ido와 동일 값)
  # CI/DI 암호화 키
  QIM_CI_AES_KEY_V1: ""             # 운영: KMS에서 주입
  QIM_CI_AES_KEY_V2: ""
  QIM_DI_SECRET: ""                 # 운영: openssl rand -hex 32
  # Redis
  REDIS_HOST: {{ .Values.infra.redis.host | quote }}
  REDIS_PASSWORD: ""
  # Kafka
  KAFKA_SERVERS: {{ .Values.infra.kafka.bootstrapServers | quote }}
---
# ── IdO Secret ────────────────────────────────────────────────────
apiVersion: v1
kind: Secret
metadata:
  name: {{ .Values.ido.secretRef.name }}
  namespace: {{ .Values.global.namespace }}
  labels:
    {{- include "onepass.labels" . | nindent 4 }}
    app.kubernetes.io/component: ido
  annotations:
    onepass/managed-by: helm
type: Opaque
stringData:
  # PostgreSQL
  DB_HOST: {{ .Values.infra.postgres.host | quote }}
  DB_USERNAME: ""
  DB_PASSWORD: ""
  # Q-IM 내부 API 키 (IdO → Q-IM, QIM_INTERNAL_API_KEY와 동일 값)
  IDO_QIM_INTERNAL_API_KEY: ""      # 운영: q-im의 QIM_INTERNAL_API_KEY와 반드시 동일
  # Q-IM SP 수신 API 검증용 PBKDF2 해시
  QIM_INBOUND_API_KEY_HASH: ""      # 운영: generate-api-key-hash.sh로 생성
  # Q-IM AES 공유키 (Q-IM 팀과 협의)
  QIM_AES_SHARED_KEY: ""
  # Q-Sign 내부 서명 (q-sign의 IDO_INTERNAL_SIG_SECRET과 동일 값)
  IDO_INTERNAL_SIG_SECRET: ""
  # Keycloak (mode=keycloak 전환 시)
  KEYCLOAK_BASE_URL: ""
  KEYCLOAK_CLIENT_SECRET: ""        # 운영: Keycloak Admin에서 재생성
  # Q-IM, Q-Sign URL
  QIM_BASE_URL: ""
  QSIGN_BASE_URL: ""
  # Handoff 암호화 키 (운영: KMS에서 주입, 90일 rotation)
  IDO_HANDOFF_AES_KEY: ""
  IDO_HANDOFF_HMAC_KEY: ""
  # ── Vault 인증 자격 (auth-method에 따라 사용 키만 채움) ──────────
  # token      : VAULT_TOKEN 만 사용 (개발)
  # approle    : VAULT_ROLE_ID + VAULT_SECRET_ID 만 사용 (CI/CD, 스테이징)
  # kubernetes : 모두 비워둠 (Pod SA JWT 자동 사용 — 운영 권장)
  # ⚠️ 운영: 절대 직접 기입 금지 → --set 또는 외부 Secret Manager(Vault Operator 등)로 주입
  VAULT_TOKEN: ""
  VAULT_ROLE_ID: ""
  VAULT_SECRET_ID: ""
  # Webhook 서명 비밀키
  IDO_WEBHOOK_SIGNING_SECRET: ""
  # Redis
  REDIS_HOST: {{ .Values.infra.redis.host | quote }}
  REDIS_PASSWORD: ""
  # Kafka
  KAFKA_SERVERS: {{ .Values.infra.kafka.bootstrapServers | quote }}
  # CORS
  CORS_ORIGIN_DEV: "http://localhost:3000"
  CORS_ORIGIN_PROD: "http://localhost:3001"
---
# ── Outbox Relay Batch Secret ─────────────────────────────────────
{{- if .Values.batch.enabled }}
apiVersion: v1
kind: Secret
metadata:
  name: {{ .Values.batch.secretRef.name }}
  namespace: {{ .Values.global.namespace }}
  labels:
    {{- include "onepass.labels" . | nindent 4 }}
    app.kubernetes.io/component: batch
  annotations:
    onepass/managed-by: helm
type: Opaque
stringData:
  # ── ido PostgreSQL ────────────────────────────────────────────────
  IDO_DB_HOST: {{ .Values.infra.postgres.host | quote }}
  IDO_DB_USERNAME: ""     # 운영: --set 또는 외부 Secret Manager 주입
  IDO_DB_PASSWORD: ""     # 운영: --set 또는 외부 Secret Manager 주입
  # ── q-im MariaDB ──────────────────────────────────────────────────
  QIM_DB_HOST: {{ .Values.infra.mariadb.host | quote }}
  QIM_DB_USERNAME: ""
  QIM_DB_PASSWORD: ""
  # ── q-sign PostgreSQL ─────────────────────────────────────────────
  QSIGN_DB_HOST: {{ .Values.infra.postgres.host | quote }}
  QSIGN_DB_USERNAME: ""
  QSIGN_DB_PASSWORD: ""
  # ── Redis (ShedLock Primary Provider) ─────────────────────────────
  REDIS_HOST: {{ .Values.infra.redis.host | quote }}
  REDIS_PASSWORD: ""
  # ── Kafka ─────────────────────────────────────────────────────────
  KAFKA_SERVERS: {{ .Values.infra.kafka.bootstrapServers | quote }}
  # ── Webhook 서명 비밀키 (ido와 동일 값 — IdO에서 발행한 서명을 검증할 때 사용) ──
  IDO_WEBHOOK_SIGNING_SECRET: ""
  # ── mTLS 클라이언트 인증서 (선택 — MTLS 인증 기관 통신 시) ─────────
  # 등록: kubectl create secret generic batch-mtls-cert ... 후 별도 envFrom 사용 권장
  BATCH_MTLS_KEYSTORE_BASE64: ""
  BATCH_MTLS_KEYSTORE_PASS: ""
  BATCH_MTLS_KEYSTORE_TYPE: "PKCS12"
  # ── DEAD_LETTER 알림 채널 (Slack/PagerDuty) ─────────────────────
  # 운영: --set 또는 외부 Secret Manager 주입
  BATCH_ALERT_SLACK_WEBHOOK_URL: ""
  BATCH_ALERT_PAGERDUTY_ROUTING_KEY: ""
{{- end }}
---
# ── Agency-Stub Secret (PoC 전용) ─────────────────────────────────
{{- if .Values.agencyStub.enabled }}
apiVersion: v1
kind: Secret
metadata:
  name: {{ .Values.agencyStub.secretRef.name }}
  namespace: {{ .Values.global.namespace }}
  labels:
    {{- include "onepass.labels" . | nindent 4 }}
    app.kubernetes.io/component: agency-stub
  annotations:
    onepass/managed-by: helm
type: Opaque
stringData:
  DB_HOST: {{ .Values.infra.postgres.host | quote }}
  DB_USERNAME: ""
  DB_PASSWORD: ""
  REDIS_HOST: {{ .Values.infra.redis.host | quote }}
  REDIS_PASSWORD: ""
  KAFKA_SERVERS: {{ .Values.infra.kafka.bootstrapServers | quote }}
  IDO_BASE_URL: ""
  AGENCY_API_KEY: ""
  IDO_WEBHOOK_SIGNING_SECRET: ""
{{- end }}
---
# ── Q-AuthZ Secret (연합 인가) ─────────────────────────────────────
{{- if .Values.authz.enabled }}
apiVersion: v1
kind: Secret
metadata:
  name: {{ .Values.authz.secretRef.name }}
  namespace: {{ .Values.global.namespace }}
  labels:
    {{- include "onepass.labels" . | nindent 4 }}
    app.kubernetes.io/component: q-authz
  annotations:
    onepass/managed-by: helm
type: Opaque
stringData:
  # PostgreSQL (authz 스키마)
  AUTHZ_DB_HOST: {{ .Values.infra.postgres.host | quote }}
  AUTHZ_DB_USERNAME: ""              # 운영: --set 또는 외부 Secret 주입
  AUTHZ_DB_PASSWORD: ""              # 운영: --set 또는 외부 Secret 주입
  # 내부 API 키 (ido → q-authz, 미설정 시 /api/v1/internal/**·/scim/v2/** 401)
  AUTHZ_INTERNAL_API_KEY: ""         # 운영: openssl rand -hex 32 (ido의 IDO_QAUTHZ_INTERNAL_API_KEY와 동일)
{{- end }}
