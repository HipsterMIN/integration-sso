# ============================================================
# Secret 템플릿
#
# [보안 정책]
#   - 이 파일은 Secret 구조(키 이름)만 정의한다.
#   - 실제 값은 helm install 시 --set 또는 외부 Secret 관리 도구로 주입한다.
#   - 운영 배포 시 이 파일을 직접 사용하지 말고
#     외부 Secret 스토어(Vault, AWS Secrets Manager 등)에서 주입한다.
#
# [주입 방법 1] helm --set 사용 (CI/CD 파이프라인에서 시크릿 환경변수로):
#   helm upgrade --install onepass ./infra/helm/idem \
#     --set qsignSecret.keycloakClientSecret="${IDEM_GATE_KEYCLOAK_CLIENT_SECRET}" \
#     ...
#
# [주입 방법 2] kubectl create secret (사전 생성):
#   kubectl create secret generic idem-gate-secret \
#     --from-literal=IDEM_GATE_KEYCLOAK_CLIENT_SECRET=<value> \
#     --from-literal=IDEM_HUB_INTERNAL_SIG_SECRET=<value> \
#     -n onepass
#   → 이후 secretRef.name 참조로 Pod에 주입
# ============================================================

# ── Q-Sign Secret ─────────────────────────────────────────────────
apiVersion: v1
kind: Secret
metadata:
  name: {{ .Values.gate.secretRef.name }}
  namespace: {{ .Values.global.namespace }}
  labels:
    {{- include "onepass.labels" . | nindent 4 }}
    app.kubernetes.io/component: idem-gate
  annotations:
    # 이 Secret을 변경하면 반드시 idem-gate Pod를 rollout restart해야 함
    onepass/managed-by: helm
type: Opaque
stringData:
  # PostgreSQL — infra.postgres.existingSecret 에서 분리 (앱별 설정)
  DB_HOST: {{ .Values.infra.postgres.host | quote }}
  DB_USERNAME: ""    # 운영: --set 또는 외부 Secret으로 주입
  DB_PASSWORD: ""    # 운영: --set 또는 외부 Secret으로 주입
  # Keycloak
  KEYCLOAK_URL: ""                  # 예: https://keycloak.example.com
  IDEM_GATE_KEYCLOAK_CLIENT_SECRET: ""  # 운영: Keycloak Admin에서 재생성
  # IdO 내부 서명 (idem-gate ↔ idem-hub 동일 값)
  IDEM_HUB_BASE_URL: ""
  IDEM_HUB_INTERNAL_SIG_SECRET: ""       # 운영: openssl rand -hex 32 (D2: 비면 hub 기동 거부)
  # D2 fail-secure 필수 — 비면 hub 가 기동을 거부한다 (임시 키 자동 생성 없음)
  IDEM_HUB_CAST_PRIVATE_KEY: ""          # openssl genpkey -algorithm ed25519 | PKCS8 DER Base64 (docs/install.md §2)
  IDEM_HUB_CAST_PUBLIC_KEY: ""           # X.509 DER Base64
  IDEM_HUB_AUTHZ_INTERNAL_API_KEY: ""   # authz 의 IDEM_AUTHZ_INTERNAL_API_KEY 와 동일 (IDEM_HUB_AUTHZ_ENABLED=true 일 때 필수)
  # Redis
  REDIS_HOST: {{ .Values.infra.redis.host | quote }}
  REDIS_PASSWORD: ""
  # Kafka
  KAFKA_SERVERS: {{ .Values.infra.kafka.bootstrapServers | quote }}
---
# ── Q-IM Secret ───────────────────────────────────────────────────
apiVersion: v1
kind: Secret
metadata:
  name: {{ .Values.registry.secretRef.name }}
  namespace: {{ .Values.global.namespace }}
  labels:
    {{- include "onepass.labels" . | nindent 4 }}
    app.kubernetes.io/component: idem-registry
  annotations:
    onepass/managed-by: helm
type: Opaque
stringData:
  # MariaDB
  IDEM_REGISTRY_DB_HOST: {{ .Values.infra.mariadb.host | quote }}
  IDEM_REGISTRY_DB_USERNAME: ""
  IDEM_REGISTRY_DB_PASSWORD: ""
  # Q-IM 내부 API 키 (IdO → Q-IM X-Internal-Api-Key)
  IDEM_REGISTRY_INTERNAL_API_KEY: ""          # 운영: openssl rand -hex 32 (ido와 동일 값)
  # CI/DI 암호화 키
  IDEM_REGISTRY_CI_AES_KEY_V1: ""             # 운영: KMS에서 주입
  IDEM_REGISTRY_CI_AES_KEY_V2: ""
  IDEM_REGISTRY_DI_SECRET: ""                 # 운영: openssl rand -hex 32
  # Redis
  REDIS_HOST: {{ .Values.infra.redis.host | quote }}
  REDIS_PASSWORD: ""
  # Kafka
  KAFKA_SERVERS: {{ .Values.infra.kafka.bootstrapServers | quote }}
---
# ── IdO Secret ────────────────────────────────────────────────────
apiVersion: v1
kind: Secret
metadata:
  name: {{ .Values.hub.secretRef.name }}
  namespace: {{ .Values.global.namespace }}
  labels:
    {{- include "onepass.labels" . | nindent 4 }}
    app.kubernetes.io/component: idem-hub
  annotations:
    onepass/managed-by: helm
type: Opaque
stringData:
  # PostgreSQL
  DB_HOST: {{ .Values.infra.postgres.host | quote }}
  DB_USERNAME: ""
  DB_PASSWORD: ""
  # Q-IM 내부 API 키 (IdO → Q-IM, IDEM_REGISTRY_INTERNAL_API_KEY와 동일 값)
  IDEM_HUB_REGISTRY_INTERNAL_API_KEY: ""      # 운영: q-im의 IDEM_REGISTRY_INTERNAL_API_KEY와 반드시 동일
  # Q-IM SP 수신 API 검증용 PBKDF2 해시
  IDEM_REGISTRY_INBOUND_API_KEY_HASH: ""      # 운영: generate-api-key-hash.sh로 생성
  # Q-IM AES 공유키 (Q-IM 팀과 협의)
  IDEM_REGISTRY_AES_SHARED_KEY: ""
  # Q-Sign 내부 서명 (q-sign의 IDEM_HUB_INTERNAL_SIG_SECRET과 동일 값)
  IDEM_HUB_INTERNAL_SIG_SECRET: ""
  # Keycloak (mode=keycloak 전환 시)
  KEYCLOAK_BASE_URL: ""
  KEYCLOAK_CLIENT_SECRET: ""        # 운영: Keycloak Admin에서 재생성
  # Q-IM, Q-Sign URL
  IDEM_REGISTRY_BASE_URL: ""
  IDEM_GATE_BASE_URL: ""
  # Handoff 암호화 키 (운영: KMS에서 주입, 90일 rotation)
  IDEM_HUB_HANDOFF_AES_KEY: ""
  IDEM_HUB_HANDOFF_HMAC_KEY: ""
  # ── Vault 인증 자격 (auth-method에 따라 사용 키만 채움) ──────────
  # token      : VAULT_TOKEN 만 사용 (개발)
  # approle    : VAULT_ROLE_ID + VAULT_SECRET_ID 만 사용 (CI/CD, 스테이징)
  # kubernetes : 모두 비워둠 (Pod SA JWT 자동 사용 — 운영 권장)
  # ⚠️ 운영: 절대 직접 기입 금지 → --set 또는 외부 Secret Manager(Vault Operator 등)로 주입
  VAULT_TOKEN: ""
  VAULT_ROLE_ID: ""
  VAULT_SECRET_ID: ""
  # Webhook 서명 비밀키
  IDEM_HUB_WEBHOOK_SIGNING_SECRET: ""
  # Redis
  REDIS_HOST: {{ .Values.infra.redis.host | quote }}
  REDIS_PASSWORD: ""
  # Kafka
  KAFKA_SERVERS: {{ .Values.infra.kafka.bootstrapServers | quote }}
  # CORS
  CORS_ORIGIN_DEV: "http://localhost:3000"
  CORS_ORIGIN_PROD: "http://localhost:3001"
---
# ── Outbox Relay Batch Secret ─────────────────────────────────────
{{- if .Values.relay.enabled }}
apiVersion: v1
kind: Secret
metadata:
  name: {{ .Values.relay.secretRef.name }}
  namespace: {{ .Values.global.namespace }}
  labels:
    {{- include "onepass.labels" . | nindent 4 }}
    app.kubernetes.io/component: batch
  annotations:
    onepass/managed-by: helm
type: Opaque
stringData:
  # ── idem-hub PostgreSQL ────────────────────────────────────────────────
  IDEM_HUB_DB_HOST: {{ .Values.infra.postgres.host | quote }}
  IDEM_HUB_DB_USERNAME: ""     # 운영: --set 또는 외부 Secret Manager 주입
  IDEM_HUB_DB_PASSWORD: ""     # 운영: --set 또는 외부 Secret Manager 주입
  # ── idem-registry MariaDB ──────────────────────────────────────────────────
  IDEM_REGISTRY_DB_HOST: {{ .Values.infra.mariadb.host | quote }}
  IDEM_REGISTRY_DB_USERNAME: ""
  IDEM_REGISTRY_DB_PASSWORD: ""
  # ── idem-gate PostgreSQL ─────────────────────────────────────────────
  IDEM_GATE_DB_HOST: {{ .Values.infra.postgres.host | quote }}
  IDEM_GATE_DB_USERNAME: ""
  IDEM_GATE_DB_PASSWORD: ""
  # ── Redis (ShedLock Primary Provider) ─────────────────────────────
  REDIS_HOST: {{ .Values.infra.redis.host | quote }}
  REDIS_PASSWORD: ""
  # ── Kafka ─────────────────────────────────────────────────────────
  KAFKA_SERVERS: {{ .Values.infra.kafka.bootstrapServers | quote }}
  # ── Webhook 서명 비밀키 (ido와 동일 값 — IdO에서 발행한 서명을 검증할 때 사용) ──
  IDEM_HUB_WEBHOOK_SIGNING_SECRET: ""
  # ── mTLS 클라이언트 인증서 (선택 — MTLS 인증 기관 통신 시) ─────────
  # 등록: kubectl create secret generic batch-mtls-cert ... 후 별도 envFrom 사용 권장
  IDEM_RELAY_MTLS_KEYSTORE_BASE64: ""
  IDEM_RELAY_MTLS_KEYSTORE_PASS: ""
  IDEM_RELAY_MTLS_KEYSTORE_TYPE: "PKCS12"
  # ── DEAD_LETTER 알림 채널 (Slack/PagerDuty) ─────────────────────
  # 운영: --set 또는 외부 Secret Manager 주입
  IDEM_RELAY_ALERT_SLACK_WEBHOOK_URL: ""
  IDEM_RELAY_ALERT_PAGERDUTY_ROUTING_KEY: ""
{{- end }}
---
# ── Agency-Stub Secret (PoC 전용) ─────────────────────────────────
{{- if .Values.sample.enabled }}
apiVersion: v1
kind: Secret
metadata:
  name: {{ .Values.sample.secretRef.name }}
  namespace: {{ .Values.global.namespace }}
  labels:
    {{- include "onepass.labels" . | nindent 4 }}
    app.kubernetes.io/component: agency-stub
  annotations:
    onepass/managed-by: helm
type: Opaque
stringData:
  DB_HOST: {{ .Values.infra.postgres.host | quote }}
  DB_USERNAME: ""
  DB_PASSWORD: ""
  REDIS_HOST: {{ .Values.infra.redis.host | quote }}
  REDIS_PASSWORD: ""
  KAFKA_SERVERS: {{ .Values.infra.kafka.bootstrapServers | quote }}
  IDEM_HUB_BASE_URL: ""
  AGENCY_API_KEY: ""
  IDEM_HUB_WEBHOOK_SIGNING_SECRET: ""
{{- end }}
---
# ── Q-AuthZ Secret (연합 인가) ─────────────────────────────────────
{{- if .Values.authz.enabled }}
apiVersion: v1
kind: Secret
metadata:
  name: {{ .Values.authz.secretRef.name }}
  namespace: {{ .Values.global.namespace }}
  labels:
    {{- include "onepass.labels" . | nindent 4 }}
    app.kubernetes.io/component: idem-authz
  annotations:
    onepass/managed-by: helm
type: Opaque
stringData:
  # PostgreSQL (authz 스키마)
  IDEM_AUTHZ_DB_HOST: {{ .Values.infra.postgres.host | quote }}
  IDEM_AUTHZ_DB_USERNAME: ""              # 운영: --set 또는 외부 Secret 주입
  IDEM_AUTHZ_DB_PASSWORD: ""              # 운영: --set 또는 외부 Secret 주입
  # 내부 API 키 (idem-hub → idem-authz, 미설정 시 /api/v1/internal/**·/scim/v2/** 401)
  IDEM_AUTHZ_INTERNAL_API_KEY: ""         # 운영: openssl rand -hex 32 (ido의 IDEM_HUB_AUTHZ_INTERNAL_API_KEY와 동일)
{{- end }}
