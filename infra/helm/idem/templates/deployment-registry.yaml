{{- if .Values.registry.enabled }}
{{- $c := .Values.registry }}
apiVersion: apps/v1
kind: Deployment
metadata:
  name: idem-registry
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "idem.labels" . | nindent 4 }}
    {{- include "idem.selectorLabels" "idem-registry" | nindent 4 }}
spec:
  replicas: {{ include "idem.replicas" (dict "root" . "c" $c) }}
  selector:
    matchLabels:
      app: idem-registry
  strategy:
    type: RollingUpdate
    rollingUpdate: { maxUnavailable: 0, maxSurge: 1 }
  template:
    metadata:
      labels:
        {{- include "idem.labels" . | nindent 8 }}
        {{- include "idem.selectorLabels" "idem-registry" | nindent 8 }}
      annotations:
        checksum/config: {{ toYaml $c.config | sha256sum }}
    spec:
      {{- include "idem.podCommon" (dict "root" . "name" "idem-registry") | nindent 6 }}
      containers:
        - name: idem-registry
          image: {{ include "idem.image" (dict "root" . "image" $c.image "edition" true) }}
          imagePullPolicy: {{ .Values.appDefaults.imagePullPolicy }}
          {{- include "idem.containerSecurity" . | nindent 10 }}
          {{- include "idem.appPorts" (dict "root" . "port" 8082) | nindent 10 }}
          envFrom:
            - configMapRef: { name: idem-registry-config }
          env:
            {{- include "idem.commonEnv" . | nindent 12 }}
            - name: JAVA_OPTS
              value: {{ .Values.appDefaults.javaOpts | quote }}
            # registry 는 자기 접두(IDEM_REGISTRY_DB_*)로 같은 PostgreSQL 의 idem_registry 스키마를 쓴다
            - name: IDEM_REGISTRY_DB_HOST
              value: {{ .Values.infra.postgres.host | quote }}
            - name: IDEM_REGISTRY_DB_PORT
              value: {{ .Values.infra.postgres.port | quote }}
            - name: IDEM_REGISTRY_DB_NAME
              value: {{ .Values.infra.postgres.database | quote }}
            - name: IDEM_REGISTRY_DB_SCHEMA
              value: {{ $c.dbSchema | quote }}
            - name: IDEM_REGISTRY_DB_SSL
              value: {{ ne .Values.infra.postgres.sslMode "disable" | quote }}
            {{ include "idem.secretEnv" (dict "name" "IDEM_REGISTRY_DB_USERNAME" "secret" .Values.infra.postgres.existingSecret "key" .Values.infra.postgres.usernameKey) | nindent 12 }}
            {{ include "idem.secretEnv" (dict "name" "IDEM_REGISTRY_DB_PASSWORD" "secret" .Values.infra.postgres.existingSecret "key" .Values.infra.postgres.passwordKey) | nindent 12 }}
            # D3: 부팅 가드가 요구하는 키 — 비면 registry 가 기동을 거부한다
            {{- include "idem.appSecretEnv" (dict "root" . "keys" (list "IDEM_REGISTRY_INTERNAL_API_KEY" "IDEM_REGISTRY_DI_SECRET" "IDEM_REGISTRY_CI_AES_KEY_V1")) | nindent 12 }}
            {{- include "idem.mapEnv" $c.extraEnv | nindent 12 }}
          {{- include "idem.probes" (dict "root" . "port" 8082) | nindent 10 }}
          resources:
            {{- toYaml $c.resources | nindent 12 }}
{{- end }}
