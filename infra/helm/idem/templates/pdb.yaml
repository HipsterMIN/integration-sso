{{- /* PodDisruptionBudget — 노드 드레인 때 최소 가용 수 (appDefaults.pdb, 컴포넌트 pdb 로 덮어쓴다) */ -}}
{{- range $name, $c := dict "idem-gate" .Values.gate "idem-hub" .Values.hub "idem-registry" .Values.registry "idem-authz" .Values.authz "idem-keycloak" .Values.keycloak }}
{{- $p := merge (deepCopy ($c.pdb | default dict)) $.Values.appDefaults.pdb }}
{{- if and $c.enabled $p.enabled (gt (int (include "idem.replicas" (dict "root" $ "c" $c))) 1) }}
apiVersion: policy/v1
kind: PodDisruptionBudget
metadata:
  name: {{ $name }}
  namespace: {{ $.Release.Namespace }}
  labels:
    {{- include "idem.labels" $ | nindent 4 }}
    {{- include "idem.selectorLabels" $name | nindent 4 }}
spec:
  minAvailable: {{ $p.minAvailable }}
  selector:
    matchLabels:
      app: {{ $name }}
---
{{- end }}
{{- end }}
