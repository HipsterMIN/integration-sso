{{- /*
앱 비밀 한 벌 — 기본은 바깥에서 만든 Secret(secrets.existingSecret) 을 참조만 한다.
secrets.create=true 면 values 의 secrets.values 로 여기서 만든다 (개발·시험용. 운영은 External Secrets · Sealed Secrets · Vault 등).
키 이름과 생성 규칙은 docs/install-inputs.md.
*/ -}}
{{- if .Values.secrets.create }}
{{- $required := list "IDEM_HUB_INTERNAL_SIG_SECRET" "IDEM_HUB_INTERNAL_API_KEY_GATE" "IDEM_HUB_INTERNAL_API_KEY_RELAY" "IDEM_REGISTRY_INTERNAL_API_KEY" "IDEM_AUTHZ_INTERNAL_API_KEY" "IDEM_GATE_KEYCLOAK_CLIENT_SECRET" "KEYCLOAK_CLIENT_SECRET" "KEYCLOAK_PROVISIONER_CLIENT_SECRET" "KEYCLOAK_SESSION_MANAGER_CLIENT_SECRET" "KEYCLOAK_ADMIN_PASSWORD" "IDEM_HUB_HANDOFF_AES_KEY" "IDEM_HUB_HANDOFF_HMAC_KEY" "IDEM_HUB_WEBHOOK_SIGNING_SECRET" "IDEM_REGISTRY_AES_SHARED_KEY" "IDEM_REGISTRY_DI_SECRET" "IDEM_REGISTRY_CI_AES_KEY_V1" "IDEM_HUB_ADMIN_BOOTSTRAP_PASSWORD" "IDEM_HUB_ADMIN_SECRET_KEY" "IDEM_HUB_CAST_PRIVATE_KEY" "IDEM_HUB_CAST_PUBLIC_KEY" }}
{{- range $required }}
{{- if not (hasKey $.Values.secrets.values .) }}
{{- fail (printf "secrets.create=true 인데 secrets.values.%s 가 없습니다 (docs/install-inputs.md)" .) }}
{{- end }}
{{- end }}
apiVersion: v1
kind: Secret
metadata:
  name: {{ .Values.secrets.existingSecret }}
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "idem.labels" . | nindent 4 }}
type: Opaque
stringData:
  {{- range $k, $v := .Values.secrets.values }}
  {{ $k }}: {{ $v | quote }}
  {{- end }}
{{- end }}
