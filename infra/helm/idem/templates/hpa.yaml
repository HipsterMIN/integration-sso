---
# ── IdO HPA ───────────────────────────────────────────────────
{{- if and .Values.ido.enabled .Values.ido.hpa.enabled }}
apiVersion: autoscaling/v2
kind: HorizontalPodAutoscaler
metadata:
  name: hpa-ido
  namespace: {{ .Values.global.namespace }}
  labels:
    {{- include "onepass.labels" . | nindent 4 }}
    app.kubernetes.io/component: ido
spec:
  scaleTargetRef:
    apiVersion: apps/v1
    kind: Deployment
    name: idem-hub
  minReplicas: {{ .Values.ido.hpa.minReplicas }}
  maxReplicas: {{ .Values.ido.hpa.maxReplicas }}
  metrics:
    - type: Resource
      resource:
        name: cpu
        target:
          type: Utilization
          averageUtilization: {{ .Values.ido.hpa.targetCPUUtilizationPercentage }}
    {{- if .Values.ido.hpa.targetMemoryUtilizationPercentage }}
    - type: Resource
      resource:
        name: memory
        target:
          type: Utilization
          averageUtilization: {{ .Values.ido.hpa.targetMemoryUtilizationPercentage }}
    {{- end }}
  behavior:
    scaleDown:
      # ido는 SLO 영향이 가장 큼 → 더 보수적 (10분)
      stabilizationWindowSeconds: 600
      policies:
        - type: Percent
          value: 25
          periodSeconds: 60
    scaleUp:
      # 부하 급증 시 즉각 대응
      stabilizationWindowSeconds: 0
      policies:
        - type: Percent
          value: 100
          periodSeconds: 15
        - type: Pods
          value: 4
          periodSeconds: 15
      selectPolicy: Max
{{- end }}
---
