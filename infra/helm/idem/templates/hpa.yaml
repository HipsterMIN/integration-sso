{{- /* HPA — appDefaults.hpa 를 컴포넌트 hpa 로 덮어쓴다 (gate·hub·registry·authz) */ -}}
{{- range $name, $c := dict "idem-gate" .Values.gate "idem-hub" .Values.hub "idem-registry" .Values.registry "idem-authz" .Values.authz }}
{{- $h := merge (deepCopy ($c.hpa | default dict)) $.Values.appDefaults.hpa }}
{{- if and $c.enabled $h.enabled }}
apiVersion: autoscaling/v2
kind: HorizontalPodAutoscaler
metadata:
  name: {{ $name }}
  namespace: {{ $.Release.Namespace }}
  labels:
    {{- include "idem.labels" $ | nindent 4 }}
    {{- include "idem.selectorLabels" $name | nindent 4 }}
spec:
  scaleTargetRef:
    apiVersion: apps/v1
    kind: Deployment
    name: {{ $name }}
  minReplicas: {{ $h.minReplicas }}
  maxReplicas: {{ $h.maxReplicas }}
  metrics:
    - type: Resource
      resource:
        name: cpu
        target:
          type: Utilization
          averageUtilization: {{ $h.targetCPUUtilizationPercentage }}
---
{{- end }}
{{- end }}
