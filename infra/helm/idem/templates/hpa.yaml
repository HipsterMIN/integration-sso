# ============================================================
# HorizontalPodAutoscaler — Q-Sign / Q-IM / IdO
#
# 정책:
#   - autoscaling/v2 (안정 API, K8s 1.23+)
#   - CPU + Memory 듀얼 메트릭 (모두 임계 초과 시 스케일아웃)
#   - scaleDown stabilizationWindow: 5분 — Handoff 스파이크 후 즉시 축소 방지
#   - scaleUp stabilizationWindow: 30초 — 부하 증가 시 빠른 확장
#
# ⚠️ outbox-relay-batch는 의도적으로 HPA 미적용:
#    ShedLock이 단일 인스턴스만 Job을 실행하므로 Pod 증가가 처리량을 늘리지 못함.
#    가용성은 PDB(minAvailable=1) + replicaCount=2 고정으로 보장.
# ============================================================

# ── Q-Sign HPA ────────────────────────────────────────────────
{{- if and .Values.qsign.enabled .Values.qsign.hpa.enabled }}
apiVersion: autoscaling/v2
kind: HorizontalPodAutoscaler
metadata:
  name: hpa-qsign
  namespace: {{ .Values.global.namespace }}
  labels:
    {{- include "onepass.labels" . | nindent 4 }}
    app.kubernetes.io/component: q-sign
spec:
  scaleTargetRef:
    apiVersion: apps/v1
    kind: Deployment
    name: idem-gate
  minReplicas: {{ .Values.qsign.hpa.minReplicas }}
  maxReplicas: {{ .Values.qsign.hpa.maxReplicas }}
  metrics:
    - type: Resource
      resource:
        name: cpu
        target:
          type: Utilization
          averageUtilization: {{ .Values.qsign.hpa.targetCPUUtilizationPercentage }}
    {{- if .Values.qsign.hpa.targetMemoryUtilizationPercentage }}
    - type: Resource
      resource:
        name: memory
        target:
          type: Utilization
          averageUtilization: {{ .Values.qsign.hpa.targetMemoryUtilizationPercentage }}
    {{- end }}
  behavior:
    scaleDown:
      stabilizationWindowSeconds: 300
      policies:
        - type: Percent
          value: 50
          periodSeconds: 60
    scaleUp:
      stabilizationWindowSeconds: 30
      policies:
        - type: Percent
          value: 100
          periodSeconds: 30
        - type: Pods
          value: 2
          periodSeconds: 30
      selectPolicy: Max
{{- end }}
---
