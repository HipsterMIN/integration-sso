{{- if .Values.authz.enabled }}
{{- $c := .Values.authz }}
apiVersion: apps/v1
kind: Deployment
metadata:
  name: idem-authz
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "idem.labels" . | nindent 4 }}
    {{- include "idem.selectorLabels" "idem-authz" | nindent 4 }}
spec:
  replicas: {{ include "idem.replicas" (dict "root" . "c" $c) }}
  selector:
    matchLabels:
      app: idem-authz
  strategy:
    type: RollingUpdate
    rollingUpdate: { maxUnavailable: 0, maxSurge: 1 }
  template:
    metadata:
      labels:
        {{- include "idem.labels" . | nindent 8 }}
        {{- include "idem.selectorLabels" "idem-authz" | nindent 8 }}
      annotations:
        checksum/config: {{ toYaml $c.config | sha256sum }}
    spec:
      {{- include "idem.podCommon" (dict "root" . "name" "idem-authz") | nindent 6 }}
      containers:
        - name: idem-authz
          image: {{ include "idem.image" (dict "root" . "image" $c.image "edition" false) }}
          imagePullPolicy: {{ .Values.appDefaults.imagePullPolicy }}
          {{- include "idem.containerSecurity" . | nindent 10 }}
          ports:
            - { name: http, containerPort: 8086 }
          envFrom:
            - configMapRef: { name: idem-authz-config }
          env:
            {{- include "idem.commonEnv" . | nindent 12 }}
            - name: JAVA_OPTS
              value: {{ .Values.appDefaults.javaOpts | quote }}
            {{- include "idem.appSecretEnv" (dict "root" . "keys" (list "IDEM_AUTHZ_INTERNAL_API_KEY")) | nindent 12 }}
            {{- include "idem.mapEnv" $c.extraEnv | nindent 12 }}
          {{- include "idem.probes" (dict "root" . "port" 8086) | nindent 10 }}
          resources:
            {{- toYaml $c.resources | nindent 12 }}
{{- end }}
