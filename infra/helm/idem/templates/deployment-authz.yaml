{{- if .Values.authz.enabled }}
apiVersion: apps/v1
kind: Deployment
metadata:
  name: idem-authz
  namespace: {{ .Values.global.namespace }}
  labels:
    {{- include "onepass.labels" . | nindent 4 }}
    app.kubernetes.io/component: q-authz
  annotations:
    # Secret 변경 시 자동 rollout 트리거
    checksum/secret: {{ include (print $.Template.BasePath "/secrets.yaml") . | sha256sum }}
spec:
  replicas: {{ .Values.authz.replicaCount }}
  selector:
    matchLabels:
      app: idem-authz
  strategy:
    type: RollingUpdate
    rollingUpdate:
      maxUnavailable: 0
      maxSurge: 1
  template:
    metadata:
      labels:
        app: idem-authz
        {{- include "onepass.labels" . | nindent 8 }}
        app.kubernetes.io/component: q-authz
    spec:
      {{- if .Values.global.imagePullSecrets }}
      imagePullSecrets:
        {{- toYaml .Values.global.imagePullSecrets | nindent 8 }}
      {{- end }}
      {{- if and .Values.authz.serviceAccount .Values.authz.serviceAccount.create }}
      serviceAccountName: {{ .Values.authz.serviceAccount.name | default "idem-authz" }}
      {{- end }}
      terminationGracePeriodSeconds: 30
      containers:
        - name: q-authz
          image: {{ include "onepass.image" .Values.authz.image }}
          imagePullPolicy: {{ .Values.authz.image.pullPolicy }}
          ports:
            - name: http
              containerPort: 8086
              protocol: TCP
          envFrom:
            - configMapRef:
                name: idem-authz-config
            - configMapRef:
                name: idem-common-config
            - secretRef:
                name: {{ .Values.authz.secretRef.name }}
          {{- if .Values.authz.startupProbe }}
          startupProbe:
            {{- toYaml .Values.authz.startupProbe | nindent 12 }}
          {{- end }}
          livenessProbe:
            {{- toYaml .Values.authz.livenessProbe | nindent 12 }}
          readinessProbe:
            {{- toYaml .Values.authz.readinessProbe | nindent 12 }}
          resources:
            {{- toYaml .Values.authz.resources | nindent 12 }}
      affinity:
        podAntiAffinity:
          preferredDuringSchedulingIgnoredDuringExecution:
            - weight: 100
              podAffinityTerm:
                labelSelector:
                  matchLabels:
                    app: idem-authz
                topologyKey: kubernetes.io/hostname
{{- end }}
