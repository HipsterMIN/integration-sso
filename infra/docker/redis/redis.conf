# ============================================================
# Redis 7.2 PoC 설정
# 용도: 잠금 캐시(Q-Sign) / Q-IM 캐시(IdO) / Handoff Ticket /
#       FE 세션 / Agency 세션 보조 캐시
# ============================================================

# ── 네트워크 ──────────────────────────────────────────────────
bind 0.0.0.0
protected-mode no
port 6379
tcp-backlog 511
timeout 300
tcp-keepalive 60

# ── 메모리 ────────────────────────────────────────────────────
maxmemory 512mb
# allkeys-lru: TTL 없는 키도 LRU로 축출 → 캐시 성격 반영
maxmemory-policy allkeys-lru
maxmemory-samples 10
active-expire-enabled yes
active-expire-effort 1

# ── 지속성 ────────────────────────────────────────────────────
# AOF: 인증 잠금 / Handoff Ticket 는 손실 허용 안 됨
appendonly yes
appendfilename "appendonly.aof"
appendfsync everysec                 # 성능/내구성 균형
no-appendfsync-on-rewrite no
auto-aof-rewrite-percentage 100
auto-aof-rewrite-min-size 64mb
aof-rewrite-incremental-fsync yes

# RDB (스냅샷) — AOF 보완
save 900 1
save 300 10
save 60  10000
dbfilename dump.rdb
dir /data
rdbcompression yes
rdbchecksum yes

# ── 로깅 ──────────────────────────────────────────────────────
loglevel notice
logfile ""

# ── 느린 쿼리 로그 ────────────────────────────────────────────
slowlog-log-slower-than 10000        # 10ms 이상
slowlog-max-len 256

# ── 키스페이스 알림 ───────────────────────────────────────────
# KEA: Key Event + Key Expiry + ALL commands
# IdO 가 TTL 만료 이벤트를 수신해 캐시 무효화에 활용
notify-keyspace-events "KEA"

# ── 클라이언트 ────────────────────────────────────────────────
maxclients 100
tcp-keepalive 300

# ── 네임스페이스 설계 (주석 문서화) ──────────────────────────
# q-sign:lock:{lockKey}              → AuthLock (TTL=잠금해제시간)
# q-sign:nonce:{nonce}               → Nonce 재사용 방지 (TTL=60s)
# ido:ticket:{ticketId}              → Handoff Ticket (TTL=60s)
# ido:qim-cache:{qimUserId}          → Q-IM 사용자 캐시 (TTL≤300s)
# ido:agency-meta:{agencyCode}       → 기관 메타 캐시 (TTL≤3600s)
# fe:session:{sessionId}             → FE 세션 (TTL=30m / abs=8h)
# agency:session:{agsid-hash}        → 기관 세션 캐시 보조 (TTL=30m)
