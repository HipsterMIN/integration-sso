# ═══════════════════════════════════════════════════════════════════════════
# Idem 단일 설치본 (D1-b) — docs/install.md
#
#   PostgreSQL · Redis · Keycloak(숨김) · idem-gate · idem-registry · idem-hub · idem-authz · idem-console-admin (+ KR 에디션: --profile kr → idem-kr-portal)
#   Kafka 없음: idem.messaging.kafka.enabled=false 로 아웃박스·감사가 DB 만으로 완결된다 (docs/generalization-plan.md D1).
#
#   cp infra/docker/install.env.example infra/docker/install.env      # 값 채우기 (openssl rand — install.md 2단계)
#   docker compose --env-file infra/docker/install.env \
#                  -f infra/docker/compose.install.yml up -d --build
#   Docker Compose ≥ 2.17 (idem-hub 의 build.additional_contexts). `docker compose version` 으로 확인.
#
# 이 파일 하나로 완결된다 (compose.base.yml 등과 겹쳐 쓰지 않는다). 기존 개발용 전체 스택(Kafka·Vault·모니터링 포함)은
# compose.sso-im.yml / compose.sso-im-apps.yml 을 그대로 쓴다.
# ═══════════════════════════════════════════════════════════════════════════
name: idem

x-log: &log
  driver: json-file
  options:
    max-size: "20m"
    max-file: "5"

# 앱 공통 — DB·Redis·Kafka 스위치
x-app-common: &app-common
  DB_HOST: postgres
  DB_PORT: "5432"
  DB_NAME: idem
  DB_USERNAME: idem
  DB_PASSWORD: ${IDEM_DB_PASSWORD:?IDEM_DB_PASSWORD 를 install.env 에 설정하세요}
  REDIS_HOST: redis
  REDIS_PORT: "6379"
  IDEM_KAFKA_ENABLED: "false"
  TZ: ${IDEM_TZ:-Asia/Seoul}
  # 1.0.1 (3차 점검 M6): 운영 프로파일 — application-prod.yml(WARN 로깅, health 상세 비공개, actuator flyway/features 비노출, 보안 헤더).
  # 진단을 위해 잠시 기본 프로파일로 올리려면 install.env 에 IDEM_SPRING_PROFILE=default
  SPRING_PROFILES_ACTIVE: ${IDEM_SPRING_PROFILE:-prod}
  # compose 내부 PostgreSQL 은 TLS 없음. 바깥 PostgreSQL 을 쓰면 require/verify-full (gate·hub·authz 의 JDBC sslmode; registry 는 IDEM_REGISTRY_DB_SSL)
  DB_SSLMODE: disable

networks:
  idem-net:

volumes:
  pg-data:
  redis-data:
  keycloak-data:

services:
  # ── 데이터 ────────────────────────────────────────────────────────────────
  postgres:
    image: postgres:16-alpine
    container_name: idem-postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: idem
      POSTGRES_PASSWORD: ${IDEM_DB_PASSWORD:?IDEM_DB_PASSWORD 를 install.env 에 설정하세요}
      POSTGRES_DB: idem
      POSTGRES_INITDB_ARGS: "--encoding=UTF8 --locale=en_US.utf8"
      TZ: UTC
      PGTZ: UTC
    volumes:
      - pg-data:/var/lib/postgresql/data
      - ./init-db.sql:/docker-entrypoint-initdb.d/00-init-db.sql:ro   # 스키마 idem_gate·idem_hub·idem_registry·idem_authz·keycloak (1.0.1: 구 스키마가 있으면 새 이름을 만들지 않는 가드)
    ports:
      - "127.0.0.1:${IDEM_PORT_POSTGRES:-5432}:5432"
    networks: [idem-net]
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U idem -d idem"]
      interval: 5s
      timeout: 5s
      retries: 12
      start_period: 15s
    logging: *log

  redis:
    image: redis:7.2-alpine
    container_name: idem-redis
    restart: unless-stopped
    command: redis-server --appendonly yes --maxmemory 512mb --maxmemory-policy allkeys-lru
    volumes:
      - redis-data:/data
    networks: [idem-net]
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 10
    logging: *log

  # ── 숨긴 Keycloak (표준 OIDC 발급·세션, S6 에서 프로비저닝 정식화) ─────────────
  keycloak:
    image: quay.io/keycloak/keycloak:24.0
    container_name: idem-keycloak
    restart: unless-stopped
    command: start-dev --http-port=8080 --import-realm
    environment:
      KEYCLOAK_ADMIN: admin
      KEYCLOAK_ADMIN_PASSWORD: ${KEYCLOAK_ADMIN_PASSWORD:?KEYCLOAK_ADMIN_PASSWORD 를 install.env 에 설정하세요}
      KC_DB: postgres
      KC_DB_URL: jdbc:postgresql://postgres:5432/idem?currentSchema=keycloak
      KC_DB_USERNAME: idem
      KC_DB_PASSWORD: ${IDEM_DB_PASSWORD}
      KC_DB_SCHEMA: keycloak
      KC_HOSTNAME_STRICT: "false"
      KC_HOSTNAME_STRICT_HTTPS: "false"
      KC_HTTP_ENABLED: "true"
      KC_HEALTH_ENABLED: "true"
      KC_PROXY: edge
      KC_LOG_LEVEL: INFO
      # S6: Keycloak 은 gate 뒤에 숨는다 — 토큰 iss·로그인 화면 링크가 gate 공개 URL 로 나오도록 hostname 을 gate 로 고정.
      # 관리 콘솔(설치자 전용)만 loopback 포트로.
      KC_HOSTNAME_URL: ${IDEM_PUBLIC_URL_GATE:-http://localhost:8081}
      KC_HOSTNAME_ADMIN_URL: http://localhost:${IDEM_PORT_KEYCLOAK:-8088}
      # 1.0.1 (3차 점검 M10): realm-export.json 의 내부 client(idem-gate·idem-hub) redirect URI·webOrigins 가 공개 URL 을 읽는다 (첫 import 때만 적용)
      IDEM_PUBLIC_URL_GATE: ${IDEM_PUBLIC_URL_GATE:-http://localhost:8081}
      IDEM_PUBLIC_URL_HUB: ${IDEM_PUBLIC_URL_HUB:-http://localhost:8083}
      IDEM_PUBLIC_URL_CONSOLE: ${IDEM_PUBLIC_URL_CONSOLE:-http://localhost:3001}
      # realm-export.json 의 client secret 은 ${env.…} 로 아래 값을 읽는다 — 앱 쪽 값과 같아야 한다
      IDEM_GATE_KEYCLOAK_CLIENT_SECRET: ${IDEM_GATE_KEYCLOAK_CLIENT_SECRET:?IDEM_GATE_KEYCLOAK_CLIENT_SECRET 를 install.env 에 설정하세요}
      KEYCLOAK_CLIENT_SECRET: ${KEYCLOAK_CLIENT_SECRET:?KEYCLOAK_CLIENT_SECRET 를 install.env 에 설정하세요}
      # S6: hub 가 OIDC_RP client 를 프로비저닝할 때 쓰는 서비스 계정(realm-management manage-clients) 비밀
      KEYCLOAK_PROVISIONER_CLIENT_SECRET: ${KEYCLOAK_PROVISIONER_CLIENT_SECRET:?KEYCLOAK_PROVISIONER_CLIENT_SECRET 를 install.env 에 설정하세요}
      # S6 PR-2: gate 가 SLO 로 Keycloak 세션을 끊는 서비스 계정(realm-management view-users·manage-users) 비밀
      KEYCLOAK_SESSION_MANAGER_CLIENT_SECRET: ${KEYCLOAK_SESSION_MANAGER_CLIENT_SECRET:?KEYCLOAK_SESSION_MANAGER_CLIENT_SECRET 를 install.env 에 설정하세요}
    volumes:
      - keycloak-data:/opt/keycloak/data
      - ./keycloak/realm-export.json:/opt/keycloak/data/import/realm-export.json:ro
    ports:
      - "127.0.0.1:${IDEM_PORT_KEYCLOAK:-8088}:8080"
    networks: [idem-net]
    depends_on:
      postgres:
        condition: service_healthy
    healthcheck:
      # 이미지에 curl 이 없다 — bash 로 realm 엔드포인트 200 확인 (import 완료 = 준비됨)
      test: ["CMD-SHELL", "exec 3<>/dev/tcp/127.0.0.1/8080 && printf 'GET /realms/idem HTTP/1.0\\r\\n\\r\\n' >&3 && head -1 <&3 | grep -q ' 200 '"]
      interval: 15s
      timeout: 10s
      retries: 12
      start_period: 90s
    logging: *log

  # ── 제품 1: Idem SSO ───────────────────────────────────────────────────────
  idem-gate:
    build:
      context: ../..
      dockerfile: idem-gate/Dockerfile
    image: idem-gate:${IDEM_VERSION:-latest}
    container_name: idem-gate
    restart: unless-stopped
    environment:
      <<: *app-common
      IDEM_HUB_BASE_URL: http://idem-hub:8083
      IDEM_HUB_INTERNAL_SIG_SECRET: ${IDEM_HUB_INTERNAL_SIG_SECRET:?IDEM_HUB_INTERNAL_SIG_SECRET 를 install.env 에 설정하세요}
      KEYCLOAK_URL: http://keycloak:8080
      KEYCLOAK_REALM: idem
      IDEM_GATE_KEYCLOAK_CLIENT_ID: idem-gate
      IDEM_GATE_KEYCLOAK_CLIENT_SECRET: ${IDEM_GATE_KEYCLOAK_CLIENT_SECRET}
      IDEM_GATE_KEYCLOAK_REDIRECT_URI: ${IDEM_PUBLIC_URL_GATE:-http://localhost:8081}/api/v1/oidc/keycloak/callback
      IDEM_GATE_INTERNAL_SIG_STRICT: "true"
      # S6 OIDC 프런트: 기관 RP 가 보는 issuer = gate 공개 URL/realms/idem (Keycloak KC_HOSTNAME_URL 과 같다)
      IDEM_PUBLIC_URL_GATE: ${IDEM_PUBLIC_URL_GATE:-http://localhost:8081}
      # S6 PR-2: SLO 의 Keycloak 세션 종료 (Back-Channel Logout 수신은 /api/v1/oidc/backchannel-logout — realm-export 의 내부 client 가 가리킨다)
      KEYCLOAK_SESSION_MANAGER_CLIENT_SECRET: ${KEYCLOAK_SESSION_MANAGER_CLIENT_SECRET}
    ports:
      - "127.0.0.1:${IDEM_PORT_GATE:-8081}:8081"
    networks: [idem-net]
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      keycloak:
        condition: service_started
    healthcheck:
      test: ["CMD-SHELL", "curl -sf http://localhost:8081/actuator/health || exit 1"]
      interval: 15s
      timeout: 5s
      retries: 6
      start_period: 60s
    logging: *log

  idem-hub:
    build:
      context: ../..
      dockerfile: idem-hub/Dockerfile
      args:
        IDEM_EDITION: ${IDEM_EDITION:-core}   # core | kr (S8-a: KR 에디션은 SMES 회원 개념 포함)
      additional_contexts:
        # KR 에디션 벤더 SDK jar 디렉터리 (S9 PR-3). core 나 SDK 없이 빌드하면 빈 디렉터리 그대로
        vendor-libs: ${IDEM_VENDOR_LIBS_DIR:-./vendor-libs-empty}
    image: idem-hub:${IDEM_VERSION:-latest}-${IDEM_EDITION:-core}
    container_name: idem-hub
    restart: unless-stopped
    environment:
      <<: *app-common
      IDEM_REGISTRY_BASE_URL: http://idem-registry:8082
      IDEM_GATE_BASE_URL: http://idem-gate:8081
      IDEM_HUB_AUTHZ_BASE_URL: http://idem-authz:8086
      IDEM_HUB_REGISTRY_INTERNAL_API_KEY: ${IDEM_REGISTRY_INTERNAL_API_KEY:?IDEM_REGISTRY_INTERNAL_API_KEY 를 install.env 에 설정하세요}
      IDEM_HUB_INTERNAL_SIG_SECRET: ${IDEM_HUB_INTERNAL_SIG_SECRET}
      # 내부 호출자 API 키 (F4.8) — 비면 기동 실패
      IDEM_HUB_INTERNAL_API_KEY_GATE: ${IDEM_HUB_INTERNAL_API_KEY_GATE:?IDEM_HUB_INTERNAL_API_KEY_GATE 를 install.env 에 설정하세요}
      IDEM_HUB_INTERNAL_API_KEY_RELAY: ${IDEM_HUB_INTERNAL_API_KEY_RELAY:?IDEM_HUB_INTERNAL_API_KEY_RELAY 를 install.env 에 설정하세요}
      # D2 fail-secure 필수 — 없으면 hub 가 기동을 거부한다 (탈출구는 로컬 전용)
      IDEM_HUB_AUTHZ_INTERNAL_API_KEY: ${IDEM_AUTHZ_INTERNAL_API_KEY:?IDEM_AUTHZ_INTERNAL_API_KEY 를 install.env 에 설정하세요}
      IDEM_HUB_CAST_PRIVATE_KEY: ${IDEM_HUB_CAST_PRIVATE_KEY:?IDEM_HUB_CAST_PRIVATE_KEY(Ed25519 PKCS8 DER Base64) 를 install.env 에 설정하세요}
      IDEM_HUB_CAST_PUBLIC_KEY: ${IDEM_HUB_CAST_PUBLIC_KEY:?IDEM_HUB_CAST_PUBLIC_KEY(Ed25519 X.509 DER Base64) 를 install.env 에 설정하세요}
      IDEM_REGISTRY_AES_SHARED_KEY: ${IDEM_REGISTRY_AES_SHARED_KEY:?IDEM_REGISTRY_AES_SHARED_KEY(32바이트 Base64) 를 install.env 에 설정하세요}
      IDEM_HUB_BROKER_MODE: ${IDEM_HUB_BROKER_MODE:-qsign}
      IDEM_PLATFORM_CODE: ${IDEM_PLATFORM_CODE:-IDEM}
      # S7 관리자 인증 — 관리 API(/api/v1/admin/**·/actuator/**)는 관리자 세션 + 2단계(TOTP) 뒤에 있다 (docs/admin-auth.md)
      IDEM_HUB_ADMIN_BOOTSTRAP_USERNAME: ${IDEM_HUB_ADMIN_BOOTSTRAP_USERNAME:-admin}
      IDEM_HUB_ADMIN_BOOTSTRAP_PASSWORD: ${IDEM_HUB_ADMIN_BOOTSTRAP_PASSWORD:?IDEM_HUB_ADMIN_BOOTSTRAP_PASSWORD(첫 관리자 비밀번호) 를 install.env 에 설정하세요}
      IDEM_HUB_ADMIN_SECRET_KEY: ${IDEM_HUB_ADMIN_SECRET_KEY:?IDEM_HUB_ADMIN_SECRET_KEY(32바이트 Base64, 2단계 비밀 봉인) 를 install.env 에 설정하세요}
      IDEM_HUB_ADMIN_COOKIE_SECURE: ${IDEM_HUB_ADMIN_COOKIE_SECURE:-true}
      # 1.0.1: 회전된 Handoff 키 재료 봉인 — Vault 없이 prod 프로파일로 뜨기 위한 로컬 마스터 키 KMS (Vault 가 있으면 provider=vault + VAULT_*)
      IDEM_HUB_KMS_ENABLED: "true"
      IDEM_HUB_KMS_PROVIDER: ${IDEM_HUB_KMS_PROVIDER:-local}
      IDEM_HUB_KMS_MASTER_KEY: ${IDEM_HUB_KMS_MASTER_KEY:?IDEM_HUB_KMS_MASTER_KEY(32바이트 Base64, 키 재료 봉인) 를 install.env 에 설정하세요}
      KEYCLOAK_BASE_URL: http://keycloak:8080
      KEYCLOAK_REALM: idem
      KEYCLOAK_CLIENT_ID: idem-hub
      KEYCLOAK_CLIENT_SECRET: ${KEYCLOAK_CLIENT_SECRET}
      KEYCLOAK_REDIRECT_URI: ${IDEM_PUBLIC_URL_HUB:-http://localhost:8083}/api/v1/broker/callback
      # S6: OIDC_RP client 프로비저닝(서비스 계정) + 기관에 알려 줄 issuer
      KEYCLOAK_PROVISIONER_CLIENT_SECRET: ${KEYCLOAK_PROVISIONER_CLIENT_SECRET}
      IDEM_PUBLIC_URL_GATE: ${IDEM_PUBLIC_URL_GATE:-http://localhost:8081}
      IDEM_HUB_WEBHOOK_SIGNING_SECRET: ${IDEM_HUB_WEBHOOK_SIGNING_SECRET:?IDEM_HUB_WEBHOOK_SIGNING_SECRET 를 install.env 에 설정하세요}
      IDEM_HUB_HANDOFF_AES_KEY: ${IDEM_HUB_HANDOFF_AES_KEY:?IDEM_HUB_HANDOFF_AES_KEY 를 install.env 에 설정하세요}
      IDEM_HUB_HANDOFF_HMAC_KEY: ${IDEM_HUB_HANDOFF_HMAC_KEY:?IDEM_HUB_HANDOFF_HMAC_KEY 를 install.env 에 설정하세요}
      CORS_ORIGIN_DEV: ${IDEM_PUBLIC_URL_CONSOLE:-http://localhost:3001}
      CORS_ORIGIN_PROD: ${IDEM_PUBLIC_URL_CONSOLE:-http://localhost:3001}
      # 설치 검증용 Mock 본인확인 제공자 (docs/install.md 5단계, IDEM_SPRING_PROFILE=default 와 함께 — prod 프로파일은 fail-secure 가드가 거부). 운영 전환 시 false
      IDEM_PLUGINS_MOCK_AUTH_ENABLED: ${IDEM_PLUGINS_MOCK_AUTH_ENABLED:-false}
      # KR 에디션 벤더 플러그인 (1.0.1, 3차 점검 M8: 종전에는 false 고정이라 kr 설치본이 플러그인을 켤 수 없었다). 자격증명은 plugins/*/README.md
      IDEM_PLUGINS_NICE_OACX_ENABLED: ${IDEM_PLUGINS_NICE_OACX_ENABLED:-false}
      IDEM_PLUGINS_ANYID_ENABLED: ${IDEM_PLUGINS_ANYID_ENABLED:-false}
    ports:
      - "127.0.0.1:${IDEM_PORT_HUB:-8083}:8083"
    networks: [idem-net]
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      idem-registry:
        condition: service_healthy
      idem-gate:
        condition: service_healthy
      idem-authz:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "curl -sf http://localhost:8083/actuator/health || exit 1"]
      interval: 15s
      timeout: 5s
      retries: 6
      start_period: 60s
    logging: *log

  # ── 제품 2: Idem IM ────────────────────────────────────────────────────────
  idem-registry:
    build:
      context: ../..
      dockerfile: idem-registry/Dockerfile
      args:
        IDEM_EDITION: ${IDEM_EDITION:-core}   # core | kr (S8-a: KR 에디션은 SMES 회원 개념 포함)
    image: idem-registry:${IDEM_VERSION:-latest}-${IDEM_EDITION:-core}
    container_name: idem-registry
    restart: unless-stopped
    environment:
      <<: *app-common
      IDEM_REGISTRY_DB_HOST: postgres
      IDEM_REGISTRY_DB_PORT: "5432"
      IDEM_REGISTRY_DB_NAME: idem
      IDEM_REGISTRY_DB_SCHEMA: idem_registry
      IDEM_REGISTRY_DB_USERNAME: idem
      IDEM_REGISTRY_DB_PASSWORD: ${IDEM_DB_PASSWORD}
      IDEM_REGISTRY_DB_SSL: "false"
      IDEM_REGISTRY_INTERNAL_API_KEY: ${IDEM_REGISTRY_INTERNAL_API_KEY}
      # D3: registry 부팅 가드가 요구하는 키 — 종전 compose 에 없어 registry 가 기동을 거부했다(CI 설치본 스모크로 발견)
      IDEM_REGISTRY_DI_SECRET: ${IDEM_REGISTRY_DI_SECRET:?IDEM_REGISTRY_DI_SECRET(hex 32) 를 install.env 에 설정하세요}
      IDEM_REGISTRY_CI_AES_KEY_V1: ${IDEM_REGISTRY_CI_AES_KEY_V1:?IDEM_REGISTRY_CI_AES_KEY_V1(32바이트 Base64) 를 install.env 에 설정하세요}
    ports:
      - "127.0.0.1:${IDEM_PORT_REGISTRY:-8082}:8082"
    networks: [idem-net]
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "curl -sf http://localhost:8082/actuator/health || exit 1"]
      interval: 15s
      timeout: 5s
      retries: 6
      start_period: 45s
    logging: *log

  idem-authz:
    build:
      context: ../..
      dockerfile: idem-authz/Dockerfile
    image: idem-authz:${IDEM_VERSION:-latest}
    container_name: idem-authz
    restart: unless-stopped
    environment:
      <<: *app-common
      IDEM_AUTHZ_INTERNAL_API_KEY: ${IDEM_AUTHZ_INTERNAL_API_KEY:?IDEM_AUTHZ_INTERNAL_API_KEY 를 install.env 에 설정하세요}
    ports:
      - "127.0.0.1:${IDEM_PORT_AUTHZ:-8086}:8086"
    networks: [idem-net]
    depends_on:
      postgres:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "curl -sf http://localhost:8086/actuator/health || exit 1"]
      interval: 15s
      timeout: 5s
      retries: 6
      start_period: 45s
    logging: *log

  # ── 관리 콘솔 (S7 PR-2: React + Nginx, /api → idem-hub 같은 출처. 관리자 로그인·2단계는 hub 가 한다 — docs/admin-auth.md) ──
  idem-console-admin:
    build:
      context: ../..
      dockerfile: idem-console-admin/Dockerfile
    image: idem-console-admin:${IDEM_VERSION:-latest}
    container_name: idem-console-admin
    restart: unless-stopped
    ports:
      - "127.0.0.1:${IDEM_PORT_CONSOLE:-3001}:80"
    networks: [idem-net]
    depends_on:
      idem-hub:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://localhost/nginx-health || exit 1"]
      interval: 15s
      timeout: 5s
      retries: 5
      start_period: 15s
    logging: *log

  # ── KR 에디션 회원 포털 (구 idem-console — 회원전환·본인확인 위젯·마이페이지). `--profile kr` 로만 올라간다 ──
  idem-kr-portal:
    profiles: ["kr"]
    build:
      context: ../..
      dockerfile: editions/idem-kr-portal/Dockerfile.optionB
      target: react-nginx
    image: idem-kr-portal:${IDEM_VERSION:-latest}
    container_name: idem-kr-portal
    restart: unless-stopped
    ports:
      - "127.0.0.1:${IDEM_PORT_KR_PORTAL:-3002}:80"
    networks: [idem-net]
    depends_on:
      idem-hub:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://localhost/nginx-health || exit 1"]
      interval: 15s
      timeout: 5s
      retries: 5
