# ============================================================
# Kafka 브로커 설정 (Confluent cp-kafka:7.6.1 / KRaft 모드 X, Zookeeper)
# PoC 단일 브로커 기준
# ============================================================

# ── 브로커 식별 ───────────────────────────────────────────────
broker.id=1

# ── 리스너 ────────────────────────────────────────────────────
listeners=PLAINTEXT://0.0.0.0:29092,PLAINTEXT_HOST://0.0.0.0:9092
advertised.listeners=PLAINTEXT://kafka:29092,PLAINTEXT_HOST://localhost:9092
listener.security.protocol.map=PLAINTEXT:PLAINTEXT,PLAINTEXT_HOST:PLAINTEXT
inter.broker.listener.name=PLAINTEXT

# ── Zookeeper ─────────────────────────────────────────────────
zookeeper.connect=zookeeper:2181
zookeeper.connection.timeout.ms=18000
zookeeper.session.timeout.ms=18000

# ── 토픽 기본 설정 ────────────────────────────────────────────
auto.create.topics.enable=false            # 명시적 토픽 생성 강제
num.partitions=6                           # 기본 파티션 수
default.replication.factor=1              # PoC 단일 브로커
min.insync.replicas=1

# ── 로그 설정 ─────────────────────────────────────────────────
log.dirs=/var/lib/kafka/data
num.recovery.threads.per.data.dir=2
log.retention.hours=168                    # 7일 기본 보관
log.retention.check.interval.ms=300000    # 5분마다 만료 체크
log.segment.bytes=1073741824              # 1GB 세그먼트

# ── 성능 ──────────────────────────────────────────────────────
num.network.threads=3
num.io.threads=8
socket.send.buffer.bytes=102400
socket.receive.buffer.bytes=102400
socket.request.max.bytes=104857600

# ── 트랜잭션 / 멱등 ──────────────────────────────────────────
transaction.state.log.replication.factor=1
transaction.state.log.min.isr=1
transaction.state.log.num.partitions=50
transactional.id.expiration.ms=604800000  # 7일

# ── 압축 ──────────────────────────────────────────────────────
compression.type=producer                  # 프로듀서 설정 준수
# Compacted 토픽용 (qim.user.events, qim.user.snapshot)
log.cleaner.enable=true
log.cleaner.threads=2
log.cleaner.dedupe.buffer.size=134217728   # 128MB
log.cleaner.io.buffer.size=524288
log.cleaner.io.max.bytes.per.second=1.7976931348623157E308
log.cleaner.backoff.ms=15000
log.cleaner.min.cleanable.ratio=0.5

# ── 오프셋 ────────────────────────────────────────────────────
offsets.topic.replication.factor=1
offsets.retention.minutes=10080           # 7일

# ── 그룹 코디네이터 ───────────────────────────────────────────
group.initial.rebalance.delay.ms=100
