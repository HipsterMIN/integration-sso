# ══════════════════════════════════════════════════════════════════════════════
# Nginx 설정 — React SPA 서빙 + IdO 역방향 프록시
#
# [변경] BFF 이관: onepass-fe Spring Boot → ido(port 8083)
#
# 역할:
#   1. React 정적 산출물 서빙 (/ → index.html SPA fallback)
#   2. /api/**, /actuator/** → ido BFF(port 8083) 프록시
#   3. 정적 파일 캐시 / 압축
# ══════════════════════════════════════════════════════════════════════════════
worker_processes  auto;
error_log         /var/log/nginx/error.log warn;
pid               /var/run/nginx.pid;

events {
    worker_connections  1024;
    use                 epoll;
    multi_accept        on;
}

http {
    include       /etc/nginx/mime.types;
    default_type  application/octet-stream;

    # ── 로그 포맷 ────────────────────────────────────────────────────────────
    log_format main '$remote_addr - $remote_user [$time_local] '
                    '"$request" $status $body_bytes_sent '
                    '"$http_referer" "$http_user_agent" '
                    'rt=$request_time uid=$http_x_correlation_id';

    access_log  /var/log/nginx/access.log main;

    # ── 성능 ─────────────────────────────────────────────────────────────────
    sendfile           on;
    tcp_nopush         on;
    tcp_nodelay        on;
    keepalive_timeout  65;
    server_tokens      off;

    # ── 압축 ─────────────────────────────────────────────────────────────────
    gzip              on;
    gzip_vary         on;
    gzip_proxied      any;
    gzip_comp_level   6;
    gzip_buffers      16 8k;
    gzip_http_version 1.1;
    gzip_min_length   256;
    gzip_types
        text/plain text/css text/xml
        application/json application/javascript application/xml+rss
        application/atom+xml image/svg+xml
        font/woff font/woff2;

    # ── 업스트림: IdO (BFF 이관 후 onepass-ido:8083) ─────────────────────────
    upstream bff_backend {
        server onepass-ido:8083;
        keepalive 32;
    }

    # ── 가상 호스트 ──────────────────────────────────────────────────────────
    server {
        listen       80;
        server_name  _;

        root   /usr/share/nginx/html;
        index  index.html;

        # ── 보안 헤더 ────────────────────────────────────────────────────────
        add_header X-Frame-Options           "SAMEORIGIN"     always;
        add_header X-Content-Type-Options    "nosniff"        always;
        add_header X-XSS-Protection          "1; mode=block"  always;
        add_header Referrer-Policy           "strict-origin-when-cross-origin" always;
        add_header Permissions-Policy        "camera=(), microphone=(), geolocation=()" always;

        # ── /api/** → BFF 프록시 ─────────────────────────────────────────────
        location /api/ {
            proxy_pass         http://bff_backend;
            proxy_http_version 1.1;
            proxy_set_header   Connection        "";
            proxy_set_header   Host              $host;
            proxy_set_header   X-Real-IP         $remote_addr;
            proxy_set_header   X-Forwarded-For   $proxy_add_x_forwarded_for;
            proxy_set_header   X-Forwarded-Proto $scheme;
            proxy_set_header   X-Correlation-Id  $http_x_correlation_id;
            proxy_read_timeout 30s;
            proxy_send_timeout 30s;
            # feSessionId 쿠키 전달 보장
            proxy_pass_header  Set-Cookie;
        }

        # ── /actuator/** → BFF 헬스체크 ─────────────────────────────────────
        location /actuator/ {
            proxy_pass         http://bff_backend;
            proxy_http_version 1.1;
            proxy_set_header   Connection "";
            proxy_set_header   Host      $host;
            proxy_read_timeout 10s;
        }

        # ── 정적 파일 (content-hash 파일명) — 장기 캐시 ──────────────────────
        location /static/ {
            expires    1y;
            add_header Cache-Control "public, immutable";
        }

        # ── favicon / robots 단기 캐시 ───────────────────────────────────────
        location ~* \.(ico|txt|json)$ {
            expires    1d;
            add_header Cache-Control "public";
        }

        # ── SPA fallback — React Router 클라이언트 라우팅 지원 ────────────────
        location / {
            try_files $uri $uri/ /index.html;
            # index.html 은 캐시하지 않음 (항상 최신 버전 제공)
            add_header Cache-Control "no-cache, no-store, must-revalidate";
        }

        # ── 헬스체크 ─────────────────────────────────────────────────────────
        location /nginx-health {
            access_log off;
            return 200 "OK\n";
            add_header Content-Type text/plain;
        }
    }
}
