# ══════════════════════════════════════════════════════════════════════════════
# Nginx 설정 — React SPA 서빙 + IdO 역방향 프록시
#
# [변경] BFF 이관: idem-console Spring Boot → ido(port 8083)
#
# 역할:
#   1. React 정적 산출물 서빙 (/ → index.html SPA fallback)
#   2. /api/**, /actuator/** → ido BFF(port 8083) 프록시
#   3. 정적 파일 캐시 / 압축
# ══════════════════════════════════════════════════════════════════════════════
worker_processes  auto;
error_log         /var/log/nginx/error.log warn;
pid               /var/run/nginx.pid;

events {
    worker_connections  1024;
    use                 epoll;
    multi_accept        on;
}

http {
    include       /etc/nginx/mime.types;
    default_type  application/octet-stream;

    # ── 로그 포맷 ────────────────────────────────────────────────────────────
    log_format main '$remote_addr - $remote_user [$time_local] '
                    '"$request" $status $body_bytes_sent '
                    '"$http_referer" "$http_user_agent" '
                    'rt=$request_time uid=$http_x_correlation_id';

    access_log  /var/log/nginx/access.log main;

    # ── 성능 ─────────────────────────────────────────────────────────────────
    sendfile           on;
    tcp_nopush         on;
    tcp_nodelay        on;
    keepalive_timeout  65;
    server_tokens      off;

    # ── 압축 ─────────────────────────────────────────────────────────────────
    gzip              on;
    gzip_vary         on;
    gzip_proxied      any;
    gzip_comp_level   6;
    gzip_buffers      16 8k;
    gzip_http_version 1.1;
    gzip_min_length   256;
    gzip_types
        text/plain text/css text/xml
        application/json application/javascript application/xml+rss
        application/atom+xml image/svg+xml
        font/woff font/woff2;

    # ── 업스트림: IdO (BFF 이관 후 idem-hub:8083) ─────────────────────────
    upstream bff_backend {
        server idem-hub:8083;
        keepalive 32;
    }

    # ── 가상 호스트 ──────────────────────────────────────────────────────────
    server {
        listen       80;
        server_name  _;

        root   /usr/share/nginx/html;
        index  index.html;

        # ── 보안 헤더 ────────────────────────────────────────────────────────
        # Clickjacking 방어: DENY로 강화 (SAMEORIGIN → DENY)
        add_header X-Frame-Options           "DENY"           always;
        add_header X-Content-Type-Options    "nosniff"        always;
        # X-XSS-Protection: 구형 브라우저 대응 (CSP로 대체됐지만 하위 호환 유지)
        add_header X-XSS-Protection          "1; mode=block"  always;
        add_header Referrer-Policy           "strict-origin-when-cross-origin" always;
        add_header Permissions-Policy        "camera=(), microphone=(), geolocation=(), payment=(), usb=()" always;
        # HSTS: HTTPS 강제 1년 (서브도메인 포함)
        add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;

        # Content-Security-Policy (React SPA 전용)
        # 정책 설계:
        #   - default-src 'self': 기본 동일 출처만 허용
        #   - script-src 'self' 'unsafe-inline': React 앱 인라인 스크립트 허용 (빌드 최적화 후 nonce로 교체 권장)
        #   - style-src 'self' 'unsafe-inline': Ant Design 동적 스타일 허용
        #   - img-src 'self' data:: Base64 이미지 허용 (아이콘 등)
        #   - connect-src 'self': API 요청은 동일 출처만 (Nginx 프록시를 통해 ido로 전달)
        #   - font-src 'self' data:: 웹폰트 허용
        #   - frame-ancestors 'none': iframe 삽입 전면 차단
        #   - form-action 'self': form 제출 동일 출처 제한
        #   - base-uri 'self': base 태그 조작 방지
        #   운영 배포 후 report-uri 설정 및 unsafe-inline 제거(nonce 적용) 권장
        add_header Content-Security-Policy
            "default-src 'self'; "
            "script-src 'self' 'unsafe-inline'; "
            "style-src 'self' 'unsafe-inline'; "
            "img-src 'self' data:; "
            "connect-src 'self'; "
            "font-src 'self' data:; "
            "frame-ancestors 'none'; "
            "form-action 'self'; "
            "base-uri 'self'"
            always;

        # ── /api/** → BFF 프록시 ─────────────────────────────────────────────
        location /api/ {
            proxy_pass         http://bff_backend;
            proxy_http_version 1.1;
            proxy_set_header   Connection        "";
            proxy_set_header   Host              $host;
            proxy_set_header   X-Real-IP         $remote_addr;
            proxy_set_header   X-Forwarded-For   $proxy_add_x_forwarded_for;
            proxy_set_header   X-Forwarded-Proto $scheme;
            proxy_set_header   X-Correlation-Id  $http_x_correlation_id;
            proxy_read_timeout 30s;
            proxy_send_timeout 30s;
            # feSessionId 쿠키 전달 보장
            proxy_pass_header  Set-Cookie;
        }

        # ── /actuator/** → BFF 헬스체크 ─────────────────────────────────────
        location /actuator/ {
            proxy_pass         http://bff_backend;
            proxy_http_version 1.1;
            proxy_set_header   Connection "";
            proxy_set_header   Host      $host;
            proxy_read_timeout 10s;
        }

        # ── 정적 파일 (content-hash 파일명) — 장기 캐시 ──────────────────────
        location /static/ {
            expires    1y;
            add_header Cache-Control "public, immutable";
        }

        # ── favicon / robots 단기 캐시 ───────────────────────────────────────
        location ~* \.(ico|txt|json)$ {
            expires    1d;
            add_header Cache-Control "public";
        }

        # ── SPA fallback — React Router 클라이언트 라우팅 지원 ────────────────
        location / {
            try_files $uri $uri/ /index.html;
            # index.html 은 캐시하지 않음 (항상 최신 버전 제공)
            add_header Cache-Control "no-cache, no-store, must-revalidate";
        }

        # ── 헬스체크 ─────────────────────────────────────────────────────────
        location /nginx-health {
            access_log off;
            return 200 "OK\n";
            add_header Content-Type text/plain;
        }
    }
}
