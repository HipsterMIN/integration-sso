# ============================================================
# PostgreSQL 16 PoC 튜닝 설정
# 로컬 개발 / PoC 환경 기준 (컨테이너 메모리 2GB 가정)
# ============================================================

# ── 연결 ──────────────────────────────────────────────────────
max_connections = 200
superuser_reserved_connections = 3

# ── 메모리 ────────────────────────────────────────────────────
shared_buffers = 512MB                  # RAM 의 25%
effective_cache_size = 1536MB           # RAM 의 75%
work_mem = 8MB                          # 정렬·해시 연산당
maintenance_work_mem = 128MB            # VACUUM / CREATE INDEX
wal_buffers = 16MB

# ── WAL / 체크포인트 ──────────────────────────────────────────
wal_level = replica                     # Logical replication 대비
max_wal_senders = 3
wal_keep_size = 256MB
checkpoint_completion_target = 0.9
checkpoint_timeout = 10min
max_wal_size = 2GB
min_wal_size = 256MB

# ── 쿼리 플래너 ───────────────────────────────────────────────
default_statistics_target = 100
random_page_cost = 1.1                  # SSD 기준
effective_io_concurrency = 200          # SSD / NVMe

# ── 로깅 ──────────────────────────────────────────────────────
log_timezone = 'Asia/Seoul'
log_min_duration_statement = 1000       # 1초 이상 쿼리 로깅
log_line_prefix = '%t [%p]: [%l-1] user=%u,db=%d,app=%a,client=%h '
log_checkpoints = on
log_connections = off
log_disconnections = off
log_lock_waits = on
log_temp_files = 10MB
log_autovacuum_min_duration = 500ms

# ── 타임존 ────────────────────────────────────────────────────
timezone = 'UTC'
datestyle = 'iso, mdy'

# ── 자동 VACUUM ───────────────────────────────────────────────
autovacuum = on
autovacuum_max_workers = 3
autovacuum_naptime = 1min
autovacuum_vacuum_scale_factor = 0.05
autovacuum_analyze_scale_factor = 0.02

# ── 잠금 ──────────────────────────────────────────────────────
deadlock_timeout = 1s
lock_timeout = 10s
idle_in_transaction_session_timeout = 30s

# ── 기타 ──────────────────────────────────────────────────────
statement_timeout = 60s
idle_session_timeout = 0               # 개발 환경 비활성
jit = off                              # PoC 환경 – JIT 비활성
