# ============================================================
# pg_hba.conf — PostgreSQL 16 PoC 접근 제어
# ============================================================
# TYPE  DATABASE        USER            ADDRESS                 METHOD
local   all             all                                     trust
host    all             all             127.0.0.1/32            md5
host    all             all             ::1/128                 md5
# Docker network (172.x.x.x) — 내부 서비스 접근 허용
host    all             all             172.0.0.0/8             md5
# 플랫폼 내부 네트워크 (onepass-net 브리지)
host    all             all             10.0.0.0/8              md5
# Docker Desktop 호스트 포트 포워딩 — 호스트(Windows)에서 localhost:5432 접속 허용
host    all             all             0.0.0.0/0               md5
host    all             all             ::/0                    md5
