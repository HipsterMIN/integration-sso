# ══════════════════════════════════════════════════════════════════════════════
# 통합인증 플랫폼 — 로컬/개발 인프라 (Docker Compose)
#
# [DB 구조] (D1, 2026-09-21: MariaDB 제거 — 엔진 1종)
#   PostgreSQL 16 (port 5432) : Q-Sign(qsign) / IdO(ido) / Q-IM(qim) / agency-stub / Keycloak — 스키마로 분리
#
# [프로파일 구성]
#   기본(프로파일 없음) : 인프라만 (DB / Redis / Kafka / Kafka-UI / Redis-Insight)
#   app               : + Q-Sign / Q-IM / IdO / Agency-Stub
#   keycloak          : + Keycloak OIDC 브로커
#   optionB           : + React SPA (Nginx)
#   tools             : + pgAdmin
#   monitoring        : + Prometheus / Grafana / Loki / Promtail
#
# [환경변수 관리]
#   로컬 개발: infra/docker/.env 파일 (git-ignored) 또는 환경변수 export
#   운영 배포: K8s Secret / Helm values-prod.yaml
#
# [사용 예]
#   infra 기동  : docker compose -f infra/docker/docker-compose.yml up -d
#   앱 포함     : docker compose -f infra/docker/docker-compose.yml --profile app up -d
#   전체        : docker compose -f infra/docker/docker-compose.yml \
#                   --profile app --profile keycloak --profile monitoring up -d
# ══════════════════════════════════════════════════════════════════════════════

# ── 기본값 정의 (YAML 앵커) ─────────────────────────────────────────────────
x-log-defaults: &log-defaults
  driver: json-file
  options:
    max-size: "20m"
    max-file: "5"

x-log-small: &log-small
  driver: json-file
  options:
    max-size: "10m"
    max-file: "3"

# Promtail 로그 수집 대상 레이블
x-promtail-label: &promtail-label
  logging: "promtail"

networks:
  idem-net:
    driver: bridge
    ipam:
      config:
        - subnet: 172.20.0.0/24

volumes:
  pg-data:
  redis-data:
  kafka-data:
  zookeeper-data:
  zookeeper-log:
  keycloak-data:
  prometheus-data:
  grafana-data:
  loki-data:

services:

  # ════════════════════════════════════════════════════════════
  # PostgreSQL 16 — Q-Sign(qsign) / IdO(ido) / Q-IM(qim, D1) / agency-stub / Keycloak
  # ════════════════════════════════════════════════════════════
  postgres:
    image: postgres:16-alpine
    container_name: idem-postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER:     onepass
      POSTGRES_PASSWORD: onepass
      POSTGRES_DB:       onepass
      POSTGRES_INITDB_ARGS: "--encoding=UTF8 --locale=en_US.utf8"
      TZ:   UTC
      PGTZ: UTC
    ports:
      - "5432:5432"
    volumes:
      - pg-data:/var/lib/postgresql/data
      - ./init-db.sql:/docker-entrypoint-initdb.d/00-init-db.sql:ro
      - ./postgres/postgresql.conf:/etc/postgresql/postgresql.conf:ro
      - ./postgres/pg_hba.conf:/etc/postgresql/pg_hba.conf:ro
    command: >
      postgres
        -c config_file=/etc/postgresql/postgresql.conf
        -c hba_file=/etc/postgresql/pg_hba.conf
    networks:
      idem-net:
        ipv4_address: 172.20.0.10
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U onepass -d onepass"]
      interval: 5s
      timeout: 5s
      retries: 10
      start_period: 15s
    deploy:
      resources:
        limits:
          memory: 1g
        reservations:
          memory: 512m
    logging: *log-defaults

  # ════════════════════════════════════════════════════════════
  # Redis 7.2
  # ════════════════════════════════════════════════════════════
  redis:
    image: redis:7.2-alpine
    container_name: idem-redis
    restart: unless-stopped
    ports:
      - "6379:6379"
    volumes:
      - redis-data:/data
      - ./redis/redis.conf:/usr/local/etc/redis/redis.conf:ro
    command: redis-server /usr/local/etc/redis/redis.conf
    networks:
      idem-net:
        ipv4_address: 172.20.0.11
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 10
      start_period: 5s
    deploy:
      resources:
        limits:
          memory: 768m
        reservations:
          memory: 256m
    logging: *log-small

  # ════════════════════════════════════════════════════════════
  # HashiCorp Vault — KMS (Key Management Service)
  # IDO_KMS_ENABLED=true / IDO_KMS_PROVIDER=vault 시 사용
  # 개발 환경: Dev 모드(인메모리, 재시작 시 초기화)
  # 운영 환경: -dev 플래그 제거 + Raft 스토리지 + TLS 적용
  # ════════════════════════════════════════════════════════════
  vault:
    image: hashicorp/vault:1.17
    container_name: idem-vault
    restart: unless-stopped
    ports:
      - "8200:8200"
    environment:
      # Dev 모드: 인메모리 스토리지, 재시작 시 초기화됨
      # 운영 전환 시 이 두 줄을 제거하고 vault.hcl 마운트
      VAULT_DEV_ROOT_TOKEN_ID: ${VAULT_TOKEN:-dev-root-token}
      VAULT_DEV_LISTEN_ADDRESS: "0.0.0.0:8200"
    command: server -dev
    cap_add:
      - IPC_LOCK  # mlock() 허용 — 메모리 스왑 방지 (운영 보안 필수)
    networks:
      idem-net:
        ipv4_address: 172.20.0.20
    healthcheck:
      test: ["CMD", "vault", "status", "-address=http://127.0.0.1:8200"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 5s
    deploy:
      resources:
        limits:
          memory: 256m
        reservations:
          memory: 128m
    logging: *log-small

  # ════════════════════════════════════════════════════════════
  # Zookeeper
  # ════════════════════════════════════════════════════════════
  zookeeper:
    image: confluentinc/cp-zookeeper:7.6.1
    container_name: idem-zookeeper
    restart: unless-stopped
    environment:
      ZOOKEEPER_CLIENT_PORT: 2181
      ZOOKEEPER_TICK_TIME: 2000
      ZOOKEEPER_SYNC_LIMIT: 2
      ZOOKEEPER_INIT_LIMIT: 5
      ZOOKEEPER_MAX_CLIENT_CNXNS: 60
      ZOOKEEPER_AUTOPURGE_SNAP_RETAIN_COUNT: 3
      ZOOKEEPER_AUTOPURGE_PURGE_INTERVAL: 24
      KAFKA_OPTS: "-Dzookeeper.4lw.commands.whitelist=ruok,stat,mntr,conf"
    ports:
      - "2181:2181"
    volumes:
      - zookeeper-data:/var/lib/zookeeper/data
      - zookeeper-log:/var/lib/zookeeper/log
    networks:
      idem-net:
        ipv4_address: 172.20.0.12
    healthcheck:
      test: ["CMD-SHELL", "echo ruok | nc -w 2 localhost 2181 | grep imok"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 15s
    logging: *log-small

  # ════════════════════════════════════════════════════════════
  # Kafka Broker
  # ════════════════════════════════════════════════════════════
  kafka:
    image: confluentinc/cp-kafka:7.6.1
    container_name: idem-kafka
    restart: unless-stopped
    depends_on:
      zookeeper:
        condition: service_healthy
    environment:
      # ── 브로커 기본 ──────────────────────────────────────────
      KAFKA_BROKER_ID: 1
      KAFKA_ZOOKEEPER_CONNECT: zookeeper:2181
      # ── 리스너 ───────────────────────────────────────────────
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: PLAINTEXT:PLAINTEXT,PLAINTEXT_HOST:PLAINTEXT
      KAFKA_ADVERTISED_LISTENERS: PLAINTEXT://kafka:29092,PLAINTEXT_HOST://localhost:9092
      KAFKA_LISTENERS: PLAINTEXT://0.0.0.0:29092,PLAINTEXT_HOST://0.0.0.0:9092
      KAFKA_INTER_BROKER_LISTENER_NAME: PLAINTEXT
      # ── 토픽 기본값 ──────────────────────────────────────────
      KAFKA_AUTO_CREATE_TOPICS_ENABLE: "false"
      KAFKA_NUM_PARTITIONS: 6
      KAFKA_DEFAULT_REPLICATION_FACTOR: 1
      KAFKA_MIN_INSYNC_REPLICAS: 1
      # ── 트랜잭션 / 멱등 ──────────────────────────────────────
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_MIN_ISR: 1
      KAFKA_TRANSACTION_STATE_LOG_NUM_PARTITIONS: 50
      KAFKA_TRANSACTIONAL_ID_EXPIRATION_MS: 604800000
      # ── 로그 보관 ────────────────────────────────────────────
      KAFKA_LOG_RETENTION_HOURS: 168
      KAFKA_LOG_SEGMENT_BYTES: 1073741824
      KAFKA_LOG_RETENTION_CHECK_INTERVAL_MS: 300000
      # ── Log Cleaner (Compacted 토픽용) ───────────────────────
      KAFKA_LOG_CLEANER_ENABLE: "true"
      KAFKA_LOG_CLEANER_THREADS: 2
      KAFKA_LOG_CLEANER_DEDUPE_BUFFER_SIZE: 134217728
      KAFKA_LOG_CLEANER_MIN_CLEANABLE_RATIO: "0.5"
      # ── 성능 ─────────────────────────────────────────────────
      KAFKA_NUM_NETWORK_THREADS: 3
      KAFKA_NUM_IO_THREADS: 8
      KAFKA_SOCKET_SEND_BUFFER_BYTES: 102400
      KAFKA_SOCKET_RECEIVE_BUFFER_BYTES: 102400
      KAFKA_SOCKET_REQUEST_MAX_BYTES: 104857600
      KAFKA_GROUP_INITIAL_REBALANCE_DELAY_MS: 100
      # ── JMX ──────────────────────────────────────────────────
      KAFKA_JMX_PORT: 9999
      KAFKA_JMX_HOSTNAME: kafka
      KAFKA_HEAP_OPTS: "-Xmx512m -Xms256m"
    ports:
      - "9092:9092"
      - "9999:9999"
    volumes:
      - kafka-data:/var/lib/kafka/data
    networks:
      idem-net:
        ipv4_address: 172.20.0.13
    healthcheck:
      test:
        - "CMD-SHELL"
        - "kafka-broker-api-versions --bootstrap-server localhost:9092 > /dev/null 2>&1"
      interval: 10s
      timeout: 10s
      retries: 10
      start_period: 30s
    deploy:
      resources:
        limits:
          memory: 1g
        reservations:
          memory: 512m
    logging: *log-defaults

  # ════════════════════════════════════════════════════════════
  # Kafka 토픽 초기화 (create-topics.sh)
  # ════════════════════════════════════════════════════════════
  kafka-init:
    image: confluentinc/cp-kafka:7.6.1
    container_name: idem-kafka-init
    depends_on:
      kafka:
        condition: service_healthy
    networks:
      - idem-net
    volumes:
      - ./kafka/create-topics.sh:/create-topics.sh:ro
    entrypoint: ["/bin/bash", "/create-topics.sh"]
    restart: on-failure

  # ════════════════════════════════════════════════════════════
  # Schema Registry (선택 — profile: schema)
  # ════════════════════════════════════════════════════════════
  schema-registry:
    image: confluentinc/cp-schema-registry:7.6.1
    container_name: idem-schema-registry
    restart: unless-stopped
    depends_on:
      kafka:
        condition: service_healthy
    environment:
      SCHEMA_REGISTRY_HOST_NAME: schema-registry
      SCHEMA_REGISTRY_KAFKASTORE_BOOTSTRAP_SERVERS: kafka:29092
      SCHEMA_REGISTRY_LISTENERS: http://0.0.0.0:8081
      SCHEMA_REGISTRY_KAFKASTORE_TOPIC_REPLICATION_FACTOR: 1
    ports:
      - "8085:8081"
    networks:
      idem-net:
        ipv4_address: 172.20.0.14
    healthcheck:
      test: ["CMD-SHELL", "curl -sf http://localhost:8081/subjects || exit 1"]
      interval: 15s
      timeout: 5s
      retries: 5
      start_period: 30s
    profiles:
      - schema
    logging: *log-small

  # ════════════════════════════════════════════════════════════
  # Kafka UI — http://localhost:8090  (admin/admin)
  # ════════════════════════════════════════════════════════════
  kafka-ui:
    image: provectuslabs/kafka-ui:latest
    container_name: idem-kafka-ui
    restart: unless-stopped
    depends_on:
      kafka:
        condition: service_healthy
    ports:
      - "8090:8080"
    environment:
      KAFKA_CLUSTERS_0_NAME: idem-local
      KAFKA_CLUSTERS_0_BOOTSTRAPSERVERS: kafka:29092
      KAFKA_CLUSTERS_0_ZOOKEEPER: zookeeper:2181
      KAFKA_CLUSTERS_0_JMXPORT: 9999
      DYNAMIC_CONFIG_ENABLED: "true"
      AUTH_TYPE: "LOGIN_FORM"
      SPRING_SECURITY_USER_NAME: admin
      SPRING_SECURITY_USER_PASSWORD: admin
    networks:
      idem-net:
        ipv4_address: 172.20.0.15
    healthcheck:
      test: ["CMD-SHELL", "curl -sf http://localhost:8080/actuator/health || exit 1"]
      interval: 15s
      timeout: 5s
      retries: 5
      start_period: 30s
    logging: *log-small

  # ════════════════════════════════════════════════════════════
  # Redis Insight — http://localhost:5540
  # ════════════════════════════════════════════════════════════
  redis-insight:
    image: redis/redisinsight:latest
    container_name: idem-redis-insight
    restart: unless-stopped
    ports:
      - "5540:5540"
    networks:
      idem-net:
        ipv4_address: 172.20.0.16
    depends_on:
      redis:
        condition: service_healthy
    logging: *log-small

  # ════════════════════════════════════════════════════════════
  # pgAdmin 4 — http://localhost:5050  (admin@onepass.local / admin)
  # profile: tools
  # ════════════════════════════════════════════════════════════
  pgadmin:
    image: dpage/pgadmin4:latest
    container_name: idem-pgadmin
    restart: unless-stopped
    environment:
      PGADMIN_DEFAULT_EMAIL: admin@onepass.local
      PGADMIN_DEFAULT_PASSWORD: admin
      PGADMIN_CONFIG_SERVER_MODE: "False"
      PGADMIN_CONFIG_MASTER_PASSWORD_REQUIRED: "False"
    ports:
      - "5050:80"
    volumes:
      - ./postgres/pgadmin-servers.json:/pgadmin4/servers.json:ro
    networks:
      idem-net:
        ipv4_address: 172.20.0.17
    depends_on:
      postgres:
        condition: service_healthy
    profiles:
      - tools
    logging: *log-small

  # ════════════════════════════════════════════════════════════
  # Keycloak 24.0 — OIDC 브로커 — http://localhost:8088
  # profile: keycloak
  #
  # Client secrets: realm-export.json과 반드시 일치해야 함
  #   q-sign-client → QSIGN_KEYCLOAK_CLIENT_SECRET
  #   ido-client    → KEYCLOAK_CLIENT_SECRET
  # 초기 기본값은 .env 파일의 change-me 값과 realm-export.json이 동일해야 함
  # ════════════════════════════════════════════════════════════
  keycloak:
    image: quay.io/keycloak/keycloak:24.0
    container_name: idem-keycloak
    restart: unless-stopped
    command: start-dev --http-port=8080 --import-realm
    environment:
      KEYCLOAK_ADMIN:          admin
      KEYCLOAK_ADMIN_PASSWORD: admin
      KC_DB:              postgres
      KC_DB_URL:          jdbc:postgresql://postgres:5432/onepass?currentSchema=keycloak
      KC_DB_USERNAME:     onepass
      KC_DB_PASSWORD:     onepass
      KC_DB_SCHEMA:       keycloak
      KC_HOSTNAME_STRICT:       "false"
      KC_HOSTNAME_STRICT_HTTPS: "false"
      KC_HTTP_ENABLED:          "true"
      KC_PROXY:                 edge
      KC_LOG_LEVEL:             INFO
    ports:
      - "8088:8080"
    volumes:
      - keycloak-data:/opt/keycloak/data
      - ./keycloak/realm-export.json:/opt/keycloak/data/import/realm-export.json:ro
    networks:
      idem-net:
        ipv4_address: 172.20.0.18
    depends_on:
      postgres:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "curl -sf http://localhost:8080/health/ready || exit 1"]
      interval: 20s
      timeout: 10s
      retries: 10
      start_period: 90s
    profiles:
      - keycloak
    logging: *log-defaults

  # ════════════════════════════════════════════════════════════
  # ★ Q-Sign — 인증 결과 SoR — http://localhost:8081
  # profile: app
  #
  # 빌드:
  #   ./gradlew :idem-gate:bootJar -x test
  #   docker build -f idem-gate/Dockerfile -t idem-gate:latest .
  # ════════════════════════════════════════════════════════════
  idem-gate:
    image: idem-gate:latest
    container_name: idem-gate
    restart: unless-stopped
    labels:
      <<: *promtail-label
      com.docker.compose.service: idem-gate
    environment:
      SPRING_PROFILES_ACTIVE: docker
      # ── PostgreSQL ──────────────────────────────────────────
      DB_HOST:     postgres
      DB_PORT:     "5432"
      DB_NAME:     onepass
      DB_USERNAME: onepass
      DB_PASSWORD: onepass
      # ── Redis / Kafka ───────────────────────────────────────
      REDIS_HOST:    redis
      REDIS_PORT:    "6379"
      KAFKA_SERVERS: kafka:29092
      # ── IdO 내부 통신 ───────────────────────────────────────
      IDO_BASE_URL:             http://idem-hub:8083
      IDO_INTERNAL_SIG_SECRET:  ${IDO_INTERNAL_SIG_SECRET:-change-me-32bytes-internal-sig-secret}
      # ── Keycloak 어댑터 ─────────────────────────────────────
      KEYCLOAK_URL:                  http://keycloak:8080
      KEYCLOAK_REALM:                onepass
      QSIGN_KEYCLOAK_CLIENT_ID:      q-sign-client
      # Sprint γ-1 / F2.1 후속: docker-compose 에서도 placeholder default 제거.
      QSIGN_KEYCLOAK_CLIENT_SECRET:  ${QSIGN_KEYCLOAK_CLIENT_SECRET:?QSIGN_KEYCLOAK_CLIENT_SECRET 환경변수가 설정되지 않았습니다. 호스트 .env 또는 셸에서 주입하십시오.}
      QSIGN_KEYCLOAK_REDIRECT_URI:   http://localhost:8081/api/v1/oidc/keycloak/callback
      QSIGN_INTERNAL_SIG_STRICT:     "false"
    ports:
      - "8081:8081"
    networks:
      idem-net:
        ipv4_address: 172.20.0.24
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      kafka:
        condition: service_healthy
      kafka-init:
        condition: service_completed_successfully
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://localhost:8081/actuator/health || exit 1"]
      interval: 15s
      timeout: 5s
      retries: 5
      start_period: 60s
    profiles:
      - app
    logging: *log-defaults

  # ════════════════════════════════════════════════════════════
  # ★ Q-IM — 식별·매핑 SoR — http://localhost:8082
  # profile: app
  #
  # 빌드:
  #   ./gradlew :idem-registry:bootJar -x test
  #   docker build -f idem-registry/Dockerfile -t idem-registry:latest .
  # ════════════════════════════════════════════════════════════
  idem-registry:
    image: idem-registry:latest
    container_name: idem-registry
    restart: unless-stopped
    labels:
      <<: *promtail-label
      com.docker.compose.service: idem-registry
    environment:
      SPRING_PROFILES_ACTIVE: docker
      # ── PostgreSQL (D1: hub 와 같은 인스턴스, 스키마 qim) ───────
      QIM_DB_HOST:     postgres
      QIM_DB_PORT:     "5432"
      QIM_DB_NAME:     onepass
      QIM_DB_SCHEMA:   qim
      QIM_DB_USERNAME: onepass
      QIM_DB_PASSWORD: onepass
      QIM_DB_SSL:      "false"
      # ── Redis / Kafka ───────────────────────────────────────
      REDIS_HOST:    redis
      REDIS_PORT:    "6379"
      KAFKA_SERVERS: kafka:29092
      # ── 내부 API 보안 (IdO → Q-IM 호출용 X-Internal-Api-Key) ──
      # 운영: 최소 32자 무작위 문자열, .env 또는 K8s Secret으로 주입
      QIM_INTERNAL_API_KEY: ${QIM_INTERNAL_API_KEY:-dev-qim-internal-api-key-change-me}
    ports:
      - "8082:8082"
    networks:
      idem-net:
        ipv4_address: 172.20.0.22
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      kafka:
        condition: service_healthy
      kafka-init:
        condition: service_completed_successfully
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://localhost:8082/actuator/health || exit 1"]
      interval: 15s
      timeout: 5s
      retries: 5
      start_period: 30s
    profiles:
      - app
    logging: *log-defaults

  # ════════════════════════════════════════════════════════════
  # ★ IdO — 정책 오케스트레이터 + FE BFF — http://localhost:8083
  # profile: app
  #
  # 빌드:
  #   ./gradlew :idem-hub:bootJar -x test
  #   docker build -f idem-hub/Dockerfile -t idem-hub:latest .
  # ════════════════════════════════════════════════════════════
  idem-hub:
    image: idem-hub:latest
    container_name: idem-hub
    restart: unless-stopped
    labels:
      <<: *promtail-label
      com.docker.compose.service: idem-hub
    environment:
      SPRING_PROFILES_ACTIVE: docker
      # ── PostgreSQL ──────────────────────────────────────────
      DB_HOST:     postgres
      DB_PORT:     "5432"
      DB_NAME:     onepass
      DB_USERNAME: onepass
      DB_PASSWORD: onepass
      # ── Redis / Kafka ───────────────────────────────────────
      REDIS_HOST:    redis
      REDIS_PORT:    "6379"
      KAFKA_SERVERS: kafka:29092
      # ── 백엔드 서비스 URL ───────────────────────────────────
      QIM_BASE_URL:   http://idem-registry:8082
      QSIGN_BASE_URL: http://idem-gate:8081
      # ── Q-IM 내부 API 호출 키 (IdO → Q-IM X-Internal-Api-Key) ──
      # Q-IM의 QIM_INTERNAL_API_KEY와 반드시 동일해야 함
      IDO_QIM_INTERNAL_API_KEY: ${QIM_INTERNAL_API_KEY:-dev-qim-internal-api-key-change-me}
      # ── Q-Sign 내부 서명 비밀키 ─────────────────────────────
      IDO_INTERNAL_SIG_SECRET: ${IDO_INTERNAL_SIG_SECRET:-change-me-32bytes-internal-sig-secret}
      # ── CORS ─────────────────────────────────────────────────
      CORS_ORIGIN_DEV:  http://localhost:3000
      CORS_ORIGIN_PROD: http://localhost:3001
      # ── 브로커 모드 (qsign 또는 keycloak) ───────────────────
      IDO_BROKER_MODE: ${IDO_BROKER_MODE:-qsign}
      # ── Keycloak OIDC 브로커 (mode=keycloak 전환 시 활성화) ──
      KEYCLOAK_BASE_URL:      http://keycloak:8080
      KEYCLOAK_REALM:         onepass
      KEYCLOAK_CLIENT_ID:     ido-client
      # Sprint γ-1 / γ-3 후속: docker-compose 에서도 placeholder default 제거.
      # 호스트 .env 또는 셸에서 환경변수 주입 필수. 미주입 시 컨테이너가
      # CrashLoopBackOff 로 빠져 운영자가 즉시 인지 가능 (의도된 동작).
      # 32바이트 키 생성: openssl rand -base64 32
      KEYCLOAK_CLIENT_SECRET: ${KEYCLOAK_CLIENT_SECRET:?KEYCLOAK_CLIENT_SECRET 환경변수가 설정되지 않았습니다. 호스트 .env 또는 셸에서 주입하십시오.}
      KEYCLOAK_REDIRECT_URI:  http://localhost:8083/api/v1/broker/callback
      # ── Webhook ──────────────────────────────────────────────
      IDO_WEBHOOK_SIGNING_SECRET: ${IDO_WEBHOOK_SIGNING_SECRET:?IDO_WEBHOOK_SIGNING_SECRET 환경변수가 설정되지 않았습니다. openssl rand -hex 32 로 생성하여 주입하십시오.}
      # ── Handoff 암호화 키 (운영: Vault/KMS 주입, 로컬: 무작위 32바이트 키) ──
      IDO_HANDOFF_AES_KEY:  ${IDO_HANDOFF_AES_KEY:?IDO_HANDOFF_AES_KEY 환경변수가 설정되지 않았습니다. openssl rand -base64 32 로 생성하여 주입하십시오.}
      IDO_HANDOFF_HMAC_KEY: ${IDO_HANDOFF_HMAC_KEY:?IDO_HANDOFF_HMAC_KEY 환경변수가 설정되지 않았습니다. openssl rand -base64 32 로 생성하여 주입하십시오.}
    ports:
      - "8083:8083"
    networks:
      idem-net:
        ipv4_address: 172.20.0.19
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      kafka:
        condition: service_healthy
      kafka-init:
        condition: service_completed_successfully
      idem-registry:
        condition: service_healthy
      idem-gate:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://localhost:8083/actuator/health || exit 1"]
      interval: 15s
      timeout: 5s
      retries: 5
      start_period: 45s
    profiles:
      - app
    logging: *log-defaults

  # ════════════════════════════════════════════════════════════
  # ★ Agency-Stub — 유관기관 OIDC 클라이언트 시뮬레이터
  # http://localhost:8084
  # profile: app
  #
  # 빌드:
  #   ./gradlew :idem-tenant-sample:bootJar -x test
  #   docker build -f idem-tenant-sample/Dockerfile -t idem-tenant-sample:latest .
  # ════════════════════════════════════════════════════════════
  idem-tenant-sample:
    image: idem-tenant-sample:latest
    container_name: idem-tenant-sample
    restart: unless-stopped
    labels:
      <<: *promtail-label
      com.docker.compose.service: idem-tenant-sample
    environment:
      SPRING_PROFILES_ACTIVE: docker
      DB_HOST:     postgres
      DB_PORT:     "5432"
      DB_NAME:     onepass
      DB_USERNAME: onepass
      DB_PASSWORD: onepass
      REDIS_HOST:    redis
      REDIS_PORT:    "6379"
      KAFKA_SERVERS: kafka:29092
      IDO_BASE_URL:  http://idem-hub:8083
      AGENCY_API_KEY:             ${AGENCY_API_KEY:-stub-api-key-dev-001}
      IDO_WEBHOOK_SIGNING_SECRET: ${IDO_WEBHOOK_SIGNING_SECRET:-poc-webhook-secret-change-in-production}
    ports:
      - "8084:8084"
    networks:
      idem-net:
        ipv4_address: 172.20.0.25
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      kafka:
        condition: service_healthy
      kafka-init:
        condition: service_completed_successfully
      idem-hub:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://localhost:8084/actuator/health || exit 1"]
      interval: 15s
      timeout: 5s
      retries: 5
      start_period: 60s
    profiles:
      - app
    logging: *log-defaults

  # ════════════════════════════════════════════════════════════
  # ★ React SPA (Nginx) — idem-console — http://localhost:3001
  # profile: optionB
  #
  # build context: 프로젝트 루트 (nginx.conf 참조 가능)
  # Dockerfile.optionB는 context 내부 상대경로 사용
  # ════════════════════════════════════════════════════════════
  idem-console:
    build:
      # context를 프로젝트 루트로 설정 → infra/docker/nginx/nginx.conf COPY 가능
      context: ../..
      dockerfile: idem-console/Dockerfile.optionB
      target: react-nginx
    image: idem-console:latest
    container_name: idem-console
    restart: unless-stopped
    labels:
      <<: *promtail-label
      com.docker.compose.service: idem-console
    ports:
      - "3001:80"
    networks:
      idem-net:
        ipv4_address: 172.20.0.20
    depends_on:
      idem-hub:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://localhost/nginx-health || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 15s
    profiles:
      - optionB
    logging: *log-small

  # ════════════════════════════════════════════════════════════
  # Prometheus — http://localhost:9090
  # profile: monitoring
  # ════════════════════════════════════════════════════════════
  prometheus:
    image: prom/prometheus:v2.51.2
    container_name: idem-prometheus
    restart: unless-stopped
    command:
      - '--config.file=/etc/prometheus/prometheus.yml'
      - '--storage.tsdb.path=/prometheus'
      - '--storage.tsdb.retention.time=15d'
      - '--web.console.libraries=/usr/share/prometheus/console_libraries'
      - '--web.console.templates=/usr/share/prometheus/consoles'
      - '--web.enable-lifecycle'
    ports:
      - "9090:9090"
    volumes:
      - ../monitoring/prometheus/prometheus.yml:/etc/prometheus/prometheus.yml:ro
      - ../monitoring/prometheus/alert_rules.yml:/etc/prometheus/alert_rules.yml:ro
      - prometheus-data:/prometheus
    networks:
      idem-net:
        ipv4_address: 172.20.0.50
    extra_hosts:
      - "host.docker.internal:host-gateway"
    profiles:
      - monitoring
    logging: *log-small
    deploy:
      resources:
        limits:
          memory: 512m

  # ════════════════════════════════════════════════════════════
  # Grafana — http://localhost:3002  (admin/admin)
  # profile: monitoring
  # ════════════════════════════════════════════════════════════
  grafana:
    image: grafana/grafana:10.4.2
    container_name: idem-grafana
    restart: unless-stopped
    environment:
      GF_SECURITY_ADMIN_USER:     admin
      GF_SECURITY_ADMIN_PASSWORD: admin
      GF_USERS_ALLOW_SIGN_UP:     "false"
      GF_SERVER_ROOT_URL:         "http://localhost:3002"
      GF_INSTALL_PLUGINS:         "grafana-clock-panel"
      GF_DASHBOARDS_DEFAULT_HOME_DASHBOARD_PATH: /var/lib/grafana/dashboards/idem-overview.json
    ports:
      - "3002:3000"
    volumes:
      - grafana-data:/var/lib/grafana
      - ../monitoring/grafana/provisioning:/etc/grafana/provisioning:ro
      # dashboards 실제 경로: infra/monitoring/dashboards/
      - ../monitoring/dashboards:/var/lib/grafana/dashboards:ro
    networks:
      idem-net:
        ipv4_address: 172.20.0.51
    depends_on:
      - prometheus
    profiles:
      - monitoring
    logging: *log-small
    deploy:
      resources:
        limits:
          memory: 256m

  # ════════════════════════════════════════════════════════════
  # Loki — http://localhost:3100
  # profile: monitoring
  # ════════════════════════════════════════════════════════════
  loki:
    image: grafana/loki:3.0.0
    container_name: idem-loki
    restart: unless-stopped
    ports:
      - "3100:3100"
    command: -config.file=/etc/loki/loki-config.yml
    volumes:
      - ../monitoring/loki/loki-config.yml:/etc/loki/loki-config.yml:ro
      - loki-data:/tmp/loki
    networks:
      idem-net:
        ipv4_address: 172.20.0.52
    profiles:
      - monitoring
    logging: *log-small
    deploy:
      resources:
        limits:
          memory: 256m

  # ════════════════════════════════════════════════════════════
  # Promtail — 컨테이너 로그 수집 → Loki
  # profile: monitoring
  #
  # 수집 대상: labels.logging=promtail 이 설정된 컨테이너
  # ════════════════════════════════════════════════════════════
  promtail:
    image: grafana/promtail:3.0.0
    container_name: idem-promtail
    restart: unless-stopped
    volumes:
      - ../monitoring/promtail/promtail-config.yml:/etc/promtail/promtail-config.yml:ro
      - /var/run/docker.sock:/var/run/docker.sock:ro
      - /var/log:/var/log:ro
    command: -config.file=/etc/promtail/promtail-config.yml
    networks:
      idem-net:
        ipv4_address: 172.20.0.53
    depends_on:
      - loki
    profiles:
      - monitoring
    logging: *log-small
