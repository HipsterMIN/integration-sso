# SSO/IM application containers.
#
# Compose this file only when the application secrets are available:
#   IDEM_GATE_KEYCLOAK_CLIENT_SECRET, KEYCLOAK_CLIENT_SECRET,
#   IDEM_HUB_WEBHOOK_SIGNING_SECRET, IDEM_HUB_HANDOFF_AES_KEY, IDEM_HUB_HANDOFF_HMAC_KEY.

x-log-defaults: &log-defaults
  driver: json-file
  options:
    max-size: "20m"
    max-file: "5"

x-log-small: &log-small
  driver: json-file
  options:
    max-size: "10m"
    max-file: "3"

x-promtail-label: &promtail-label
  logging: "promtail"

services:
  idem-gate:
    image: idem-gate:latest
    container_name: idem-gate
    restart: unless-stopped
    labels:
      <<: *promtail-label
      com.docker.compose.service: idem-gate
    environment:
      SPRING_PROFILES_ACTIVE: docker
      DB_HOST: postgres
      DB_PORT: "5432"
      DB_NAME: onepass
      DB_USERNAME: onepass
      DB_PASSWORD: onepass
      REDIS_HOST: redis
      REDIS_PORT: "6379"
      KAFKA_SERVERS: kafka:29092
      IDEM_KAFKA_ENABLED: "true"   # D1-b: 이 스택은 Kafka 를 띄우므로 Kafka 경로. 없이 설치하려면 compose.install.yml
      IDEM_HUB_BASE_URL: http://idem-hub:8083
      IDEM_HUB_INTERNAL_SIG_SECRET: ${IDEM_HUB_INTERNAL_SIG_SECRET:-change-me-32bytes-internal-sig-secret}
      KEYCLOAK_URL: http://keycloak:8080
      KEYCLOAK_REALM: onepass
      IDEM_GATE_KEYCLOAK_CLIENT_ID: q-sign-client
      IDEM_GATE_KEYCLOAK_CLIENT_SECRET: ${IDEM_GATE_KEYCLOAK_CLIENT_SECRET:?IDEM_GATE_KEYCLOAK_CLIENT_SECRET 환경변수가 설정되지 않았습니다.}
      IDEM_GATE_KEYCLOAK_REDIRECT_URI: http://localhost:8081/api/v1/oidc/keycloak/callback
      IDEM_GATE_INTERNAL_SIG_STRICT: "false"
    ports:
      - "8081:8081"
    networks:
      idem-net:
        ipv4_address: 172.20.0.24
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      kafka:
        condition: service_healthy
      kafka-init:
        condition: service_completed_successfully
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://localhost:8081/actuator/health || exit 1"]
      interval: 15s
      timeout: 5s
      retries: 5
      start_period: 60s
    profiles:
      - app
    logging: *log-defaults

  idem-registry:
    image: idem-registry:latest
    container_name: idem-registry
    restart: unless-stopped
    labels:
      <<: *promtail-label
      com.docker.compose.service: idem-registry
    environment:
      SPRING_PROFILES_ACTIVE: docker
      IDEM_REGISTRY_DB_HOST: postgres
      IDEM_REGISTRY_DB_PORT: "5432"
      IDEM_REGISTRY_DB_NAME: onepass
      IDEM_REGISTRY_DB_SCHEMA: qim
      IDEM_REGISTRY_DB_USERNAME: onepass
      IDEM_REGISTRY_DB_PASSWORD: onepass
      IDEM_REGISTRY_DB_SSL: "false"
      REDIS_HOST: redis
      REDIS_PORT: "6379"
      KAFKA_SERVERS: kafka:29092
      IDEM_KAFKA_ENABLED: "true"   # D1-b: 이 스택은 Kafka 를 띄우므로 Kafka 경로. 없이 설치하려면 compose.install.yml
      IDEM_REGISTRY_INTERNAL_API_KEY: ${IDEM_REGISTRY_INTERNAL_API_KEY:-dev-qim-internal-api-key-change-me}
    ports:
      - "8082:8082"
    networks:
      idem-net:
        ipv4_address: 172.20.0.22
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      kafka:
        condition: service_healthy
      kafka-init:
        condition: service_completed_successfully
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://localhost:8082/actuator/health || exit 1"]
      interval: 15s
      timeout: 5s
      retries: 5
      start_period: 30s
    profiles:
      - app
    logging: *log-defaults

  idem-hub:
    image: idem-hub:latest
    container_name: idem-hub
    restart: unless-stopped
    labels:
      <<: *promtail-label
      com.docker.compose.service: idem-hub
    environment:
      SPRING_PROFILES_ACTIVE: docker
      DB_HOST: postgres
      DB_PORT: "5432"
      DB_NAME: onepass
      DB_USERNAME: onepass
      DB_PASSWORD: onepass
      REDIS_HOST: redis
      REDIS_PORT: "6379"
      KAFKA_SERVERS: kafka:29092
      IDEM_KAFKA_ENABLED: "true"   # D1-b: 이 스택은 Kafka 를 띄우므로 Kafka 경로. 없이 설치하려면 compose.install.yml
      # D2 fail-secure 탈출구 — 개발 스택 전용 (prod/stage 프로파일에서는 FailSecureBootGuard 가 기동을 거부한다)
      IDEM_HUB_AUTHZ_ENABLED: "false"             # 이 스택에는 idem-authz 가 없다
      IDEM_HUB_CAST_ALLOW_GENERATED_KEYS: "true"   # CAST 서명키 임시 생성 허용
      IDEM_HUB_REGISTRY_ALLOW_EMPTY_AES_KEY: "true"     # registry 공유키 없이 기동 허용
      IDEM_REGISTRY_BASE_URL: http://idem-registry:8082
      IDEM_GATE_BASE_URL: http://idem-gate:8081
      IDEM_HUB_REGISTRY_INTERNAL_API_KEY: ${IDEM_REGISTRY_INTERNAL_API_KEY:-dev-qim-internal-api-key-change-me}
      IDEM_HUB_INTERNAL_SIG_SECRET: ${IDEM_HUB_INTERNAL_SIG_SECRET:-change-me-32bytes-internal-sig-secret}
      CORS_ORIGIN_DEV: http://localhost:3000
      CORS_ORIGIN_PROD: http://localhost:3001
      IDEM_HUB_BROKER_MODE: ${IDEM_HUB_BROKER_MODE:-qsign}
      KEYCLOAK_BASE_URL: http://keycloak:8080
      KEYCLOAK_REALM: onepass
      KEYCLOAK_CLIENT_ID: ido-client
      KEYCLOAK_CLIENT_SECRET: ${KEYCLOAK_CLIENT_SECRET:?KEYCLOAK_CLIENT_SECRET 환경변수가 설정되지 않았습니다.}
      KEYCLOAK_REDIRECT_URI: http://localhost:8083/api/v1/broker/callback
      IDEM_HUB_WEBHOOK_SIGNING_SECRET: ${IDEM_HUB_WEBHOOK_SIGNING_SECRET:?IDEM_HUB_WEBHOOK_SIGNING_SECRET 환경변수가 설정되지 않았습니다.}
      IDEM_HUB_HANDOFF_AES_KEY: ${IDEM_HUB_HANDOFF_AES_KEY:?IDEM_HUB_HANDOFF_AES_KEY 환경변수가 설정되지 않았습니다.}
      IDEM_HUB_HANDOFF_HMAC_KEY: ${IDEM_HUB_HANDOFF_HMAC_KEY:?IDEM_HUB_HANDOFF_HMAC_KEY 환경변수가 설정되지 않았습니다.}
    ports:
      - "8083:8083"
    networks:
      idem-net:
        ipv4_address: 172.20.0.19
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      kafka:
        condition: service_healthy
      kafka-init:
        condition: service_completed_successfully
      idem-registry:
        condition: service_healthy
      idem-gate:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://localhost:8083/actuator/health || exit 1"]
      interval: 15s
      timeout: 5s
      retries: 5
      start_period: 45s
    profiles:
      - app
    logging: *log-defaults

  idem-tenant-sample:
    image: idem-tenant-sample:latest
    container_name: idem-tenant-sample
    restart: unless-stopped
    labels:
      <<: *promtail-label
      com.docker.compose.service: idem-tenant-sample
    environment:
      SPRING_PROFILES_ACTIVE: docker
      DB_HOST: postgres
      DB_PORT: "5432"
      DB_NAME: onepass
      DB_USERNAME: onepass
      DB_PASSWORD: onepass
      REDIS_HOST: redis
      REDIS_PORT: "6379"
      KAFKA_SERVERS: kafka:29092
      IDEM_KAFKA_ENABLED: "true"   # D1-b: 이 스택은 Kafka 를 띄우므로 Kafka 경로. 없이 설치하려면 compose.install.yml
      IDEM_HUB_BASE_URL: http://idem-hub:8083
      AGENCY_API_KEY: ${AGENCY_API_KEY:-stub-api-key-dev-001}
      IDEM_HUB_WEBHOOK_SIGNING_SECRET: ${IDEM_HUB_WEBHOOK_SIGNING_SECRET:-poc-webhook-secret-change-in-production}
    ports:
      - "8084:8084"
    networks:
      idem-net:
        ipv4_address: 172.20.0.25
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      kafka:
        condition: service_healthy
      kafka-init:
        condition: service_completed_successfully
      idem-hub:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://localhost:8084/actuator/health || exit 1"]
      interval: 15s
      timeout: 5s
      retries: 5
      start_period: 60s
    profiles:
      - app
    logging: *log-defaults

  idem-kr-portal:   # 구 idem-console (KR 에디션 회원 포털, S7 PR-2). 코어 관리 콘솔은 compose.install.yml 의 idem-console-admin
    build:
      context: ../..
      dockerfile: editions/idem-kr-portal/Dockerfile.optionB
      target: react-nginx
    image: idem-kr-portal:latest
    container_name: idem-kr-portal
    restart: unless-stopped
    labels:
      <<: *promtail-label
      com.docker.compose.service: idem-kr-portal
    ports:
      - "3001:80"
    networks:
      idem-net:
        ipv4_address: 172.20.0.26
    depends_on:
      idem-hub:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://localhost/nginx-health || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 15s
    profiles:
      - optionB
    logging: *log-small
