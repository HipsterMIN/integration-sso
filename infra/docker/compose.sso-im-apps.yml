# SSO/IM application containers.
#
# Compose this file only when the application secrets are available:
#   QSIGN_KEYCLOAK_CLIENT_SECRET, KEYCLOAK_CLIENT_SECRET,
#   IDO_WEBHOOK_SIGNING_SECRET, IDO_HANDOFF_AES_KEY, IDO_HANDOFF_HMAC_KEY.

x-log-defaults: &log-defaults
  driver: json-file
  options:
    max-size: "20m"
    max-file: "5"

x-log-small: &log-small
  driver: json-file
  options:
    max-size: "10m"
    max-file: "3"

x-promtail-label: &promtail-label
  logging: "promtail"

services:
  onepass-qsign:
    image: onepass-qsign:latest
    container_name: onepass-qsign
    restart: unless-stopped
    labels:
      <<: *promtail-label
      com.docker.compose.service: onepass-qsign
    environment:
      SPRING_PROFILES_ACTIVE: docker
      DB_HOST: postgres
      DB_PORT: "5432"
      DB_NAME: onepass
      DB_USERNAME: onepass
      DB_PASSWORD: onepass
      REDIS_HOST: redis
      REDIS_PORT: "6379"
      KAFKA_SERVERS: kafka:29092
      IDO_BASE_URL: http://onepass-ido:8083
      IDO_INTERNAL_SIG_SECRET: ${IDO_INTERNAL_SIG_SECRET:-change-me-32bytes-internal-sig-secret}
      KEYCLOAK_URL: http://keycloak:8080
      KEYCLOAK_REALM: onepass
      QSIGN_KEYCLOAK_CLIENT_ID: q-sign-client
      QSIGN_KEYCLOAK_CLIENT_SECRET: ${QSIGN_KEYCLOAK_CLIENT_SECRET:?QSIGN_KEYCLOAK_CLIENT_SECRET 환경변수가 설정되지 않았습니다.}
      QSIGN_KEYCLOAK_REDIRECT_URI: http://localhost:8081/api/v1/oidc/keycloak/callback
      QSIGN_INTERNAL_SIG_STRICT: "false"
    ports:
      - "8081:8081"
    networks:
      onepass-net:
        ipv4_address: 172.20.0.24
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      kafka:
        condition: service_healthy
      kafka-init:
        condition: service_completed_successfully
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://localhost:8081/actuator/health || exit 1"]
      interval: 15s
      timeout: 5s
      retries: 5
      start_period: 60s
    profiles:
      - app
    logging: *log-defaults

  onepass-qim:
    image: onepass-qim:latest
    container_name: onepass-qim
    restart: unless-stopped
    labels:
      <<: *promtail-label
      com.docker.compose.service: onepass-qim
    environment:
      SPRING_PROFILES_ACTIVE: docker
      QIM_DB_HOST: mariadb
      QIM_DB_PORT: "3306"
      QIM_DB_NAME: qim
      QIM_DB_USERNAME: qim
      QIM_DB_PASSWORD: qim
      QIM_DB_SSL: "false"
      REDIS_HOST: redis
      REDIS_PORT: "6379"
      KAFKA_SERVERS: kafka:29092
      QIM_INTERNAL_API_KEY: ${QIM_INTERNAL_API_KEY:-dev-qim-internal-api-key-change-me}
    ports:
      - "8082:8082"
    networks:
      onepass-net:
        ipv4_address: 172.20.0.22
    depends_on:
      mariadb:
        condition: service_healthy
      redis:
        condition: service_healthy
      kafka:
        condition: service_healthy
      kafka-init:
        condition: service_completed_successfully
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://localhost:8082/actuator/health || exit 1"]
      interval: 15s
      timeout: 5s
      retries: 5
      start_period: 30s
    profiles:
      - app
    logging: *log-defaults

  onepass-ido:
    image: onepass-ido:latest
    container_name: onepass-ido
    restart: unless-stopped
    labels:
      <<: *promtail-label
      com.docker.compose.service: onepass-ido
    environment:
      SPRING_PROFILES_ACTIVE: docker
      DB_HOST: postgres
      DB_PORT: "5432"
      DB_NAME: onepass
      DB_USERNAME: onepass
      DB_PASSWORD: onepass
      REDIS_HOST: redis
      REDIS_PORT: "6379"
      KAFKA_SERVERS: kafka:29092
      QIM_BASE_URL: http://onepass-qim:8082
      QSIGN_BASE_URL: http://onepass-qsign:8081
      IDO_QIM_INTERNAL_API_KEY: ${QIM_INTERNAL_API_KEY:-dev-qim-internal-api-key-change-me}
      IDO_INTERNAL_SIG_SECRET: ${IDO_INTERNAL_SIG_SECRET:-change-me-32bytes-internal-sig-secret}
      CORS_ORIGIN_DEV: http://localhost:3000
      CORS_ORIGIN_PROD: http://localhost:3001
      IDO_BROKER_MODE: ${IDO_BROKER_MODE:-qsign}
      KEYCLOAK_BASE_URL: http://keycloak:8080
      KEYCLOAK_REALM: onepass
      KEYCLOAK_CLIENT_ID: ido-client
      KEYCLOAK_CLIENT_SECRET: ${KEYCLOAK_CLIENT_SECRET:?KEYCLOAK_CLIENT_SECRET 환경변수가 설정되지 않았습니다.}
      KEYCLOAK_REDIRECT_URI: http://localhost:8083/api/v1/broker/callback
      IDO_WEBHOOK_SIGNING_SECRET: ${IDO_WEBHOOK_SIGNING_SECRET:?IDO_WEBHOOK_SIGNING_SECRET 환경변수가 설정되지 않았습니다.}
      IDO_HANDOFF_AES_KEY: ${IDO_HANDOFF_AES_KEY:?IDO_HANDOFF_AES_KEY 환경변수가 설정되지 않았습니다.}
      IDO_HANDOFF_HMAC_KEY: ${IDO_HANDOFF_HMAC_KEY:?IDO_HANDOFF_HMAC_KEY 환경변수가 설정되지 않았습니다.}
    ports:
      - "8083:8083"
    networks:
      onepass-net:
        ipv4_address: 172.20.0.19
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      kafka:
        condition: service_healthy
      kafka-init:
        condition: service_completed_successfully
      onepass-qim:
        condition: service_healthy
      onepass-qsign:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://localhost:8083/actuator/health || exit 1"]
      interval: 15s
      timeout: 5s
      retries: 5
      start_period: 45s
    profiles:
      - app
    logging: *log-defaults

  onepass-agency-stub:
    image: onepass-agency-stub:latest
    container_name: onepass-agency-stub
    restart: unless-stopped
    labels:
      <<: *promtail-label
      com.docker.compose.service: onepass-agency-stub
    environment:
      SPRING_PROFILES_ACTIVE: docker
      DB_HOST: postgres
      DB_PORT: "5432"
      DB_NAME: onepass
      DB_USERNAME: onepass
      DB_PASSWORD: onepass
      REDIS_HOST: redis
      REDIS_PORT: "6379"
      KAFKA_SERVERS: kafka:29092
      IDO_BASE_URL: http://onepass-ido:8083
      AGENCY_API_KEY: ${AGENCY_API_KEY:-stub-api-key-dev-001}
      IDO_WEBHOOK_SIGNING_SECRET: ${IDO_WEBHOOK_SIGNING_SECRET:-poc-webhook-secret-change-in-production}
    ports:
      - "8084:8084"
    networks:
      onepass-net:
        ipv4_address: 172.20.0.25
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      kafka:
        condition: service_healthy
      kafka-init:
        condition: service_completed_successfully
      onepass-ido:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://localhost:8084/actuator/health || exit 1"]
      interval: 15s
      timeout: 5s
      retries: 5
      start_period: 60s
    profiles:
      - app
    logging: *log-defaults

  onepass-react:
    build:
      context: ../..
      dockerfile: onepass-fe/Dockerfile.optionB
      target: react-nginx
    image: onepass-react:latest
    container_name: onepass-react
    restart: unless-stopped
    labels:
      <<: *promtail-label
      com.docker.compose.service: onepass-react
    ports:
      - "3001:80"
    networks:
      onepass-net:
        ipv4_address: 172.20.0.26
    depends_on:
      onepass-ido:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://localhost/nginx-health || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 15s
    profiles:
      - optionB
    logging: *log-small
