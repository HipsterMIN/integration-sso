# OnePass Support isolated stack.
#
# Use cases:
#   docker compose -f infra/docker/compose.base.yml -f infra/docker/compose.support.yml up -d support-postgres
#   docker compose -f infra/docker/compose.base.yml -f infra/docker/compose.support.yml up -d
#
# Host JDBC:
#   jdbc:postgresql://localhost:5433/onepass_support?currentSchema=support
#
# Container JDBC:
#   jdbc:postgresql://support-postgres:5432/onepass_support?currentSchema=support

volumes:
  support-pg-data:

services:
  support-postgres:
    image: postgres:16-alpine
    container_name: onepass-support-postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${SUPPORT_POSTGRES_USER:-onepass_support}
      POSTGRES_PASSWORD: ${SUPPORT_POSTGRES_PASSWORD:-onepass_support}
      POSTGRES_DB: ${SUPPORT_POSTGRES_DB:-onepass_support}
      POSTGRES_INITDB_ARGS: "--encoding=UTF8 --locale=en_US.utf8"
      TZ: UTC
      PGTZ: UTC
    ports:
      - "${SUPPORT_POSTGRES_PORT:-5433}:5432"
    volumes:
      - support-pg-data:/var/lib/postgresql/data
      - ./postgres/postgresql.conf:/etc/postgresql/postgresql.conf:ro
      - ./postgres/pg_hba.conf:/etc/postgresql/pg_hba.conf:ro
    command: >
      postgres
        -c config_file=/etc/postgresql/postgresql.conf
        -c hba_file=/etc/postgresql/pg_hba.conf
    networks:
      onepass-net:
        ipv4_address: 172.20.0.30
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 5s
      timeout: 5s
      retries: 10
      start_period: 15s
    deploy:
      resources:
        limits:
          memory: 512m
        reservations:
          memory: 256m
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"

  onepass-support:
    build:
      context: ../..
      dockerfile: onepass-support/Dockerfile
    image: onepass-support:latest
    container_name: onepass-support
    restart: unless-stopped
    environment:
      SPRING_PROFILES_ACTIVE: docker
      SUPPORT_DB_HOST: support-postgres
      SUPPORT_DB_PORT: "5432"
      SUPPORT_DB_NAME: ${SUPPORT_POSTGRES_DB:-onepass_support}
      SUPPORT_DB_USERNAME: ${SUPPORT_POSTGRES_USER:-onepass_support}
      SUPPORT_DB_PASSWORD: ${SUPPORT_POSTGRES_PASSWORD:-onepass_support}
      SUPPORT_DB_SSLMODE: disable
    ports:
      - "${SUPPORT_APP_PORT:-8085}:8085"
    networks:
      onepass-net:
        ipv4_address: 172.20.0.31
    depends_on:
      support-postgres:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://localhost:8085/actuator/health || exit 1"]
      interval: 15s
      timeout: 5s
      retries: 5
      start_period: 45s
    profiles:
      - support-app
    logging:
      driver: json-file
      options:
        max-size: "20m"
        max-file: "5"
