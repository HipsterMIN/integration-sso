# ============================================================
# Any-ID SSO 어댑터 설정 — 로컬 개발 환경 (dev 키 기준)
# 기관번호: #311 / srvc_No: 1000001157
# 기관명:   중소기업기술정보진흥원 (중소벤처24기업마당)
#
# 참조: wiki/iam/07-sso-session.md §3.1 SSO 어댑터 설정
# 원본: 별첨2.(개발KEY)311_중소기업기술정보진흥원_중소벤처24기업마당.xlsx
#       [sso-adaptor-conf.properties] 탭
#
# 운영: sso-adaptor-conf-prod.properties 또는 K8s Secret으로 주입
# 주의: secret.code 는 절대 Git에 평문 커밋 금지 (운영 환경에서는 Vault/KMS 주입)
# ============================================================

# ── 기관 식별자 ──────────────────────────────────────────────
anyid.adaptor.agency.code=1000001157

# ── Any-ID 포털 (관리/프로비저닝 API) ────────────────────────
anyid.adaptor.portal.domain=https://www.anyid.dev
anyid.adaptor.portal.port=1451

# ── Any-ID SSO 서버 ──────────────────────────────────────────
anyid.adaptor.sso.domain=https://sso.anyid.dev
anyid.adaptor.sso.port=1452

# ── SSO HMAC 서명 검증 시크릿 (Base64, HMAC-SHA256) ──────────
# 행안부 발급 개발키 — 운영 시 반드시 별도 운영키로 교체
# 환경변수 주입 권장: ANYID_SSO_SECRET_CODE
anyid.adaptor.sso.secret.code=WDtDc2ek56S0kLKttE8Ux7BomxcOyTPpe0CfzdxSobI=

# ── SSO 세션 설정 ─────────────────────────────────────────────
# SSO 세션 토큰 유효 시간 (초) — 기본 3600s (1시간)
anyid.adaptor.sso.session.ttl.seconds=3600
# SSO 쿠키 이름 (기관 도메인 쿠키)
anyid.adaptor.sso.cookie.name=ANYID_SSO
# SSO 토큰 검증 엔드포인트
anyid.adaptor.sso.verify.url=https://sso.anyid.dev:1452/sso/api/v1/verify
# SSO 로그아웃 URL
anyid.adaptor.sso.logout.url=https://sso.anyid.dev:1452/sso/api/v1/logout

# ── HTTP 클라이언트 타임아웃 ──────────────────────────────────
anyid.adaptor.http.connect.timeout.ms=3000
anyid.adaptor.http.read.timeout.ms=5000
