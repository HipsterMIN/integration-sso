server:
  port: 8083
  shutdown: graceful
  servlet:
    session:
      timeout: 30m
      cookie:
        name: feSessionId
        http-only: true
        secure: true
        same-site: lax

spring:
  application:
    name: ido
  lifecycle:
    timeout-per-shutdown-phase: 20s

  # ── DataSource ──────────────────────────────────────────────
  datasource:
    url: jdbc:postgresql://${DB_HOST:localhost}:${DB_PORT:5432}/${DB_NAME:onepass}?currentSchema=ido
    username: ${DB_USERNAME:onepass}
    password: ${DB_PASSWORD:onepass}
    driver-class-name: org.postgresql.Driver
    hikari:
      pool-name: ido-hikari
      maximum-pool-size: 20
      minimum-idle: 5
      idle-timeout: 300000
      connection-timeout: 30000
      max-lifetime: 1800000
      keepalive-time: 60000
      connection-test-query: SELECT 1

  # ── JPA ────────────────────────────────────────────────────
  jpa:
    hibernate:
      ddl-auto: validate
    show-sql: false
    open-in-view: false
    properties:
      hibernate:
        dialect: org.hibernate.dialect.PostgreSQLDialect
        default_schema: ido
        jdbc:
          time_zone: UTC
          batch_size: 50
        order_inserts: true
        order_updates: true

  # ── Flyway ─────────────────────────────────────────────────
  flyway:
    enabled: true
    locations: classpath:db/migration
    schemas: ido
    default-schema: ido
    baseline-on-migrate: true
    baseline-version: 0
    validate-on-migrate: true
    out-of-order: false
    connect-retries: 5
    connect-retries-interval: 10s

  # ── Redis ──────────────────────────────────────────────────
  data:
    redis:
      host: ${REDIS_HOST:localhost}
      port: ${REDIS_PORT:6379}
      password: ${REDIS_PASSWORD:}
      timeout: 2000ms
      lettuce:
        pool:
          max-active: 20
          max-idle: 8
          min-idle: 2
          max-wait: 1000ms

  # ── Kafka ──────────────────────────────────────────────────
  kafka:
    bootstrap-servers: ${KAFKA_SERVERS:localhost:9092}
    properties:
      security.protocol: PLAINTEXT
    producer:
      client-id: ido-producer
      key-serializer: org.apache.kafka.common.serialization.StringSerializer
      value-serializer: org.springframework.kafka.support.serializer.JsonSerializer
      acks: all
      retries: 3
      batch-size: 16384
      linger-ms: 5
      compression-type: lz4
      properties:
        enable.idempotence: "true"
        max.in.flight.requests.per.connection: "5"
        spring.json.add.type.headers: "false"
        transactional.id: ido-tx-producer
    consumer:
      group-id: ido-qim-consumer          # Q-IM 이벤트 수신 컨슈머 그룹
      auto-offset-reset: earliest
      enable-auto-commit: false
      max-poll-records: 50
      key-deserializer: org.apache.kafka.common.serialization.StringDeserializer
      value-deserializer: org.springframework.kafka.support.serializer.JsonDeserializer
      properties:
        spring.json.trusted.packages: "kr.go.smes.*"
        isolation.level: read_committed
    listener:
      ack-mode: MANUAL_IMMEDIATE
      concurrency: 3
      missing-topics-fatal: true

# ── IdO 도메인 설정 ────────────────────────────────────────────
ido:
  # §11.5 Q-IM 연동
  qim:
    base-url: ${QIM_BASE_URL:http://localhost:8082}
    cache-ttl-seconds: 300           # ≤5분 (설계서 §11.3)
    agency-meta-ttl-seconds: 3600    # ≤60분 (기관 메타·정책 캐시)
    connect-timeout-ms: 3000
    read-timeout-ms: 5000
    # ── Q-IM → IdO 아웃바운드 수신 API (SP 역할) ─────────────────────────
    # Q-IM 관리 콘솔에서 발급한 API Key 해시 (PBKDF2 또는 임시 평문)
    # 운영: ${QIM_INBOUND_API_KEY_HASH} 환경변수로 주입
    # 개발: CHANGEME 유지 시 API Key 검증 우회 (QimSpReceiverService.isValidApiKey 참조)
    inbound-api-key-hash: ${QIM_INBOUND_API_KEY_HASH:CHANGEME}
    # Q-IM과 협의하여 발급받은 AES-256 공유키 (Base64 인코딩, 32바이트 디코드)
    # 운영: ${QIM_AES_SHARED_KEY} 환경변수로 주입
    # 개발: 플레이스홀더 사용 — 실제 값은 Q-IM 팀에서 수령 후 교체 [합의 필요 #1]
    aes-shared-key: ${QIM_AES_SHARED_KEY:CHANGEME_32BYTES_BASE64_PLACEHOLDER=}
    # SP 수신 API 멱등성 키 TTL (일) — sp_receiver_idempotency.expires_at 기준
    idempotency-ttl-days: 7
    # SP 수신 감사 로그 활성화 (운영: true 권장)
    receiver-audit-enabled: ${QIM_RECEIVER_AUDIT:true}

  # §11.8 Q-Sign 연동 — X-Internal-Sig
  qsign:
    base-url: ${QSIGN_BASE_URL:http://localhost:8081}
    internal-sig-ttl-seconds: 60
    nonce-ttl-seconds: 60
    connect-timeout-ms: 3000
    read-timeout-ms: 5000

  # ── 브로커 모드 설정 (문서 §6) ──────────────────────────────────────────
  # qsign    : 기존 방식 — ido → q-sign으로 URL 발급 위임 (현재 기본값)
  # keycloak : 신규 방식 — ido가 직접 Keycloak Authorization URL 생성
  broker:
    mode: ${IDO_BROKER_MODE:qsign}

  # ── Keycloak OIDC 브로커 설정 (문서 §7, §10) ──────────────────────────
  # ido.broker.mode=keycloak 전환 시 아래 설정 활성화
  keycloak:
    # Keycloak 서버 URL (로컬: http://localhost:8088, Docker: http://keycloak:8088)
    base-url: ${KEYCLOAK_BASE_URL:http://localhost:8088}
    # Realm 이름 (§10-1)
    realm: ${KEYCLOAK_REALM:onepass}
    # ido-client 클라이언트 ID (§10-2 confidential client)
    client-id: ${KEYCLOAK_CLIENT_ID:ido-client}
    # ido-client 클라이언트 시크릿 (§10-2 — Keycloak Admin Console에서 생성)
    client-secret: ${KEYCLOAK_CLIENT_SECRET:change-me}
    # Keycloak 콜백 redirect_uri (§10-2 Valid Redirect URIs에 등록 필수)
    redirect-uri: ${KEYCLOAK_REDIRECT_URI:http://localhost:8083/api/v1/broker/callback}
    # state/nonce Redis TTL (초) — CSRF 방어
    state-ttl-seconds: 300
    # JWKS 캐시 TTL (초) — 키 로테이션 주기보다 짧게 설정
    jwks-cache-ttl-seconds: 3600
    # HTTP 타임아웃
    connect-timeout-ms: 3000
    read-timeout-ms: 5000
    # kc_idp_hint 매핑 (§10-3 — Keycloak Identity Provider alias)
    idp-hint-mapping:
      kakao: social-kakao
      naver: social-naver
    # ACR → AuthLevel 매핑 (§10-4 — Keycloak ACR Mapper 설정 필요)
    acr-to-auth-level:
      "1": L1
      "2": L2
      "3": L3
    # NOTE(P1): Kafka 인증 이벤트 토픽은 ido.kafka.topic-auth-events 로 통일.
    # KeycloakOidcService / NonOidcAuthService 모두 ${ido.kafka.topic-auth-events} 참조.
    # 이전에 있던 ido.keycloak.auth-events-topic 키는 제거 — ido.kafka.topic-auth-events 사용.

  # §16.4 Handoff Ticket 설정
  ticket:
    ttl-seconds: 60                  # 1회성 TTL
    encryption-algorithm: AES-256-GCM
    signing-algorithm: HMAC-SHA256
    key-rotation-days: 90
    key-grace-period-hours: 24
    reuse-block-threshold: 3

  # §16.4.1 Clock Skew 허용
  clock-skew-tolerance-minutes: 5

  # ── FE 세션 설정 (onepass-fe BFF 이관) ──────────────────────────────────
  fe:
    session:
      sliding-ttl-minutes: 30            # §12.4 Sliding TTL
      absolute-timeout-minutes: 480      # §12.4 절대 만료 (8h)
    # returnUrl 화이트리스트 (§12.6 — 기관 callback_whitelist 보조)
    allowed-return-urls:
      - https://agency-a.example.com
      - https://agency-b.example.com
      - http://localhost:8084            # agency-stub (PoC)
      - http://localhost:3000            # React dev server (개발)
      - http://localhost:3001            # Nginx React (Option B 프로덕션)

  # Kafka 토픽
  kafka:
    topic-handoff-events: ido.handoff.events
    topic-session-advisory: platform.session.advisory
    # P1 수정: KeycloakOidcService / NonOidcAuthService @Value(${ido.kafka.topic-auth-events}) 키와 일치
    topic-auth-events: ${IDO_KAFKA_TOPIC_AUTH_EVENTS:qsign.auth.events}
    consumer-group-qim: ido-qim-consumer               # qim.user.events 구독
    consumer-group-qsign: ido-qsign-consumer            # qsign.auth.events 구독
    consumer-group-fe-advisory: ido-fe-advisory-consumer  # platform.session.advisory 구독 (FE 세션)
    # Q-IM SP 수신 API 내부 전파 컨슈머 (QimSpMemberEventConsumer)
    topic-qim-sp-member-events: ${QIM_SP_MEMBER_TOPIC:qim.sp.member.events}
    consumer-group-qim-sp-member: ido-qim-sp-member-consumer
    # Handoff 이벤트 컨슈머 (HandoffEventConsumer → WebhookDispatcherService)
    consumer-group-handoff: ido-handoff-consumer
    # 60,000명 대응 파티션/복제 설정 (KafkaTopicConfig 참조)
    # PoC: partition-count-main=12(기본), replication-factor=1, min-insync-replicas=1
    # 운영 3-broker: 환경변수 IDO_KAFKA_PARTITION_COUNT_MAIN=12, REPLICATION_FACTOR=3, ISR=2
    partition-count-main: ${IDO_KAFKA_PARTITION_COUNT_MAIN:12}
    partition-count-dlq:  ${IDO_KAFKA_PARTITION_COUNT_DLQ:6}
    replication-factor:   ${IDO_KAFKA_REPLICATION_FACTOR:1}
    min-insync-replicas:  ${IDO_KAFKA_MIN_INSYNC_REPLICAS:1}

  # Outbox Relay (ido.outbox 테이블 — Session Advisory 폴백)
  outbox:
    relay-interval-ms: 500
    batch-size: 100
    max-retry: 3

  # ── Webhook Dispatcher 설정 ────────────────────────────────────────────
  # 기관 외부 HTTPS webhook 발송 Outbox Relay 설정
  webhook:
    # Outbox 폴링 간격 (ms) — 500ms: 60k 급증 시 빠른 발송
    relay-interval-ms: 500
    # 배치당 처리 건수 — 50건: 기관당 HTTP 동시 연결 수 제어
    relay-batch-size: 50
    # 기본 최대 재시도 횟수 (기관별 설정 우선)
    max-retry: 3
    # webhook 요청 타임아웃
    connect-timeout-ms: 3000
    read-timeout-ms: 8000
    # HMAC-SHA256 기본 서명 비밀키 (운영: Vault/KMS 주입 필수)
    signing-secret: ${IDO_WEBHOOK_SIGNING_SECRET:poc-webhook-secret-change-in-production}

  # ── 60k 급증 대응 — Redis Pre-warming (Burst Absorption) ──────────────
  burst:
    # Auth Result Redis 캐시 TTL (초)
    # Handoff Ticket TTL(60s)보다 길게 설정 (사용자 이동 시간 고려)
    auth-result-cache-ttl-seconds: 300

  # ── Kafka 토픽 파티션 수 (환경별 오버라이드) ───────────────────────────
  # PoC 단일 브로커: partition-count-main=6, replication-factor=1
  # 운영 3-broker: partition-count-main=12, replication-factor=3, min-insync-replicas=2
  # (KafkaTopicConfig 참조)
  # kafka.partition-count-main, replication-factor, min-insync-replicas는
  # ido.kafka.* 네임스페이스가 아닌 KafkaTopicConfig @Value로 직접 주입됨.
  # 아래는 해당 설정을 위한 표준 위치 안내 주석 — 실제 값은 환경변수 또는 k8s ConfigMap으로 주입.
  # IDO_KAFKA_PARTITION_COUNT_MAIN=12
  # IDO_KAFKA_REPLICATION_FACTOR=3
  # IDO_KAFKA_MIN_INSYNC_REPLICAS=2

  # ── CORS (React dev-server / Nginx → IdO) ──────────────────────────────
  # BFF 이관에 따라 CORS 허용 Origin 관리
  cors:
    enabled: true
    allowed-origins:
      - ${CORS_ORIGIN_DEV:http://localhost:3000}    # React dev server (개발)
      - ${CORS_ORIGIN_PROD:http://localhost:3001}   # Nginx React (Option B 프로덕션)

# ── Resilience4j ──────────────────────────────────────────────
resilience4j:
  circuitbreaker:
    instances:
      qim-client:
        register-health-indicator: true
        sliding-window-type: COUNT_BASED
        sliding-window-size: 10
        failure-rate-threshold: 60
        slow-call-rate-threshold: 80
        slow-call-duration-threshold: 3s
        wait-duration-in-open-state: 15s
        permitted-number-of-calls-in-half-open-state: 3
        minimum-number-of-calls: 5
      # P2 수정: qsign-client → keycloak-client (Keycloak HTTP 호출 보호)
      keycloak-client:
        sliding-window-size: 10
        failure-rate-threshold: 50
        slow-call-rate-threshold: 80
        slow-call-duration-threshold: 3s
        wait-duration-in-open-state: 30s
        permitted-number-of-calls-in-half-open-state: 5
        minimum-number-of-calls: 5
  retry:
    instances:
      qim-client:
        max-attempts: 3
        wait-duration: 300ms
        retry-exceptions:
          - java.io.IOException
          - java.util.concurrent.TimeoutException
      # P2 수정: qsign-client → keycloak-client
      keycloak-client:
        max-attempts: 3
        wait-duration: 500ms
        retry-exceptions:
          - java.io.IOException
          - java.util.concurrent.TimeoutException
  timelimiter:
    instances:
      qim-client:
        timeout-duration: 5s
      # P2 수정: qsign-client → keycloak-client
      keycloak-client:
        timeout-duration: 5s

# ── Actuator ──────────────────────────────────────────────────
management:
  endpoints:
    web:
      exposure:
        include: health,info,metrics,prometheus,flyway
  endpoint:
    health:
      show-details: when-authorized
      probes:
        enabled: true
  metrics:
    tags:
      application: ${spring.application.name}

# ── Async Executor 설정 ───────────────────────────────────────────────────
ido:
  async:
    audit:
      core-pool-size: ${IDO_AUDIT_EXECUTOR_CORE:4}
      max-pool-size:  ${IDO_AUDIT_EXECUTOR_MAX:16}
      queue-capacity: ${IDO_AUDIT_EXECUTOR_QUEUE:10000}
      keep-alive-seconds: 60
    webhook:
      core-pool-size: ${IDO_WEBHOOK_EXECUTOR_CORE:4}
      max-pool-size:  ${IDO_WEBHOOK_EXECUTOR_MAX:20}
      queue-capacity: ${IDO_WEBHOOK_EXECUTOR_QUEUE:5000}

  audit:
    kafka-publish-enabled: ${IDO_AUDIT_KAFKA_ENABLED:true}
    retry-interval-ms: 600000   # 10분마다 Kafka 미발행 감사 로그 재처리

logging:
  level:
    kr.go.smes.ido: INFO
    kr.go.smes.ido.fe: INFO
    kr.go.smes.ido.webhook: INFO
    kr.go.smes.ido.burst: INFO
    kr.go.smes.ido.audit: INFO
    org.springframework.kafka: WARN
    org.flywaydb: INFO
