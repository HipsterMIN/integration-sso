# ============================================================
# IdO local 프로파일 — 샌드박스 직접 구동용
# ============================================================

spring:
  kafka:
    bootstrap-servers: localhost:9092
    listener:
      missing-topics-fatal: false
    consumer:
      properties:
        metadata.max.age.ms: 5000
  flyway:
    enabled: true
    connect-retries: 3
    connect-retries-interval: 3s

# 로컬 테스트용 설정
ido:
  agency-subject-secret: local-test-secret-32-bytes-padding
  qim:
    aes-shared-key: bG9jYWwtdGVzdC1zZWNyZXQtMzJieXRlcy1wYWRkZWQ=  # Base64(local-test-secret-32bytes-padded)

logging:
  level:
    org.springframework.kafka: ERROR
    org.apache.kafka: ERROR
