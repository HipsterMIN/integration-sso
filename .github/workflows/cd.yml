# ════════════════════════════════════════════════════════════════════════════
# CD — Helm 배포 (수동/opt-in)
#
# 전제(운영 결정 필요):
#   · 클러스터 접근: secrets.KUBE_CONFIG (base64 인코딩된 kubeconfig)
#       echo -n "$(cat ~/.kube/config)" | base64 -w0   →  Repo Settings > Secrets
#   · 이미지: ci.yml이 GHCR(ghcr.io/<owner>/idem-<module> (예: idem-hub, idem-gate))로 push한 것을 사용
#   · GitOps(ArgoCD/Flux)를 쓰는 경우 본 워크플로 대신 그쪽 파이프라인을 사용하세요.
#       (본 파일은 push 기반 helm upgrade 템플릿이며, 환경/네임스페이스/태그를 입력받습니다.)
#
# 안전장치: KUBE_CONFIG 미설정 시 즉시 실패(가이드 출력). 환경 보호규칙(environment)
#           으로 승인 게이트를 걸 수 있습니다.
# ════════════════════════════════════════════════════════════════════════════
name: CD (Helm Deploy)

on:
  workflow_dispatch:
    inputs:
      environment:
        description: "배포 환경"
        type: choice
        options: [dev, stage, prod]
        default: dev
      image_tag:
        description: "배포할 이미지 태그 (예: 커밋 SHA 또는 latest)"
        type: string
        default: latest

permissions:
  contents: read

jobs:
  deploy:
    name: "Helm 배포 (${{ inputs.environment }})"
    runs-on: ubuntu-latest
    environment: ${{ inputs.environment }}   # GitHub Environment 보호규칙(승인 게이트) 연계
    steps:
      - name: 소스 체크아웃
        uses: actions/checkout@v4

      - name: KUBE_CONFIG 시크릿 확인 (미설정 시 중단)
        env:
          KUBE_CONFIG: ${{ secrets.KUBE_CONFIG }}
        run: |
          if [ -z "$KUBE_CONFIG" ]; then
            echo "::error::secrets.KUBE_CONFIG 미설정 — 클러스터 접근 정보(base64 kubeconfig)가 필요합니다. 본 파일 상단 주석 참조."
            exit 1
          fi

      - name: kubeconfig 구성
        env:
          KUBE_CONFIG: ${{ secrets.KUBE_CONFIG }}
        run: |
          mkdir -p "$HOME/.kube"
          echo "$KUBE_CONFIG" | base64 -d > "$HOME/.kube/config"
          chmod 600 "$HOME/.kube/config"

      - name: Helm 설치
        uses: azure/setup-helm@v4

      - name: 이미지 레포(소유자 소문자) 계산
        run: echo "IMAGE_REPO=ghcr.io/$(echo '${{ github.repository_owner }}' | tr '[:upper:]' '[:lower:]')/" >> "$GITHUB_ENV"

      - name: Helm upgrade --install
        run: |
          TAG='${{ inputs.image_tag }}'
          helm upgrade --install onepass infra/helm/idem \
            --namespace "idem-${{ inputs.environment }}" --create-namespace \
            -f "infra/helm/idem/values-${{ inputs.environment }}.yaml" \
            --set "global.imageRegistry=${IMAGE_REPO}" \
            --set "idem.gate.image.tag=${TAG}" \
            --set "idem.registry.image.tag=${TAG}" \
            --set "idem.hub.image.tag=${TAG}" \
            --set "idem.authz.image.tag=${TAG}" \
            --set "idem.relay.image.tag=${TAG}" \
            --wait --timeout 10m

      - name: 롤아웃 상태
        run: kubectl -n "idem-${{ inputs.environment }}" get deploy,po
