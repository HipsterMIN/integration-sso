# ══════════════════════════════════════════════════════════════════════════════
# NO-GO Quick Verification — 단순 버전 (10~15분)
# ══════════════════════════════════════════════════════════════════════════════
#
# 목적:
#   docs/release-go-no-go-20260524.md 에 보고된 5건 (Issue #2 제외) 의 회귀 여부를
#   GitHub Actions ubuntu-latest (2 vCPU / 7GB RAM) 에서 빠르게 확인.
#
# 실행 방법:
#   1. 자동: shipster 브랜치 push 시
#   2. 수동: GitHub UI → Actions → "NO-GO Quick Verification" → "Run workflow"
#           (branch 선택 가능 — shipster/main/genspark_ai_developer 등)
#
# 검증 범위:
#   - Issue #1: :idem-hub:compileTestJava + :idem-hub:test (MemberLookupControllerTest)
#   - Issue #3a/3b: :idem-registry:test (QimLifecycle + Outbox)
#   - Issue #4: :idem-agent:test (WeavingStrategyFactoryJeusTest)
#   - Issue #5: :idem-console:yarnInstall (또는 frontend 단독 yarn install)
#   - Issue #2: SKIPPED (Testcontainers 필요 — full 버전에서 검증)
#
# Docker 가 GitHub runner 에 있지만 본 워크플로는 Testcontainers 의도적으로 비활성화
# (Issue #2 의 E2E 는 nogo-full.yml 에서 별도로 다룸).
# ══════════════════════════════════════════════════════════════════════════════

name: NO-GO Quick Verification

on:
  workflow_dispatch:           # 수동 실행 지원 — Actions 탭에서 Run workflow 버튼
    inputs:
      modules:
        description: '실행할 모듈 (쉼표 구분, 예: idem-hub,idem-registry,idem-agent,frontend / 빈 값 = 모두)'
        required: false
        default: ''
  push:
    branches: [ shipster ]      # shipster push 시 자동 실행

# 동일 브랜치 동시 실행 방지
concurrency:
  group: nogo-quick-${{ github.ref }}
  cancel-in-progress: true

env:
  JAVA_VERSION: '21'
  # 단일 빌드라 daemon 사용 (성능)
  GRADLE_OPTS: '-Dorg.gradle.daemon=true -Dorg.gradle.parallel=false -Dfile.encoding=UTF-8'
  # Testcontainers 자동 스킵 — Issue #2 는 full 에서 검증
  DOCKER_UNAVAILABLE: 'true'

jobs:
  nogo-verify:
    name: NO-GO 5건 회귀 검증
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - name: 소스 체크아웃
        uses: actions/checkout@v4

      - name: 런너 사양 확인 (디버깅용)
        run: |
          echo "=== Runner specs ==="
          echo "CPU: $(nproc) cores"
          echo "RAM: $(free -h | awk 'NR==2{print $2}')"
          echo "Disk: $(df -h / | awk 'NR==2{print $4}') free"
          echo "Docker: $(docker --version 2>/dev/null || echo 'NOT AVAILABLE')"
          echo "OS: $(uname -a)"

      - name: Java ${{ env.JAVA_VERSION }} 설정
        uses: actions/setup-java@v4
        with:
          java-version: ${{ env.JAVA_VERSION }}
          distribution: 'temurin'
          cache: 'gradle'

      - name: Gradle Wrapper 권한
        run: chmod +x ./gradlew

      - name: Gradle 캐시 복원
        uses: actions/cache@v4
        with:
          path: |
            ~/.gradle/caches
            ~/.gradle/wrapper
          key: ${{ runner.os }}-gradle-${{ hashFiles('**/*.kts', '**/gradle-wrapper.properties') }}
          restore-keys: |
            ${{ runner.os }}-gradle-

      # ── 입력 파싱: 수동 실행 시 모듈 필터링 ─────────────────────────────────
      - name: 실행 모듈 결정
        id: pick
        run: |
          INPUT="${{ inputs.modules }}"
          if [ -z "$INPUT" ]; then
            echo "modules=idem-hub,idem-registry,idem-agent,frontend" >> $GITHUB_OUTPUT
            echo "▶ 입력 없음 → 전체 모듈 실행"
          else
            echo "modules=$INPUT" >> $GITHUB_OUTPUT
            echo "▶ 사용자 지정 모듈: $INPUT"
          fi

      # ── Issue #1: IdO 컴파일 + 테스트 ───────────────────────────────────────
      - name: 'Issue #1 — :idem-hub 컴파일 + MemberLookupControllerTest'
        if: contains(steps.pick.outputs.modules, 'idem-hub')
        id: idem-hub
        run: |
          set -o pipefail
          echo "::group::compileTestJava"
          ./gradlew :idem-hub:compileTestJava --no-daemon --console=plain --stacktrace 2>&1 | tee /tmp/ido-compile.log
          echo "::endgroup::"
          echo "::group::test (memberlookup only)"
          ./gradlew :idem-hub:test --no-daemon --console=plain --continue \
            --tests "kr.go.smes.ido.memberlookup.*" 2>&1 | tee /tmp/ido-test.log
          echo "::endgroup::"

      # ── Issue #3a + #3b: Q-IM lifecycle + outbox ──────────────────────────
      - name: 'Issue #3a/3b — :idem-registry QimLifecycle + Outbox'
        if: contains(steps.pick.outputs.modules, 'idem-registry')
        id: qim
        run: |
          set -o pipefail
          echo "::group::test (lifecycle + outbox)"
          ./gradlew :idem-registry:test --no-daemon --console=plain --continue \
            --tests "kr.go.smes.qim.integration.QimLifecycleIntegrationTest" \
            --tests "kr.go.smes.qim.outbox.OutboxIntegrationTest" 2>&1 | tee /tmp/qim-test.log
          echo "::endgroup::"

      # ── Issue #4: Agent WeavingStrategyFactoryJeusTest ────────────────────
      - name: 'Issue #4 — :idem-agent WeavingStrategyFactoryJeusTest'
        if: contains(steps.pick.outputs.modules, 'idem-agent')
        id: agent
        run: |
          set -o pipefail
          echo "::group::test"
          ./gradlew :idem-agent:test --no-daemon --console=plain --continue \
            --tests "kr.go.smes.agent.weaving.jeus.WeavingStrategyFactoryJeusTest" 2>&1 | tee /tmp/agent-test.log
          echo "::endgroup::"

      # ── Issue #5: FE yarn install ─────────────────────────────────────────
      - name: 'Issue #5 — idem-console yarn install 검증'
        if: contains(steps.pick.outputs.modules, 'frontend')
        id: fe
        run: |
          set -o pipefail
          echo "::group::node version"
          node --version
          echo "::endgroup::"
          echo "::group::yarn install"
          cd idem-console/frontend
          # CI에서는 frozen-lockfile 권장 (lock 파일 갱신 필요 시 PR 분리)
          yarn install --frozen-lockfile --network-timeout 600000 2>&1 | tee /tmp/fe-yarn.log
          echo "::endgroup::"
          echo "::group::sass version check"
          # 설치된 sass 버전 & engine 출력 (NO-GO 보고 검증용)
          if [ -f node_modules/sass/package.json ]; then
            node -e "const p=require('./node_modules/sass/package.json'); console.log('sass:', p.version, 'engines:', JSON.stringify(p.engines))"
          fi
          echo "::endgroup::"

      # ── 결과 로그 업로드 ──────────────────────────────────────────────────
      - name: 검증 로그 업로드
        uses: actions/upload-artifact@v4
        if: always()
        continue-on-error: true   # 아티팩트 저장 용량 초과가 검증 결과를 실패로 만들지 않도록
        with:
          name: nogo-quick-logs-${{ github.run_number }}
          path: |
            /tmp/ido-*.log
            /tmp/qim-*.log
            /tmp/agent-*.log
            /tmp/fe-*.log
            **/build/reports/tests/
            **/build/test-results/
          retention-days: 3

      - name: 요약 출력
        if: always()
        run: |
          {
            echo "## NO-GO Quick Verification 결과"
            echo ""
            echo "| Issue | Step | Status |"
            echo "|-------|------|--------|"
            echo "| #1 IdO   | ${{ steps.idem-hub.outcome   || 'skipped' }} |"
            echo "| #3a/3b Q-IM | ${{ steps.qim.outcome   || 'skipped' }} |"
            echo "| #4 Agent  | ${{ steps.agent.outcome || 'skipped' }} |"
            echo "| #5 FE    | ${{ steps.fe.outcome    || 'skipped' }} |"
            echo ""
            echo "상세 로그는 위 아티팩트 (\`nogo-quick-logs-${{ github.run_number }}\`) 에서 확인하세요."
          } >> $GITHUB_STEP_SUMMARY
