# ══════════════════════════════════════════════════════════════════════════════
# Idem Platform CI/CD Pipeline
# ══════════════════════════════════════════════════════════════════════════════
#
# 트리거:
#   - push: main            (Docker Build 6종 + GHCR push 포함)
#   - pull_request: main    (PR 게이트: build-and-test → smoke-test, frontend-check)
#   - workflow_dispatch     (수동: security-scan 등)
#
# Job 구성 (2026-09-08 정리 — 전부 CI_HEAVY_RUNNER 자체 호스팅 러너):
#   1. build-and-test   — Gradle 빌드 + 단위 테스트 (모든 모듈)            [PR·main]
#   2. frontend-check   — FE 빌드: 관리 콘솔(npm/Vite) · frontend-check-kr: KR 포털(yarn/Webpack)   [PR·main]
#   3. security-scan    — OWASP Dependency-Check (수동 전용)                [dispatch]
#   4. smoke-test       — 설치본 스모크 (D3: compose 환경 계약으로 Keycloak·registry·authz·gate·hub 실기동 + install-smoke.sh + k6) [PR·main]
#   5. docker-build     — 6개 서비스 이미지 빌드 + GHCR push + Trivy 이미지 스캔 [main]
#   포맷(Spotless)·변경 모듈 테스트는 로컬 git 훅이 담당한다: docs/local-dev-workflow.md
#
# 시크릿 (GitHub Settings → Secrets):
#   NVD_API_KEY — OWASP NVD API 키 (security-scan, 없으면 느리게 동작)
#   GHCR push 는 GITHUB_TOKEN(packages: write) 사용
#
name: CI

on:
  workflow_dispatch:           # 수동 실행 (Actions UI → Run workflow) 지원 추가
  # 사용량 절감(2026-09-04): shipster push 트리거 제거 — shipster 변경은 PR 이벤트로만 검증한다.
  # 종전에는 shipster push + PR 이 같은 커밋을 두 번 실행해 Actions 분을 2배로 썼고,
  # 같은 ref 의 concurrency 취소로 진행 중 실행이 유실되는 사고도 있었다.
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

# 동일 브랜치/PR 동시 실행 방지 (이전 실행 자동 취소)
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  JAVA_VERSION: '21'
  GRADLE_OPTS: '-Dorg.gradle.daemon=false -Dorg.gradle.parallel=false'
  # 통합 테스트 비활성화 (Docker 없는 CI 환경)
  DOCKER_UNAVAILABLE: 'true'

jobs:
  # ── Job 1: 빌드 + 단위 테스트 ────────────────────────────────────────────────
  build-and-test:
    name: Build & Unit Test
    # PR 게이트. 저장소 변수 CI_HEAVY_RUNNER(예: self-hosted) 설정 시 자체 호스팅 러너에서 실행 (Actions 분 미차감) — docs/ci-runner-guide.md
    runs-on: ${{ vars.CI_HEAVY_RUNNER || 'ubuntu-latest' }}
    timeout-minutes: 20

    steps:
      - name: 소스 체크아웃
        uses: actions/checkout@v4
        with:
          fetch-depth: 0    # (Sonar 제거 후에도 유지) 전체 이력 — 릴리스 노트·blame 참조용

      - name: Java ${{ env.JAVA_VERSION }} 설정
        uses: actions/setup-java@v4
        with:
          java-version: ${{ env.JAVA_VERSION }}
          distribution: 'temurin'
          cache: ${{ runner.environment == 'github-hosted' && 'gradle' || '' }}   # 자체 호스팅은 ~/.gradle 이 머신에 남으므로 캐시 전송 생략

      - name: Gradle Wrapper 실행 권한
        run: chmod +x ./gradlew

      # 빌드 캐시 (Gradle 증분 빌드 활용)
      - name: Gradle 캐시
        uses: actions/cache@v4
        if: runner.environment == 'github-hosted'   # 자체 호스팅 러너는 로컬 ~/.gradle 재사용 (느린 망에서 500MB 전송이 잡을 수십 분 지연)
        with:
          path: |
            ~/.gradle/caches
            ~/.gradle/wrapper
          key: ${{ runner.os }}-gradle-${{ hashFiles('**/*.kts', '**/gradle-wrapper.properties') }}
          restore-keys: |
            ${{ runner.os }}-gradle-

      - name: Gradle 빌드 (테스트 제외)
        run: ./gradlew build -x test --no-daemon --stacktrace

      - name: 단위 테스트 실행
        env:
          DOCKER_UNAVAILABLE: 'true'    # Testcontainers(Docker 필요) 자동 스킵
        run: |
          ./gradlew test --no-daemon --continue \
            --tests "io.github.hipstermin.idem.**"
          # NOTE: idem-registry:test가 복원되었습니다.
          # idem-registry 모듈 테스트 통과가 CI 성공 조건입니다.

      - name: 테스트 결과 업로드
        uses: actions/upload-artifact@v4
        if: always()    # 테스트 실패해도 결과 업로드
        continue-on-error: true   # 아티팩트 저장 용량 초과(quota)가 빌드 게이트를 막지 않도록
        with:
          name: test-results
          path: |
            **/build/reports/tests/
            **/build/test-results/
          retention-days: 3

      - name: JaCoCo 커버리지 리포트 생성
        if: success()
        run: ./gradlew jacocoTestReport --no-daemon || true    # 미설정 시 무시

  # ── Job 2: FE 빌드 검증 ───────────────────────────────────────────────────────
  #   frontend-check    — 코어 관리 콘솔 idem-console-admin (npm·Vite·TypeScript, S7 PR-2): typecheck + 단위 테스트 + 빌드
  #   frontend-check-kr — KR 에디션 회원 포털 editions/idem-kr-portal/frontend (yarn·Webpack, 구 idem-console): typecheck + 빌드
  frontend-check:
    name: Frontend Build
    runs-on: ${{ vars.CI_HEAVY_RUNNER || 'ubuntu-latest' }}
    timeout-minutes: 10
    defaults:
      run:
        working-directory: idem-console-admin

    steps:
      - name: 소스 체크아웃
        uses: actions/checkout@v4

      - name: Node.js 설정
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: ${{ runner.environment == 'github-hosted' && 'npm' || '' }}
          cache-dependency-path: idem-console-admin/package-lock.json

      - name: 의존성 설치 (npm ci)
        run: npm ci

      - name: TypeScript 검사 + 단위 테스트
        run: |
          npm run typecheck
          npm test

      - name: Vite 빌드
        run: npm run build

  frontend-check-kr:
    name: Frontend Build (KR portal)
    # 2026-09-08 호스트 러너 한도(분 소진)로 항상 실패하던 것을 자체 호스팅 러너로 이동. 프론트 변경을 검증하는 유일한 자동 지점.
    runs-on: ${{ vars.CI_HEAVY_RUNNER || 'ubuntu-latest' }}
    timeout-minutes: 15
    defaults:
      run:
        working-directory: editions/idem-kr-portal/frontend

    steps:
      - name: 소스 체크아웃
        uses: actions/checkout@v4

      - name: Node.js 설정
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          # 자체 호스팅 러너는 node_modules·yarn 캐시가 머신에 남으므로 GitHub 캐시 전송 생략(느린 망에서 수 분 지연)
          cache: ${{ runner.environment == 'github-hosted' && 'yarn' || '' }}
          cache-dependency-path: editions/idem-kr-portal/frontend/yarn.lock

      # 호스트 러너와 달리 자체 호스팅 러너에는 yarn 이 없다(2026-09-08 첫 실행 "yarn: command not found").
      # Node 20 에 포함된 Corepack 으로 yarn classic(1.x, yarn.lock v1)을 활성화한다 — 호스트 러너에서도 동일하게 동작.
      - name: yarn 준비 (Corepack)
        run: |
          corepack enable
          corepack prepare yarn@1.22.22 --activate
          yarn --version

      - name: 의존성 설치
        run: yarn install --frozen-lockfile

      - name: TypeScript 컴파일 검사
        # i18n hash 자동 생성을 포함한 typecheck 스크립트 사용 (package.json scripts 참조)
        # 2026-05-24 PR #196 에서 14건 TS 부채 해소 완료 → continue-on-error 제거
        run: yarn typecheck

      - name: Webpack 빌드
        env:
          NODE_ENV: production
        run: yarn build

  # ── Job 3: OWASP Dependency-Check (수동 전용 심층 스캔) ──────────────────────
  # PR 게이트에서 제외한 이유: NVD API가 키가 있어도 상습적으로 저하/장애 상태라
  # (2026-09 NvdCveClient NPE 사례) PR을 20~40분씩 막았음. 빠른 PR 게이트는
  # docker-build 의 Trivy 이미지 스캔이 담당하고, 본 잡은 수동 실행(workflow_dispatch) 전용.
  # 2026-09-07 야간 cron 제거 — NVD 동기화가 망 상태(IPv6·프록시·대역폭)에 민감해 무인 실행 가치가 낮았다.
  # 로컬 실행: NVD_API_KEY=... ./gradlew dependencyCheckAggregate  (docs/ci-runner-guide.md)
  security-scan:
    name: OWASP Dependency-Check
    # 무거운 잡은 저장소 변수 CI_HEAVY_RUNNER(예: self-hosted)로 자체 호스팅 러너에 보낼 수 있다.
    # 변수 미설정 시 GitHub 호스트 러너. 등록 절차: docs/ci-runner-guide.md
    runs-on: ${{ vars.CI_HEAVY_RUNNER || 'ubuntu-latest' }}
    timeout-minutes: 60    # 수동 전용이라 PR을 막지 않음 — NVD 저하 시에도 첫 전체 동기화가 완주하도록 여유
    if: github.event_name == 'workflow_dispatch'
    permissions:
      contents: read
      security-events: write   # SARIF → Security 탭 업로드 (없으면 "Resource not accessible by integration", run 34049253507)
      actions: read            # upload-sarif 가 workflow-run 조회에 사용

    steps:
      - name: 소스 체크아웃
        uses: actions/checkout@v4

      - name: Java ${{ env.JAVA_VERSION }} 설정
        uses: actions/setup-java@v4
        with:
          java-version: ${{ env.JAVA_VERSION }}
          distribution: 'temurin'
          cache: ${{ runner.environment == 'github-hosted' && 'gradle' || '' }}   # 자체 호스팅은 ~/.gradle 이 머신에 남으므로 캐시 전송 생략

      - name: Gradle 캐시
        uses: actions/cache@v4
        if: runner.environment == 'github-hosted'   # 자체 호스팅 러너는 로컬 ~/.gradle 재사용 (느린 망에서 500MB 전송이 잡을 수십 분 지연)
        with:
          path: |
            ~/.gradle/caches
            ~/.gradle/wrapper
          key: ${{ runner.os }}-gradle-${{ hashFiles('**/*.kts') }}

      # OWASP NVD 캐시 (의존성 취약점 DB — 매일 갱신)
      # restore/save를 분리하고 save를 if: always()로 두는 이유: 단일 actions/cache는 잡이
      # 타임아웃(cancelled)되면 post 단계 save를 건너뛰어 NVD 부분 동기화 진행분이 매번 유실됐다.
      # dependency-check는 로컬 H2 DB에서 증분 재개하므로, 실패해도 저장해야 반복 실행이 수렴한다.
      - name: OWASP NVD 캐시 복원
        uses: actions/cache/restore@v4
        if: runner.environment == 'github-hosted'   # 자체 호스팅은 ~/.gradle/dependency-check-data 가 머신에 남음
        with:
          path: ~/.gradle/dependency-check-data
          key: owasp-nvd-${{ hashFiles('build.gradle.kts') }}-${{ github.run_id }}
          restore-keys: |
            owasp-nvd-${{ hashFiles('build.gradle.kts') }}-
            owasp-nvd-

      - name: OWASP Dependency-Check 실행
        env:
          # NVD API 키 (secrets.NVD_API_KEY) — 미설정 시에도 동작하나 NVD rate limit로 20~40분 소요.
          # build.gradle.kts dependencyCheck.nvd.apiKey 가 이 환경변수를 읽는다.
          NVD_API_KEY: ${{ secrets.NVD_API_KEY }}
          # 자체 호스팅(WSL2) 러너에서 Java 가 IPv6 를 먼저 시도해 "Network is unreachable" 로 NVD/RetireJS/
          # 호스티드 suppression 다운로드가 전부 실패했다(run 34075241830). JVM 전체에 IPv4 우선을 강제한다.
          JAVA_TOOL_OPTIONS: -Djava.net.preferIPv4Stack=true
        run: |
          # dependencyCheckAggregate: 서브프로젝트 12개의 의존성을 한 리포트로 스캔.
          # dependencyCheckAnalyze 는 호출한 프로젝트(루트, 의존성 0개)만 봐서
          # "Found 0 vulnerabilities" 가 무검사였다(run 34049253507). 리포트 경로는 동일.
          ./gradlew dependencyCheckAggregate --no-daemon \
            -Pdependency.check.failBuildOnCVSS=7 \
            -Pdependency.check.formats=HTML,JSON,SARIF
          # SECURITY: CVSS 7.0 이상 취약점 발견 시 빌드 실패 (보안 게이트 활성화)
          # '|| true' 제거 — CVE 발견 시 반드시 검토 후 suppression 처리할 것

      # 타임아웃/취소 직후에는 Gradle 데몬(JVM)이 아직 H2 DB(odc.mv.db)를 쓰고 있어
      # tar가 "file changed as we read it"로 실패한다(run 33595730174 실측) → 저장 전 종료.
      - name: OWASP 프로세스 정리 (캐시 저장 전 DB 쓰기 중단)
        # 자체 호스팅 러너에서는 pkill 이 같은 머신의 다른 Gradle 프로세스까지 죽이므로 호스트 러너에서만 실행
        if: always() && runner.environment == 'github-hosted'
        run: |
          pkill -f 'org.gradle' 2>/dev/null || true
          pkill -f 'dependency-check' 2>/dev/null || true
          sleep 5

      - name: OWASP NVD 캐시 저장 (실패/타임아웃 시에도 진행분 보존)
        uses: actions/cache/save@v4
        if: always() && runner.environment == 'github-hosted'
        with:
          path: ~/.gradle/dependency-check-data
          key: owasp-nvd-${{ hashFiles('build.gradle.kts') }}-${{ github.run_id }}

      - name: 취약점 리포트 업로드
        uses: actions/upload-artifact@v4
        if: always()
        continue-on-error: true
        with:
          name: dependency-check-report-${{ github.run_number }}
          path: |
            **/build/reports/dependency-check/
          retention-days: 7

      - name: SARIF 결과를 GitHub Security에 업로드
        uses: github/codeql-action/upload-sarif@v3
        # 프라이빗 저장소는 Code scanning(GHAS) 이 꺼져 있어 업로드가 거부된다(run 34075241830:
        # "Code scanning is not enabled for this repository"). 저장소 변수 CODE_SCANNING_ENABLED=true 일 때만 실행.
        if: always() && vars.CODE_SCANNING_ENABLED == 'true'
        with:
          sarif_file: build/reports/dependency-check/dependency-check-report.sarif
        continue-on-error: true    # SARIF 없을 때 실패 방지

  # ── Job 5: 설치본 스모크 (D3) — compose.install.yml 의 환경 계약으로 4개 앱 + 실제 Keycloak 을 띄운다 ─────
  #   종전에는 hub 만 띄우고 registry 는 Node 스텁이라 설치 결함(secret 자리표시자·필수 키 누락 등)을 한 번도 잡지 못했다.
  #   지금: compose config 검증 → Keycloak 컨테이너(realm import, 같은 image·env) → registry·authz·gate·hub 부트 jar(compose 와 같은
  #   환경변수 이름) → scripts/ci/install-smoke.sh(헬스·Discovery·프로파일 PUT→client·로그인 화면 프록시·Mock 라운드트립) → k6 스모크.
  #   이미지 빌드(Dockerfile) 자체는 main 의 docker-build 잡이 검증한다. 잡 이름은 브랜치 보호 규칙과 맞추기 위해 유지한다.
  smoke-test:
    name: k6 Smoke Test
    runs-on: ${{ vars.CI_HEAVY_RUNNER || 'ubuntu-latest' }}
    timeout-minutes: 25
    needs: build-and-test
    if: github.event_name == 'push' || github.event_name == 'pull_request'

    services:
      redis:
        image: redis:7-alpine
        ports:
          - 6379:6379
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 5s
          --health-timeout 3s
          --health-retries 10
      postgres:
        image: postgres:16-alpine     # compose.install.yml 과 같은 메이저
        ports:
          - 5432:5432
        env:
          POSTGRES_DB: onepass
          POSTGRES_USER: onepass
          POSTGRES_PASSWORD: onepass
        options: >-
          --health-cmd "pg_isready -U onepass"
          --health-interval 5s
          --health-timeout 3s
          --health-retries 10

    steps:
      - name: 소스 체크아웃
        uses: actions/checkout@v4

      - name: Java ${{ env.JAVA_VERSION }} 설정
        uses: actions/setup-java@v4
        with:
          java-version: ${{ env.JAVA_VERSION }}
          distribution: 'temurin'
          cache: ${{ runner.environment == 'github-hosted' && 'gradle' || '' }}

      - name: Gradle 캐시
        uses: actions/cache@v4
        if: runner.environment == 'github-hosted'
        with:
          path: |
            ~/.gradle/caches
            ~/.gradle/wrapper
          key: ${{ runner.os }}-gradle-${{ hashFiles('**/*.kts', '**/gradle-wrapper.properties') }}
          restore-keys: |
            ${{ runner.os }}-gradle-

      - name: 부트 jar 빌드 (registry·authz·gate·hub — 코어 에디션)
        run: |
          chmod +x ./gradlew
          ./gradlew :idem-registry:bootJar :idem-authz:bootJar :idem-gate:bootJar :idem-hub:bootJar -x test --no-daemon

      - name: 설치 환경 파일 생성 (install.env.example 의 모든 필수 키를 1회용 값으로)
        run: |
          openssl genpkey -algorithm ed25519 -out /tmp/cast.pem
          cat > /tmp/install.env <<EOF
          IDEM_DB_PASSWORD=onepass
          KEYCLOAK_ADMIN_PASSWORD=$(openssl rand -hex 16)
          IDO_INTERNAL_SIG_SECRET=$(openssl rand -base64 32)
          IDO_INTERNAL_API_KEY_QSIGN=$(openssl rand -hex 32)
          IDO_INTERNAL_API_KEY_OUTBOX=$(openssl rand -hex 32)
          QIM_INTERNAL_API_KEY=$(openssl rand -hex 32)
          AUTHZ_INTERNAL_API_KEY=$(openssl rand -hex 32)
          QSIGN_KEYCLOAK_CLIENT_SECRET=$(openssl rand -hex 32)
          KEYCLOAK_CLIENT_SECRET=$(openssl rand -hex 32)
          KEYCLOAK_PROVISIONER_CLIENT_SECRET=$(openssl rand -hex 32)
          KEYCLOAK_SESSION_MANAGER_CLIENT_SECRET=$(openssl rand -hex 32)
          IDO_HANDOFF_AES_KEY=$(openssl rand -base64 32)
          IDO_HANDOFF_HMAC_KEY=$(openssl rand -base64 32)
          IDO_WEBHOOK_SIGNING_SECRET=$(openssl rand -hex 32)
          QIM_AES_SHARED_KEY=$(openssl rand -base64 32)
          QIM_DI_SECRET=$(openssl rand -hex 32)
          QIM_CI_AES_KEY_V1=$(openssl rand -base64 32)
          IDEM_ADMIN_BOOTSTRAP_PASSWORD=Ci-$(openssl rand -hex 12)-Aa
          IDEM_ADMIN_SECRET_KEY=$(openssl rand -base64 32)
          IDO_CAST_PRIVATE_KEY=$(openssl pkey -in /tmp/cast.pem -outform DER | base64 -w0)
          IDO_CAST_PUBLIC_KEY=$(openssl pkey -in /tmp/cast.pem -pubout -outform DER | base64 -w0)
          IDEM_PLUGINS_MOCK_AUTH_ENABLED=true
          IDEM_EDITION=core
          EOF
          # 예시 파일의 '값을 채워야 하는' 키가 전부 있는지 — 예시에 키가 늘면 여기도 늘어야 한다
          missing=0
          for k in $(grep -E '^[A-Z_]+=' infra/docker/install.env.example | cut -d= -f1); do
            grep -q "^$k=" /tmp/install.env || { echo "install.env.example 의 키가 스모크 env 에 없습니다: $k"; missing=1; }
          done
          [ $missing -eq 0 ]
          # 아래 단계들이 같은 값을 쓴다 — 1회용 값이지만 로그에 남지 않도록 마스킹한다
          while IFS='=' read -r k v; do
            case "$k" in *SECRET*|*KEY*|*PASSWORD*) echo "::add-mask::$v" ;; esac
          done < /tmp/install.env
          cat /tmp/install.env >> "$GITHUB_ENV"

      - name: compose.install.yml 검증 (실제 값으로 config 렌더링)
        run: |
          docker compose --env-file /tmp/install.env -f infra/docker/compose.install.yml config -q
          docker compose --env-file /tmp/install.env -f infra/docker/compose.install.yml config \
            | grep -c "container_name: idem-" | xargs -I{} sh -c '[ {} -ge 7 ] && echo "compose services: {}"'

      - name: DB 스키마 초기화 (compose 의 init-db.sql 과 동일)
        run: PGPASSWORD=onepass psql -h localhost -U onepass -d onepass -v ON_ERROR_STOP=1 -f infra/docker/init-db.sql

      - name: Keycloak 기동 (compose 와 같은 image·realm import·hostname — gate 뒤에 숨는다)
        run: |
          docker run -d --name idem-keycloak --network host \
            -v "$PWD/infra/docker/keycloak/realm-export.json:/opt/keycloak/data/import/realm-export.json:ro" \
            -e KEYCLOAK_ADMIN=admin -e KEYCLOAK_ADMIN_PASSWORD="$KEYCLOAK_ADMIN_PASSWORD" \
            -e KC_HTTP_ENABLED=true -e KC_HOSTNAME_STRICT=false -e KC_HOSTNAME_STRICT_HTTPS=false -e KC_HEALTH_ENABLED=true -e KC_PROXY=edge \
            -e KC_HOSTNAME_URL=http://localhost:8081 -e KC_HOSTNAME_ADMIN_URL=http://localhost:8088 \
            -e QSIGN_KEYCLOAK_CLIENT_SECRET -e KEYCLOAK_CLIENT_SECRET -e KEYCLOAK_PROVISIONER_CLIENT_SECRET -e KEYCLOAK_SESSION_MANAGER_CLIENT_SECRET \
            quay.io/keycloak/keycloak:24.0 start-dev --http-port=8088 --import-realm
          for i in $(seq 1 60); do
            if curl -sf http://localhost:8088/realms/onepass > /dev/null 2>&1; then echo "✅ Keycloak realm onepass UP (${i}x3s)"; exit 0; fi
            sleep 3
          done
          echo "❌ Keycloak 기동 실패"; docker logs idem-keycloak | tail -50; exit 1

      - name: registry·authz·gate·hub 기동 (compose.install.yml 의 환경변수 이름 그대로)
        run: |
          mkdir -p /tmp/idem
          jar() { find "$1/build/libs" -name "$1-*.jar" -not -name "*-plain.jar" -not -name "*-test-fixtures.jar" | head -1; }
          # x-app-common
          export DB_HOST=localhost DB_PORT=5432 DB_NAME=onepass DB_USERNAME=onepass DB_PASSWORD=onepass
          export REDIS_HOST=localhost REDIS_PORT=6379 IDEM_KAFKA_ENABLED=false TZ=Asia/Seoul
          # registry
          QIM_DB_HOST=localhost QIM_DB_PORT=5432 QIM_DB_NAME=onepass QIM_DB_SCHEMA=qim QIM_DB_USERNAME=onepass QIM_DB_PASSWORD=onepass QIM_DB_SSL=false \
            nohup java -Xmx512m -jar "$(jar idem-registry)" --server.port=8082 > /tmp/idem/registry.log 2>&1 &
          # authz
          nohup java -Xmx384m -jar "$(jar idem-authz)" --server.port=8086 > /tmp/idem/authz.log 2>&1 &
          # gate
          IDO_BASE_URL=http://localhost:8083 KEYCLOAK_URL=http://localhost:8088 KEYCLOAK_REALM=onepass QSIGN_KEYCLOAK_CLIENT_ID=q-sign-client \
            QSIGN_KEYCLOAK_REDIRECT_URI=http://localhost:8081/api/v1/oidc/keycloak/callback IDEM_PUBLIC_URL_GATE=http://localhost:8081 \
            nohup java -Xmx512m -jar "$(jar idem-gate)" --server.port=8081 > /tmp/idem/gate.log 2>&1 &
          # hub
          QIM_BASE_URL=http://localhost:8082 QSIGN_BASE_URL=http://localhost:8081 QAUTHZ_BASE_URL=http://localhost:8086 \
            IDO_QIM_INTERNAL_API_KEY="$QIM_INTERNAL_API_KEY" IDO_QAUTHZ_INTERNAL_API_KEY="$AUTHZ_INTERNAL_API_KEY" \
            IDO_BROKER_MODE=qsign KEYCLOAK_BASE_URL=http://localhost:8088 KEYCLOAK_REALM=onepass KEYCLOAK_CLIENT_ID=ido-client \
            KEYCLOAK_REDIRECT_URI=http://localhost:8083/api/v1/broker/callback IDEM_PUBLIC_URL_GATE=http://localhost:8081 \
            IDEM_PLATFORM_CODE=IDEM IDEM_PLUGINS_NICE_OACX_ENABLED=false IDEM_PLUGINS_ANYID_ENABLED=false \
            CORS_ORIGIN_DEV=http://localhost:3001 CORS_ORIGIN_PROD=http://localhost:3001 \
            nohup java -Xmx768m -jar "$(jar idem-hub)" --server.port=8083 > /tmp/idem/hub.log 2>&1 &
          # bash -e: 연결 거부(curl 종료 7)가 스크립트를 끝내지 않도록 || true
          for i in $(seq 1 90); do
            r=$(curl -s -o /dev/null -w '%{http_code}' http://localhost:8082/actuator/health || true)
            a=$(curl -s -o /dev/null -w '%{http_code}' http://localhost:8086/actuator/health || true)
            g=$(curl -s -o /dev/null -w '%{http_code}' http://localhost:8081/actuator/health || true)
            h=$(curl -s -o /dev/null -w '%{http_code}' http://localhost:8083/actuator/health || true)
            if [ "$r$a$g$h" = "200200200200" ]; then echo "✅ registry·authz·gate·hub UP (${i}x3s)"; exit 0; fi
            sleep 3
          done
          echo "❌ 기동 실패: registry=$r authz=$a gate=$g hub=$h"
          for n in registry authz gate hub; do echo "──── $n ────"; grep -m5 -iE "error|exception|Caused by" /tmp/idem/$n.log | cut -c1-400; done
          exit 1

      - name: 설치본 스모크 (scripts/ci/install-smoke.sh — 관리자 로그인(2단계)·온보딩·감사까지)
        run: |
          # 첫 로그인 비밀번호 변경(S7)에 쓸 1회용 값 — 로그에 남지 않도록 마스킹
          export IDEM_ADMIN_NEW_PASSWORD="Ci-$(openssl rand -hex 12)-Bb"
          echo "::add-mask::$IDEM_ADMIN_NEW_PASSWORD"
          IDEM_EDITION=core scripts/ci/install-smoke.sh

      - name: k6 설치
        run: |
          if command -v k6 >/dev/null 2>&1; then echo "k6 already installed: $(k6 version)"; exit 0; fi
          sudo gpg -k
          sudo gpg --no-default-keyring \
            --keyring /usr/share/keyrings/k6-archive-keyring.gpg \
            --keyserver hkp://keyserver.ubuntu.com:80 \
            --recv-keys C5AD17C747E3415A3642D57D77C6C491D6AC1D69
          echo "deb [signed-by=/usr/share/keyrings/k6-archive-keyring.gpg] https://dl.k6.io/deb stable main" \
            | sudo tee /etc/apt/sources.list.d/k6.list
          sudo apt-get update && sudo apt-get install -y k6
          k6 version

      - name: k6 스모크 (hub + 실제 registry)
        run: |
          k6 run k6/scenarios/smoke.js \
            --env BASE_URL=http://localhost:8083 \
            --env IDEM_EDITION=core \
            --env AGENCY_CODE=AGENCY001 \
            --env INTERNAL_API_KEY="$IDO_INTERNAL_API_KEY_QSIGN" \
            --out json=/tmp/smoke-result.json

      - name: 로그 출력 (실패 시)
        if: failure()
        run: |
          for n in registry authz gate hub; do echo "════ $n ════"; tail -120 /tmp/idem/$n.log 2>/dev/null || true; done
          echo "════ keycloak ════"; docker logs idem-keycloak 2>&1 | tail -80 || true

      - name: k6 스모크 결과 업로드
        uses: actions/upload-artifact@v4
        if: always()
        continue-on-error: true
        with:
          name: k6-smoke-result-${{ github.run_number }}
          path: /tmp/smoke-result.json
          retention-days: 3

      - name: 정리
        if: always()
        run: |
          pkill -f 'idem-(registry|authz|gate|hub)-.*\.jar' || true
          docker rm -f idem-keycloak > /dev/null 2>&1 || true

  # ── Job 6: Docker 멀티스테이지 이미지 빌드 검증 (S8-T6) ─────────────────────
  docker-build:
    name: Docker Build (Multistage)
    # 저장소 변수 CI_HEAVY_RUNNER 설정 시 자체 호스팅 러너(Docker 필요, Linux/WSL2 권장)에서 실행
    runs-on: ${{ vars.CI_HEAVY_RUNNER || 'ubuntu-latest' }}
    timeout-minutes: 20
    needs: build-and-test
    permissions:
      contents: read
      packages: write          # GHCR(ghcr.io) 이미지 push 권한
    # main push 시에만 실행 (PR에서는 빌드 검증만)
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'

    strategy:
      matrix:
        module:
          - name: idem-hub
            dockerfile: idem-hub/Dockerfile
            port: 8083
          - name: idem-registry
            dockerfile: idem-registry/Dockerfile
            port: 8082
          - name: idem-gate
            dockerfile: idem-gate/Dockerfile
            port: 8081
          - name: idem-authz
            dockerfile: idem-authz/Dockerfile
            port: 8086
          - name: idem-relay
            dockerfile: idem-relay/Dockerfile
            port: 8090
          - name: idem-tenant-sample
            dockerfile: idem-tenant-sample/Dockerfile
            port: 8084
      fail-fast: false    # 하나 실패해도 나머지 빌드 계속

    steps:
      - name: 소스 체크아웃
        uses: actions/checkout@v4

      - name: Docker BuildKit 활성화
        run: echo "DOCKER_BUILDKIT=1" >> $GITHUB_ENV

      - name: Docker Buildx 설정
        uses: docker/setup-buildx-action@v3

      # GHCR(ghcr.io) 로그인 — GITHUB_TOKEN 사용(별도 레지스트리 시크릿 불필요)
      - name: GHCR 로그인
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      # 이미지 레포(소유자 소문자) 계산 — GHCR은 소문자 경로만 허용
      - name: 이미지 레포 계산
        run: echo "IMAGE_REPO=ghcr.io/$(echo '${{ github.repository_owner }}' | tr '[:upper:]' '[:lower:]')" >> "$GITHUB_ENV"

      # GitHub Actions 캐시를 Docker 레이어 캐시로 활용
      - name: Docker 레이어 캐시
        uses: actions/cache@v4
        if: runner.environment == 'github-hosted'   # 자체 호스팅은 /tmp/.buildx-cache-* 가 머신에 남음
        with:
          path: /tmp/.buildx-cache-${{ matrix.module.name }}
          key: ${{ runner.os }}-buildx-${{ matrix.module.name }}-${{ github.sha }}
          restore-keys: |
            ${{ runner.os }}-buildx-${{ matrix.module.name }}-

      - name: Docker 이미지 빌드 (${{ matrix.module.name }})
        uses: docker/build-push-action@v5
        with:
          context: .
          file: ${{ matrix.module.dockerfile }}
          push: true    # GHCR로 push (이 잡은 보호 브랜치 push 이벤트에서만 실행)
          tags: |
            ${{ env.IMAGE_REPO }}/${{ matrix.module.name }}:${{ github.sha }}
            ${{ env.IMAGE_REPO }}/${{ matrix.module.name }}:latest
          build-args: |
            APP_VERSION=${{ github.sha }}
            GIT_SHA=${{ github.sha }}
            BUILD_DATE=${{ github.event.repository.updated_at }}
          cache-from: type=local,src=/tmp/.buildx-cache-${{ matrix.module.name }}
          cache-to: type=local,dest=/tmp/.buildx-cache-${{ matrix.module.name }}-new,mode=max

      # 캐시 교체 (새 캐시로 덮어쓰기)
      - name: Docker 캐시 교체
        if: always()
        run: |
          rm -rf /tmp/.buildx-cache-${{ matrix.module.name }}
          mv /tmp/.buildx-cache-${{ matrix.module.name }}-new \
             /tmp/.buildx-cache-${{ matrix.module.name }} 2>/dev/null || true

      - name: 이미지 정보 출력 (GHCR 매니페스트)
        run: |
          echo "=== ${{ matrix.module.name }} 이미지(GHCR) ==="
          docker buildx imagetools inspect \
            ${{ env.IMAGE_REPO }}/${{ matrix.module.name }}:latest || true

      - name: Trivy 보안 스캔 (취약점 검사)
        uses: aquasecurity/trivy-action@master
        with:
          image-ref: idem/${{ matrix.module.name }}:latest
          format: table
          exit-code: '0'         # CRITICAL 취약점도 빌드 중단 안함 (리포트만)
          ignore-unfixed: true
          vuln-type: 'os,library'
          severity: 'CRITICAL,HIGH'
        continue-on-error: true  # Trivy 오류 시 전체 Job 실패 방지
