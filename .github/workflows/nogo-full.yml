# ══════════════════════════════════════════════════════════════════════════════
# NO-GO Full Verification — 풍부 버전 (25~40분)
# ══════════════════════════════════════════════════════════════════════════════
#
# 목적:
#   docs/release-go-no-go-20260524.md 의 6건 전체 검증.
#   특히 nogo-quick.yml 에서 다루지 못한 Issue #2 (Agency E2E, Testcontainers 필요)
#   까지 Docker 를 활용해 가능한 한 실측.
#
# 실행 방법:
#   1. 자동: shipster push, PR(shipster→main) open/sync 시
#   2. 수동: GitHub UI → Actions → "NO-GO Full Verification" → "Run workflow"
#           - branch 선택 가능
#           - include_e2e: Issue #2 (Agency E2E) 강제 활성화 토글
#           - include_security: OWASP 보안 스캔 포함 여부
#
# 검증 매트릭스:
#   Phase 1 (병렬):
#     - module-tests:  idem-hub / idem-registry / idem-agent / idem-tenant-sample
#                      (각 모듈 별도 runner — Testcontainers Docker 가용)
#     - frontend:      idem-console 단독
#   Phase 2 (Phase 1 후):
#     - integration:   :idem-hub :idem-registry 통합 테스트 (Testcontainers PostgreSQL 사용)
#     - e2e (optional): Issue #2 Agency E2E — @Disabled 무시 시도
#     - security (optional): OWASP Dependency-Check
#   Phase 3:
#     - report:        모든 결과 종합 → PR 댓글 자동 게시
#
# 출력:
#   - 테스트 결과 아티팩트 (JUnit XML, HTML 리포트)
#   - JaCoCo 커버리지 리포트
#   - PR 댓글 자동 게시 (PR 이벤트 시)
#   - GitHub Step Summary (Actions UI 의 Summary 탭)
# ══════════════════════════════════════════════════════════════════════════════

name: NO-GO Full Verification

on:
  workflow_dispatch:           # 수동 실행
    inputs:
      include_e2e:
        description: 'Issue #2 (Agency E2E) 강제 실행 — @Disabled 무시 시도'
        required: false
        type: boolean
        default: false
      include_security:
        description: 'OWASP Dependency-Check 보안 스캔 포함'
        required: false
        type: boolean
        default: false
      modules:
        description: '실행할 모듈 (쉼표 구분 / 빈 값 = 모두)'
        required: false
        default: ''
  # 사용량 절감(2026-09-04): shipster push 트리거 제거 — PR 이벤트로만 실행 (ci.yml 과 동일 원칙)
  pull_request:
    branches: [ main, develop ]
    types: [ opened, synchronize, reopened ]

concurrency:
  group: nogo-full-${{ github.ref }}
  cancel-in-progress: true

env:
  JAVA_VERSION: '21'
  GRADLE_OPTS: '-Dorg.gradle.daemon=true -Dorg.gradle.parallel=false -Dfile.encoding=UTF-8'

permissions:
  contents: read
  pull-requests: write    # PR 댓글 게시용
  checks: write           # 테스트 결과를 Check 로 게시

jobs:
  # ─────────────────────────────────────────────────────────────────────────────
  # Phase 1: 모듈별 단위/슬라이스 테스트 (매트릭스 — 병렬 실행)
  # ─────────────────────────────────────────────────────────────────────────────
  module-tests:
    name: 'Module: ${{ matrix.module }}'
    runs-on: ubuntu-latest
    timeout-minutes: 25

    strategy:
      fail-fast: false      # 한 모듈 실패해도 다른 모듈 계속
      matrix:
        module:
          - idem-hub
          - idem-registry
          - idem-agent
          - idem-tenant-sample
          - idem-common
          - idem-gate
          - idem-relay

    steps:
      - name: 소스 체크아웃
        uses: actions/checkout@v4

      - name: 모듈 필터 검사
        id: filter
        run: |
          INPUT="${{ inputs.modules }}"
          MOD="${{ matrix.module }}"
          if [ -z "$INPUT" ] || echo ",$INPUT," | grep -q ",$MOD,"; then
            echo "run=true" >> $GITHUB_OUTPUT
          else
            echo "run=false" >> $GITHUB_OUTPUT
            echo "▶ $MOD 는 입력 모듈 목록($INPUT)에 없음 → 스킵"
          fi

      - name: 런너 사양
        if: steps.filter.outputs.run == 'true'
        run: |
          echo "Module: ${{ matrix.module }}"
          echo "CPU: $(nproc) / RAM: $(free -h | awk 'NR==2{print $2}')"
          echo "Docker: $(docker --version)"

      - name: Java ${{ env.JAVA_VERSION }} 설정
        if: steps.filter.outputs.run == 'true'
        uses: actions/setup-java@v4
        with:
          java-version: ${{ env.JAVA_VERSION }}
          distribution: 'temurin'
          cache: 'gradle'

      - name: Gradle Wrapper 권한
        if: steps.filter.outputs.run == 'true'
        run: chmod +x ./gradlew

      - name: Gradle 캐시 (모듈별 키)
        if: steps.filter.outputs.run == 'true'
        uses: actions/cache@v4
        with:
          path: |
            ~/.gradle/caches
            ~/.gradle/wrapper
          key: ${{ runner.os }}-gradle-${{ matrix.module }}-${{ hashFiles('**/*.kts', '**/gradle-wrapper.properties') }}
          restore-keys: |
            ${{ runner.os }}-gradle-${{ matrix.module }}-
            ${{ runner.os }}-gradle-

      # Testcontainers 가 사용할 수 있도록 Docker 가 활성 상태인지 확인
      - name: Docker 준비 확인 (Testcontainers 용)
        if: steps.filter.outputs.run == 'true'
        run: |
          docker info > /dev/null
          echo "✅ Docker daemon ready (Testcontainers 활용 가능)"
          # postgres:15-alpine 사전 pull (캐시 워밍)
          docker pull postgres:15-alpine &
          docker pull redis:7-alpine &
          wait

      - name: 'gradle :${{ matrix.module }}:test'
        if: steps.filter.outputs.run == 'true'
        # DOCKER_UNAVAILABLE 의도적으로 false — Testcontainers 살림
        env:
          DOCKER_UNAVAILABLE: 'false'
          TESTCONTAINERS_RYUK_DISABLED: 'true'    # CI 환경 ryuk 비활성 (안정성)
        run: |
          set -o pipefail
          ./gradlew :${{ matrix.module }}:test --no-daemon --console=plain --continue --stacktrace 2>&1 | tee /tmp/${{ matrix.module }}-test.log
        continue-on-error: true     # 한 step 실패가 다음 step 막지 않도록

      - name: 테스트 결과 업로드 (${{ matrix.module }})
        if: steps.filter.outputs.run == 'true' && always()
        uses: actions/upload-artifact@v4
        continue-on-error: true   # 아티팩트 저장 용량 초과가 모듈 검증 결과를 실패로 만들지 않도록
        with:
          name: test-${{ matrix.module }}-${{ github.run_number }}
          path: |
            ${{ matrix.module }}/build/reports/tests/
            ${{ matrix.module }}/build/test-results/
            /tmp/${{ matrix.module }}-test.log
          retention-days: 3

      - name: JUnit XML 을 Check 로 게시
        if: steps.filter.outputs.run == 'true' && always()
        uses: dorny/test-reporter@v1
        with:
          name: 'Test Report: ${{ matrix.module }}'
          path: '${{ matrix.module }}/build/test-results/test/*.xml'
          reporter: java-junit
          fail-on-error: false

  # ─────────────────────────────────────────────────────────────────────────────
  # Phase 1: Frontend 빌드 검증 (병렬)
  # ─────────────────────────────────────────────────────────────────────────────
  frontend:
    name: 'Frontend Build & Install'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    defaults:
      run:
        working-directory: idem-console/frontend

    steps:
      - name: 소스 체크아웃
        uses: actions/checkout@v4

      - name: Node 20 설정
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'yarn'
          cache-dependency-path: idem-console/frontend/yarn.lock

      - name: yarn install (frozen-lockfile)
        run: yarn install --frozen-lockfile --network-timeout 600000

      - name: sass 실제 버전 확인 (NO-GO #5 진위 검증)
        run: |
          node -e "
            const p=require('./node_modules/sass/package.json');
            console.log('sass version:', p.version);
            console.log('sass engines:', JSON.stringify(p.engines));
            console.log('node runtime:', process.version);
          "

      - name: TypeScript 타입 검사
        # i18n hash 자동 생성을 포함한 typecheck 스크립트 사용 (package.json scripts 참조)
        # 2026-05-24 PR #196 에서 14건 TS 부채 해소 완료 → continue-on-error 제거
        run: yarn typecheck

      - name: Webpack 빌드 (production)
        env:
          NODE_ENV: production
        run: yarn build
        continue-on-error: true     # 빌드 실패해도 후속 진행 (리포트용)

      - name: FE 결과 업로드
        if: always()
        uses: actions/upload-artifact@v4
        continue-on-error: true
        with:
          name: frontend-build-${{ github.run_number }}
          path: |
            idem-console/frontend/dist/
          retention-days: 3

  # ─────────────────────────────────────────────────────────────────────────────
  # Phase 2: Issue #2 — Agency E2E (수동/옵트인 시에만)
  # ─────────────────────────────────────────────────────────────────────────────
  e2e-agency:
    name: 'Issue #2: Agency E2E (Testcontainers)'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    needs: [ module-tests ]
    if: inputs.include_e2e == true

    steps:
      - name: 소스 체크아웃
        uses: actions/checkout@v4

      - name: Java ${{ env.JAVA_VERSION }} 설정
        uses: actions/setup-java@v4
        with:
          java-version: ${{ env.JAVA_VERSION }}
          distribution: 'temurin'
          cache: 'gradle'

      - name: Gradle 캐시
        uses: actions/cache@v4
        with:
          path: |
            ~/.gradle/caches
            ~/.gradle/wrapper
          key: ${{ runner.os }}-gradle-e2e-${{ hashFiles('**/*.kts') }}

      - name: Docker 사전 pull
        run: |
          docker pull postgres:15-alpine
          docker pull redis:7-alpine

      - name: '@Disabled 무시 시도하며 E2E 실행'
        env:
          DOCKER_UNAVAILABLE: 'false'
          TESTCONTAINERS_RYUK_DISABLED: 'true'
        run: |
          # @Disabled 어노테이션은 Gradle 옵션으로 무시 불가 (Junit 정책).
          # 따라서 별도 -Pcli 프로퍼티로 어노테이션 제거 후 재실행하는 우회 없음.
          # 대신 @Disabled 표시 그대로 두고, 다음 명령은 "현재 활성화된 E2E 만" 실행.
          chmod +x ./gradlew
          ./gradlew :idem-tenant-sample:test --no-daemon --console=plain --continue \
            --tests "kr.go.smes.agency.e2e.*" 2>&1 | tee /tmp/e2e.log || true
          
          echo ""
          echo "═══════════════════════════════════════════════════════════════"
          echo "NOTE: AgencyHandoffE2EIntegrationTest 는 @Disabled 어노테이션이 붙어있어"
          echo "      여기서도 SKIP 됩니다. 이는 의도된 결과입니다."
          echo "      B단계에서 WireMock 기반으로 재설계 후 @Disabled 제거 예정."
          echo "═══════════════════════════════════════════════════════════════"

      - name: E2E 결과 업로드
        if: always()
        uses: actions/upload-artifact@v4
        continue-on-error: true
        with:
          name: e2e-agency-${{ github.run_number }}
          path: |
            idem-tenant-sample/build/reports/tests/
            idem-tenant-sample/build/test-results/
            /tmp/e2e.log
          retention-days: 3

  # ─────────────────────────────────────────────────────────────────────────────
  # Phase 2: OWASP 보안 스캔 (옵트인)
  # ─────────────────────────────────────────────────────────────────────────────
  security:
    name: 'OWASP Dependency-Check'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    needs: [ module-tests ]
    if: inputs.include_security == true

    steps:
      - name: 소스 체크아웃
        uses: actions/checkout@v4

      - name: Java ${{ env.JAVA_VERSION }} 설정
        uses: actions/setup-java@v4
        with:
          java-version: ${{ env.JAVA_VERSION }}
          distribution: 'temurin'
          cache: 'gradle'

      - name: OWASP NVD 캐시
        uses: actions/cache@v4
        with:
          path: ~/.gradle/dependency-check-data
          key: owasp-nvd-${{ hashFiles('build.gradle.kts') }}-${{ github.run_id }}
          restore-keys: |
            owasp-nvd-${{ hashFiles('build.gradle.kts') }}-
            owasp-nvd-

      - name: OWASP 스캔 실행
        run: |
          chmod +x ./gradlew
          ./gradlew dependencyCheckAnalyze --no-daemon \
            -Pdependency.check.failBuildOnCVSS=7 \
            -Pdependency.check.formats=HTML,JSON || true

      - name: 보안 스캔 결과 업로드
        if: always()
        uses: actions/upload-artifact@v4
        continue-on-error: true
        with:
          name: security-report-${{ github.run_number }}
          path: '**/build/reports/dependency-check/'
          retention-days: 7

  # ─────────────────────────────────────────────────────────────────────────────
  # Phase 3: 결과 종합 + PR 댓글 자동 게시
  # ─────────────────────────────────────────────────────────────────────────────
  report:
    name: 'NO-GO 종합 결과 게시'
    runs-on: ubuntu-latest
    if: always()
    needs: [ module-tests, frontend ]

    steps:
      - name: 결과 요약 작성
        id: summary
        run: |
          cat > /tmp/summary.md <<'EOF'
          ## NO-GO Full Verification 결과 (run #${{ github.run_number }})

          | 영역 | 결과 |
          |------|------|
          | Module tests (전체 8 모듈) | ${{ needs.module-tests.result }} |
          | Frontend build | ${{ needs.frontend.result }} |
          | Agency E2E (opt-in) | ${{ inputs.include_e2e == true && 'executed' || 'skipped (default)' }} |
          | OWASP 보안 (opt-in) | ${{ inputs.include_security == true && 'executed' || 'skipped (default)' }} |

          - **트리거**: `${{ github.event_name }}` on `${{ github.ref }}`
          - **커밋**: `${{ github.sha }}`
          - **실행자**: @${{ github.actor }}
          - **상세 로그**: [Actions 탭](${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }})

          ### 다운로드 가능한 아티팩트
          - `test-{module}-${{ github.run_number }}`: 각 모듈 JUnit XML + HTML 리포트
          - `frontend-build-${{ github.run_number }}`: webpack dist
          - `e2e-agency-${{ github.run_number }}`: Agency E2E 로그 (실행한 경우)
          - `security-report-${{ github.run_number }}`: OWASP 리포트 (실행한 경우)

          > 🤖 본 결과는 GitHub Actions `ubuntu-latest` (2 vCPU / 7GB RAM / Docker 가용) 에서 실측됨.
          EOF
          
          echo "──── Summary ────"
          cat /tmp/summary.md
          # GITHUB_STEP_SUMMARY 에도 기록
          cat /tmp/summary.md >> $GITHUB_STEP_SUMMARY

      - name: PR 댓글 게시 (PR 이벤트일 때만)
        if: github.event_name == 'pull_request'
        uses: actions/github-script@v7
        with:
          script: |
            const fs = require('fs');
            const body = fs.readFileSync('/tmp/summary.md', 'utf8');
            await github.rest.issues.createComment({
              owner: context.repo.owner,
              repo: context.repo.repo,
              issue_number: context.issue.number,
              body: body
            });
