##############################################################################
# onepass-agent.properties — OnePass Agent 설정 파일
#
# 이 파일은 테스트베드에서 사용하는 Agent 설정 템플릿입니다.
# 운영 환경에서는 보안 정책에 따라 별도 경로에 보관하세요.
#
# 로드 방법:
#   -Donepass.agent.config=/path/to/onepass-agent.properties
#   또는 클래스패스에 위치 시 자동 로드
#
# 최종 수정: 2026-05-17
##############################################################################

# ─── 기본 활성화 ──────────────────────────────────────────────────────────────
# Agent 위빙 활성화 여부 (true/false)
# System Property로 런타임 재활성화 가능: -Donepass.agent.enabled=true
onepass.agent.enabled=true

# ─── OnePass 서버 연결 ────────────────────────────────────────────────────────
# OnePass SSO 서버 기본 URL (슬래시 없이 종료)
# 테스트베드: Mock 서버 사용
onepass.server.url=http://mock-onepass-server:8080

# 토큰 검증 API 경로
onepass.server.verify.path=/api/agent/verify

# HTTP 연결 타임아웃 (ms)
onepass.server.connect.timeout.ms=3000

# HTTP 읽기 타임아웃 (ms)
onepass.server.read.timeout.ms=5000

# 연결 실패 시 재시도 횟수 (0 = 재시도 없음)
onepass.server.retry.count=2

# ─── WAS 유형 설정 ────────────────────────────────────────────────────────────
# WAS 유형 강제 지정 (비워두면 자동 감지)
# 유효 값: JEUS_LEGACY, JEUS_6, JEUS_7, JEUS_8, JEUS_8_5, JEUS_9_PLUS,
#          TOMCAT_LEGACY, TOMCAT_7, TOMCAT_8, TOMCAT_9, TOMCAT_10_PLUS,
#          JBOSS_LEGACY, JBOSS, WILDFLY, WEBLOGIC_LEGACY, WEBLOGIC,
#          WEBSPHERE_LEGACY, WEBSPHERE, GLASSFISH, GLASSFISH_JAKARTA,
#          RESIN, UNDERTOW, JETTY_LEGACY, JETTY, JETTY_JAKARTA, UNKNOWN
# System Property로 오버라이드: -Donepass.was.type=TOMCAT_9
#onepass.was.type=

# ─── 인증 정책 ────────────────────────────────────────────────────────────────
# 토큰 헤더 이름 (기본: Authorization)
# Bearer 접두사 자동 제거 포함
onepass.token.header=Authorization

# 쿠키로도 토큰 전달 허용 여부
onepass.token.cookie.enabled=true
onepass.token.cookie.name=ONEPASS_TOKEN

# ─── 제외 경로 패턴 ───────────────────────────────────────────────────────────
# 인증 없이 접근 허용할 경로 (쉼표 구분, ANT 패턴)
# 예: /health,/actuator/**,/static/**,/login,/error
onepass.exclude.paths=/health,/actuator/**,/status,/favicon.ico

# 특정 Content-Type 제외 (쉼표 구분)
#onepass.exclude.content.types=application/x-www-form-urlencoded

# ─── Fail-Open 정책 ───────────────────────────────────────────────────────────
# true: OnePass 서버 호출 실패 시 요청 통과 (운영 안정성 우선)
# false: OnePass 서버 호출 실패 시 요청 거부 (보안 우선)
onepass.failopen=true

# Fail-Open 시 로그 레벨 (WARN/ERROR)
onepass.failopen.log.level=WARN

# ─── 캐시 설정 ────────────────────────────────────────────────────────────────
# 토큰 검증 결과 캐시 활성화 (성능 향상)
onepass.token.cache.enabled=true

# 캐시 항목 유효 시간 (초)
onepass.token.cache.ttl.seconds=60

# 캐시 최대 항목 수
onepass.token.cache.max.size=1000

# ─── 위빙 설정 ────────────────────────────────────────────────────────────────
# byte-buddy 위빙 전략 (SUBCLASS / REDEFINE / RETRANSFORM)
# 대부분의 WAS에서 REDEFINE이 안정적
onepass.weaving.strategy=REDEFINE

# Javassist 위빙 실패 시 Fallback 허용
onepass.weaving.javassist.fallback=true

# ─── 로깅 ─────────────────────────────────────────────────────────────────────
# Agent 내부 로그 레벨 (DEBUG/INFO/WARN/ERROR/OFF)
onepass.log.level=INFO

# 로그 파일 경로 (비워두면 System.err 출력)
#onepass.log.file=/var/log/onepass-agent.log

# 토큰 값 로그 마스킹 (운영 환경: 반드시 true)
onepass.log.mask.token=true

# ─── 테스트베드 전용 설정 ─────────────────────────────────────────────────────
# ※ 아래 설정은 테스트베드 전용입니다. 운영 환경에서 제거하세요.

# Agent 버전 (로그 출력용)
onepass.agent.version=dev-testbed

# Mock 서버 API Key (테스트베드 Mock 서버의 X-Api-Key 헤더값)
#onepass.server.api.key=testbed-api-key-2026

# 요청/응답 전체 로깅 (DEBUG 전용, 운영 환경 절대 사용 금지)
onepass.debug.request.log=false
