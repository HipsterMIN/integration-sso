<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8" />
<title>인증 처리 중</title>
<style>
body { display: flex; justify-content: center; align-items: center; height: 100vh; margin: 0; font-family: sans-serif; background: #f5f5f5; }
p { color: #666; font-size: 14px; }
</style>
</head>
<body>
<p>인증 처리 중입니다. 잠시만 기다려주세요...</p>
<script>
(function () {
	var params = new URLSearchParams(window.location.search);
	var webTransactionId = params.get('web_transaction_id');
	var requestNo = params.get('request_no');

	if (window.opener) {
		window.opener.postMessage(
			JSON.stringify({
				type: 'nice-phone-auth',
				web_transaction_id: webTransactionId || '',
				request_no: requestNo || ''
			}),
			window.location.origin
		);
	}

	window.close();
})();
</script>
</body>
</html>
