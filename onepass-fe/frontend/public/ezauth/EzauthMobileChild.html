<!DOCTYPE html>
<html lang="ko">
    <head>
        <meta http-equiv="Content-Type" content="text/html; charset=UTF-8" />
        <meta http-equiv="X-UA-Compatible" content="IE=Edge" />
        <meta name="apple-mobile-web-app-capable" content="yes" />
        <meta name="format-detection" content="telephone=no" />
        <meta name="viewport" content="width=device-width, initial-scale=1.0" />
        <title>Welcome to EZ Auth</title>
        <link rel="shortcut icon" href="img/icons/favicon.ico" type="image/x-icon" />

        <!--<link rel="stylesheet" type="text/css" href="../font/Pretendard-1.3.8/web/static/pretendard.css"/> -->
        <!-- 미사용 <link rel="stylesheet" type="text/css" href="../font/Pretendard-1.3.8/web/static/pretendard-subset.css"/> -->
        <!-- 미사용 <link rel="stylesheet" type="text/css" href="../font/Pretendard-1.3.8/web/variable/pretendardvariable.css"/> -->
        <!--<link rel="stylesheet" type="text/css" href="../css/EzauthInit.css"/> -->
        <!--<link rel="stylesheet" type="text/css" href="../css/EzauthMobileChild.css"/> -->

        <!-- style -->
        <link rel="stylesheet" href="./assets/font/Pretendard-1.3.8/web/variable/pretendardvariable.css" />
        <link rel="stylesheet" href="./assets/css/EzauthInit.css" />
        <link rel="stylesheet" href="./assets/css/EzauthMobileChild.css" />
        <link rel="stylesheet" href="./assets/css/EzauthAlert.css" />
        <link rel="stylesheet" href="./assets/css/EzauthBlock.css" />
        <link rel="stylesheet" href="./assets/css/EzauthMobileModal.css" />

        <!-- script -->
        <!-- Automatically provides/replaces `Promise` if missing or broken. -->
        <script src="api/es6-promise.min.js"></script>
        <script src="api/es6-promise.auto.min.js"></script>
        <script src="js/EzAuthMAct.bundle.js"></script>
    </head>

    <body>
        <div id="EzauthContainer">
            <div class="encase">
                <header class="container-header">
                    <div class="left">
                        <div class="close">
                            <img role="button" tabindex="0" src="" title="" alt="" />
                        </div>
                    </div>
                    <div class="middle">
                        <div class="title"></div>
                    </div>
                    <div class="right">
                        <div class="img_logo-gov24">
                            <img src="assets/img/logo_gov.svg" alt="" title=""/>
                        </div>
                    </div>
                </header>
                <div class="body">
                    <section class="step1">
                        <section class="user-info">
                            <ul class="body">
                                <!-- 사업자 인증서 드롭다운 style ui -->
                                <li class="dropdown_menu_wrap biz_cert">
                                    <p id="biz_cert_label" class="label"></p>
                                    <!--  aria-expanded 속성으로 확장메뉴 토글 여부 확인 -->
                                    <div id="biz_cert_btn" class="dropdown_menu_btn" role="button" type="button" tabindex="0" aria-labelledby="biz_cert_label biz_cert_selected_text" aria-controls="biz_cert_menu" aria-haspopup="true" aria-expanded="false">
                                        <div class="content_area">
                                            <div class="cert_logo">
                                                <img src="assets/img/cp_logo_nor.svg" alt="" />
                                            </div>
                                            <span id="biz_cert_selected_text" class="text"></span>
                                        </div>
                                        <img class="down_arrow" src="assets/img/form_select_arrow_ovr.png" alt="" />
                                    </div>
                                    <div id="biz_cert_menu" class="dropdown_menu_list" role="menu" aria-labelledby="biz_cert_label">
                                        <div class="dropdown_menu_list_inner" role="none">
                                        </div>
                                    </div>
                                </li>
                                <!-- 인증방법 선택 드롭다운 style ui -->
                                <li class="dropdown_menu_wrap auth_methods">
                                    <p id="auth_methods_label" class="label"></p>
                                    <div id="auth_methods_btn" class="dropdown_menu_btn" role="button" type="button" tabindex="0" aria-labelledby="auth_methods_label auth_methods_selected_text" aria-controls="auth_methods_menu" aria-haspopup="true" aria-expanded="false">
                                        <div class="content_area">
                                            <span id="auth_methods_selected_text" class="text"></span>
                                        </div>
                                        <img class="down_arrow" src="assets/img/form_select_arrow_ovr.png" alt="" />
                                    </div>
                                    <div id="auth_methods_menu" class="dropdown_menu_list" role="menu" aria-labelledby="auth_methods_label">
                                        <div class="dropdown_menu_list_inner" role="none">
                                            <div class="btn_auth_methods_menu_item cloud-button" role="menuitem" title="선택되지않음" tabindex="0">
                                                <span class="text">클라우드</span>
                                            </div>
                                            <div class="btn_auth_methods_menu_item app2app-button" role="menuitem" title="선택되지않음" tabindex="0">
                                                <span class="text">앱 실행(앱2앱)</span>
                                            </div>
                                            <div class="btn_auth_methods_menu_item app-push-button" role="menuitem" title="선택되지않음" tabindex="0">
                                                <span class="text">앱 알림(PUSH)</span>
                                            </div>
                                        </div>
                                    </div>
                                </li>
                                <li class="name">
                                    <p class="label"></p>
                                    <input tabindex="0" type="text" placeholder="" maxlength="50" />
                                </li>
                                <li class="birth">
                                    <p class="label"></p>
                                    <input tabindex="0" type="number" oninput="maxleng(this, 8)" inputmode="numeric" placeholder="" value="" numberOnly maxlength="8" />
                                </li>
                                <li class="biz-registration-number">
                                    <p class="label"></p>
                                    <input tabindex="0" type="number" oninput="maxleng(this, 10)" inputmode="numeric" placeholder="" numberOnly maxlength="10" />
                                </li>
                                <li class="hp">
                                    <p class="label"></p>
                                    <div class="wrap" role="none">
                                        <!-- <select class="telco" tabindex="0" class="telco"></select>
                                        <select class="sel_telnum" tabindex="0" role="combobox" aria-expanded="false">
                                            <option value="010" role="option">010</option>
                                        </select> -->
                                        <input tabindex="0" type="number" title="010" readonly maxlength="3" value="010" class="sel_telnum telnum_start"/>
                                        <input tabindex="0" type="number" oninput="maxleng(this, 8)" inputmode="numeric" placeholder="" numberOnly maxlength="8" class="telnum_end"/>
                                    </div>
                                </li>
                                <li class="ssn">
                                    <p class="label"></p>
                                    <div class="wrap" role="none">
                                        <input class="ssn1" tabindex="0" type="number" oninput="maxleng(this, 6)" inputmode="numeric" placeholder="" numberOnly maxlength="6" />
                                        <input class="ssn2" tabindex="0" type="password" oninput="maxleng(this, 7)" inputmode="numeric" placeholder="" numberOnly maxlength="7" />
                                    </div>
                                </li>
                            </ul>
                        </section>
                        <section class="ezauth-info">
                            <header></header>
                            <div class="body">
                            </div>
                        </section>
                        <section class="user-manual">
                            <a href="pdf/guide.pdf" target="_blank" rel="noopener noreferrer" class="btn_show_manual" title="사용방법 메뉴얼 안내 (새 창)">
                                <img src="assets/img/ico_info.svg" alt=""/>
                                <span>사용방법 메뉴얼 안내</span>
                            </a>
                        </section>
                        <section class="policys">
                            <div class="encase">
                                <header>
                                    <div class="left">
                                        <div class="title"></div>
                                    </div>
                                    <div class="right">
                                        <div class="close">
                                            <img role="button" tabindex="0" src="" title="닫기" alt="닫기" />
                                        </div>
                                    </div>
                                </header>
                                <ul class="body">
                                    <!-- <li class="policy-title">
							<img tabindex="0" class="checkbox" src="assets/img/form_checkbox_nor.png" title="" alt="">
							<p class="all-agree"></p>
						</li> -->
                                    <li id="policy1" class="policy" data-required="false">
                                        <!-- <img tabindex="0" class="checkbox" src="assets/img/form_checkbox_nor.png" title="" alt=""> -->
                                        <p class="text"></p>
                                        <div role="button" tabindex="0" class="button-show"></div>
                                    </li>
                                    <li id="policy2" class="policy" data-required="false">
                                        <!-- <img tabindex="0" class="checkbox" src="assets/img/form_checkbox_nor.png" title="" alt=""> -->
                                        <p class="text"></p>
                                        <div role="button" tabindex="0" class="button-show"></div>
                                    </li>
                                    <li id="policy3" class="policy" data-required="false">
                                        <!-- <img tabindex="0" class="checkbox" src="assets/img/form_checkbox_nor.png" title="" alt=""> -->
                                        <p class="text"></p>
                                        <div role="button" tabindex="0" class="button-show"></div>
                                    </li>
                                </ul>
                            </div>
                        </section>
                        <section class="buttons">
                            <div role="button" tabindex="0" class="button next"></div>
                            <div role="button" tabindex="0" class="button req-auth"></div>
                        </section>
                    </section>
                    <section class="step2">
                        <article class="main">
                            <section class="top">
                                <div class="title">
                                    <p class="text"></p>
                                </div>
                                <div>
                                    <p class="text-detail"></p>
                                </div>
                            </section>
                            <section class="middle">
                                <div class="step-image">
                                    <div class="step01img">
                                        <img class="StepImg" src="assets/img/mo_wait_nor.svg" title="" alt="" />
                                    </div>
                                </div>
                            </section>
                            <section class="bottom">
                                <div class="infomation">
                                    <div class="info-detail">
                                    </div>
                                </div>
                            </section>
                        </article>
                        <section class="buttons">
                            <div role="button" tabindex="0" class="button close">닫기</div>
                            <div role="button" tabindex="0" class="button complete-auth">
                                <span class="label"></span>
                                <div class="icon_auth_loading">
                                    <img src="assets/img/ico_loading.svg" alt="" />
                                </div>
                            </div>
                        </section>
                    </section>
                    <section class="step3">
                        <!-- reserved -->
                    </section>
                    <section class="step4">
                        <!-- reserved -->
                    </section>
                </div>
            </div>
        </div>
        <div id="iframeContainer" style="position: fixed; top: 0; left: 0; width: 100vw; height: 100vh; z-index: 99999; background-color: rgba(0, 0, 0, 0.5); display: none; justify-content: center; align-items: center"></div>
    </body>
</html>
