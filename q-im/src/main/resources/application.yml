server:
  port: 8082
  shutdown: graceful

spring:
  application:
    name: q-im
  lifecycle:
    timeout-per-shutdown-phase: 20s

  # ── Jackson 직렬화 ──────────────────────────────────────────
  # Instant/OffsetDateTime 등 java.time 타입을 ISO-8601 UTC 문자열로 직렬화.
  # write-dates-as-timestamps: false → "2025-06-01T06:30:00Z" 형태 보장
  # time-zone: UTC → 직렬화 기준 타임존 명시 (JVM TZ 의존 차단)
  #
  # [배경] 운영 MariaDB system_time_zone=KST / JDBC serverTimezone=UTC 환경에서
  # LocalDateTime.now() 사용 시 JVM(UTC) 값이 저장되어 고객이 9시간 차이 경험.
  # Java 타입 전면 Instant 교체 + 이 설정으로 API 응답도 UTC ISO-8601 통일.
  jackson:
    serialization:
      write-dates-as-timestamps: false   # Instant → "2025-06-01T06:30:00Z" (epoch 숫자 아님)
    time-zone: UTC                        # 직렬화 기준 TZ 명시 (LocalDateTime 잔존분 방어)
    deserialization:
      fail-on-unknown-properties: false   # API 클라이언트 호환성 유지

  # ── DataSource ──────────────────────────────────────────────
  # [변경] PostgreSQL → MariaDB
  # 운영: NHN Cloud RDS for MariaDB (${QIM_DB_HOST})
  # 로컬 PoC: Docker self-hosted MariaDB 11.x (172.20.0.21:3306)
  datasource:
    url: jdbc:mariadb://${QIM_DB_HOST:localhost}:${QIM_DB_PORT:3306}/${QIM_DB_NAME:qim}?useUnicode=true&characterEncoding=UTF-8&serverTimezone=UTC&rewriteBatchedStatements=true&useSSL=${QIM_DB_SSL:false}
    username: ${QIM_DB_USERNAME:qim}
    password: ${QIM_DB_PASSWORD:qim}
    driver-class-name: org.mariadb.jdbc.Driver
    hikari:
      pool-name: qim-hikari
      maximum-pool-size: 20
      minimum-idle: 5
      idle-timeout: 300000
      connection-timeout: 30000
      max-lifetime: 1800000
      keepalive-time: 60000
      connection-test-query: SELECT 1

  # ── JPA ────────────────────────────────────────────────────
  # [변경] PostgreSQLDialect → MariaDBDialect
  # MariaDB는 스키마 개념 없음 → default_schema 제거, DB 자체가 qim
  jpa:
    hibernate:
      ddl-auto: validate
    show-sql: false
    open-in-view: false
    properties:
      hibernate:
        dialect: org.hibernate.dialect.MariaDBDialect
        jdbc:
          time_zone: UTC
          batch_size: 50
        order_inserts: true
        order_updates: true

  # ── Flyway ─────────────────────────────────────────────────
  # [변경] schemas/default-schema 제거 (MariaDB는 DB = 스키마)
  # MariaDB Flyway는 flyway-mysql 플러그인 사용 (build.gradle.kts 참조)
  flyway:
    enabled: true
    locations: classpath:db/migration
    baseline-on-migrate: true
    baseline-version: 0
    validate-on-migrate: true
    out-of-order: false
    connect-retries: 5
    connect-retries-interval: 10s

  # ── Redis ──────────────────────────────────────────────────
  data:
    redis:
      host: ${REDIS_HOST:localhost}
      port: ${REDIS_PORT:6379}
      password: ${REDIS_PASSWORD:}
      timeout: 2000ms
      lettuce:
        pool:
          max-active: 16
          max-idle: 8
          min-idle: 2
          max-wait: 1000ms

  # ── Kafka ──────────────────────────────────────────────────
  kafka:
    bootstrap-servers: ${KAFKA_SERVERS:localhost:9092}
    properties:
      security.protocol: PLAINTEXT
    producer:
      client-id: q-im-producer
      key-serializer: org.apache.kafka.common.serialization.StringSerializer
      value-serializer: org.springframework.kafka.support.serializer.JsonSerializer
      acks: all
      retries: 3
      batch-size: 16384
      linger-ms: 5
      compression-type: lz4
      properties:
        enable.idempotence: "true"
        max.in.flight.requests.per.connection: "5"
        spring.json.add.type.headers: "false"
        # Transactional Outbox – 트랜잭션 프로듀서 ID
        transactional.id: q-im-tx-producer
    consumer:
      group-id: q-im-consumer
      auto-offset-reset: earliest
      enable-auto-commit: false
      max-poll-records: 50
      key-deserializer: org.apache.kafka.common.serialization.StringDeserializer
      value-deserializer: org.springframework.kafka.support.serializer.JsonDeserializer
      properties:
        spring.json.trusted.packages: "kr.go.smes.*"
        isolation.level: read_committed
    listener:
      ack-mode: MANUAL_IMMEDIATE
      concurrency: 3
      missing-topics-fatal: true

# ── Q-IM 도메인 설정 ───────────────────────────────────────────
qim:
  # §10.5.2 / GAP-QIM-04 Transactional Outbox Relay
  outbox:
    relay-interval-ms: 500      # PENDING 레코드 발행 주기 (ms)
    batch-size: 100
    max-retry: 5                # 최대 재시도 횟수 (도달 시 영구 FAILED)
    retry-back-off-ms: 1000
    # GAP-QIM-04: FAILED 레코드 재시도 스케줄러 실행 주기 (ms)
    retry-interval-ms: 30000    # 30초마다 FAILED 레코드 재시도
  # Kafka 토픽 (§10.5.2 / §11.5.6)
  kafka:
    topic-user-events: qim.user.events       # cleanup.policy=compact
    topic-snapshot: qim.user.snapshot        # Compacted Snapshot Topic
  # Redis 캐시 TTL (IdO 가 pull 시 기준)
  cache:

  # ── CI 암호화 키 설정 ───────────────────────────────────────────────────────
  crypto:
    ci:
      key-v1:         ${QIM_CI_AES_KEY_V1:AAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAA=}
      key-v2:         ${QIM_CI_AES_KEY_V2:}
      current-version: ${QIM_CI_CURRENT_VERSION:v1}
    di:
      secret:         ${QIM_DI_SECRET:default-di-secret-change-in-production}

  # ── 내부 API 보안 (P2 보안 수정) ─────────────────────────────────────────────
  # IdO → Q-IM 내부 호출 시 X-Internal-Api-Key 헤더 검증
  # 운영 환경에서 반드시 QIM_INTERNAL_API_KEY 환경변수를 설정하십시오.
  # (32자 이상 랜덤 문자열 권장 — openssl rand -hex 32)
  security:
    internal-api-key: ${QIM_INTERNAL_API_KEY:}
    user-ttl-seconds: 300                    # ≤5분 (설계서 §11.3)

# ── Actuator ──────────────────────────────────────────────────
management:
  endpoints:
    web:
      exposure:
        include: health,info,metrics,prometheus,flyway
  endpoint:
    health:
      show-details: when-authorized
      probes:
        enabled: true
  metrics:
    tags:
      application: ${spring.application.name}

logging:
  level:
    kr.go.smes.qim: INFO
    org.springframework.kafka: WARN
    org.flywaydb: INFO

