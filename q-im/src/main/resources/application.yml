server:
  port: 8082

spring:
  application:
    name: q-im

  datasource:
    url: jdbc:postgresql://localhost:5432/qim
    username: ${DB_USERNAME:onepass}
    password: ${DB_PASSWORD:onepass}
    hikari:
      maximum-pool-size: 20

  jpa:
    hibernate:
      ddl-auto: validate
    properties:
      hibernate:
        default_schema: qim

  flyway:
    enabled: true
    locations: classpath:db/migration
    schemas: qim

  data:
    redis:
      host: ${REDIS_HOST:localhost}
      port: ${REDIS_PORT:6379}

  kafka:
    bootstrap-servers: ${KAFKA_SERVERS:localhost:9092}
    producer:
      key-serializer: org.apache.kafka.common.serialization.StringSerializer
      value-serializer: org.springframework.kafka.support.serializer.JsonSerializer
      acks: all
      properties:
        enable.idempotence: true
    consumer:
      group-id: q-im
      auto-offset-reset: earliest

# Transactional Outbox Relay 설정 (설계서 10.5.2절)
qim:
  outbox:
    relay-interval-ms: 500
    batch-size: 100
  # Kafka 토픽
  kafka:
    topic-user-events: qim.user.events   # cleanup.policy=compact
    topic-snapshot: qim.user.snapshot    # Compacted Snapshot Topic

management:
  endpoints:
    web:
      exposure:
        include: health,info,metrics,prometheus
